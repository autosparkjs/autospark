<!-- 首页：Hero + 快捷入口 + 热销精选 + 服务亮点 + 最新资讯 -->
<div class="page page-home">
    <style>
        /* ===== 首页私有样式（跨页公用样式见 styles.css） ===== */
        .hero {
            position: relative;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 2rem;
            align-items: center;
            padding: clamp(1.8rem, 4vw, 3.2rem);
            border-radius: 24px;
            background:
                radial-gradient(120% 120% at 85% 10%, rgba(23, 195, 217, 0.4), transparent 55%),
                linear-gradient(135deg, #121a3a 0%, #23306b 55%, #3b2f8f 100%);
            color: #fff;
            box-shadow: var(--shadow-lg);
        }

        .hero::after {
            content: "";
            position: absolute;
            right: -80px;
            bottom: -110px;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(124, 92, 255, 0.55), transparent 65%);
        }

        .hero-badge {
            display: inline-block;
            padding: 0.25rem 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            background: rgba(255, 255, 255, 0.12);
        }

        .hero h1 {
            margin-top: 0.9rem;
            font-size: clamp(2rem, 5vw, 3.2rem);
            line-height: 1.15;
            letter-spacing: 0.02em;
        }

        .hero-sub {
            margin-top: 0.7rem;
            color: rgba(255, 255, 255, 0.82);
            max-width: 46ch;
        }

        .hero-points {
            display: flex;
            flex-wrap: wrap;
            gap: 0.55rem;
            list-style: none;
            margin-top: 1rem;
        }

        .hero-points li {
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.14);
            font-size: 0.85rem;
        }

        .hero-cta {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .hero-price {
            margin-top: 1.2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .hero-price strong {
            font-size: 1.7rem;
            color: #ffd166;
            margin-left: 0.3rem;
        }

        .hero-visual {
            position: relative;
            z-index: 1;
            display: grid;
            place-items: center;
            min-height: 240px;
        }

        .phone-mock {
            width: 168px;
            height: 300px;
            border-radius: 30px;
            border: 7px solid rgba(255, 255, 255, 0.9);
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.28), rgba(255, 255, 255, 0.06));
            display: grid;
            place-items: center;
            font-size: 3.6rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
            transform: rotate(-8deg);
            animation: homeFloat 4.5s ease-in-out infinite;
        }

        @keyframes homeFloat {
            0%,
            100% {
                transform: rotate(-8deg) translateY(0);
            }
            50% {
                transform: rotate(-8deg) translateY(-14px);
            }
        }

        .quick-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-top: 1.4rem;
        }

        .quick-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 1rem 1.1rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            transition:
                transform 0.18s ease,
                box-shadow 0.18s ease,
                border-color 0.18s ease;
        }

        .quick-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: transparent;
        }

        .q-ico {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-size: 1.3rem;
            border-radius: 12px;
            background: rgba(79, 107, 255, 0.1);
        }

        .q-text {
            display: flex;
            flex-direction: column;
            line-height: 1.4;
            min-width: 0;
        }

        .q-title {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .q-desc {
            font-size: 0.78rem;
            color: var(--muted);
        }

        .svc-mini-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
        }

        .svc-mini {
            padding: 1.2rem 1.25rem;
            border-radius: var(--radius);
            background: var(--surface);
            border: 1px solid var(--line);
        }

        .svc-mini .s-ico {
            font-size: 1.6rem;
        }

        .svc-mini h3 {
            margin: 0.5rem 0 0.3rem;
            font-size: 1rem;
        }

        .svc-mini p {
            font-size: 0.85rem;
            color: var(--ink-2);
        }

        .news-brief {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            overflow: hidden;
        }

        .news-brief .brief-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.95rem 1.2rem;
            border-bottom: 1px solid var(--line);
            transition: background 0.15s ease;
        }

        .news-brief .brief-row:last-child {
            border-bottom: none;
        }

        .news-brief .brief-row:hover {
            background: rgba(79, 107, 255, 0.05);
        }

        .brief-row time {
            font-size: 0.78rem;
            color: var(--muted);
            flex-shrink: 0;
        }

        .news-brief .brief-row .b-title {
            flex: 1;
            min-width: 0;
            font-size: 0.95rem;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 980px) {
            .hero {
                grid-template-columns: 1fr;
            }
            .hero-visual {
                min-height: 200px;
            }
            .quick-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .svc-mini-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 620px) {
            .quick-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <!-- Hero -->
    <section class="hero">
        <div class="hero-copy">
            <span class="hero-badge" x-text="hero.badge"></span>
            <h1 x-text="hero.title"></h1>
            <p class="hero-sub" x-text="hero.subtitle"></p>
            <ul class="hero-points">
                <template x-for="h of hero.highlights" :key="h">
                    <li x-text="h"></li>
                </template>
            </ul>
            <div class="hero-cta">
                <auto-link class="btn btn-primary" to="/products">立即选购</auto-link>
                <auto-link class="btn btn-ghost-light" to="/services">了解服务</auto-link>
            </div>
            <p class="hero-price">起售价<strong>¥<span x-text="hero.price"></span></strong></p>
        </div>
        <div class="hero-visual">
            <div class="phone-mock">📱</div>
        </div>
    </section>

    <!-- 快捷入口 -->
    <section class="quick-grid">
        <auto-link class="quick-item" to="/products">
            <span class="q-ico">🛍️</span>
            <span class="q-text">
                <span class="q-title">选购手机</span>
                <span class="q-desc">全系机型 · 加购即享</span>
            </span>
        </auto-link>
        <auto-link class="quick-item" to="/services">
            <span class="q-ico">🛠️</span>
            <span class="q-text">
                <span class="q-title">服务支持</span>
                <span class="q-desc">维修 / 换新 / 延保</span>
            </span>
        </auto-link>
        <auto-link class="quick-item" to="/news">
            <span class="q-ico">📰</span>
            <span class="q-text">
                <span class="q-title">新闻资讯</span>
                <span class="q-desc">新品与活动早知道</span>
            </span>
        </auto-link>
        <auto-link class="quick-item" to="/cart">
            <span class="q-ico">🛒</span>
            <span class="q-text">
                <span class="q-title">我的购物车</span>
                <span class="q-desc" x-text="cartCount > 0 ? '已选 ' + cartCount + ' 件' : '还是空的'"></span>
            </span>
        </auto-link>
    </section>

    <!-- 热销精选 -->
    <section>
        <div class="section-head">
            <div>
                <h2>热销精选</h2>
                <div class="sub">点击「加入购物车」，导航栏角标与购物车页实时同步</div>
            </div>
            <auto-link class="more-link" to="/products">查看全部 →</auto-link>
        </div>
        <div class="card-grid">
            <template x-for="p of featured" :key="p.id">
                <article class="p-card">
                    <div class="p-tile" :style="'background-color:' + p.color">
                        <span class="p-flag" x-text="p.flag"></span>
                        <span class="p-emoji" x-text="p.emoji"></span>
                    </div>
                    <div class="p-body">
                        <div class="p-name" x-text="p.name"></div>
                        <ul class="p-specs">
                            <template x-for="s of p.specs" :key="s">
                                <li x-text="s"></li>
                            </template>
                        </ul>
                        <div class="p-buy">
                            <div class="p-price">
                                ¥<span x-text="p.price"></span>
                                <span class="p-old" x-show="p.oldPrice" x-text="p.oldPrice ? '¥' + p.oldPrice : ''"></span>
                            </div>
                            <button class="btn btn-primary btn-sm" type="button" @click="addToCart(p)">加入购物车</button>
                        </div>
                    </div>
                </article>
            </template>
        </div>
    </section>

    <!-- 服务亮点 -->
    <section>
        <div class="section-head">
            <div>
                <h2>服务亮点</h2>
                <div class="sub">买得放心，用得省心</div>
            </div>
            <auto-link class="more-link" to="/services">全部服务 →</auto-link>
        </div>
        <div class="svc-mini-grid">
            <template x-for="s of serviceBars" :key="s.title">
                <div class="svc-mini">
                    <div class="s-ico" x-text="s.icon"></div>
                    <h3 x-text="s.title"></h3>
                    <p x-text="s.desc"></p>
                </div>
            </template>
        </div>
    </section>

    <!-- 最新资讯 -->
    <section>
        <div class="section-head">
            <div>
                <h2>最新资讯</h2>
                <div class="sub">来自星辰手机商店的官方动态</div>
            </div>
            <auto-link class="more-link" to="/news">更多新闻 →</auto-link>
        </div>
        <div class="news-brief">
            <template x-for="n of newsBrief" :key="n.id">
                <auto-link class="brief-row" to="/news">
                    <time x-text="n.date"></time>
                    <span class="b-title" x-text="n.title"></span>
                </auto-link>
            </template>
        </div>
    </section>
</div>
