<!-- 登录页：表单绑定全局 loginForm，提交走全局 action login -->
<div class="page page-login">
    <style>
        /* ===== 登录页私有样式 ===== */
        .login-wrap {
            display: grid;
            grid-template-columns: 1fr 1.05fr;
            border-radius: 22px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow: var(--shadow-lg);
            min-height: 460px;
        }

        .login-side {
            position: relative;
            padding: clamp(1.6rem, 3vw, 2.6rem);
            background:
                radial-gradient(120% 100% at 0% 0%, rgba(23, 195, 217, 0.4), transparent 55%),
                linear-gradient(150deg, #141b3d, #33287e);
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .login-side h2 {
            font-size: clamp(1.5rem, 3vw, 2rem);
        }

        .login-side > p {
            color: rgba(255, 255, 255, 0.82);
            font-size: 0.93rem;
        }

        .side-list {
            list-style: none;
            display: grid;
            gap: 0.7rem;
            margin-top: auto;
        }

        .side-list li {
            display: flex;
            gap: 0.65rem;
            align-items: flex-start;
            padding: 0.7rem 0.9rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            font-size: 0.88rem;
        }

        .side-list li b {
            display: block;
            font-size: 0.94rem;
        }

        .side-list li span {
            color: rgba(255, 255, 255, 0.78);
        }

        .login-main {
            padding: clamp(1.6rem, 3vw, 2.6rem);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-main h1 {
            font-size: 1.6rem;
        }

        .lm-sub {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 0.3rem 0 1.4rem;
        }

        .field {
            display: grid;
            gap: 0.35rem;
            margin-bottom: 1rem;
        }

        .field label {
            font-size: 0.86rem;
            font-weight: 700;
            color: var(--ink-2);
        }

        .field input[type="text"],
        .field input[type="password"] {
            padding: 0.72rem 0.95rem;
            border: 1px solid var(--line);
            border-radius: 10px;
            font-size: 0.95rem;
            background: #fafbff;
            color: var(--ink);
            outline: none;
            transition:
                border-color 0.18s ease,
                box-shadow 0.18s ease;
        }

        .field input:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 4px rgba(79, 107, 255, 0.14);
            background: #fff;
        }

        .field-check {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.88rem;
            color: var(--ink-2);
            margin-bottom: 1rem;
            cursor: pointer;
        }

        .form-error {
            margin-bottom: 0.9rem;
            padding: 0.6rem 0.85rem;
            border-radius: 8px;
            font-size: 0.86rem;
            background: rgba(240, 71, 107, 0.1);
            color: var(--danger);
        }

        .form-hint {
            margin-top: 0.9rem;
            font-size: 0.83rem;
            color: var(--muted);
        }

        .logged-panel {
            text-align: center;
        }

        .logged-panel .lp-avatar {
            width: 76px;
            height: 76px;
            margin: 0 auto 0.9rem;
            display: grid;
            place-items: center;
            border-radius: 50%;
            background: var(--grad);
            color: #fff;
            font-size: 1.9rem;
            font-weight: 800;
        }

        .logged-panel p {
            color: var(--muted);
            margin: 0.4rem 0 1.4rem;
        }

        .logged-actions {
            display: flex;
            justify-content: center;
            gap: 0.7rem;
            flex-wrap: wrap;
        }

        @media (max-width: 980px) {
            .login-wrap {
                grid-template-columns: 1fr;
            }

            .side-list {
                margin-top: 1rem;
            }
        }
    </style>

    <div class="login-wrap">
        <!-- 品牌侧 -->
        <aside class="login-side">
            <h2 x-text="title"></h2>
            <p x-text="subtitle"></p>
            <ul class="side-list">
                <template x-for="f of features" :key="f.title">
                    <li>
                        <span x-text="f.icon"></span>
                        <span>
                            <b x-text="f.title"></b>
                            <span x-text="f.desc"></span>
                        </span>
                    </li>
                </template>
            </ul>
        </aside>

        <!-- 表单侧 -->
        <div class="login-main">
            <!-- 未登录：登录表单 -->
            <form x-show="!user" @submit.prevent="login">
                <h1>账号登录</h1>
                <p class="lm-sub">使用 x-model 双向绑定全局 loginForm，提交走全局 action。</p>

                <div class="field">
                    <label for="lg-user">用户名</label>
                    <input id="lg-user" type="text" x-model="loginForm.username" placeholder="请输入用户名" autocomplete="username" />
                </div>
                <div class="field">
                    <label for="lg-pass">密码</label>
                    <input
                        id="lg-pass"
                        type="password"
                        x-model="loginForm.password"
                        placeholder="至少 6 位"
                        autocomplete="current-password"
                    />
                </div>
                <label class="field-check">
                    <input type="checkbox" x-model="loginForm.remember" />
                    记住我（演示字段，写入全局状态 loginForm.remember）
                </label>

                <div class="form-error" x-show="loginForm.error" x-text="loginForm.error"></div>

                <button class="btn btn-primary btn-block btn-lg" type="submit" :disabled="logging" x-text="logging ? '登录中…' : '登录'"></button>
                <p class="form-hint" x-text="hint"></p>
            </form>

            <!-- 已登录：登录成功面板 -->
            <div class="logged-panel" x-show="user">
                <div class="lp-avatar" x-text="user ? user.name.slice(0, 1) : ''"></div>
                <h1 x-text="user ? '已登录：' + user.name : ''"></h1>
                <p>登录态保存在全局状态 user 中：导航栏头像、购物车结算都会读取它。</p>
                <div class="logged-actions">
                    <auto-link class="btn btn-primary" to="/cart">去购物车结算</auto-link>
                    <auto-link class="btn btn-ghost" to="/products">继续选购</auto-link>
                    <button class="btn btn-danger" type="button" @click="logout">退出登录</button>
                </div>
            </div>
        </div>
    </div>
</div>
