<!--
    远程片段测试文件（被 x-dialog url 片段兜底路径加载，ADR-0119）。
    无任何 x-define 声明——按片段编译（x-html.compile 同语义）：
    任意指令可用、插值读消费处状态、props 注入响应式数据域。
    （若混入 x-define 声明：组件照常注册但不渲染——编译期剪枝；注册了非匹配名组件时消费处 warn 一次名字提示。）
-->
<div style="padding: 24px; min-width: 320px">
    <h3 class="title is-5" x-text="topic"></h3>
    <p>插值读<b>消费处</b>状态：<b x-text="ui.source"></b></p>
    <p class="is-size-7 has-text-grey">
        这段 HTML 没有任何 x-define 声明——按<b>片段</b>编译，任意指令可用、无需组件声明；
        props（<code>topic</code>）注入响应式数据域，热更新与组件路径同权。
    </p>
    <button class="button is-fullwidth" @click="close()">关闭</button>
</div>
