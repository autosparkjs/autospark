<!--
    异步父组件（ADR-0083 demo 资产）：docs/demos/component/inherit-async.html 经
    x-import 加载的远程文件——只含 card 的 x-define 声明（三出口 + 计数逻辑，
    与本地版 inherit.html 的 card 等价）。
-->
<div x-define="card">
    <div class="demo-card">
        <div class="hd" x-slot:header>默认标题</div>
        <div class="bd" x-slot>count={{ count }}</div>
        <div class="ft" x-slot:footer>card 组件（远程异步父）</div>
    </div>
    <script type="autospark/setup">
        {
            data: { count: 0, step: 1 },
            methods: {
                inc() {
                    this.data.count += this.data.step;
                },
            },
        }
    </script>
</div>
