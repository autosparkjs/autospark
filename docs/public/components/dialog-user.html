<!--
    远程组件测试文件（被 x-dialog url 组件优先路径加载，ADR-0119）。
    一个文件可含 1-N 个 x-define；此处声明 remote-user——与消费名 x-dialog:remote-user
    匹配 → 组件路径编译：data / props / 方法 / 作用域样式与本地组件完全等价。
    组件内读不到消费处 x-data（作用域隔离），数据只走 props 传入。
-->
<div x-define="remote-user">
    <style>
        .remote-user-panel {
            background: #fff;
            border-radius: 8px;
            padding: 24px;
            min-width: 320px;
        }
    </style>
    <div class="remote-user-panel">
        <h3 class="title is-5">远程用户资料</h3>
        <p>ID（props 注入）：<b x-text="userId"></b></p>
        <p>内部计数（组件 data）：<b x-text="count"></b></p>
        <button class="button is-small mr-2" @click="count++">内部计数 +1</button>
        <p class="is-size-7 has-text-grey mt-3">
          本文件声明了 <code>x-define="remote-user"</code>，与消费名匹配——按<b>组件路径</b>编译；
          <code>userId</code> 由消费处 props 传入（组件内无法直接读取消费处 <code>x-data</code> 状态）；
          <code>count</code> 是组件内部 <code>data</code>，与外部隔离。
        </p>
        <button class="button is-fullwidth mt-3" @click="close()">关闭</button>
    </div>
    <script type="autospark/setup">{ data: { userId: 0, count: 0 } }</script>
</div>
