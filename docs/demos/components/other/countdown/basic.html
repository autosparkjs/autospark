<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Countdown · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.countdown.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main">
      <div class="auto-card">
        <div class="auto-card-header">基础：time 毫秒时长 + 缺省 format（时:分:秒）</div>
        <div class="auto-card-body">
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px">
            <div>
              <x-countdown :time="t1"></x-countdown>
              <p class="hint" style="margin-top: 4px">秒杀场次 90 秒</p>
            </div>
            <div>
              <x-countdown :time="t2" @finish="done = true"></x-countdown>
              <p class="hint" style="margin-top: 4px">
                {{ done ? "已归零——@finish 已触发" : "短倒计时 5 秒（finish 事件演示）" }}
              </p>
            </div>
          </div>
          <p class="hint" style="margin-top: 12px">
            time 为毫秒时长（变化即重启新一轮）；数值排版为 statistic 同款语言 （tabular-nums
            等宽数字——走秒不跳宽）。
          </p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">重启：验证码 60s 重发（time 变化即新一轮）</div>
        <div class="auto-card-body">
          <x-countdown :time="code" format="{m} 分 {s} 秒后可重发"></x-countdown>
          <p style="margin-top: 8px">
            <button class="demo-btn" @click="code = 60000; sent = sent + 1">
              重新发送（已发 {{ sent }} 次）
            </button>
          </p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {
        t1: 90000,
        t2: 5000,
        code: 60000,
        done: false,
        sent: 0,
      });
    </script>
  </body>
</html>
