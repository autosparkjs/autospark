<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>menu v2 形态</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 24px; background: #fff; }
        .row { display: flex; gap: 40px; align-items: flex-start; flex-wrap: wrap; }
        .panel { border: 1px solid #eee; border-radius: 8px; padding: 8px; }
        .wide { width: 480px; }
        .rail { width: 120px; }
        h3 { margin: 4px 0 12px; font-size: 14px; color: #666; }
        button.ctrl { margin: 4px 4px 12px 0; padding: 4px 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="row">
        <div class="panel">
            <h3>collapsed 三档（响应式切换）</h3>
            <button class="ctrl" data-c="0">0 常规</button>
            <button class="ctrl" data-c="1">1 图标条</button>
            <button class="ctrl" data-c="2">2 单按钮</button>
            <x-menu :items="menu" :collapsed="mode" :value="active" trigger="click"></x-menu>
        </div>
        <div class="panel wide">
            <h3>horizontal（横排 + 向下弹出 + header/footer 上下分区）</h3>
            <x-menu :items="hmenu" mode="horizontal" :value="hactive">
                <template header><b>AutoSpark</b></template>
                <template footer><span style="font-size:12px;color:#999">v2 · ADR-0033</span></template>
            </x-menu>
        </div>
    </div>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.overlay.js"></script>
    <script src="/autospark/autospark.button.js"></script>
    <script src="/autospark/autospark.menu.js"></script>
    <script>
        const state = {
            mode: 0,
            active: "home",
            hactive: "home",
            menu: [
                { key: "home", label: "首页", icon: "file" },
                { key: "nav", label: "导航", icon: "bell", children: [
                    { key: "n1", label: "指令" },
                    { key: "n2", label: "组件" },
                ] },
                { key: "form", label: "表单", icon: "edit", children: [
                    { key: "f1", label: "输入框" },
                    { key: "f2", label: "选择器", children: [{ key: "f2a", label: "级联" }] },
                ] },
                "-",
                { key: "set", label: "设置", icon: "copy" },
            ],
            hmenu: [
                { key: "home", label: "首页" },
                { key: "guide", label: "指南", children: [
                    { key: "g1", label: "快速入门" },
                    { key: "g2", label: "引擎", children: [{ key: "g2a", label: "深层级联" }] },
                ] },
                { key: "api", label: "API" },
            ],
        };
        const engine = new AutoSpark(document.body, state);
        document.querySelectorAll("button.ctrl").forEach((b) => {
            b.addEventListener("click", () => { engine.store.state.mode = Number(b.dataset.c); });
        });
    </script>
</body>
</html>
