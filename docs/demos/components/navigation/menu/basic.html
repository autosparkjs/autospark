<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>menu 基础</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <style>
      .hint { color: var(--auto-secondary-color, #868e96); font-size: 13px; margin: 8px 0 0; }
    </style>
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.card.js"></script>
    <script src="/autospark/autospark.overlay.js"></script>
    <script src="/autospark/autospark.button.js"></script>
    <script src="/autospark/autospark.menu.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main">
      <div class="auto-card">
        <div class="auto-card-header">基础（缺省宽 200 · 子菜单点击展开 / 折叠）</div>
        <div class="auto-card-body">
          <x-menu :items="menu" value="home"></x-menu>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">popLevel=1（缩进 + 弹层混合 · 悬浮展开）</div>
        <div class="auto-card-body">
          <x-menu :items="menu2" :pop-level="1" :value="active"></x-menu>
        </div>
        <p class="hint">level 1 缩进呈现；level 2 起（二级组）悬浮弹出——弹层宽度与菜单本体一致</p>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">width="0"（填满父容器）</div>
        <div class="auto-card-body">
          <x-menu width="0" :items="menu" :value="active"></x-menu>
        </div>
        <p class="hint">菜单填满卡片体宽度（不设自身宽度——侧栏场景的配方写法）</p>
      </div>
    </main>
    <script>
      new AutoSpark(document.body, {
        active: 'home',
        menu: [
          { key: 'home', label: '首页', icon: 'file' },
          { type: 'group', title: '组件' },
          { key: 'guide', label: '指南', icon: 'edit' },
          { key: 'comps', label: '组件', icon: 'copy' },
          { key: 'api', label: 'API' },
          '-',
          {
            key: 'nav',
            label: '导航',
            children: [
              { key: 'n1', label: '指令' },
              { key: 'n2', label: '路由' },
            ],
          },
        ],
        menu2: [
          { key: 'home', label: '首页', icon: 'file' },
          {
            key: 'grp',
            label: '折叠组',
            children: [
              { key: 'g1', label: '二级项' },
              {
                key: 'g2',
                label: '二级组',
                children: {
                  title: '三级弹层',
                  children: [
                    { key: 'g2a', label: '三级项' },
                    {
                      key: 'g2b',
                      label: '更深层',
                      children: [{ key: 'g2b1', label: '四级级联' }],
                    },
                  ],
                },
              },
            ],
          },
        ],
      });
    </script>
  </body>
</html>
