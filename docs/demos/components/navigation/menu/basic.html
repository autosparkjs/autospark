<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>menu v2 基础</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 24px; background: #fff; }
        .wrap { display: flex; gap: 40px; align-items: flex-start; }
        .panel { width: 260px; border: 1px solid #eee; border-radius: 8px; padding: 8px; }
        h3 { margin: 4px 0 12px; font-size: 14px; color: #666; }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="panel">
            <h3>基础（缩进域 + expandLevel + 勾选）</h3>
            <x-menu :items="menu" :value="picked"></x-menu>
        </div>
        <div class="panel">
            <h3>popLevel=1（缩进+弹层混合）</h3>
            <x-menu :items="menu2" :pop-level="1" :value="active" trigger="click"></x-menu>
        </div>
    </div>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.overlay.js"></script>
    <script src="/autospark/autospark.button.js"></script>
    <script src="/autospark/autospark.menu.js"></script>
    <script>
        const state = {
            picked: ["a1"],
            active: "home",
            menu: [
                { key: "home", label: "首页", icon: "file" },
                { type: "group", title: "组件", icon: "bell" },
                { key: "a1", label: "可勾选一", icon: "edit", checkable: true },
                { key: "a2", label: "可勾选二", icon: "copy", checkable: true },
                { key: "a3", label: "无图标占位", checkable: true },
                "-",
                { key: "nav", label: "导航", children: [
                    { key: "n1", label: "指令" },
                    { key: "n2", label: "组件" },
                ] },
            ],
            menu2: [
                { key: "home", label: "首页", icon: "file" },
                { key: "grp", label: "折叠组", children: [
                    { key: "g1", label: "二级项" },
                    { key: "g2", label: "二级组", children: { title: "三级弹层", children: [
                        { key: "g2a", label: "三级项" },
                        { key: "g2b", label: "更深层", children: [{ key: "g2b1", label: "四级级联" }] },
                    ] } },
                ] },
            ],
        };
        new AutoSpark(document.body, state);
        document.querySelectorAll(".asc-menu").forEach((m) => m.addEventListener("change", (e) => console.log("change", e.detail)));
    </script>
</body>
</html>
