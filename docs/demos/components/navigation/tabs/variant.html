<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Tabs · 形态与主题档位</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.tabs.js"></script>
    <script src="/autospark/theme-controls.js"></script>
    <style>
      .dark-box {
        margin-top: 12px;
        padding: 12px 16px;
        border-radius: 8px;
        background: #1a1a1a;
      }
    </style>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main">
      <div class="auto-card">
        <div class="auto-card-header">variant：line 下划线（缺省）/ card 卡片 / segmented 分段控制器</div>
        <div class="auto-card-body">
          <p><x-tabs variant="line"><x-tab key="a" label="概览"></x-tab><x-tab key="b" label="设置"></x-tab><x-tab key="c" label="日志"></x-tab></x-tabs></p>
          <p><x-tabs variant="card"><x-tab key="a" label="概览"></x-tab><x-tab key="b" label="设置"></x-tab><x-tab key="c" label="日志"></x-tab></x-tabs></p>
          <p><x-tabs variant="segmented" :items="segTabs" :value="mode"></x-tabs></p>
          <p class="hint">
            segmented 即分段控制器（button-group 选中模式视觉近亲，ADR-0018 决策 3 裁定并入本件）——
            视图切换器用法，无面板区；主题档位（data-size 等）经 autospark.base 继承全跟随。
          </p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">暗色态（容器裸挂 data-dark）</div>
        <div class="auto-card-body">
          <div class="dark-box" data-dark>
            <p><x-tabs variant="line"><x-tab key="a" label="概览"></x-tab><x-tab key="b" label="设置"></x-tab></x-tabs></p>
            <p><x-tabs variant="card"><x-tab key="a" label="概览"></x-tab><x-tab key="b" label="设置"></x-tab></x-tabs></p>
            <p><x-tabs variant="segmented" :items="segTabs" :value="mode"></x-tabs></p>
          </div>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {
        mode: "list",
        segTabs: [
          { key: "list", label: "列表" },
          { key: "card", label: "卡片" },
          { key: "table", label: "表格" },
        ],
      });
    </script>
  </body>
</html>
