<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Pagination · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.pagination.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main" id="app">
      <div class="auto-card">
        <div class="auto-card-header">受控翻页（@change 一行回写 + 页码窗口省略号折叠）</div>
        <div class="auto-card-body">
          <div @change="page = $event.detail.page">
            <x-pagination total="200" :page="page" x-pagination-options="{ props: { pageSize: 10 } }"></x-pagination>
          </div>
          <p class="hint">
            当前页：<code>{{ page }}</code>——总页数 > 7 时自动五宽窗口折叠（1 ··· 4 5 6 ··· 20）；
            首/末与上/下页按钮在边界自动禁用，越界值自动钳位。
          </p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">每页条数切换（pageSizes）+ 总条数文案</div>
        <div class="auto-card-body">
          <div @change="log = '第 ' + $event.detail.page + ' 页 / 每页 ' + $event.detail.pageSize + ' 条'">
            <!-- 保留值形态：pageSizes 状态引用注入（动态 camelCase 键在元素名形态无 :绑定通道；静态形态可走 page-sizes="JSON" 改道） -->
            <div x-component:autospark.pagination="{ total: 305, pageSize: 10, page: p2, pageSizes: sizes }"></div>
          </div>
          <p class="hint">{{ log || '切换每页条数会重置到第 1 页；总条数与条/页文案走 i18n 词典（未装时回退中文）。' }}</p>
        </div>
      </div>
      <div class="auto-card" data-dark>
        <div class="auto-card-header">极简形态（simple）+ 暗色态</div>
        <div class="auto-card-body">
          <div @change="p3 = $event.detail.page">
            <x-pagination total="200" simple="true" :page="p3" x-pagination-options="{ props: { pageSize: 10 } }"></x-pagination>
          </div>
          <p class="hint">极简形态只保留 ‹ 3 / 20 ›（总数、条数切换、页码窗口、首末钮全部隐藏）。</p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.getElementById("app"), {
        page: 5,
        p2: 1,
        p3: 3,
        log: "",
        sizes: [10, 20, 50, 100],
      });
    </script>
  </body>
</html>
