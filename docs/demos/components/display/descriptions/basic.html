<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Descriptions · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.descriptions.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main">
      <div class="auto-card">
        <div class="auto-card-header">基础：items 状态引用（简洁形态，3 列缺省）</div>
        <div class="auto-card-body">
          <x-descriptions title="订单信息" :items="rows"></x-descriptions>
          <p class="hint" style="margin-top: 12px">
            items 须<b>状态引用</b>注入（字面量数组触发 props 更新死环——引擎已知缺陷规避）；
            columns 缺省 3 列；空 title 整行不占位。
          </p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">子元素声明形态（静态描述）</div>
        <div class="auto-card-body">
          <x-descriptions columns="2">
            <x-descriptions-item label="版本">2.4.0</x-descriptions-item>
            <x-descriptions-item label="协议">MIT</x-descriptions-item>
            <x-descriptions-item label="运行时">零依赖 engine</x-descriptions-item>
            <x-descriptions-item label="产物">IIFE 单文件</x-descriptions-item>
          </x-descriptions>
          <p class="hint" style="margin-top: 12px">
            静态描述直接写 &lt;x-descriptions-item&gt; 子元素（precompile 折叠为 data-items
            通道）；动态数据走 items 状态引用。
          </p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {
        rows: [
          { label: "订单号", value: "ORD-20261113-0001" },
          { label: "收货人", value: "张三" },
          { label: "联系电话", value: "138****8888" },
          { label: "收货地址", value: "上海市静安区某某路 88 号", span: 2 },
          { label: "备注", value: "工作日配送" },
        ],
      });
    </script>
  </body>
</html>
