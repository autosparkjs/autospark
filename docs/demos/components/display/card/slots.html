<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Card · 插槽</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.card.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main">
      <div class="auto-card">
        <div class="auto-card-header">header / extra / footer 具名插槽</div>
        <div class="auto-card-body">
          <x-card>
            <template x-slot:header><b>自定义头部</b></template>
            <template x-slot:extra>更多</template>
            body 为默认插槽（裸子节点）；header 槽整体重载标题区，extra 槽落头部右缘。
            <template x-slot:footer><span>底部动作区</span></template>
          </x-card>
          <p class="hint" style="margin-top: 12px">
            空段自动隐藏：title 空 + header/extra 槽无内容 → 整个 header 不占位；footer 槽
            无内容 / body 空 → 对应段不占位。
          </p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
