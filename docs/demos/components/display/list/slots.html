<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>List · 自定义行与虚拟滚动</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.empty.js"></script>
    <script src="/autospark/autospark.list.js"></script>
    <script src="/autospark/autospark.virtual.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main">
      <div class="auto-card">
        <div class="auto-card-header">row 作用域插槽自定义行（{ item, $index } + 行内事件冒泡）</div>
        <div class="auto-card-body">
          <div x-component:autospark.list="{ items: users }">
            <template x-slot:row="{ item, $index }">
              <b x-text="item.name"></b>
              <span style="color: #868e96" x-text="'#' + ($index + 1)"></span>
              <span style="margin-left: auto; color: #009aff; cursor: pointer" @click="picked = item.name">选TA</span>
            </template>
          </div>
          <p class="hint" style="margin-top: 12px">
            最近选中：<code x-text="picked || '（未选）'"></code>——行内 @click 在调用方作用域求值，
            经行元素原生冒泡（组件零内建事件）。
          </p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">virtual 虚拟滚动（10000 项 · 须同页引入 autospark.virtual.js）</div>
        <div class="auto-card-body">
          <div x-component:autospark.list="{ items: bigUsers, virtual: true }"></div>
          <p class="hint" style="margin-top: 12px">
            定高滚动容器（<code>--asc-list-virtual-height</code> 可覆盖），只渲染可见窗口 +
            overscan 缓冲；行定高假设由 CSS 行高保证。
          </p>
        </div>
      </div>
    </main>
    <script>
      const bigUsers = Array.from({ length: 10000 }, (_, i) => ({ label: `第 ${i + 1} 行 · 虚拟滚动长列表项` }));
      new AutoSpark(document.querySelector(".demo-main"), {
        users: [
          { name: "张三", label: "张三" },
          { name: "李四", label: "李四" },
          { name: "王五", label: "王五" },
        ],
        bigUsers,
        picked: "",
      });
    </script>
  </body>
</html>
