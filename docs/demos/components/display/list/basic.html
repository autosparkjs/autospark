<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>List · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.empty.js"></script>
    <script src="/autospark/autospark.list.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main">
      <div class="auto-card">
        <div class="auto-card-header">基础：items 数据驱动（默认行四键探测）</div>
        <div class="auto-card-body">
          <div x-component:autospark.list="{ items: users }"></div>
          <p class="hint" style="margin-top: 12px">
            items 须<b>状态引用</b>注入（字面量数组触发 props 更新死环——引擎已知缺陷规避）；
            默认行按 label / title / name / value 依次探测 + 标量直出。
          </p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">空态（autospark.empty 组合兜底）与 loading 覆盖层</div>
        <div class="auto-card-body">
          <div x-component:autospark.list="{ items: emptyUsers }"></div>
          <div style="margin-top: 12px">
            <div x-component:autospark.list="{ items: users, loading: busy }"></div>
            <p style="margin-top: 8px">
              <button @click="busy = !busy" x-text="busy ? '关闭 loading' : '开启 loading'"></button>
            </p>
          </div>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {
        users: [{ label: "张三" }, { label: "李四" }, { label: "王五" }],
        emptyUsers: [],
        busy: false,
      });
    </script>
  </body>
</html>
