<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Text · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.text.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main">
      <div class="auto-card">
        <div class="auto-card-header">最小用法：宿主元素 + x-component 实例化</div>
        <div class="auto-card-body">
          <p>
            <span x-component:autospark.text="{ label: '一段正文文本：引擎后加载 autospark.text.js 即注册完成。' }"></span>
            <span x-component:autospark.text="{ label: '次要层级', type: 'secondary' }"></span>
            <span x-component:autospark.text="{ label: '辅助层级', type: 'third' }"></span>
          </p>
          <p class="hint">插槽内容优先于 label 兜底；右侧面板调节主题（暗色 / 档位），字号即时跟随。</p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
