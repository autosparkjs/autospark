<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ButtonGroup · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <!-- 加载顺序契约：button-group 须先于 button（组 precompile 变换在子钮上做
         缺省下发与 data-value stamp，须赶在 button 折叠 props 之前，ADR-0014） -->
    <script src="/autospark/autospark.button-group.js?v=20261110"></script>
    <script src="/autospark/autospark.button.js?v=20261110"></script>
    <script src="/autospark/autospark.ripple.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main">
      <div class="auto-card">
        <div class="auto-card-header">最小用法：融合按钮组（缺省 gap=0）</div>
        <div class="auto-card-body">
          <div style="display: flex; gap: 16px; flex-wrap: wrap; align-items: center">
            <x-button-group>
              <x-button label="日"></x-button>
              <x-button label="周"></x-button>
              <x-button label="月"></x-button>
            </x-button-group>
            <x-button-group type="danger">
              <x-button label="左"></x-button>
              <x-button label="中"></x-button>
              <x-button label="右"></x-button>
            </x-button-group>
          </div>
          <p class="hint">
            无 gap 时相邻子钮融合成一体（相邻侧圆角清除 + 边线单线复用）；
            引擎后加载 <code>autospark.button-group.js</code>（先）与
            <code>autospark.button.js</code>（后）即注册完成。
          </p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
