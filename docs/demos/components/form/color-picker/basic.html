<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>ColorPicker · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <!-- 面板呈现复用 x-popover 指令机制——按需加载场景须同时引入 overlay 产物 -->
    <script src="/autospark/autospark.overlay.js"></script>
    <script src="/autospark/autospark.color-picker.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main" style="max-width: 460px">
      <div class="auto-card">
        <div class="auto-card-header">最小用法：元素名实例化 + x-model 双向绑定</div>
        <div class="auto-card-body">
          <p>
            <x-color-picker x-model="color"></x-color-picker>
          </p>
          <p class="hint">
            当前色：<code>{{ color }}</code> —— 点击触发器开面板：SV 面板拖拽（实时改色、松手提交）、H 条切色相、hex 输入回车应用。
          </p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">change 事件消费（detail = { value }）与 name 表单提交</div>
        <div class="auto-card-body">
          <!-- engine 根元素上 @事件 绑定不生效——消费监听挂内层包裹元素 -->
          <div @change="picked = $event.detail.value">
            <x-color-picker name="theme-color"></x-color-picker>
          </div>
          <p class="hint">
            最近确认：<code>{{ picked || '（未操作）' }}</code>（提交恒在松手/应用——拖拽不逐帧派发）；name 透传 hidden 载体直提交。
          </p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {
        color: "#4098fc",
        picked: "",
      });
    </script>
  </body>
</html>
