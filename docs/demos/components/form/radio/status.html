<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Radio · 状态色与禁用</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.radio.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main" x-data="{ pick: '' }">
      <div class="auto-card">
        <div class="auto-card-header">status 状态色（x-field 校验结果染色入口）与 disabled</div>
        <div class="auto-card-body">
          <p style="display: flex; gap: 20px; align-items: center; flex-wrap: wrap">
            <span x-component:autospark.radio="{ value: 'e1', label: '校验未通过', status: 'error' }"></span>
            <span x-component:autospark.radio="{ value: 'e2', label: '已选中（错误态）', status: 'error', checked: true }"></span>
            <span x-component:autospark.radio="{ value: 's1', label: '已确认', status: 'success', checked: true }"></span>
            <span x-component:autospark.radio="{ value: 'd1', label: '禁用', disabled: true }"></span>
          </p>
          <p class="hint">状态在场边框/选中圆点染 <code>--asc-field-tone</code>（error=danger 等）；<code>error</code> 态内层控件同步 <code>aria-invalid="true"</code>。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">动态状态（未选染 error，选定即 success——必选校验惯用法）</div>
        <div class="auto-card-body">
          <p style="display: flex; gap: 20px; align-items: center">
            <span x-model="pick" x-component:autospark.radio="{ value: 'a', label: '选项 A', status: pick ? 'success' : 'error' }"></span>
            <span x-model="pick" x-component:autospark.radio="{ value: 'b', label: '选项 B', status: pick ? 'success' : 'error' }"></span>
          </p>
          <p class="hint">当前值：{{ pick || '（未选）' }} —— status 经绑定通道消费 <code>$field.error</code> 类校验结果的惯用法演示。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">暗色态（容器裸挂 data-dark）</div>
        <div class="auto-card-body">
          <div data-dark style="display: inline-flex; gap: 20px; align-items: center; padding: 12px 16px; border-radius: 8px; background: #1a1a1a">
            <span x-model="pick" x-component:autospark.radio="{ value: 'a', label: '暗色·A' }"></span>
            <span x-model="pick" x-component:autospark.radio="{ value: 'b', label: '暗色·B' }"></span>
          </div>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
