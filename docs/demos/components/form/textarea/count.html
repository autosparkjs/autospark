<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Textarea · 清除与计数</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.textarea.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main" x-data="{ memo: '可清除的内容', limited: '' }">
      <div class="auto-card">
        <div class="auto-card-header">clearable：右上角清除钮</div>
        <div class="auto-card-body">
          <p><x-textarea x-model="memo" clearable placeholder="非空时右上角出现清除钮"></x-textarea></p>
          <p class="hint">当前值：{{ memo || '（空）' }} —— 清除会派发 input 事件，x-model 同步回写。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">maxlength 自动显示计数；show-count 显示无上限字数</div>
        <div class="auto-card-body">
          <p><x-textarea x-model="limited" maxlength="60" placeholder="60 字上限（超限染红）"></x-textarea></p>
          <p><x-textarea show-count placeholder="无 maxlength，show-count 只显示当前字数"></x-textarea></p>
          <p class="hint">计数器绝对定位于右下角，不占文本行宽；超出上限整组染 danger 色。</p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
