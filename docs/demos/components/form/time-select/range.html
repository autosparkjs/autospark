<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>TimeSelect · 键盘与状态</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.overlay.js"></script>
    <script src="/autospark/autospark.time-select.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main" style="max-width: 460px">
      <div class="auto-card">
        <div class="auto-card-header">键盘导航（select 同款）</div>
        <div class="auto-card-body">
          <p><x-time-select x-model="kb" start="08:00" end="12:00" step="00:30"></x-time-select></p>
          <p class="hint">
            <code>↑/↓</code> 移动高亮（首尾环绕）、<code>Enter</code> 确认选中并关面板、<code>ESC</code> 关闭（机制继承）。
          </p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">状态色与禁用 / 只读（骨架通道）</div>
        <div class="auto-card-body">
          <p><x-time-select value="09:30" status="success"></x-time-select></p>
          <p><x-time-select value="09:30" disabled="true"></x-time-select></p>
          <p><x-time-select value="09:30" readonly="true"></x-time-select></p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">尺寸档位（主题通道 data-size 挂祖先容器）</div>
        <div class="auto-card-body">
          <p><span data-size="small"><x-time-select value="09:30"></x-time-select></span></p>
          <p><span data-size="large"><x-time-select value="09:30"></x-time-select></span></p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), { kb: "" });
    </script>
  </body>
</html>
