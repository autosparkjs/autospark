<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Checkbox · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.checkbox.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main" x-data="{ agree: false, fruits: ['apple'] }">
      <div class="auto-card">
        <div class="auto-card-header">最小用法：宿主元素 + x-component 实例化，x-model.boolean 双向绑定</div>
        <div class="auto-card-body">
          <p>
            <x-checkbox x-model.boolean="agree" label="我已阅读并同意协议"></x-checkbox>
          </p>
          <p class="hint">当前值：{{ agree }} —— 布尔语域配 <code>x-model.boolean</code> 类型保真；点击文字/盒子任一处切换（真实 label 包裹）。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">半选态（indeterminate，JS 通道）与多选组</div>
        <div class="auto-card-body">
          <p style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap">
            <x-checkbox label="全选（半选）" indeterminate="true"></x-checkbox>
            <x-checkbox x-model.boolean="fruits[0]" label="苹果"></x-checkbox>
            <x-checkbox x-model.boolean="agree" label="同状态联动"></x-checkbox>
          </p>
          <p class="hint">内嵌真 input 即表单提交载体：勾选提交 <code>name=true</code>、未勾选不提交（原生 checkbox 语义）。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">尺寸档位（主题通道 data-size，挂任意祖先容器）</div>
        <div class="auto-card-body">
          <p style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap">
            <span data-size="x-small"><x-checkbox label="xs"></x-checkbox></span>
            <span data-size="small"><x-checkbox label="sm"></x-checkbox></span>
            <span data-size="medium"><x-checkbox label="md（缺省）"></x-checkbox></span>
            <span data-size="large"><x-checkbox label="lg"></x-checkbox></span>
            <span data-size="x-large"><x-checkbox label="xl"></x-checkbox></span>
          </p>
          <p class="hint">盒子 em 基准随 <code>--auto-font-size</code> 档位联动，即时生效（右侧面板调节亦同）。</p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
