<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Checkbox · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.checkbox.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main" x-data="{ agree: false, fruits: ['apple'] }">
      <div class="auto-card">
        <div class="auto-card-header">最小用法：宿主元素 + x-component 实例化，x-model.boolean 双向绑定</div>
        <div class="auto-card-body">
          <p>
            <span x-model.boolean="agree" x-component:autospark.checkbox="{ label: '我已阅读并同意协议' }"></span>
          </p>
          <p class="hint">当前值：{{ agree }} —— 布尔语域配 <code>x-model.boolean</code> 类型保真；点击文字/盒子任一处切换（真实 label 包裹）。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">半选态（indeterminate，JS 通道）与多选组</div>
        <div class="auto-card-body">
          <p style="display: flex; gap: 24px; align-items: center; flex-wrap: wrap">
            <span x-component:autospark.checkbox="{ label: '全选（半选）', indeterminate: true }"></span>
            <span x-model.boolean="fruits[0]" x-component:autospark.checkbox="{ label: '苹果' }"></span>
            <span x-model.boolean="agree" x-component:autospark.checkbox="{ label: '同状态联动' }"></span>
          </p>
          <p class="hint">内嵌真 input 即表单提交载体：勾选提交 <code>name=true</code>、未勾选不提交（原生 checkbox 语义）。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">尺寸档位（主题通道 data-size，挂任意祖先容器）</div>
        <div class="auto-card-body">
          <p style="display: flex; gap: 16px; align-items: center; flex-wrap: wrap">
            <span data-size="x-small"><span x-component:autospark.checkbox="{ label: 'xs' }"></span></span>
            <span data-size="small"><span x-component:autospark.checkbox="{ label: 'sm' }"></span></span>
            <span data-size="medium"><span x-component:autospark.checkbox="{ label: 'md（缺省）' }"></span></span>
            <span data-size="large"><span x-component:autospark.checkbox="{ label: 'lg' }"></span></span>
            <span data-size="x-large"><span x-component:autospark.checkbox="{ label: 'xl' }"></span></span>
          </p>
          <p class="hint">盒子 em 基准随 <code>--auto-font-size</code> 档位联动，即时生效（右侧面板调节亦同）。</p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
