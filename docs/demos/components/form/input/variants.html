<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Input · type 文本族与尺寸档位</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.input.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main" x-data="{ pwd: '' }">
      <div class="auto-card">
        <div class="auto-card-header">password 密码形态（type 透传）</div>
        <div class="auto-card-body">
          <p><x-input x-model="pwd" type="password" placeholder="密码"></x-input></p>
          <p class="hint">密码值：{{ pwd || '（空）' }} —— type 透传原生 input type（原生密码掩码语义）。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">尺寸档位（主题通道 data-size，挂任意祖先容器）</div>
        <div class="auto-card-body">
          <p style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap">
            <span data-size="x-small"><x-input placeholder="xs"></x-input></span>
            <span data-size="small"><x-input placeholder="sm"></x-input></span>
            <span data-size="medium"><x-input placeholder="md（缺省）"></x-input></span>
            <span data-size="large"><x-input placeholder="lg"></x-input></span>
            <span data-size="x-large"><x-input placeholder="xl"></x-input></span>
          </p>
          <p class="hint">高度/内距消费 <code>--auto-input-height</code> / <code>--auto-input-padding</code>，档位联动即时生效（右侧面板调节亦同）。</p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
