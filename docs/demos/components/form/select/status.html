<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Select · 状态色 / 禁用 / x-field 协作</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    
    <script src="/autospark/autospark.overlay.js"></script>
    <script src="/autospark/autospark.select.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    
    <main class="demo-main" style="max-width: 460px">
      <div class="auto-card">
        <div class="auto-card-header">status 状态色（error / warning / success）与禁用/只读</div>
        <div class="auto-card-body">
          <p><x-select value="bj" status="error" :options="cities"></x-select></p>
          <p><x-select value="bj" status="warning" :options="cities"></x-select></p>
          <p><x-select value="bj" status="success" :options="cities"></x-select></p>
          <p><x-select value="bj" disabled="true" :options="cities"></x-select></p>
          <p><x-select value="bj" readonly="true" :options="cities"></x-select></p>
          <p class="hint">状态色染边框与焦点环（field 骨架通道，error 态同步 aria-invalid）；禁用整体淡化 + 不可开；只读可开面板浏览但选项不可选。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">与 x-field 协作（label/校验由指令承担，组件经 status 染色）</div>
        <div class="auto-card-body">
          <form x-form="login" style="display: flex; flex-direction: column; gap: 4px">
            <div x-field="city">
              <label style="font-size: 0.875rem">{{ $field.label }}</label>
              <x-select x-model="login.city" placeholder="请选择城市" :options="cities" :status="$field.error ? 'error' : ''"></x-select>
              <em style="color: #ef4444; font-size: 0.8125rem; font-style: normal; min-height: 1.2em">{{ $field.error }}</em>
            </div>
          </form>
          <p class="hint">表单域声明与校验在 x-form/x-field 层；select 只消费 <code>$field.error</code> 染状态色（不双轨建域）。</p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {
        cities: [
          { label: "北京", value: "bj" },
          { label: "上海", value: "sh" },
          { label: "深圳", value: "sz" },
        ],
        login: { city: "" },
      });
    </script>
  </body>
</html>
