<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Select · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    
    <script src="/autospark/autospark.overlay.js"></script>
    <script src="/autospark/autospark.select.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    
    <main class="demo-main" style="max-width: 460px">
      <div class="auto-card">
        <div class="auto-card-header">最小用法：宿主元素 + x-component 实例化，x-model 双向绑定</div>
        <div class="auto-card-body">
          <p>
            <x-select x-model="city" :options="cities"></x-select>
          </p>
          <p class="hint">当前值：<code>{{ city || '（空）' }}</code> —— 宿主 <code>x-model</code> 直写（值桥协议：el.value 劫持 + input 派发回写）。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">change 事件消费（detail = { value }）与 name 表单提交</div>
        <div class="auto-card-body">
          
          <div @change="picked = $event.detail.value">
            <x-select name="fruit" value="apple" :options="fruits"></x-select>
          </div>
          <p class="hint">最近选择：<code>{{ picked || '（未操作）' }}</code>；宿主 <code>name="fruit"</code> 透传内嵌 hidden 载体——原生表单提交 / FormData 直接生效。</p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {
        city: "sh",
        cities: [
          { label: "北京", value: "bj" },
          { label: "上海", value: "sh" },
          { label: "广州", value: "gz" },
          { label: "深圳", value: "sz" },
          { label: "杭州", value: "hz" },
        ],
        fruits: [
          { label: "苹果", value: "apple" },
          { label: "香蕉", value: "banana" },
          { label: "樱桃", value: "cherry" },
        ],
        picked: "",
      });
    </script>
  </body>
</html>
