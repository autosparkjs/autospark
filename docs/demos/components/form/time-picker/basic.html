<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>TimePicker · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <!-- 时间面板复用 x-popover 指令机制——按需加载场景须同时引入 overlay 产物 -->
    <script src="/autospark/autospark.overlay.js"></script>
    <script src="/autospark/autospark.time-picker.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <!-- 状态经构造器全局状态注入（x-model 绑定值走全局路径） -->
    <main class="demo-main" style="max-width: 460px">
      <div class="auto-card">
        <div class="auto-card-header">最小用法：元素名写法 + x-model 双向绑定</div>
        <div class="auto-card-body">
          <p>
            <x-time-picker x-model="time"></x-time-picker>
          </p>
          <p class="hint">当前值：<code>{{ time || '（空）' }}</code> —— 值语域 "HH:mm"；点选时/分格部分提交（面板保持开，先选时再选分）。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">clearable 可清除 + change 连发（两列连续选择）</div>
        <div class="auto-card-body">
          <!-- engine 根元素上 @事件 绑定不生效——消费监听挂内层包裹元素 -->
          <div @change="picked = $event.detail.value">
            <x-time-picker :value="init" clearable></x-time-picker>
          </div>
          <p class="hint">最近值：<code>{{ picked || '（未操作）' }}</code>；先点时格再点分格会连发两次 change（值确实变了两次）。</p>
        </div>
      </div>
      <div class="auto-card" data-dark>
        <div class="auto-card-header">暗色态（容器 data-dark）</div>
        <div class="auto-card-body">
          <x-time-picker :value="init" clearable></x-time-picker>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {
        time: "",
        init: "09:30",
        picked: "",
      });
    </script>
  </body>
</html>
