<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Slider · 变体</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.slider.js"></script>
    <script src="/autospark/autospark.input-number.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main" x-data="{ rate: 4, temp: 22 }">
      <div class="auto-card">
        <div class="auto-card-header">showInput 数值输入联动（双向同步，须同引 autospark.input-number.js）</div>
        <div class="auto-card-body">
          <p>
            <x-slider x-model.number="rate" min="0" max="10" step="0.5" x-slider-options="{ props: { showInput: true } }"></x-slider>
          </p>
          <p>
            <x-slider x-model.number="temp" min="-10" max="40" x-slider-options="{ props: { showInput: true } }"></x-slider>
          </p>
          <p class="hint">拖动滑块同步输入框；输入框 blur 确认同步滑块。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">状态色 / 禁用 / 只读</div>
        <div class="auto-card-body">
          <p><x-slider status="error" value="85"></x-slider></p>
          <p><x-slider status="success" value="40"></x-slider></p>
          <p><x-slider value="60" disabled="true"></x-slider></p>
          <p><x-slider value="60" readonly="true"></x-slider></p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
