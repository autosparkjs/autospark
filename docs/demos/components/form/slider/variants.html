<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Slider · 变体</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.slider.js"></script>
    <script src="/autospark/autospark.input-number.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main" x-data="{ rate: 4, temp: 22 }">
      <div class="auto-card">
        <div class="auto-card-header">showInput 数值输入联动（双向同步，须同引 autospark.input-number.js）</div>
        <div class="auto-card-body">
          <p>
            <span x-model.number="rate" x-component:autospark.slider="{ min: 0, max: 10, step: 0.5, showInput: true }"></span>
          </p>
          <p>
            <span x-model.number="temp" x-component:autospark.slider="{ min: -10, max: 40, showInput: true }"></span>
          </p>
          <p class="hint">拖动滑块同步输入框；输入框 blur 确认同步滑块。</p>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">状态色 / 禁用 / 只读</div>
        <div class="auto-card-body">
          <p><span x-component:autospark.slider="{ status: 'error', value: 85 }"></span></p>
          <p><span x-component:autospark.slider="{ status: 'success', value: 40 }"></span></p>
          <p><span x-component:autospark.slider="{ value: 60, disabled: true }"></span></p>
          <p><span x-component:autospark.slider="{ value: 60, readonly: true }"></span></p>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
