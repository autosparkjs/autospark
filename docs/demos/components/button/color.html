<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>Button · 语义色</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.button.js"></script>
    <script src="/autospark/theme-controls.js"></script>
</head>
<body>
    <aside class="demo-panel"><theme-controls groups="color,mode"></theme-controls></aside>
    <main class="demo-main">
        <div class="auto-card">
            <div class="auto-card-header">五种语义色（color）</div>
            <div class="auto-card-body">
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <button x-component:autospark.button="{ color: 'primary', label: '默认' }"></button>
                    <button x-component:autospark.button="{ color: 'success', label: '成功' }"></button>
                    <button x-component:autospark.button="{ color: 'warning', label: '警告' }"></button>
                    <button x-component:autospark.button="{ color: 'danger', label: '危险' }"></button>
                    <button x-component:autospark.button="{ color: 'info', label: '信息' }"></button>
                </div>
            </div>
        </div>
        <div class="auto-card">
            <div class="auto-card-header">与任意形态自由组合</div>
            <div class="auto-card-body">
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <button x-component:autospark.button="{ type: 'dashed', color: 'danger', label: '危险虚线' }"></button>
                    <button x-component:autospark.button="{ type: 'secondary', color: 'success', label: '成功次底' }"></button>
                    <button x-component:autospark.button="{ type: 'link', color: 'warning', label: '警告链接' }"></button>
                </div>
                <p class="hint">语义色取 theme 的 <code>--auto-*-color</code> 变量——右侧面板换主题色，primary 系按钮即时跟随。</p>
            </div>
        </div>
    </main>
    <script>
        new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
</body>
</html>
