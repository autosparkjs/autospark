<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>Button · 形态</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.button.js"></script>
    <script src="/autospark/theme-controls.js"></script>
</head>
<body>
    <aside class="demo-panel"><theme-controls groups="color,mode"></theme-controls></aside>
    <main class="demo-main">
        <div class="auto-card">
            <div class="auto-card-header">五种形态（type）</div>
            <div class="auto-card-body">
                <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
                    <button x-component:autospark.button="{ type: 'primary', label: '主按钮' }"></button>
                    <button x-component:autospark.button="{ type: 'secondary', label: '次按钮' }"></button>
                    <button x-component:autospark.button="{ type: 'dashed', label: '虚线按钮' }"></button>
                    <button x-component:autospark.button="{ type: 'text', label: '文本按钮' }"></button>
                    <button x-component:autospark.button="{ type: 'link', label: '链接按钮' }"></button>
                </div>
                <p class="hint">形态只决定「长相」（实底 / 次底 / 虚线 / 纯文本 / 链接），颜色归 <code>color</code> 管。</p>
            </div>
        </div>
    </main>
    <script>
        new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
</body>
</html>
