<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <title>Button · 可勾选</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.button.js"></script>
    <script src="/autospark/theme-controls.js"></script>
</head>
<body>
    <aside class="demo-panel"><theme-controls groups="color,mode"></theme-controls></aside>
    <main class="demo-main" x-data="{ picked: false, onSale: true }">
        <div class="auto-card">
            <div class="auto-card-header">可勾选（checkable + value）：点击自动翻转，勾选态用与 color 匹配的背景色</div>
            <div class="auto-card-body">
                <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                    <span @change="picked = $event.detail.value">
                        <button x-component:autospark.button="{ type: 'secondary', checkable: true, value: picked, label: '仅看优惠' }"></button>
                    </span>
                    <span>picked = <b>{{ picked }}</b></span>
                    <span @change="onSale = $event.detail.value">
                        <button x-component:autospark.button="{ type: 'secondary', color: 'success', checkable: true, value: onSale, label: '仅看现货' }"></button>
                    </span>
                    <span>onSale = <b>{{ onSale }}</b></span>
                </div>
                <p class="hint">
                    受控半双工：显示方向经 props 单向注入（value 变化即跟随），翻转方向点击自动取反并冒泡 change——外层包裹元素一行 <code>@change</code> 回写即得双向（表单集成惯用法，见「事件」一节）。
                </p>
            </div>
        </div>
    </main>
    <script>
        new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
</body>
</html>
