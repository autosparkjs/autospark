<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>Progress · 快速入门</title>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/theme-demo.css" />
    <script src="/autospark/autospark.theme.js"></script>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.progress.js"></script>
    <script src="/autospark/autospark.button.js"></script>
    <script src="/autospark/theme-controls.js"></script>
  </head>
  <body>
    <aside class="demo-panel"><theme-controls></theme-controls></aside>
    <main class="demo-main">
      <div class="auto-card">
        <div class="auto-card-header">line 形态（受控推进 + 完成自动 success）</div>
        <div class="auto-card-body" style="display: flex; flex-direction: column; gap: 14px">
          <div x-data="{ p: 30 }" style="display: flex; align-items: center; gap: 12px">
            <x-progress style="flex: 1" :percent="p"></x-progress>
            <code>{{ p }}%</code>
            <span @click="p = Math.min(100, p + 10)">
              <x-button label="+10" variant="primary" size="sm"></x-button>
            </span>
          </div>
          <x-progress percent="100" status="success"></x-progress>
          <x-progress percent="68" status="error"></x-progress>
          <x-progress percent="45" status="warning"></x-progress>
          <x-progress percent="80" x-progress-options="{ props: { showText: false, strokeWidth: 10 } }"></x-progress>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">circle 形态（SVG 圆环）</div>
        <div class="auto-card-body" style="display: flex; gap: 28px; flex-wrap: wrap; align-items: center">
          <x-progress percent="75" variant="circle"></x-progress>
          <x-progress percent="100" variant="circle" status="success"></x-progress>
          <x-progress percent="55" variant="circle" status="error" x-progress-options="{ props: { strokeWidth: 10 } }"></x-progress>
          <x-progress percent="40" variant="circle" x-progress-options="{ props: { showText: false, strokeWidth: 3 } }"></x-progress>
        </div>
      </div>
      <div class="auto-card">
        <div class="auto-card-header">暗色态（容器 data-dark）</div>
        <div class="auto-card-body">
          <div style="background: #1a1a1a; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px" data-dark>
            <x-progress percent="65"></x-progress>
            <x-progress percent="85" status="error"></x-progress>
            <x-progress percent="45" variant="circle"></x-progress>
          </div>
        </div>
      </div>
    </main>
    <script>
      new AutoSpark(document.querySelector(".demo-main"), {});
    </script>
  </body>
</html>
