<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>messages · 全局 action 与事件</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- 配套 action 三件套（toast / confirm / task，均为内置执行型）：模板任意
             @click 处直接发起，自动注入 anchor = 发起元素。事件双通道：
             引擎总线 message:* + 卡片元素 dispatchEvent；kind='toast' 迁移期
             双发旧事件 toast:show / toast:hide。 -->
        <div class="demo-app section">
            <div x-data="{ size: 'M' }">
                <div class="block">
                    <button class="button is-primary" @click="toast('已保存')">toast action（字符串）</button>
                    <!-- action 参数表达式经 with(data) 求值——payload 里可直接引用 x-data 字段 -->
                    <button
                        class="button is-primary"
                        @click="toast({ type: 'success', title: '已加入购物车（' + size + ' 码）' })"
                    >
                        toast action（对象 · 引用状态）
                    </button>
                    <button class="button is-warning" @click="confirm({ title: '删除这条记录？', yes: '删除', no: '再想想' })">
                        confirm action（结果就近回流）
                    </button>
                </div>
                <div class="block">
                    尺码：
                    <button class="button is-small" @click="size = 'S'">S</button>
                    <button class="button is-small" @click="size = 'M'">M</button>
                    <button class="button is-small" @click="size = 'L'">L</button>
                    <span class="has-text-grey">当前：<b x-text="size"></b></span>
                </div>
            </div>
            <div class="block">
                <button class="button is-light" onclick="app.messages.clear(false)">messages.clear(false) 立即清空</button>
            </div>
            <div class="block">
                <pre id="log" class="has-background-light" style="padding: 8px; max-height: 120px; overflow: auto">事件日志：
</pre>
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            const log = (t) => {
                const pre = document.getElementById("log");
                pre.textContent += `[${t}] ${new Date().toLocaleTimeString()}\n`;
                pre.scrollTop = pre.scrollHeight;
            };
            // 引擎总线回调收 payload { message, el }；message:action 追加 { action, value? }
            app.on("message:show", (m) => log(`message:show  id=${m.payload.message.id}`));
            app.on("message:hide", (m) => log(`message:hide  id=${m.payload.message.id}`));
            app.on("message:action", (m) =>
                log(`message:action  id=${m.payload.message.id} value=${JSON.stringify(m.payload.value)}`),
            );
            // confirm 的结果消费：模板就近监听（anchor 派发根）或总线 message:action 均可
        </script>
    </body>
</html>
