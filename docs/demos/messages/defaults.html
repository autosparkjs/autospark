<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>messages · 全局默认与 kinds</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- 四层合并链：内置默认 < options.messages < kinds[kind] < 单次 props。
             kind 是给每类消息定默认值的钩子——同一次 add 只给 kind，其余走层叠默认。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button" onclick="app.messages.add({ title: '默认 toast（3 秒）' })">kind 缺省（toast）</button>
                <button class="button is-info" onclick="app.messages.add({ title: '站点通知', kind: 'notice' })">
                    kind: notice（sticky + 可关闭）
                </button>
                <button class="button is-warning" onclick="app.messages.add({ title: '记得续费', kind: 'remind' })">
                    kind: remind（默认 warn 色）
                </button>
                <button class="button is-dark" onclick="app.messages.add({ title: '单次覆盖 kind 默认', kind: 'notice', delayClose: 1500, type: 'success' })">
                    单次 props 压过 kinds
                </button>
            </div>
            <div class="block has-text-grey">
                notice 默认 <code>delayClose: 0</code>（sticky）+ <code>closable: true</code>；remind 默认
                <code>type: "warn"</code>——第四个按钮用单次 props 覆盖 kinds 层，观察 1.5 秒自动关与 success 色。
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {}, {
                messages: {
                    kinds: {
                        notice: { delayClose: 0, closable: true }, // 通知：sticky + 手关
                        remind: { type: "warn" },                  // 提醒：默认警示色
                    },
                },
            });
        </script>
    </body>
</html>
