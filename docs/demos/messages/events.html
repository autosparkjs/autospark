<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>messages · 事件族</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- 双通道：引擎总线 message:* + 卡片元素 dispatchEvent（payload { message, el }；
             message:action 追加 { action, value? }）。kind='toast' 迁移期双发
             旧事件 toast:show / toast:hide（notice 不双发）。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button" onclick="fireToast()">发 toast（双发 toast:show）</button>
                <button class="button is-info" onclick="fireNotice()">发 notice（不双发）</button>
                <button class="button is-warning" onclick="fireAction()">带 value 按钮（message:action）</button>
                <button class="button is-light" onclick="clearLog()">清空日志</button>
            </div>
            <div class="block has-text-grey">
                DOM 通道：卡片元素自身也可监听（本页在 document.body 上捕获冒泡的
                <code>message:*</code> 事件，日志中以 [DOM] 标注）。
            </div>
            <div class="block"><pre id="log" class="has-background-light" style="padding: 8px; max-height: 200px; overflow: auto">事件日志：
</pre></div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            const log = (t) => {
                const pre = document.getElementById("log");
                pre.textContent += `${new Date().toLocaleTimeString()}  ${t}\n`;
                pre.scrollTop = pre.scrollHeight;
            };
            const fireToast = () => app.messages.add({ title: "toast 消息", delayClose: 1200 });
            const fireNotice = () => app.messages.add({ title: "notice 消息", kind: "notice", delayClose: 1200, pos: "bottom-right" });
            const fireAction = () =>
                app.messages.add({
                    title: "带按钮的消息",
                    delayClose: 0,
                    actions: [{ title: "确认", value: "ok" }],
                });
            const clearLog = () => (document.getElementById("log").textContent = "事件日志：\n");

            // 总线通道：payload 在 m.payload
            for (const type of ["message:add", "message:update", "message:show", "message:hide", "message:read", "message:status", "message:action"]) {
                app.on(type, (m) => {
                    const extra = type === "message:action" ? `  value=${JSON.stringify(m.payload.value)}` : "";
                    log(`[总线] ${type}  id=${m.payload.message.id}${extra}`);
                });
            }
            // 迁移期双发：仅 kind='toast' 的 show/hide 照发旧事件
            app.on("toast:show", () => log("[总线] toast:show（迁移期双发）"));
            app.on("toast:hide", () => log("[总线] toast:hide（迁移期双发）"));
            // DOM 通道：卡片元素 dispatchEvent（bubbles，body 捕获）
            document.body.addEventListener("message:show", (e) => log("[DOM]   message:show"));
            document.body.addEventListener("message:action", (e) => log("[DOM]   message:action"));
        </script>
    </body>
</html>
