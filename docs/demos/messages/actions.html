<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>messages · 按钮行与数据应答</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- actions 双形态：字符串 = 全局 action 名（沿 anchor scope 链解析，无 anchor 查全局表）；
             对象 = 局部一次性按钮。value 键 = 数据应答（点击写 result + 发 message:action）；
             hide 键默认 true（点击后关卡片），显式 false 续显（「失败重试」场景）。 -->
        <div class="demo-app section">
            <div class="block">
                <button
                    class="button"
                    onclick="app.messages.add({ title: '已删除 3 个文件', type: 'warn', delayClose: 0, actions: [{ title: '撤销', handle: undo }] })"
                >
                    局部按钮（点击后关闭）
                </button>
                <button class="button" onclick="retry()">hide: false 续显（失败重试）</button>
                <button
                    class="button"
                    onclick="app.messages.add({ title: '配置已导出', type: 'success', actions: ['copy'] })"
                >
                    字符串查全局表（copy）
                </button>
                <button class="button is-info" onclick="survey()">value 数据应答（写 result）</button>
            </div>
            <div class="block has-text-grey">
                点击闭环：置已读 → value 写 <code>result</code> → 发 <code>message:action</code> →
                handle 调用 → hide 判定。带按钮时悬停暂停倒计时给你时间点。
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                {},
                {
                    // 字符串形态的解析来源：全局 action 表（title 缺省回退 action 名）
                    actions: {
                        copy: { title: "复制到剪贴板", handle: () => navigator.clipboard?.writeText("exported") },
                    },
                },
            );
            function undo() {
                app.messages.add({ title: "已撤销删除", type: "success" });
            }
            let failed = true;
            function retry() {
                if (failed) {
                    failed = false;
                    app.messages.add({
                        id: "sync",
                        title: "同步失败，请重试",
                        type: "error",
                        delayClose: 0,
                        actions: [{ title: "重试", handle: retry, hide: false }],
                    });
                } else {
                    failed = true;
                    // 同 id 原地更新收尾：换 success + 2 秒自动关
                    app.messages.add({ id: "sync", title: "重试成功", type: "success", delayClose: 2000 });
                }
            }
            function survey() {
                const task = app.messages.add({
                    title: "这个方案你打几分？",
                    delayClose: 0,
                    actions: [
                        { title: "5 分", value: 5, hide: false },
                        { title: "一般", value: 3 },
                    ],
                });
                let voted = false;
                app.on("message:action", (m) => {
                    // value 点击写 result + 发事件；一次性守卫防重复处理
                    if (!voted && m.payload.message.id === task.id && m.payload.value != null) {
                        voted = true;
                        app.messages.update(task.id, { title: `已记录：${m.payload.value} 分`, actions: [] });
                    }
                });
            }
        </script>
    </body>
</html>
