<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>messages · 同 id 原地更新与进度任务</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- 同 id 重复 add = 原地更新：换内容 / 换 type 响应式刷新（不重播动画、
             不重复挂卡），显示中重置 delayClose 满额计时。
             进度任务用 show({ kind: 'task' })——返回 Task 会话（六方法行为句柄）。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button is-primary" id="up-btn" onclick="fakeUpload()">模拟上传（同 id 原地更新）</button>
                <button class="button" id="bar-btn" onclick="exportTask()">导出任务（kind: 'task'）</button>
            </div>
            <div class="block has-text-grey">
                左侧：进度提示用 <code>delayClose: 0</code>（sticky）+ 固定 <code>id</code>，每次调用刷新同一张卡片；
                右侧：<code>show({ kind: 'task' })</code> 创建不自启，<code>start → progress(n)</code> 推进，
                <code>100%</code> 完成态按 delayClose 自动收口。
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            function fakeUpload() {
                const btn = document.getElementById("up-btn");
                btn.disabled = true;
                let p = 0;
                const timer = setInterval(() => {
                    p = Math.min(100, p + 10 + Math.floor(Math.random() * 15));
                    if (p < 100) {
                        app.messages.add({ id: "upload", title: `上传中 ${p}%…`, type: "info", delayClose: 0 });
                    } else {
                        clearInterval(timer);
                        app.messages.add({ id: "upload", title: "上传完成", type: "success", delayClose: 2000 });
                        btn.disabled = false;
                    }
                }, 250);
            }
            function exportTask() {
                const btn = document.getElementById("bar-btn");
                btn.disabled = true;
                const task = app.messages.show({ title: "正在导出…", kind: "task", delayClose: 1500 });
                task.start();
                let p = 0;
                const timer = setInterval(() => {
                    p = Math.min(100, p + 8 + Math.floor(Math.random() * 12));
                    task.progress(p);
                    if (p >= 100) {
                        clearInterval(timer);
                        app.messages.update(task.id, { title: "导出完成", type: "success" });
                        btn.disabled = false;
                    }
                }, 200);
            }
        </script>
    </body>
</html>
