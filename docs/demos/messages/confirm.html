<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>messages · 通用确认（kind='confirm'）</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- show({ kind: 'confirm' })：Confirm 会话（yes/no/cancel 方法 + thenable——await 会话
             直接得 choice 应答）；缺省自动注入「确定/取消」value-only 双钮、sticky 永不自动关、
             永不 reject——超时自行 Promise.race。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button is-primary" onclick="ask()">show({ kind: 'confirm' })</button>
                <button class="button is-warning" onclick="askCustom()">自定义按钮文案（actions）</button>
                <button class="button is-light" onclick="stack()">并发堆叠（连发 3 个确认）</button>
            </div>
            <div class="block has-text-grey">
                await 结果展示在下方——不点击则永远挂起（sticky 永不 settle）；
                非模态：不挡页面其余交互。
            </div>
            <div class="block"><pre id="log" class="has-background-light" style="padding: 8px">结果：尚无选择</pre></div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            const log = (t) => (document.getElementById("log").textContent = t);
            async function ask() {
                log("结果：等待用户选择…（不点则永远挂起）");
                // thenable：await 会话 = 等 choice 应答（yes→true / no→false）
                const ok = await app.messages.show({ title: "确认删除该文件？", kind: "confirm", delayClose: 0 });
                log(`结果：${ok ? "true（删除）" : "false（再想想）"}`);
            }
            async function askCustom() {
                log("结果：等待用户选择…（自定义文案）");
                const ok = await app.messages.show({
                    title: "放弃未保存的修改？",
                    kind: "confirm",
                    delayClose: 0,
                    actions: [
                        { title: "放弃", value: true },
                        { title: "继续编辑", value: false },
                    ],
                });
                log(`结果：${ok}（${ok ? "放弃" : "继续编辑"}）`);
            }
            function stack() {
                log("结果：连发 3 个确认（并发堆叠、各自独立 resolve）");
                for (let i = 1; i <= 3; i++) {
                    app.messages
                        .show({ title: `第 ${i} 项导入有冲突，覆盖？`, kind: "confirm", delayClose: 0, actions: [{ title: "覆盖", value: true }, { title: "跳过", value: false }] })
                        .then((v) => log(`结果：第 ${i} 项 → ${v ? "覆盖" : "跳过"}`));
                }
            }
        </script>
    </body>
</html>
