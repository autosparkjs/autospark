<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-scrollbar · 快速入门</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.scrollbar.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .panel-list {
        height: 200px;
        overflow: auto; /* 约定式：宿主自带滚动容器语义，指令只负责皮肤 */
        border: 1px solid #dcdfe6;
        border-radius: 8px;
        padding: 12px 16px;
      }
      .panel-list p { margin-bottom: 10px; }
      .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <!-- 三种指令值形态：无值恒开 / 表达式响应式 / 字面 false 恒关；鼠标移入面板渐显滚动条 -->
    <div class="demo-app section">
      <div class="demo-grid">
        <div>
          <p class="is-size-7 has-text-grey mb-2">无值恒开</p>
          <div class="panel-list" x-scrollbar x-for="i of rows">
            <p>列表项 {{ i }} —— 移入查看渐显滚动条</p>
          </div>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">表达式控制（ui.on = <span x-text="ui.on"></span>）</p>
          <div class="panel-list" x-scrollbar="ui.on" x-for="i of rows">
            <p>列表项 {{ i }} —— 关闭后原生滚动条回归</p>
          </div>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">恒关（原生滚动条）</p>
          <div class="panel-list" x-scrollbar="false" x-for="i of rows">
            <p>列表项 {{ i }} —— 对照组：默认滚动条</p>
          </div>
        </div>
      </div>
      <div class="block has-text-centered">
        <button class="button is-small" @click="ui.on = !ui.on">切换中间面板</button>
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {
        ui: { on: true },
        rows: Array.from({ length: 18 }, (_, i) => i + 1),
      });
    </script>
  </body>
</html>
