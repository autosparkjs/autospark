<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-scrollbar · 尺寸与颜色</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.scrollbar.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .panel {
        height: 180px;
        overflow: auto;
        border: 1px solid #dcdfe6;
        border-radius: 8px;
        padding: 12px 16px;
      }
      .panel p { margin-bottom: 10px; }
      .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <!-- width 轨道厚度 / thumbWidth 滑块粗细（hover 与拖拽自动增粗）/ color 滑块色 / minSize 滑块最小长度 -->
    <div class="demo-app section">
      <div class="demo-grid">
        <div>
          <p class="is-size-7 has-text-grey mb-2">缺省（width 15 / thumbWidth 6 / 中性灰）</p>
          <div class="panel" x-scrollbar x-for="i of rows">
            <p>列表项 {{ i }} —— 缺省皮肤</p>
          </div>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">加粗主色（width 20 / thumbWidth 9 / 主题色）</p>
          <div class="panel" x-scrollbar x-scrollbar-options="{width:20,thumbWidth:9,color:'#3273dc'}" x-for="i of rows">
            <p>列表项 {{ i }} —— 加粗与主色</p>
          </div>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">minSize 40（内容极多时滑块不小于 40px）</p>
          <div class="panel" x-scrollbar x-scrollbar-options="{minSize:40}" x-for="i of rows200">
            <p>列表项 {{ i }} —— minSize 兜底</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {
        rows: Array.from({ length: 16 }, (_, i) => i + 1),
        rows200: Array.from({ length: 200 }, (_, i) => i + 1),
      });
    </script>
  </body>
</html>
