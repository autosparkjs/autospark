<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-scrollbar · 方向</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.scrollbar.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .panel {
        height: 180px;
        overflow: auto;
        border: 1px solid #dcdfe6;
        border-radius: 8px;
        padding: 12px 16px;
        white-space: nowrap; /* 横向溢出示例：内容不换行 */
      }
      .panel p { margin-bottom: 10px; }
      .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <!-- 双向自动按需：纵向溢出出纵轨、横向溢出出横轨、双向溢出双轨互不重叠；.x/.y 修饰符限定单向 -->
    <div class="demo-app section">
      <div class="demo-grid">
        <div>
          <p class="is-size-7 has-text-grey mb-2">双向溢出（默认 both，双轨自动）</p>
          <div class="panel" x-scrollbar x-for="i of rows14">
            <p>第 {{ i }} 行 —— <span x-for="j of cols8"><em>横向段 {{ (i - 1) * 8 + j }}　</em></span></p>
          </div>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">仅横轨（.x 修饰符限定，纵轨不出现）</p>
          <div class="panel" x-scrollbar.x x-for="i of rows3">
            <p>第 {{ i }} 行 —— <span x-for="j of cols12"><em>横向段 {{ (i - 1) * 12 + j }}　</em></span></p>
          </div>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">仅纵轨（.y 修饰符限定，横轨不出现）</p>
          <div class="panel" x-scrollbar.y style="white-space: normal" x-for="i of rows">
            <p>列表项 {{ i }} —— 纵向内容很长，但横轨被限定关闭</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      const seq = (n) => Array.from({ length: n }, (_, i) => i + 1);
      new AutoSpark(document.querySelector(".demo-app"), {
        rows14: seq(14),
        rows3: seq(3),
        rows: seq(18),
        cols8: seq(8),
        cols12: seq(12),
      });
    </script>
  </body>
</html>
