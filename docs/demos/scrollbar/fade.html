<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-scrollbar · 显隐节奏</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.scrollbar.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .panel {
        height: 180px;
        overflow: auto;
        border: 1px solid #dcdfe6;
        border-radius: 8px;
        padding: 12px 16px;
      }
      .panel p { margin-bottom: 10px; }
      .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <!-- delay 移出后渐隐延迟 / fadeDuration 渐显渐隐过渡时长：左快右慢对照；拖拽与轨道点击期间强制维持显示 -->
    <div class="demo-app section">
      <div class="demo-grid">
        <div>
          <p class="is-size-7 has-text-grey mb-2">快节奏（delay 100 / fadeDuration 100）</p>
          <div class="panel" x-scrollbar x-scrollbar-options="{delay:100,fadeDuration:100}" x-for="i of rows">
            <p>列表项 {{ i }} —— 移出即走</p>
          </div>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">缺省节奏（delay 300 / fadeDuration 200）</p>
          <div class="panel" x-scrollbar x-for="i of rows">
            <p>列表项 {{ i }} —— 平衡节奏</p>
          </div>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">慢节奏（delay 1000 / fadeDuration 600）</p>
          <div class="panel" x-scrollbar x-scrollbar-options="{delay:1000,fadeDuration:600}" x-for="i of rows">
            <p>列表项 {{ i }} —— 流连忘返</p>
          </div>
        </div>
      </div>
      <p class="is-size-7 has-text-grey">
        系统开启「减弱动态效果」时过渡自动停用（直接显隐）；拖拽滑块或点击轨道期间不渐隐。
      </p>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {
        rows: Array.from({ length: 16 }, (_, i) => i + 1),
      });
    </script>
  </body>
</html>
