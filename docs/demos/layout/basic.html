<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-layout · 快速入门</title>
    <script src="/autospark/autospark.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .pane {
        background: #fff;
        border: 1px solid #dbdbdb;
        border-radius: 8px;
        padding: 12px 14px;
        box-sizing: border-box;
        font-size: 13px;
      }
      .pane strong {
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <!-- 快速入门：五窗格默认布局。sidebar 默认可折叠（把手常驻）+ 可拖拽调节宽度 -->
    <div class="demo-app section">
      <div x-data>
        <div class="block has-text-grey is-size-7">
          header / footer 全宽贯穿是缺省态；左右 sidebar
          默认可折叠（圆把手）也可拖内缘调节宽度；content 吸收剩余空间。
        </div>
        <div x-layout x-layout-options="{gap: 8}" style="height: 360px">
          <div class="pane" x-pane:header><strong>header</strong> · 全宽 64px</div>
          <div class="pane" x-pane:sidebar.left>
            <strong>sidebar.left</strong>
            <p class="is-size-7 has-text-grey">
              默认宽 240px；边缘圆把手折叠，拖内缘调宽（拖到 0 自动折叠）
            </p>
          </div>
          <div class="pane" x-pane:content>
            <strong>content</strong>
            <p class="is-size-7 has-text-grey">恒 1fr 吸收剩余空间</p>
          </div>
          <div class="pane" x-pane:sidebar.right><strong>sidebar.right</strong></div>
          <div class="pane" x-pane:footer><strong>footer</strong> · 全宽 64px</div>
        </div>
      </div>
    </div>
    <script>
      new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
