<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-dialog · 字面量（挂载即开）</title>
    <script src="/autospark/autospark.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .ov-panel {
        background: #fff;
        border-radius: 8px;
        padding: 24px;
        min-width: 320px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      }
    </style>
  </head>
  <body>
    <!-- 字面量 true：挂载即开（公告类）；请求关闭仅收起 UI，无状态可回写 -->
    <div class="demo-app section" style="height: 320px">
      <div class="block has-text-grey">
        <code>x-dialog:notice="true"</code>——页面加载即弹出，适合公告 / 通知类对话框。
      </div>
      <div x-data="{}">
        <!-- 组件：公告内容 -->
        <div x-component="notice">
          <div class="ov-panel">
            <h3 class="title is-5">📢 公告</h3>
            <p>这是一个字面量驱动的公告弹窗（页面加载即开）。</p>
            <button class="button is-fullwidth" @click="close()">我知道了</button>
          </div>
        </div>
        <!-- 消费者：字面量 true 挂载即开（宿主任意元素；组件须声明在消费者 scope 链上） -->
        <div x-dialog:notice="true"></div>
      </div>
    </div>
    <script>
      new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
