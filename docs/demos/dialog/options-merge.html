<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>x-dialog · 配置三级深度合并</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            .ov-panel { background: #fff; border-radius: 8px; padding: 24px; min-width: 320px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
        </style>
    </head>
    <body>
        <!-- 配置链（组件 def 不携带配置，全部走消费处）：内置默认 < x-dialog-options < 值对象内联，相邻层深度合并 -->
        <div class="demo-app section">
            <div x-data="{ ui: { open: false } }">
                <div class="block">
                    <button class="button is-primary"
                            x-dialog:cfg="{visible: 'ui.open', closeOnMask: true}"
                            x-dialog-options="{animate: false}"
                            @click="ui.open = true">打开</button>
                </div>
                <div class="block has-text-grey">
                    消费处指令选项 <code>x-dialog-options="{animate: false}"</code> 覆盖内置默认（无动画）；
                    值对象内联 <code>closeOnMask: true</code>（本就等于默认，演示内联层）——最终生效：
                    切换<b>无动画</b>（指令选项层）、遮罩<b>可点关</b>（内联层）。只写想改的键，其余原样保留。
                </div>

                <div x-define="cfg">
                    <div class="ov-panel">
                        <h3 class="title is-5">合并演示</h3>
                        <p>点遮罩可关（内联层）；切换无动画（指令选项层 animate: false 生效）。</p>
                        <button class="button is-fullwidth" @click="close()">关闭</button>
                    </div>
                </div>
            </div>
        </div>
        <script>
            new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
        </script>
    </body>
</html>
