<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-dialog · 远程模板（片段）</title>
    <script src="/autospark/autospark.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
  </head>
  <body>
    <!-- 远程模板（片段）：url 指向无 x-define 的纯 HTML → 片段路径编译，与消费处同 scope -->
    <div class="demo-app section">
      <div x-data="{ ui: { open: false, topic: '远程片段标题', source: '来自消费处 x-data', shared: 0 } }">
        <div class="block">
          <button
            class="button is-link"
            x-dialog:remote-note="ui.open"
            x-dialog-options="{url: '/autospark/components/dialog-note.html'}"
            x-dialog-options.props="{topic: ui.topic}"
            @click="ui.open = true"
          >
            打开远程片段对话框
          </button>
        </div>

        <div class="block">
          <label class="label">props（topic）热更新 —— 打开对话框后改，片段标题即时变化</label>
          <input class="input" x-model="ui.topic" />
        </div>

        <div class="block">
          <label class="label">
            消费处 <code>x-data</code> 的 <code>ui.source</code> ——
            打开对话框后改，片段里 <code>x-text="ui.source"</code> 即时同步
          </label>
          <input class="input" x-model="ui.source" />
        </div>

        <div class="block">
          <label class="label">
            片段与消费处<b>同 scope</b> —— 改这里的 <code>ui.shared</code>，片段里的计数也会变
          </label>
          <button class="button is-small" @click="ui.shared++">消费处 shared +1 → </button>
          <span x-text="ui.shared"></span>
        </div>

        <div class="block has-text-grey is-size-7">
          远程文件 <b>没有</b>任何 <code>x-define</code> 声明，走<b>片段路径</b>编译——
          与消费处<b>同 scope</b>，所以片段模板里可以直接写 <code>x-text="ui.source"</code>
          读消费处状态（外部改了即时同步）；<code>topic</code> 来自 props 注入的响应式 data 域；
          片段内部也可以写 <code>x-data</code> 声明局部状态（scope 继承但局部遮蔽）。
          <b>双通道：消费处 x-data + props 注入，全部共享</b>。
        </div>
      </div>
    </div>
    <script>
      new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
