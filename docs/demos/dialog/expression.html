<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>x-dialog · 表达式驱动</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            .ov-panel { background: #fff; border-radius: 8px; padding: 24px; min-width: 320px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
        </style>
    </head>
    <body>
        <!-- 表达式形态：派生条件驱动（向导场景）。真值即开、假值即关；请求关闭仅 UI 收起、不回写状态 -->
        <div class="demo-app section">
            <div x-data="{ wizard: { step: 1 } }">
                <div class="block">
                    <button class="button" @click="wizard.step = 1">1 填写</button>
                    <button class="button is-primary" x-dialog:pay="wizard.step === 2"
                            @click="wizard.step = 2">2 确认（去支付）</button>
                    <button class="button" @click="wizard.step = 3">3 完成</button>
                    <span class="tag" x-text="'step = ' + wizard.step"></span>
                </div>
                <div class="block has-text-grey">
                    <code>x-dialog:pay="wizard.step === 2"</code>——进入第 2 步自动弹出；面板内「确认」把 step
                    推到 3，表达式归假<b>自动关闭</b>。表达式无路径可回写：ESC / 点遮罩只收起界面、状态保持
                    <code>step = 2</code>——此时再点「2 确认」<b>不会重弹</b>（状态未变化不触发）；
                    先切到其他步、再回第 2 步（假 → 真）才会再次弹出。
                </div>

                <div x-component="pay">
                    <div class="ov-panel">
                        <h3 class="title is-5">确认订单</h3>
                        <p>这是第 2 步的确认弹窗。</p>
                        <button class="button is-primary" @click="wizard.step = 3">确认并进入第 3 步</button>
                    </div>
                </div>
            </div>
        </div>
        <script>
            new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
        </script>
    </body>
</html>
