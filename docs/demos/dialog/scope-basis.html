<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>x-dialog · dataContext 数据视图基准</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            .ov-panel { background: #fff; border-radius: 8px; padding: 24px; min-width: 320px; box-shadow: 0 8px 30px rgba(0,0,0,.18); }
        </style>
    </head>
    <body>
        <!-- dataContext 数据视图基准决定覆盖物实例的数据视图（挂链即基准）：declarer（默认）读声明处；host 读消费处 -->
        <div class="demo-app section">
            <div x-data="{ ui: { openA: false, openB: false }, who: '声明处的数据' }">
                <div class="block">
                    <button class="button" x-dialog:demo="ui.openA" @click="ui.openA = true">打开（默认 declarer）</button>
                </div>
                <div class="block has-text-grey">
                    同一个组件 <code>x-component="demo"</code>，两种基准（挂链即基准）：默认 <code>declarer</code>
                    实例挂<b>声明处</b> scope，读它的 <code>who</code>；<code>dataContext: 'host'</code> 挂<b>消费处</b>
                    scope，读消费处局部域的 <code>who</code>（旧值 <code>'consumer'</code> 已废弃，运行时 warn 并按 host 处理）。
                </div>

                <!-- 组件声明：归属外层 x-data scope（声明处，who = 声明处的数据） -->
                <div x-component="demo">
                    <div class="ov-panel">
                        <h3 class="title is-5">数据来自</h3>
                        <p class="title is-4" x-text="who"></p>
                        <button class="button is-fullwidth" @click="close()">关闭</button>
                    </div>
                </div>

                <!-- 消费处：局部 x-data 遮蔽了外层 who，dataContext: 'host' 的实例挂它（ui.openB 沿祖先链回退外层） -->
                <div x-data="{ who: '消费处的数据（局部域）' }">
                    <div class="block has-text-grey is-size-7">（本区域局部 x-data 声明了同名 who，dataContext: 'host' 读它）</div>
                    <button class="button" x-dialog:demo="{visible: 'ui.openB', dataContext: 'host'}"
                            @click="ui.openB = true">打开（dataContext: 'host'）</button>
                </div>
            </div>
        </div>
        <script>
            new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
        </script>
    </body>
</html>
