<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-spark · 涟漪形态</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.spark.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }
      .spark-card {
        padding: 32px 24px;
        border: 1px solid #dcdfe6;
        border-radius: 12px;
        background: #fff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- 效果族 type:'ripple'（缺省）下的三种涟漪形态 rippleMode：ring / glow / echo -->
    <div class="demo-app section">
      <div class="grid">
        <div class="spark-card" x-spark x-spark-options="{rippleMode: 'ring', speed: 1800}">
          <strong>ring</strong>
          <p class="is-size-7 has-text-grey">外扩环</p>
        </div>
        <div class="spark-card" x-spark x-spark-options="{rippleMode: 'glow', speed: 1800}">
          <strong>glow</strong>
          <p class="is-size-7 has-text-grey">边框光晕呼吸</p>
        </div>
        <div class="spark-card" x-spark x-spark-options="{rippleMode: 'echo', speed: 1800}">
          <strong>echo</strong>
          <p class="is-size-7 has-text-grey">回声双环错相位（默认）</p>
        </div>
      </div>
      <div class="block has-text-grey is-size-7">
        涟漪是 x-spark 的缺省效果族（<code>type: 'ripple'</code> 可省略）；<code>rippleMode</code>
        声明形态——ring / echo 是一圈边框色自边框向外扩散渐隐，glow 是 box-shadow 明暗脉冲不位移，
        echo 以半个周期错相位叠加第二环，一波未平一波又起。
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
