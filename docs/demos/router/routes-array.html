<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>静态数组路由表 + 动态参数</title>
        <script src="/autospark/autospark.js"></script>
        <script src="/autospark/autospark.router.js"></script>
        <script src="/autospark/router-demos/boot.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>

    <body>
        <div class="demo-app section">
            <div class="buttons mb-2">
                <auto-link class="button is-small is-primary" to="/">首页</auto-link>
                <auto-link class="button is-small" to="/about">关于</auto-link>
                <auto-link class="button is-small" to="/user/42?tab=info">用户 42</auto-link>
                <auto-link class="button is-small" to="/user/7?tab=posts">用户 7</auto-link>
            </div>

            <div x-outlet></div>
        </div>

        <script>
            const host = document.querySelector(".demo-app");

            const engine = new AutoSparkSpaces.AutoSpark(host, {}, {
                // 完整路由配置对象形态：mode / base 须与路由表同对象声明（数组形态仅承载路由表）。
                // 文档 demo 环境约定：hash 模式 + 显式 base，iframe 沙箱与直连打开行为一致
                routes: {
                    mode: "hash",
                    base: "/autospark/router-demos/",
                    routes: [
                        { path: "/", title: "首页", view: "/autospark/router-demos/views/home.html" },
                        { path: "/about", title: "关于", view: "/autospark/router-demos/views/about.html" },
                        // 动态参数 :id 与查询串经 $params / $query 注入视图上下文
                        { path: "/user/:id", title: "用户", view: "/autospark/router-demos/views/user.html" },
                    ],
                },
            });
        </script>
    </body>
</html>
