<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>toast · 同 id 原地更新</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- 同 id 重复 toast = 原地更新：换内容 / 换 type 响应式刷新（不重播动画、
             不重复挂卡），显示中重置 delay 满额计时。上传进度是典型场景。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button is-primary" id="up-btn" onclick="fakeUpload()">模拟上传（同 id 原地更新）</button>
            </div>
            <div class="block has-text-grey">
                进度提示用 <code>delay: 0</code>（sticky 永不自动关）+ 固定 <code>id</code>：
                每次调用刷新同一张卡片的内容与 type；完成时换 success 并带 2 秒延时自动收尾。
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            function fakeUpload() {
                const btn = document.getElementById("up-btn");
                btn.disabled = true;
                let p = 0;
                const timer = setInterval(() => {
                    p = Math.min(100, p + 10 + Math.floor(Math.random() * 15));
                    if (p < 100) {
                        app.toast({ id: "upload", message: `上传中 ${p}%…`, type: "info", delay: 0 });
                    } else {
                        clearInterval(timer);
                        app.toast({ id: "upload", message: "上传完成", type: "success", delay: 2000 });
                        btn.disabled = false;
                    }
                }, 250);
            }
        </script>
    </body>
</html>
