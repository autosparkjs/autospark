<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>toast · 视觉定制与自定义 shell</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            /* 语义色换肤：定义在 :root / body 层（容器挂 body 下，业务容器上的变量继承不到） */
            :root {
                --autospark-toast-error-color: #d93025;
                --autospark-toast-success-color: #1e8e3e;
            }
            /* className 主题通道：追加在卡片根的类。引擎样式后注入 head——主题选择器须带
               .autospark-toast 提升 specificity 才能覆盖内置规则（单类同权重会被后声明者压过） */
            .autospark-toast.my-toast-theme {
                border-radius: 999px;
                padding: 8px 18px;
            }
            /* 自定义 shell 的结构自由（props：type/message/icon/actions/closable 预解析注入） */
            .my-toast {
                background: #1f2937;
                color: #fff;
                padding: 10px 16px;
                border-radius: 8px;
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            }
            .my-toast b {
                margin-right: 8px;
            }
            .my-toast .autospark-toast-close {
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div class="demo-app section">
            <div class="block">
                <button class="button" onclick="a.toast({ message: 'className 圆角胶囊主题', type: 'success', className: 'my-toast-theme' })">
                    className 主题
                </button>
                <button class="button" onclick="a.toast({ message: '语义色已按 :root 变量换肤', type: 'error' })">
                    CSS 变量换肤（error 红）
                </button>
            </div>
            <div class="block has-text-grey">
                右侧两个引擎各自独立容器：上面走内置 shell + 主题定制；
                下面整体换自定义 shell（结构骨架全换，引擎契约标记照打）。
            </div>
            <div class="block" id="custom-app">
                <button class="button is-dark">自定义 shell（暗色圆角）</button>
            </div>
        </div>
        <script>
            // 引擎一：内置 shell + className / CSS 变量定制
            const a = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            // 引擎二：toast.shell 指向全局组件表里的自定义结构
            const b = new AutoSparkSpaces.AutoSpark(
                document.getElementById("custom-app"),
                {},
                {
                    components: {
                        // props 注入：type / message / icon / actions / closable（预解析后形态）
                        "my-toast": `<div class="my-toast" :data-toast-type="type"><b x-text="type"></b><span x-html="message"></span></div>`,
                    },
                    toast: { shell: "my-toast", delay: 2500 },
                },
            );
            document.querySelector("#custom-app button").onclick = () =>
                b.toast({ message: "我来自自定义 shell", type: "success" });
        </script>
    </body>
</html>
