<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>toast · 按钮行与关闭钮</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- actions 双形态：字符串 = 全局 action 名（查 engine.actions 解析 title）；
             对象 = 局部一次性按钮（点击直调）。hide 键默认 true（点击后关 toast），
             显式 false 续显（「失败重试」场景）。带按钮时悬停暂停倒计时给你时间点。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button" onclick="app.toast({ message: '已删除 3 个文件', type: 'warn', delay: 0, actions: [{ title: '撤销', handle: undo }] })">
                    局部按钮（点击后关闭）
                </button>
                <button class="button" onclick="retry()">
                    hide: false 续显（失败重试）
                </button>
                <button class="button" onclick="app.toast({ message: '配置已导出', type: 'success', actions: ['copy'] })">
                    字符串查全局表（copy）
                </button>
            </div>
            <div class="block has-text-grey">
                局部按钮不进全局 action 表、不走生命周期广播；字符串形态只查全局表
                （toast 无元素锚点，不支持局部 scope action）。
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                {},
                {
                    // 字符串形态的解析来源：全局 action 表（title 缺省回退 action 名）
                    actions: {
                        copy: { title: "复制到剪贴板", handle: () => navigator.clipboard?.writeText("exported") },
                    },
                },
            );
            function undo() {
                app.toast({ message: "已撤销删除", type: "success" });
            }
            let failed = true;
            function retry() {
                if (failed) {
                    failed = false;
                    app.toast({
                        id: "sync",
                        message: "同步失败，请重试",
                        type: "error",
                        delay: 0,
                        actions: [{ title: "重试", handle: retry, hide: false }],
                    });
                } else {
                    failed = true;
                    // 同 id 原地更新收尾：换 success + 2 秒自动关
                    app.toast({ id: "sync", message: "重试成功", type: "success", delay: 2000 });
                }
            }
        </script>
    </body>
</html>
