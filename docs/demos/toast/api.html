<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>toast · 全局 action 与事件</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- 内置全局 toast action：模板任意 @click 处直接 toast(...)，
             payload 字符串或对象直通 engine.toast。事件双通道：
             引擎总线 toast:show / toast:hide + 卡片元素 dispatchEvent。 -->
        <div class="demo-app section">
            <div x-data="{ size: 'M' }">
                <div class="block">
                    <button class="button is-primary" @click="toast('已保存')">模板发提示（字符串）</button>
                    <!-- action 参数表达式经 with(data) 求值——payload 里可直接引用 x-data 字段 -->
                    <button class="button is-primary" @click="toast({ type: 'success', message: '已加入购物车（' + size + ' 码）' })">
                        模板发提示（对象 · 引用状态）
                    </button>
                </div>
                <div class="block">
                    尺码：
                    <button class="button is-small" @click="size = 'S'">S</button>
                    <button class="button is-small" @click="size = 'M'">M</button>
                    <button class="button is-small" @click="size = 'L'">L</button>
                    <span class="has-text-grey">当前：<b x-text="size"></b></span>
                </div>
            </div>
            <div class="block">
                <button class="button is-light" onclick="app.toastManager.clear(false)">toastManager.clear(false) 立即清空</button>
            </div>
            <div class="block">
                <pre id="log" class="has-background-light" style="padding: 8px; max-height: 120px; overflow: auto">事件日志：
</pre>
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            const log = (t) => {
                const pre = document.getElementById("log");
                pre.textContent += `[${t}] ${new Date().toLocaleTimeString()}\n`;
                pre.scrollTop = pre.scrollHeight;
            };
            // 引擎总线回调收 message 对象，payload 在 m.payload
            app.on("toast:show", (m) => log(`toast:show  id=${m.payload.toast.id}`));
            app.on("toast:hide", (m) => log(`toast:hide  id=${m.payload.toast.id}`));
        </script>
    </body>
</html>
