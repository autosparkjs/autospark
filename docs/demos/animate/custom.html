<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>动画 · 自定义六类名</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            /* 自定义动画 = 按六类名约定写 CSS，传名即用（transition 型） */
            .zoom-enter-from,
            .zoom-leave-to {
                opacity: 0;
                transform: scale(0.6);
            }
            .zoom-enter-active,
            .zoom-leave-active {
                transition:
                    opacity 0.35s ease,
                    transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            }

            /* keyframe 型同样支持：把 -active 指向 @keyframes 即可 */
            .pop-enter-active {
                animation: pop-in 0.4s ease;
            }
            .pop-leave-active {
                animation: pop-out 0.3s ease forwards;
            }
            @keyframes pop-in {
                from {
                    opacity: 0;
                    transform: translateY(16px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes pop-out {
                from {
                    opacity: 1;
                    transform: translateY(0);
                }
                to {
                    opacity: 0;
                    transform: translateY(16px);
                }
            }
        </style>
    </head>

    <body>
        <div class="demo-app section">
            <div class="buttons">
                <button class="button is-primary" @click="toggleZoom">zoom（transition 型）</button>
                <button class="button" @click="togglePop">pop（keyframe 型）</button>
            </div>

            <div x-if="zoom" x-if-options="{animate:'zoom'}" class="notification is-primary">
                zoom：transition 型自定义动画（回弹缩放）
            </div>
            <div x-if="pop" x-if-options="{animate:'pop'}" class="notification is-info">
                pop：keyframe 型自定义动画（弹出/收起）
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                { zoom: true, pop: true },
                {
                    actions: {
                        toggleZoom: () => {
                            engine.state.zoom = !engine.state.zoom;
                        },
                        togglePop: () => {
                            engine.state.pop = !engine.state.pop;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
