<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>插件开发 · 快速入门</title>
    <!-- 引擎先加载；插件脚本随后（本 demo 的插件内联在下方 script 中） -->
    <script src="/autospark/autospark.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .card { border: 1px solid #dcdfe6; border-radius: 12px; padding: 20px; background: #fff; }
      [x-highlight] { background: linear-gradient(transparent 55%, #fff59d 55%); }
    </style>
  </head>
  <body>
    <!-- my-plugin：IIFE 插件本体——形参 $ 即全局 AutoSpark，加载即注册 -->
    <script>
      (function ($) {
          $.components["hello-card"] = "<div class='card' x-text='title'></div>"; // 全局组件
          $.actions["greet"] = () => "hello";                        // 全局 action
          $.directive({                                              // 全局指令（Runtime 通道）
              name: "highlight",
              kind: 1,
              mounted() { this.el.style.fontWeight = "700"; },
          });
          $.icons.add("star", "<svg viewBox='0 0 24 24'><path fill='currentColor' d='M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.2 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8z'/></svg>"); // 全局图标
          $.ready((engine) => {                                      // 就绪回调：拿到引擎实例
              engine.actions["log-ready"] = () => "engine/ready 已触发";
          });
      })(AutoSpark);
    </script>

    <div class="demo-app section" x-data="{ title: '来自插件注册的组件' }">
      <div class="block">
        <button class="button is-primary is-small" @click="greet()">调用插件注册的 greet()</button>
        <span class="tag is-success" x-show="msg" x-text="msg" style="margin-left: 8px"></span>
      </div>
      <div class="block">
        <!-- x-component 实例化插件全局组件；x-highlight 使用插件注册的指令 -->
        <button x-component:hello-card="{ title }" x-highlight @click="greet()"></button>
        <span x-icon="star" style="color: #f59f00; vertical-align: middle"></span>
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), { msg: "" });
    </script>
  </body>
</html>
