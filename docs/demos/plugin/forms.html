<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>插件开发 · 三形态官方样板</title>
    <!-- 引擎 + 三个官方插件脚本（notifications / spark / button 均自举注册，零手动接线） -->
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.notifications.js"></script>
    <script src="/autospark/autospark.spark.js"></script>
    <script src="/autospark/autospark.button.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
  </head>
  <body>
    <div class="demo-app section" x-data="{ count: 0 }">
      <div class="block">
        <!-- 指令插件样板：x-spark -->
        <button class="button is-link" x-spark.hover @click="count++">hover 涟漪（x-spark）</button>
        <!-- 组件插件样板：autospark.button（化身语义，宿主即组件根） -->
        <button x-component:autospark.button="{ label: '组件插件按钮', type: 'primary' }" @click="count++"></button>
        <span class="tag is-info" x-text="'点击计数：' + count" style="margin-left: 8px"></span>
      </div>
      <div class="block">
        <!-- 复合插件样板：notifications（toast action 由插件 ready 时注册） -->
        <button class="button is-small" @click="toast('来自通知插件', { level: 'success' })">toast（notifications）</button>
        <button class="button is-small" @click="toast('任务已开始', { type: 'task', duration: 0 })">task（notifications）</button>
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
