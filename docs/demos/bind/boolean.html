<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-bind · 布尔属性</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>

    <body>
        <!-- :disabled / :checked：值为真 setAttribute、为假 removeAttribute -->
        <div class="demo-app section">
            <div class="buttons">
                <button class="button is-primary" :disabled="saving" @click="save">{{ saving ? "保存中…" : "保存" }}</button>
            </div>
            <div class="block">
                <label class="checkbox">
                    <input type="checkbox" :checked="agree" @click="check" />
                    同意条款（当前：{{ agree ? "是" : "否" }}）
                </label>
            </div>
            <div class="buttons">
                <button class="button is-light" :disabled="!agree">下一步（未同意则禁用）</button>
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                { saving: false, agree: false },
                {
                    actions: {
                        save: async () => {
                            engine.state.saving = true;
                            await new Promise((r) => setTimeout(r, 800));
                            engine.state.saving = false;
                        },
                        check: () => {
                            engine.state.agree = !engine.state.agree;
                        },
                    },
                },
            );
        </script>
    </body>
</html>
