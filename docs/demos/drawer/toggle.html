<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-drawer · 折叠把手（toggle）</title>
    <script src="/autospark/autospark.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .drawer-body {
        padding: 16px 20px;
        box-sizing: border-box;
      }
      .drawer-body h3 {
        margin: 0 0 8px;
      }
      .drawer-body p {
        margin: 0 0 14px;
        color: #666;
        font-size: 13px;
      }
      .fake-sidebar {
        width: 420px;
        height: 200px;
        margin: 60px auto;
        border: 1px solid #dbdbdb;
        border-radius: 6px;
        padding: 14px;
        box-sizing: border-box;
        background: #fafafa;
      }
    </style>
  </head>
  <body>
    <!-- 折叠把手（toggle，默认开启）：骑面板活动边线的常驻圆形按钮（24px），
             点击折叠/展开——折叠 ≡ visible 归假（面板销毁、重开重建）；
             折叠后骑屏幕边（屏幕模式）或锚内侧边（锚定模式）露半圆，
             展开↔折叠把手沿边线同步滑移。toggle: false 显式关闭。 -->
    <div class="demo-app section" style="height: 480px">
      <div x-data>
        <div class="block buttons">
          <button class="button is-primary" x-drawer:right="ui.right" @click="ui.right = true">右侧抽屉（默认带把手）</button>
          <button class="button" x-drawer:left="ui.left" x-drawer-options.at="{placement: 'left'}" @click="ui.left = true">左侧</button>
          <button class="button" x-drawer:top="ui.top" x-drawer-options.at="{placement: 'top'}" @click="ui.top = true">顶部</button>
          <button
            class="button"
            x-drawer:no-toggle="ui.noToggle"
            x-drawer-options="{toggle: false}"
            @click="ui.noToggle = true"
          >
            无把手抽屉（toggle: false）
          </button>
        </div>
        <div class="block has-text-grey is-size-7">
          屏幕模式：折叠后把手骑屏幕边露半圆。也可以直接点面板边线上的圆形把手折叠。
        </div>

        <div class="fake-sidebar" id="sidebar">
          <strong>锚元素 #sidebar</strong>
          <p class="is-size-7 has-text-grey">下方按钮的抽屉贴本侧栏内侧展开，折叠后把手骑侧栏边线露半圆。</p>
          <button class="button is-small" x-drawer:anchored="ui.anchored" x-drawer-options.at="{selector: '/#sidebar', placement: 'right'}" @click="ui.anchored = true">锚定抽屉（贴侧栏内侧，带把手）</button>
        </div>

        <div x-define="right">
          <div class="drawer-body">
            <h3>右侧抽屉</h3>
            <p>点边线上的圆形把手折叠；折叠后把手骑屏幕右缘露半圆，再点展开。</p>
          </div>
        </div>
        <div x-define="left">
          <div class="drawer-body">
            <h3>左侧抽屉</h3>
            <p>把手在面板右边线（开口边），折叠后骑屏幕左缘。</p>
          </div>
        </div>
        <div x-define="top">
          <div class="drawer-body">
            <h3>顶部抽屉</h3>
            <p>把手在面板底边线水平居中。</p>
          </div>
        </div>
        <div x-define="noToggle">
          <div class="drawer-body">
            <h3>无把手抽屉</h3>
            <p>toggle: false——不显示折叠把手，用状态归假 / ESC / close 关闭。</p>
            <button class="button is-small" @click="close()">关闭</button>
          </div>
        </div>
        <div x-define="anchored">
          <div class="drawer-body">
            <h3>锚定抽屉</h3>
            <p>贴 #sidebar 内侧右缘展开；折叠后把手骑侧栏右内缘露半圆。</p>
          </div>
        </div>
      </div>
    </div>
    <script>
      new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {
        ui: { right: false, left: false, top: false, noToggle: false, anchored: false },
      });
    </script>
  </body>
</html>
