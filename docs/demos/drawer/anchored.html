<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-drawer · 元素贴边锚定</title>
    <script src="/autospark/autospark.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .fake-sidebar {
        /* 四周留白：四个方向都有贴锚滑入空间（上下预留 ≥ 默认短轴 320px） */
        width: 560px;
        height: 320px;
        margin: 0 auto;
        margin-bottom: 1em;
        border: 1px solid #dbdbdb;
        border-radius: 6px;
        padding: 14px;
        box-sizing: border-box;
        background: #fafafa;
      }
      .drawer-body {
        padding: 16px 20px;
        box-sizing: border-box;
      }
      .drawer-body h3 {
        margin: 0 0 8px;
      }
      .drawer-body p {
        margin: 0 0 14px;
        color: #666;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <!-- 元素贴边锚定（at.selector 命中）：抽屉贴锚元素对应边外侧滑入，
             长轴 = 锚边长（随锚 resize 重同步），短轴仍走 --autospark-drawer-size。
             placement = 贴锚的边（right/left/top/bottom 四方向演示）；
             锚定 flip 默认关（方向是明确指定）、无箭头；未命中 warn 退屏幕贴边。 -->
    <div class="demo-app section">
      <div x-data>
        <aside class="fake-sidebar" id="sidebar">
          <strong>布局侧栏（锚元素 #sidebar）</strong>
          <p class="is-size-7 has-text-grey">
            抽屉贴本侧栏对应边滑入：长轴 = 侧栏对应边长，短轴 = 默认尺寸。试试四个方向。
          </p>
        </aside>
        <div class="block buttons">
          <!-- 四方向共享同一组件 x-define="filters"，各自独立状态位 + at.placement 差异化 -->
          <button
            class="button is-primary"
            x-drawer:filters="ui.right"
            x-drawer-options.at="{selector: '/#sidebar', placement: 'right'}"
            @click="ui.right = true"
          >
            贴右缘滑入（right）
          </button>
          <button
            class="button is-primary"
            x-drawer:filters="ui.left"
            x-drawer-options.at="{selector: '/#sidebar', placement: 'left'}"
            @click="ui.left = true"
          >
            贴左缘滑入（left）
          </button>
          <button
            class="button is-primary"
            x-drawer:filters="ui.top"
            x-drawer-options.at="{selector: '/#sidebar', placement: 'top'}"
            @click="ui.top = true"
          >
            贴上缘滑入（top）
          </button>
          <button
            class="button is-primary"
            x-drawer:filters="ui.bottom"
            x-drawer-options.at="{selector: '/#sidebar', placement: 'bottom'}"
            @click="ui.bottom = true"
          >
            贴下缘滑入（bottom）
          </button>
          <button
            class="button"
            x-drawer:miss="ui.miss"
            x-drawer-options.at="{selector: '/#not-exists'}"
            @click="ui.miss = true"
          >
            锚未命中示例（warn 退屏幕贴边）
          </button>
        </div>
        <div x-define="filters">
          <div class="drawer-body">
            <h3>贴锚抽屉</h3>
            <p>贴 #sidebar 对应边滑入，长轴沿锚边展开。</p>
            <button class="button is-small" @click="close()">关闭</button>
          </div>
        </div>
        <div x-define="miss">
          <div class="drawer-body">
            <h3>回退抽屉</h3>
            <p>锚未命中：warn 后退屏幕贴边（默认 right）。</p>
            <button class="button is-small" @click="close()">关闭</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {
        ui: { right: false, left: false, top: false, bottom: false, miss: false },
      });
    </script>
  </body>
</html>
