<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>notifications · 持久化（local）</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- persist: 2（local）——localStorage key "autospark-notifications"，记录变更即同步全量写；
             新引擎启动恢复为「已隐藏」态记录（只入枚举不自动重弹），需要时 show(id)。
             persist: 3（remote）同语义走服务器（options.notifications.fetchOptions.url + POST 全量，防抖 500ms）。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button is-info" onclick="spawn()">add({ persist: 2 })</button>
                <button class="button is-warning" onclick="hideAll()">hide() 全部</button>
                <button class="button is-primary" onclick="reload()">模拟刷新（销毁 + 新引擎恢复）</button>
            </div>
            <div class="block has-text-grey">
                刷新后记录恢复为「已隐藏」态（closed=true、不重弹）——恢复的未读已按需 show；
                存储原文见下方。注意：序列化剥函数——内联 handle 不入库（字符串 action 名可恢复）。
            </div>
        </div>
        <pre id="state" class="has-background-light" style="padding: 8px; max-height: 160px; overflow: auto">localStorage：空</pre>
        <script>
            let app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            let seq = Number(localStorage.getItem("demo-seq") || 0);
            const state = document.getElementById("state");

            function dump() {
                const raw = localStorage.getItem("autospark-notifications");
                let lines = "（空）";
                try {
                    const arr = JSON.parse(raw || "[]");
                    if (arr.length) lines = arr.map((r) => `  ${r.id}  title=${r.title}  read=${r.read}`).join("\n");
                } catch {}
                state.textContent = `localStorage["autospark-notifications"]：\n${lines}`;
            }
            function spawn() {
                localStorage.setItem("demo-seq", String(++seq));
                app.notifications.add({
                    id: `memo-${seq}`,
                    title: `待办 ${seq}`,
                    type: "notice",
                    persist: 2,
                    delayClose: 0,
                    pos: "top-right",
                });
                dump();
            }
            function hideAll() {
                for (const t of app.notifications.values()) t.hide();
                setTimeout(dump, 400);
            }
            async function reload() {
                app.destroy(); // destroy 收口：终态 flush
                localStorage.removeItem("demo-seq");
                app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
                // 恢复只入枚举：重弹未读（演示用——按需 show）
                for (const t of app.notifications.values()) if (!t.read) app.notifications.show(t.id);
                dump();
            }
        </script>
    </body>
</html>
