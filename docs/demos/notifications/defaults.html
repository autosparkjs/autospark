<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>notifications · 全局默认与 types</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- 四层合并链：内置默认 < options.notifications < types[type] < 单次 props。
             type 是给每类通知定默认值的钩子——同一次 add 只给 type，其余走层叠默认。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button" onclick="app.notifications.add({ title: '默认 toast（3 秒）' })">type 缺省（toast）</button>
                <button class="button is-info" onclick="app.notifications.add({ title: '站点通知', type: 'notice' })">
                    type: notice（sticky + 可关闭）
                </button>
                <button class="button is-warning" onclick="app.notifications.add({ title: '记得续费', type: 'remind' })">
                    type: remind（默认 warn 色）
                </button>
                <button class="button is-dark" onclick="app.notifications.add({ title: '单次覆盖 type 默认', type: 'notice', delayClose: 1500, level: 'success' })">
                    单次 props 压过 types
                </button>
            </div>
            <div class="block has-text-grey">
                notice 默认 <code>delayClose: 0</code>（sticky；<code>closeable</code> 默认 true 常显 ×）；remind 默认
                <code>level: "warn"</code>——第四个按钮用单次 props 覆盖 types 层，观察 1.5 秒自动关与 success 色。
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {}, {
                notifications: {
                    types: {
                        notice: { delayClose: 0 }, // 通知：sticky（closeable 默认 true 常显 ×）
                        remind: { level: "warn" }, // 提醒：默认警示色
                    },
                },
            });
        </script>
    </body>
</html>
