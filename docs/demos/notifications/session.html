<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>notifications · 组件实例与 methods 直达（ADR-0089）</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- 组件实例（ADR-0089）：add() 恒返回——公共 methods 七件（show/hide/remove/...）；
             Task 另有六方法（start/progress/pause/resume/stop/cancel）；Confirm 有 yes/no。
             模板内 methods 直达（ADR-0089 决策六——$session 派生变量已退役）：@click="progress(66)"。
             styles：内联样式 cssText 写卡片根。persist: 1 会话缓冲（隐藏不删、items 可见）。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button is-primary" onclick="spawnTask()">add({ type: 'task' })</button>
                <button class="button is-info" onclick="spawnConfirm()">add({ type: 'confirm' })</button>
                <button class="button is-warning" onclick="spawnBuffered()">persist: 1 会话缓冲</button>
                <button class="button" onclick="reshowLast()">show() 重显最后一条隐藏</button>
            </div>
            <div class="block">
                <code id="sess-readout" class="is-size-7" x-text="'sessions=' + $notifications.items.filter(r => true).length + ' 条'"></code>
            </div>
            <div class="block has-text-grey is-size-7">
                task 卡片内按钮走 methods 直达 <code>progress(66)</code> / <code>stop()</code>
                （ADR-0089——$session 派生变量已退役）；
                会话缓冲通知 hide 后仍在上面的计数里（管理界面可再查看）。
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                {},
                {
                    // 自定义 task 模板（单层继承 ADR-0095/0097）：继承 task 组件（沿链得 shell 族根
                    // 与 task 状态机 methods）+ 默认出口覆盖段驱动按钮（methods 直达可点；
                    // progress 投影响应式驱动标签）
                    components: {
                        "task-ops": `
                            <div x-define="task-ops" x-define:inherit="autospark.notifications.task">
                                <div class="task-ops field is-grouped" style="margin-top:6px">
                                    <span class="tag is-link" x-text="(progress ?? 0) + '%'"></span>
                                    <button class="button is-small" @click="progress(66)">progress(66)</button>
                                    <button class="button is-small" @click="progress(90)">90%</button>
                                    <button class="button is-small is-danger" @click="stop()">stop()</button>
                                </div>
                            </div>`,
                    },
                    notifications: { types: { task: { render: "task-ops" } } },
                },
            );
            window.app = app;
            let seq = 0;
            window.__lastHidden = null;
            function spawnTask() {
                const s = app.notifications.add({
                    title: `任务 ${++seq}`,
                    type: "task",
                    progress: 10,
                    delayClose: 0, // 进行中 sticky
                    styles: "border-left:3px solid #3273dc",
                });
                s.start();
                window.__lastTask = s;
            }
            function spawnConfirm() {
                const s = app.notifications.add({
                    title: `确认 ${++seq}？`,
                    type: "confirm", // 缺省自动注入「确定/取消」双钮
                    delayClose: 0,
                });
                window.__lastConfirm = s;
            }
            function spawnBuffered() {
                const s = app.notifications.add({
                    title: `缓冲 ${++seq}`,
                    persist: 1, // 会话缓冲：hide 后 items 仍可见、刷新即失
                    delayClose: 1500,
                    pos: "bottom-right",
                });
                window.__lastHidden = s;
            }
            function reshowLast() {
                const cand = window.__lastHidden;
                if (cand && cand.closed) cand.show();
            }
        </script>
    </body>
</html>
