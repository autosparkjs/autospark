<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>notifications · 全局 action 与事件</title>
        <script src="/autospark/autospark.js"></script>
        <script src="/autospark/autospark.notifications.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- 配套 action 三件套（toast / confirm / task，均为内置执行型）：模板任意
             @click 处直接发起，自动注入 anchor = 发起元素。事件双通道：
             引擎总线 notifications/<type>/<id>/<verb>（ADR-0102 分层命名，通配订阅）+ 卡片元素 dispatchEvent。 -->
        <div class="demo-app section">
            <div x-data="{ size: 'M' }">
                <div class="block">
                    <button class="button is-primary" @click="toast('已保存')">toast action（字符串）</button>
                    <!-- action 参数表达式经 with(data) 求值——payload 里可直接引用 x-data 字段 -->
                    <button
                        class="button is-primary"
                        @click="toast({ level: 'success', title: '已加入购物车（' + size + ' 码）' })"
                    >
                        toast action（对象 · 引用状态）
                    </button>
                    <button class="button is-warning" @click="confirm({ title: '删除这条记录？', yes: '删除', no: '再想想' })">
                        confirm action（结果就近回流）
                    </button>
                </div>
                <div class="block">
                    尺码：
                    <button class="button is-small" @click="size = 'S'">S</button>
                    <button class="button is-small" @click="size = 'M'">M</button>
                    <button class="button is-small" @click="size = 'L'">L</button>
                    <span class="has-text-grey">当前：<b x-text="size"></b></span>
                </div>
            </div>
            <div class="block">
                <button class="button is-light" onclick="app.notifications.clear(false)">notifications.clear(false) 立即清空</button>
            </div>
            <div class="block">
                <pre id="log" class="has-background-light" style="padding: 8px; max-height: 120px; overflow: auto">事件日志：
</pre>
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            const log = (t) => {
                const pre = document.getElementById("log");
                pre.textContent += `[${t}] ${new Date().toLocaleTimeString()}\n`;
                pre.scrollTop = pre.scrollHeight;
            };
            // 引擎总线回调收 { type, payload } 信封（payload 在 .payload）；actions 事件追加 { action, value? }
            app.on("notifications/*/*/show", ({ type, payload }) => log(type + "  id=" + payload.notification.id));
            app.on("notifications/*/*/hide", ({ type, payload }) => log(type + "  id=" + payload.notification.id));
            app.on("notifications/*/*/actions/*", ({ type, payload }) =>
                log(type + "  value=" + JSON.stringify(payload.value)),
            );
            // confirm 的结果消费：总线通配 actions 事件（anchor 派发根走具体名，ADR-0102）
        </script>
    </body>
</html>
