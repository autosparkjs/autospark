<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>快速入门 · 确认（confirm）</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- confirm：非模态双钮确认——await 会话直接得用户选择（确定 → true / 取消 → false）。
             yes/no 键定制按钮文案；用户不点则 await 永远挂起（sticky 永不自动关）。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button is-danger" onclick="removeFile()">删除 report.pdf</button>
                <span id="result" class="tag is-light">（未操作）</span>
            </div>
            <div class="block has-text-grey is-size-7">
                <code>await engine.notifications.confirm("…", { yes, no })</code>——编程应答另有
                <code>s.yes() / s.no() / engine.notifications.respond(id, value)</code>。
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            async function removeFile() {
                const ok = await app.notifications.confirm("确认删除 report.pdf？此操作不可恢复。", {
                    yes: "删除",
                    no: "再想想",
                });
                const tag = document.getElementById("result");
                if (ok) {
                    await sleep(400); // 模拟删除请求
                    tag.className = "tag is-danger";
                    tag.textContent = "已删除";
                    app.notifications.toast({ title: "文件已删除", level: "success" });
                } else {
                    tag.className = "tag is-light";
                    tag.textContent = "已取消";
                }
            }
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
        </script>
    </body>
</html>
