<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>notifications · anchor 与局部 action</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- anchor 三职：① actions 字符串沿 anchor scope 链解析局部 action；
             ② notification:action 以 anchor 为根额外派发（发起子树就近消费）；
             ③ 渲染数据视图基准——type render 组件挂链 anchor scope，表达式可访问发起域。
             配套 action（toast/confirm/task）DOM 处使用时自动注入发起元素为 anchor。 -->
        <div class="demo-app section">
            <div class="block" x-data="{ orderNo: 'DD-2026-0930' }" id="order-box">
                <p>订单卡（x-data 域：orderNo=<b x-text="orderNo"></b>）：</p>
                <button class="button is-warning" id="btn1" type="button" onclick="notifyTimeout()">
                    局部 action（沿 anchor 解析）
                </button>
                <button class="button is-info" id="btn2" type="button" @click="notifyView()" @notification:action="onNearby($event.detail)">
                    数据视图（render 挂链发起域）
                </button>
                <span class="tag" x-show="reopened" x-text="'已重开：' + orderNo"></span>
                <script type="autospark/actions">
                    ({
                        reopenOrder: {
                            title: "重新打开订单",
                            handle() { app.store.state.reopened = true },
                        },
                    })
                </script>
            </div>
            <div class="block has-text-grey">
                第一个按钮的 actions 字符串 <code>"reopenOrder"</code> 在 x-data 私有域声明——只沿 anchor
                scope 链可达；第二个按钮走 types[notice].render 自定义组件，表达式读的
                <code>orderNo</code> 来自发起元素的 x-data（anchor 数据视图）。
            </div>
        </div>
        <script>
            // reopened 放全局 state（message 卡片的 action handle 为裸调用、无 this 上下文）
            const app = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                { reopened: false },
                {
                    components: {
                        // anchor 存在时挂链发起 scope：orderNo 来自 #order-box 的 x-data
                        "order-notice": `<div class="my-order-note"><b x-text="orderNo"></b><span x-text="title"></span></div>`,
                    },
                    notifications: { types: { notice: { render: "order-notice" } } },
                },
            );
            const notifyTimeout = () =>
                app.notifications.add({
                    title: "订单已超时",
                    type: "remind", // 无自定义模板——base 默认内容兜底（ADR-0088 type 链末端）
                    actions: ["reopenOrder"],
                    anchor: "#order-box", // 选择器字符串或元素
                    delayClose: 0,
                });
            const notifyView = () =>
                app.notifications.add({
                    title: "（数据视图演示）",
                    type: "notice",
                    anchor: document.getElementById("btn2"),
                    delayClose: 0,
                });
            // 职责②：事件以 anchor 为根额外派发——#btn2 就近监听 @notification:action
            function onNearby(detail) {
                console.log("anchor 侧收到 notification:action:", detail.value);
            }
        </script>
    </body>
</html>
