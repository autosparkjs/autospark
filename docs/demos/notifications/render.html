<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>notifications · 自定义渲染（内容归属）</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            /* type 模板与 shell 两层同权拿到整包数据域 props（ADR-0088 剥函数整包注入）：
               id/type/title/description/icon/actions/closable/link/read/status/result/
               progress/paused/completed + 自定义自有键 + $session 行为通道 */
            .my-notice-extra {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-top: 4px;
            }
            .my-notice-extra .tag {
                font-weight: 700;
                font-size: 11px;
            }
            .my-notice-extra .dim {
                color: #666;
                font-size: 12px;
            }
            .my-notice-extra button {
                border: none;
                background: none;
                color: #2563eb;
                cursor: pointer;
                padding: 0;
                font-size: 13px;
            }
        </style>
    </head>
    <body>
        <!-- 双层组合（ADR-0077 → ADR-0088 内容归属）：shell 管卡片外观（边框/close 钮 + 出口），
             type 模板管全部内容（title/description/actions/专属区）。自定义 type 组件可继承
             autospark.notifications.base（默认内容模板）只覆盖出口段——公共内容零重写；亦可全自绘。
             按钮行经 actions 组件组合（x-component，props 深层触发联动）；$session 为行为通道。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button is-info" onclick="spawn()">type: notice（继承默认内容）</button>
                <button class="button" onclick="app.notifications.add({ title: '普通 toast（内置 shell + base 默认内容）', delayClose: 0, pos: 'bottom-right', closable: true })">
                    type 缺省（内置兜底）
                </button>
            </div>
            <div class="block has-text-grey">
                notice 卡继承 base 默认内容（icon/title/description/actions），覆盖段显示 #type 标签与
                未读标记；点「知道了」（actions 组件按钮行）后 read=true、未读标记即时消失（响应式
                活体，无需重建）。
            </div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                {},
                {
                    components: {
                        // type='notice'：继承默认内容模板（ADR-0081）——裸子节点替换 base 出口
                        // fallback，title/description/actions 零重写
                        "notice-card": `
                            <div x-define="notice-card" x-define:inherit="autospark.notifications.base">
                                <div class="my-notice-extra">
                                    <span class="tag is-info is-light" x-text="'#' + type"></span>
                                    <span class="dim" x-show="!read">未读</span>
                                    <button type="button" @click="$session.remove()">不再提示</button>
                                </div>
                            </div>`,
                    },
                    notifications: { types: { notice: { render: "notice-card", delayClose: 0 } } },
                },
            );
            function spawn() {
                app.notifications.add({
                    title: "明日 10:00 例会改到 14:00",
                    type: "notice",
                    actions: [{ title: "知道了", hide: false }],
                });
            }
        </script>
    </body>
</html>
