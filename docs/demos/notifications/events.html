<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <title>notifications · 事件族（分层命名 + 通配订阅）</title>
        <script src="/autospark/autospark.js"></script>
        <script src="/autospark/autospark.notifications.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!-- ADR-0102 分层命名：notifications/<type>/<id>/<verb>（action = actions/<名>）——emit 恒具体名，
             订阅面 * 配一段 / ** 配尾段；总线回调收 {type,payload} 信封；双通道（总线 + 卡片元素具体名冒泡）。 -->
        <div class="demo-app section">
            <div class="block">
                <button class="button" onclick="fireToast()">发 toast</button>
                <button class="button is-info" onclick="fireNotice()">发 notice（自定义 type）</button>
                <button class="button is-warning" onclick="fireAction()">带 name 按钮（actions/save）</button>
                <button class="button is-primary" onclick="fireTask()">发 task（完整生命周期）</button>
                <button class="button is-light" onclick="clearLog()">清空日志</button>
            </div>
            <div class="block has-text-grey is-size-7">
                <b>每个事件一行</b>，<code>←</code> 后是命中本页的订阅：总线三路
                <code>notifications/**</code>（全收）/ <code>notifications/*/*/hide</code>（verb 过滤）/
                <code>notifications/toast/**</code>（type 过滤）+ DOM 通道（body 捕获具体名冒泡）。
                同一事件被多路订阅命中属正常重叠——真实业务按需订阅一路即可。
                task 演示 <code>closeWhenDone: 2000</code>（完成 2 秒收口；缺省常驻）。
            </div>
            <div class="block"><pre id="log" class="has-background-light" style="padding: 8px; max-height: 260px; overflow: auto">事件日志：
</pre></div>
        </div>
        <script>
            const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
            const logEl = document.getElementById("log");
            const log = (t) => {
                logEl.textContent += `${new Date().toLocaleTimeString("zh-CN", { hour12: false })}  ${t}\n`;
                logEl.scrollTop = logEl.scrollHeight;
            };

            // ── 聚合日志：同一 emit 的多路监听器同步收集，微任务里合并为一行 ──
            const pending = new Map(); // 具体名 → { subs: string[], extra?: string }
            let flushScheduled = false;
            const flush = () => {
                for (const [name, { subs, extra }] of pending) {
                    log(`${name}  ← ${subs.join("、")}${extra ?? ""}`);
                }
                pending.clear();
                flushScheduled = false;
            };
            const collect = (sub) => ({ type, payload }) => {
                const entry = pending.get(type) ?? { subs: [] };
                if (!entry.subs.includes(sub)) entry.subs.push(sub);
                if (payload && payload.value !== undefined && !entry.extra) {
                    entry.extra = `（value=${JSON.stringify(payload.value)}）`;
                }
                pending.set(type, entry);
                if (!flushScheduled) {
                    flushScheduled = true;
                    queueMicrotask(flush);
                }
            };

            // ── 总线三路通配订阅（信封 {type, payload}——payload 在 .payload）──
            app.on("notifications/**", collect("**"));
            app.on("notifications/*/*/hide", collect("verb=hide"));
            app.on("notifications/toast/**", collect("type=toast"));
            // ── DOM 通道：卡片元素具体名冒泡（body 捕获两个示例具体名）──
            document.body.addEventListener("notifications/toast/t1/show", () => collect("DOM")({ type: "notifications/toast/t1/show" }));
            document.body.addEventListener("notifications/toast/a1/actions/save", (e) =>
                collect("DOM")({ type: "notifications/toast/a1/actions/save", payload: { value: e.detail.value } }),
            );

            const fireToast = () => app.notifications.add({ id: "t1", title: "toast 通知", delayClose: 1500 });
            const fireNotice = () =>
                app.notifications.add({ id: "n1", title: "notice 通知", type: "notice", delayClose: 1500, pos: "bottom-right" });
            const fireAction = () =>
                app.notifications.add({
                    id: "a1",
                    title: "带按钮的通知",
                    delayClose: 0,
                    actions: [{ name: "save", title: "保存", value: "ok" }],
                });
            const fireTask = () => {
                const t = app.notifications.task({ id: "k1", title: "任务演示", closeWhenDone: 2000 });
                t.progress(30);
                setTimeout(() => t.progress(70), 300);
                setTimeout(() => t.progress(100), 600); // 完成 → closeWhenDone 2 秒后 hide
            };
            const clearLog = () => (logEl.textContent = "事件日志：\n");
        </script>
    </body>
</html>
