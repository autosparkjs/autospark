<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>notifications · 任务——完整生命周期（自动模式 + 外部控制）</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.notifications.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
  </head>
  <body>
    <!-- ① 完整生命周期（ADR-0104 六控制动词 + 状态机）：创建即 running（首次显示自动补发
         actions/start）→ progress 推进 → completed；页面按钮外部干预 pause 闸门 / resume /
         stop 留卡 / cancel 即关——与卡片自带控制钮同源（同样触发状态机与 actions/<动词> 事件）。
         共同语义：任务态 state ∈ pending/running/paused/stopped/completed；进行中 sticky 不计时；
         终态收口全在 closeWhenDone（delayClose 对 task 无效）；× 是独立 close 动词（非终态先中断）。 -->
    <div class="demo-app section">
      <div class="block">
        <button class="button is-primary" onclick="runFull()">▶ 创建任务：开始 → 完成 → 自动关闭</button>
        <p></p>
        <button class="button is-warning is-small" onclick="gate('pause')">⏸ pause()</button>
        <button class="button is-info is-small" onclick="gate('resume')">▶ resume()</button>
        <button class="button is-dark is-small" onclick="gate('stop')">■ stop()</button>
        <button class="button is-danger is-small" onclick="gate('cancel')">✕ cancel()</button>
        <p class="has-text-grey is-size-7">
          创建即 running（首次显示自动补发 actions/start）；页面按钮与卡片自带控制钮同源——
          同样触发状态机与 <code>actions/&lt;动词&gt;</code> 事件。
        </p>
      </div>
      <div class="block">
        <pre
          id="log"
          class="has-background-light"
          style="padding: 8px; max-height: 300px; overflow: auto"
        >
（点击上方按钮开始任务演示）</pre>
      </div>
    </div>
    <script>
      const app = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
      const logEl = document.getElementById("log");
      const lines = [];
      const log = (t) => {
        lines.push(`[${new Date().toLocaleTimeString("zh-CN", { hour12: false })}] ${t}`);
        logEl.textContent = lines.slice(-14).join("\n");
      };
      let task = null; // 外部控制作用对象（最新完整演示任务）

      function runFull() {
        const t = app.notifications.task({
          title: "正在导出数据…",
          closeWhenDone: 2000, // 终态展示 2 秒后自动收口（缺省 = 常驻；true = 即关）
          canPause: true, // 「暂停 ↔ 恢复」（文案随 state 切换，pause() 闸门生效）
          canStop: true, // 「停止」= abort + stopped 终态留卡
          canCancel: true, // 「取消」= abort + 立即关
        });
        task = t;
        // 控制动词订阅便捷面：卡片上的用户手势（含自动模式的补发 start）全部可观测
        for (const v of ["Start", "Pause", "Resume", "Stop", "Cancel", "Close"]) {
          t["on" + v](() => log(`⇄ actions/${v.toLowerCase()}（${v === "Close" ? "用户点 ×" : v === "Start" ? "自动补发 / 用户手势" : "用户手势"}）`));
        }
        log("创建任务（自动模式创建即 running，首次显示自动补发 actions/start）");
        t.progress(0);
        const timer = setInterval(() => {
          if (t.closed) return clearInterval(timer);
          const st = t.data.state; // 状态机：pending/running/paused/stopped/completed
          if (st === "completed" || st === "stopped") {
            clearInterval(timer);
            log(`${st === "completed" ? "progress(100) = completed" : "stop() → stopped（进度定格于 " + t.data.progress + "%）"}——按 closeWhenDone 2 秒收口`);
            setTimeout(() => t.closed && log(`任务已自动关闭（closed=${t.closed}）——生命周期结束`), 2400);
            return;
          }
          if (st === "paused") {
            t.progress(t.data.progress); // 闸门演示：暂停期间 progress 被忽略
            return;
          }
          const next = Math.min(100, (t.data.progress ?? 0) + 6 + Math.floor(Math.random() * 12));
          t.progress(next);
          if (next < 100) log(`progress(${next}) 推进中…`);
        }, 160);
      }

      /** 外部干预（作用于最新任务） */
      function gate(op) {
        if (!task || task.closed) return log(`（当前无进行中的任务——先点上方创建）`);
        if (op === "pause") {
          task.methods.pause();
          log("⏸ 已暂停：暂停期间 progress() 调用被忽略（闸门语义）");
        } else if (op === "resume") {
          task.methods.resume();
          log("▶ 已恢复：继续接受 progress() 推进");
        } else if (op === "stop") {
          task.methods.stop();
          log("■ 已停止：abortSignal 中断 + 「已停止」终态留卡（进度定格，结果可查）");
        } else if (op === "cancel") {
          task.methods.cancel();
          log("✕ 已取消：abortSignal 中断 + 立即关闭（不留结果）");
        }
      }
    </script>
  </body>
</html>
