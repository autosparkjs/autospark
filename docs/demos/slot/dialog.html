<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x-slot · x-dialog 内容归属</title>
    <script src="/autospark/autospark.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .ov-panel {
        background: #fff;
        border-radius: 8px;
        padding: 24px;
        min-width: 320px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
      }
      .proj {
        padding: 4px 10px;
        background: #fff7e6;
        border: 1px dashed #fa8c16;
        border-radius: 4px;
      }
    </style>
    <!--
            覆盖物内容归属（ADR-0056 决策十修订）：
            - 宿主裸子节点（按钮标签等）**永不收集**——标签只属于按钮；
            - 内容须显式声明：单消费者 `x-slot:*` 标记直写宿主子级，多消费者各套 `x-slots="组件名"` 容器；
            - 容器与标记编译期剪枝，不进运行 DOM；打开时从只读 template 克隆投影；
            - 组件无出口却硬塞内容 → 收集期 warn + 丢弃。
        -->
  </head>
  <body>
    <div id="app">
      <div
        x-data="{ ui: { openConfirm: false, openCfg: false, openSave: false, openCancel: false } }"
        class="demo-app section"
      >
        <!-- ① 单消费者：内容标记直写宿主子级，按钮标签照常留在按钮上 -->
        <div class="block">
          <button
            class="button is-primary"
            x-dialog:confirm="ui.openConfirm"
            @click="ui.openConfirm = true"
          >
            <span class="proj">要删除这份草稿吗？</span>
            打开（内容标记投影）
          </button>
          <span class="is-size-7 has-text-grey ml-2">
            标签「打开…」留在按钮；投影进正文的是橙框里那份标记内容
          </span>
        </div>

        <!-- ② 组件无出口：显式内容被 warn 丢弃，对话框显示固定内容 -->
        <div class="block">
          <button class="button" x-dialog:cfg="ui.openCfg" @click="ui.openCfg = true">
            <span class="proj" x-slot>硬塞的内容（无出口）</span>
            打开（无出口组件）
          </button>
          <span class="is-size-7 has-text-grey ml-2">
            组件无 x-slot 出口 → 显式内容警告丢弃，正文保持固定文案
          </span>
        </div>

        <!-- ③ 多消费者：同一元素声明两个 x-dialog，内容各套归属容器（每按钮只写自己打开的那份） -->
        <div class="block">
          <button
            class="button is-link is-light"
            x-dialog:save="ui.openSave"
            x-dialog:cancel="ui.openCancel"
            @click="ui.openSave = true"
          >
            <template x-slots="save"><span class="proj">保存当前草稿？</span></template>
            打开（save 消费者）
          </button>
          <button
            class="button is-danger is-light ml-2"
            x-dialog:save="ui.openSave"
            x-dialog:cancel="ui.openCancel"
            @click="ui.openCancel = true"
          >
            <template x-slots="cancel"><span class="proj">放弃所有修改？</span></template>
            打开（cancel 消费者）
          </button>
          <span class="is-size-7 has-text-grey ml-2">
            两个按钮都声明 save + cancel 双消费者——各自只投影自己 x-slots 里的内容，互不串台
          </span>
        </div>

        <!-- 有默认出口的组件：正文可被显式标记覆盖 -->
        <div x-define="confirm">
          <div class="ov-panel">
            <h3 class="title is-5">确认</h3>
            <div class="body">
              <div class="proj"><div x-slot>默认正文（无内容时渲染）</div></div>
            </div>
            <button class="button is-fullwidth mt-3" @click="close()">确定</button>
          </div>
        </div>

        <!-- 无出口组件：固定面板内容 -->
        <div x-define="cfg">
          <div class="ov-panel">
            <h3 class="title is-5">配置面板</h3>
            <p>组件未声明任何 x-slot 出口——显式内容已被警告丢弃，按钮标签只留在按钮上。</p>
            <button class="button is-fullwidth mt-3" @click="close()">关闭</button>
          </div>
        </div>

        <!-- 多消费者目标：两个出口，分别被两个按钮的 x-slots 容器填充 -->
        <div x-define="save">
          <div class="ov-panel">
            <h3 class="title is-5">保存</h3>
            <div class="body">
              <div class="proj"><div x-slot>保存默认提示</div></div>
            </div>
            <button class="button is-primary is-fullwidth mt-3" @click="close()">保存</button>
          </div>
        </div>
        <div x-define="cancel">
          <div class="ov-panel">
            <h3 class="title is-5">放弃修改</h3>
            <div class="body">
              <div class="proj"><div x-slot>放弃默认提示</div></div>
            </div>
            <button class="button is-danger is-fullwidth mt-3" @click="close()">放弃</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      new AutoSparkSpaces.AutoSpark(document.getElementById("app"), {});
    </script>
  </body>
</html>
