<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虚拟列表 - 滚动位置绑定</title>
  <script src="/autospark/autospark.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    .list-container {
      height: 300px;
      overflow: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .list-item {
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .list-item:nth-child(odd) { background: #f9f9f9; }
    .item-id { color: #666; font-size: 14px; min-width: 40px; }
    .item-name { flex: 1; }
    .controls { margin-top: 16px; display: flex; gap: 12px; align-items: center; }
    .info { margin-top: 12px; padding: 12px; background: #f0f7ff; border-radius: 8px; }
    button { padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>虚拟列表 - 滚动位置绑定</h2>
  <p>通过 <code>:data-index</code> 实现滚动位置与状态的双向绑定。</p>

  <div id="app">
    <div class="controls">
      <span>跳转到：</span>
      <input type="number" x-model="targetIndex" min="0" max="9999" style="width: 80px;">
      <button @click="scrollTo(targetIndex)">跳转</button>
      <span>当前索引：<strong x-text="currentIndex"></strong></span>
    </div>

    <div class="list-container" 
         x-for.virtual="item of items" 
         :key="item.id"
         :data-index="currentIndex"
         x-for-options="{itemHeight:50}">
      <div class="list-item">
        <span class="item-id">#{{ item.id }}</span>
        <span class="item-name">{{ item.name }}</span>
      </div>
    </div>
  </div>

  <script>
    const items = Array.from({ length: 10000 }, (_, i) => ({
      id: i + 1,
      name: `项目 ${i + 1}`
    }));

    const store = new AutoSparkSpaces.AutoStore({ 
      items, 
      currentIndex: 0,
      targetIndex: 0
    });
    const engine = new AutoSparkSpaces.AutoSpark(
      document.getElementById('app'),
      store,
      { actions: {
        scrollTo(index) { store.state.currentIndex = Number(index) || 0; }
      }}
    );
  </script>
</body>
</html>
