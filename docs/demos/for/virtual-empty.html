<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>虚拟列表 - 空列表与边界</title>
  <script src="/autospark/autospark.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; padding: 20px; }
    .list-container {
      height: 300px;
      overflow: auto;
      border: 1px solid #ddd;
      border-radius: 8px;
    }
    .list-item {
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .list-item:nth-child(odd) { background: #f9f9f9; }
    .item-id { color: #666; font-size: 14px; min-width: 40px; }
    .item-name { flex: 1; }
    .empty-state {
      padding: 40px;
      text-align: center;
      color: #999;
    }
    .controls { margin-top: 16px; display: flex; gap: 12px; }
    button { padding: 8px 16px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>虚拟列表 - 空列表与边界</h2>
  <p>虚拟列表支持空状态（x-empty）和单项列表等边界情况。</p>

  <div id="app">
    <div class="controls">
      <button @click="addItem">添加项</button>
      <button @click="removeItem">移除项</button>
      <button @click="clearAll">清空</button>
      <span>当前项数：<strong x-text="items.length"></strong></span>
    </div>

    <div class="list-container" 
         x-for.virtual="item of items" 
         :key="item.id"
         x-for-options="{itemHeight:50}">
      <div class="list-item">
        <span class="item-id">#{{ item.id }}</span>
        <span class="item-name">{{ item.name }}</span>
      </div>
      <div x-empty class="empty-state">
        暂无数据，请点击上方按钮添加
      </div>
    </div>
  </div>

  <script>
    let nextId = 1;
    const state = { 
      items: [] 
    };
    const engine = new AutoSparkSpaces.AutoSpark(
      document.getElementById('app'), state);

    // 暴露方法给按钮调用
    window.addItem = () => {
      engine.state.items.push({ id: nextId++, name: `项目 ${nextId - 1}` });
    };
    window.removeItem = () => {
      if (engine.state.items.length > 0) {
        engine.state.items.pop();
      }
    };
    window.clearAll = () => {
      engine.state.items = [];
    };
  </script>
</body>
</html>
