<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-for.paging · Load-More 模式</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            .list-item { padding: 8px 0; border-bottom: 1px solid #eee; }
            .load-more { text-align: center; padding: 16px; }
        </style>
    </head>

    <body>
        <div class="demo-app section">
            <h4 class="title is-4">Load-More 模式</h4>
            <p class="mb-4">当 <code>pageCount</code> 返回 <code>0</code> 时，启用无限加载模式。点击"加载更多"追加数据。</p>

            <!-- 列表 -->
            <div class="content">
                <ul x-for.paging="item of orders"
                    :data-paging="paging"
                    x-for-options="{pageSize:5, loader:'loadMore'}">
                    <li class="list-item">
                        <strong>{{ item.id }}</strong> - {{ item.name }}
                    </li>
                </ul>
            </div>

            <!-- 加载更多按钮 -->
            <div class="load-more">
                <button class="button is-primary is-loading" x-show="paging.loading">加载中...</button>
                <button class="button is-primary" x-show="paging.hasMore && !paging.loading"
                        @click="paging.page = Number(paging.page) + 1">
                    加载更多
                </button>
                <p x-show="!paging.hasMore && !paging.loading" class="has-text-grey">没有更多数据了</p>
            </div>

            <div class="tags has-addons mt-3">
                <span class="tag is-link">已加载</span>
                <span class="tag is-light">{{ loaded }} 条</span>
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                {
                    orders: [],
                    paging: { page: 1, pageSize: 5 },
                    loaded: 0
                },
                {
                    actions: {
                        loadMore: async ({ page, pageSize }) => {
                            await new Promise(r => setTimeout(r, 500));

                            const items = [];
                            const start = (page - 1) * pageSize;
                            for (let i = 0; i < pageSize && start + i < 25; i++) {
                                const idx = start + i + 1;
                                items.push({ id: idx, name: `项目 ${idx}` });
                            }
                            // 已加载条数（页偏移 + 本页实际条数）：精确计数由业务侧维护
                            engine.store.state.loaded = start + items.length;

                            return {
                                data: items,
                                page,
                                pageSize,
                                pageCount: 0  // 返回 0 表示总页数未知，启用 load-more
                            };
                        }
                    }
                }
            );
        </script>
    </body>
</html>
