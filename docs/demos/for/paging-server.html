<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-for.paging · 服务端分页</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            .list-item { padding: 8px 0; border-bottom: 1px solid #eee; }
            .status { margin-left: 8px; }
            .status.is-success { color: #48c78e; }
            .status.is-warning { color: #ffdd57; }
            .status.is-info { color: #3e8ed0; }
            .status.is-danger { color: #f14668; }
        </style>
    </head>

    <body>
        <div class="demo-app section">
            <h4 class="title is-4">服务端分页</h4>
            <p class="mb-4">通过 loader action 远程加载数据。使用 /autospark/api/orders.json 作为数据源。</p>

            <!-- 分页列表 -->
            <div class="content">
                <ul x-for.paging="item of orders"
                    :data-paging="paging"
                    x-for-options="{pageSize:5, loader:'loadOrders'}">
                    <li class="list-item">
                        <strong>{{ item.id }}</strong> - {{ item.book }}
                        <span class="status" :class="{
                            'is-success': item.status === '已完成',
                            'is-warning': item.status === '待支付',
                            'is-info': item.status === '已发货',
                            'is-danger': item.status === '已支付'
                        }">{{ item.status }}</span>
                        <span style="float:right">¥{{ item.amount }}</span>
                    </li>
                </ul>
            </div>

            <!-- 翻页按钮 -->
            <div class="buttons">
                <button class="button" @click="paging.page = Number(paging.page) - 1" :disabled="paging.page <= 1">
                    上一页
                </button>
                <button class="button" @click="paging.page = Number(paging.page) + 1" :disabled="!paging.hasMore">
                    下一页
                </button>
            </div>
            <div class="tags has-addons">
                <span class="tag is-link">当前页</span>
                <span class="tag is-light">{{ paging.page }}</span>
                <span class="tag is-info">总页数</span>
                <span class="tag is-light">{{ paging.pageCount }}</span>
                <span class="tag is-success">总条数</span>
                <span class="tag is-light">{{ paging.total }}</span>
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                {
                    orders: [],
                    paging: { page: 1, pageSize: 5 }
                },
                {
                    actions: {
                        loadOrders: async ({ page, pageSize }) => {
                            const res = await fetch(`/autospark/api/orders.json?page=${page}&size=${pageSize}`);
                            const json = await res.json();
                            const { total, items } = json.data;
                            return {
                                data: items,
                                page,
                                pageSize,
                                pageCount: Math.ceil(total / pageSize)
                            };
                        }
                    }
                }
            );
        </script>
    </body>
</html>
