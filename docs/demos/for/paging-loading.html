<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>x-for.paging · 加载状态（x-loading 配合）</title>
    <script src="/autospark/autospark.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .list-item {
        padding: 8px 0;
        border-bottom: 1px solid #eee;
      }
    </style>
  </head>

  <body>
    <div class="demo-app section">
      <h4 class="title is-4">加载状态（x-loading 配合）</h4>
      <p class="mb-4">
        翻页时 loader 执行期间 <code>paging.loading</code> 为 <code>true</code>，
        <code>x-loading</code> 覆盖层遮住列表；<code>delay:300</code> 防止快速请求闪烁。
      </p>

      <!-- x-loading 宿主：覆盖层遮住整个卡片区域；value 指向 :data-paging 绑定对象的 loading 字段 -->
      <div class="card" x-loading="{ value:'paging.loading', message:'正在加载订单…', delay:300 }">
        <div class="card-content">
          <ul
            x-for.paging="item of orders"
            :data-paging="paging"
            x-for-options="{pageSize:5, loader:'loadOrders'}"
          >
            <li class="list-item">
              <strong>{{ item.id }}</strong> - {{ item.book }} - ¥{{ item.amount }}
            </li>
          </ul>
        </div>
      </div>

      <div class="buttons mt-4">
        <button
          class="button"
          @click="paging.page = Number(paging.page) - 1"
          :disabled="paging.page <= 1"
        >
          上一页
        </button>
        <button
          class="button"
          @click="paging.page = Number(paging.page) + 1"
          :disabled="!paging.hasMore"
        >
          下一页
        </button>
      </div>
      <div class="tags has-addons">
        <span class="tag is-link">当前页</span>
        <span class="tag is-light">{{ paging.page }}</span>
        <span class="tag is-info">总页数</span>
        <span class="tag is-light">{{ paging.pageCount }}</span>
      </div>
    </div>

    <script>
      const engine = new AutoSparkSpaces.AutoSpark(
        document.querySelector(".demo-app"),
        {
          orders: [],
          paging: { page: 1, pageSize: 5 },
        },
        {
          actions: {
            // delay=600 模拟慢接口，让覆盖层可见
            loadOrders: async ({ page, pageSize }) => {
              const res = await fetch(
                `/autospark/api/orders.json?page=${page}&size=${pageSize}&delay=1000`,
              );
              const json = await res.json();
              const { total, items } = json.data;
              return {
                data: items,
                page,
                pageSize,
                pageCount: Math.ceil(total / pageSize),
              };
            },
          },
        },
      );
    </script>
  </body>
</html>
