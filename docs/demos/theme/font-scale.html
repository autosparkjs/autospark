<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>字体 · 五档基础量</title>
        <link rel="stylesheet" href="/autospark/autospark-theme.css" />
        <link rel="stylesheet" href="/autospark/theme-demo.css" />
        <script src="/autospark/autospark-theme.js"></script>
        <script src="/autospark/theme-controls.js"></script>
        <script src="/autospark/theme-demo.js"></script>
    </head>

    <body>
        <aside class="demo-panel"><theme-controls></theme-controls></aside>

        <main class="demo-main">
            <div class="auto-card">
                <div class="auto-card-header">字号五档 <code>--x-font-size-*</code></div>
                <div class="auto-card-body col">
                    <div class="auto-card-body-item" style="font-size:var(--x-font-size-x-small);">x-small：道可道，非常道；名可名，非常名。</div>
                    <div class="auto-card-body-item" style="font-size:var(--x-font-size-small);">small：道可道，非常道；名可名，非常名。</div>
                    <div class="auto-card-body-item" style="font-size:var(--x-font-size-medium);">medium：道可道，非常道；名可名，非常名。</div>
                    <div class="auto-card-body-item" style="font-size:var(--x-font-size-large);">large：道可道，非常道；名可名，非常名。</div>
                    <div class="auto-card-body-item" style="font-size:var(--x-font-size-x-large);">x-large：道可道，非常道；名可名，非常名。</div>
                </div>
            </div>

            <div class="auto-card">
                <div class="auto-card-header">字重五档 <code>--x-font-weight-*</code></div>
                <div class="auto-card-body col">
                    <div class="auto-card-body-item" style="font-weight:var(--x-font-weight-x-small);">x-small（200）：道可道，非常道。</div>
                    <div class="auto-card-body-item" style="font-weight:var(--x-font-weight-small);">small（300）：道可道，非常道。</div>
                    <div class="auto-card-body-item" style="font-weight:var(--x-font-weight-medium);">medium（400）：道可道，非常道。</div>
                    <div class="auto-card-body-item" style="font-weight:var(--x-font-weight-large);">large（500）：道可道，非常道。</div>
                    <div class="auto-card-body-item" style="font-weight:var(--x-font-weight-x-large);">x-large（600）：道可道，非常道。</div>
                </div>
            </div>
        </main>

    </body>
</html>
