<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>阴影 · 六档配方</title>
        <link rel="stylesheet" href="/autospark/autospark-theme.css" />
        <link rel="stylesheet" href="/autospark/theme-demo.css" />
        <script src="/autospark/autospark-theme.js"></script>
        <script src="/autospark/theme-controls.js"></script>
        <script src="/autospark/theme-demo.js"></script>
    </head>

    <body>
        <aside class="demo-panel"><theme-controls></theme-controls></aside>

        <main class="demo-main">
            <div class="auto-card">
                <div class="auto-card-header">六档对比（面板切「阴影」观察整页层级变化）</div>
                <div class="auto-card-body col">
                    <div class="grid tight">
                        <div class="cell" style="box-shadow:var(--x-shadow-none);">none<br /><code class="caption">--x-shadow-none</code></div>
                        <div class="cell" style="box-shadow:var(--x-shadow-x-small);">x-small<br /><code class="caption">--x-shadow-x-small</code></div>
                        <div class="cell" style="box-shadow:var(--x-shadow-small);">small<br /><code class="caption">--x-shadow-small</code></div>
                        <div class="cell" style="box-shadow:var(--x-shadow-medium);">medium<br /><code class="caption">--x-shadow-medium</code></div>
                        <div class="cell" style="box-shadow:var(--x-shadow-large);">large<br /><code class="caption">--x-shadow-large</code></div>
                        <div class="cell" style="box-shadow:var(--x-shadow-x-large);">x-large<br /><code class="caption">--x-shadow-x-large</code></div>
                    </div>
                </div>
            </div>
        </main>

    </body>
</html>
