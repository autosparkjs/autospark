<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>派生颜色 · 背景四层</title>
        <link rel="stylesheet" href="/autospark/autospark-theme.css" />
        <link rel="stylesheet" href="/autospark/theme-demo.css" />
        <script src="/autospark/autospark.theme.js"></script>
        <script src="/autospark/theme-controls.js"></script>
        <script src="/autospark/theme-demo.js"></script>
    </head>

    <body>
        <aside class="demo-panel"><theme-controls></theme-controls></aside>

        <main class="demo-main">
            <div class="auto-card">
                <div class="auto-card-header">背景四层：从工作区到内嵌块</div>
                <div class="auto-card-body col">
                    <div style="padding:0.9rem;background:var(--auto-workspace-bgcolor);border:var(--auto-border);border-radius:var(--auto-border-radius);">
                        <div class="caption">--auto-workspace-bgcolor（工作区 / 应用底）</div>
                        <div style="padding:0.9rem;margin-top:0.4rem;background:var(--auto-bgcolor);border:var(--auto-border);border-radius:var(--auto-border-radius);">
                            <div class="caption">--auto-bgcolor（面板 / 卡片）</div>
                            <div style="padding:0.8rem;margin-top:0.4rem;background:var(--auto-secondary-bgcolor);border-radius:var(--auto-border-radius);">
                                <div class="caption">--auto-secondary-bgcolor（次级面板，原料 45% 不透明）</div>
                                <div style="padding:0.6rem;margin-top:0.4rem;background:var(--auto-third-bgcolor);border-radius:var(--auto-border-radius);">
                                    <div class="caption">--auto-third-bgcolor（内嵌块，同一原料 75% 不透明）</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <p class="hint">
                        语义背景以<strong>透明度</strong>区分层次：面板是实色容器，次级与内嵌共用同一原料
                        （<code>--x-bgcolor-2</code>）的两档不透明度——四层阶梯在亮 / 暗 / 多彩下都保持单调。
                    </p>
                </div>
            </div>
        </main>

    </body>
</html>
