<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>字体 · 消费派生量 vs 写死基础量</title>
        <link rel="stylesheet" href="/autospark/autospark-theme.css" />
        <link rel="stylesheet" href="/autospark/theme-demo.css" />
        <script src="/autospark/autospark-theme.js"></script>
        <script src="/autospark/theme-controls.js"></script>
        <script src="/autospark/theme-demo.js"></script>
    </head>

    <body>
        <aside class="demo-panel"><theme-controls></theme-controls></aside>

        <main class="demo-main">
            <div class="auto-card">
                <div class="auto-card-header">自动字体 vs 固定字体（面板切「尺寸」观察差异）</div>
                <div class="auto-card-body row">
                    <div class="auto-card-body-item" style="flex-direction:column;border-color:var(--auto-theme-color);">
                        <div class="caption">自动字体：消费 <code>--auto-font</code>，随全局档位联动</div>
                        <div style="font:var(--auto-font);">
                            道可道，非常道；名可名，非常名。无名天地之始，有名万物之母。故常无欲，以观其妙；常有欲，以观其徼（jiào）。
                        </div>
                    </div>
                    <div class="auto-card-body-item" style="flex-direction:column;">
                        <div class="caption">固定字体：写死 <code>--x-font-* medium</code>，不随档位变化</div>
                        <div style="font-weight:var(--x-font-weight-medium);font-size:var(--x-font-size-medium);line-height:1.5;">
                            道可道，非常道；名可名，非常名。无名天地之始，有名万物之母。故常无欲，以观其妙；常有欲，以观其徼（jiào）。
                        </div>
                    </div>
                </div>
                <div class="auto-card-body col">
                    <p class="hint">
                        两者初始观感相同（全局默认 medium）；把面板「尺寸」切到 <code>x-small</code> 或
                        <code>x-large</code>：左侧整体缩放、右侧不动——这就是消费派生量与写死基础量的本质区别。
                    </p>
                </div>
            </div>
        </main>

    </body>
</html>
