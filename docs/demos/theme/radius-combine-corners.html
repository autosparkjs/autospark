<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>圆角 · 组合四角</title>
        <link rel="stylesheet" href="/autospark/autospark-theme.css" />
        <link rel="stylesheet" href="/autospark/theme-demo.css" />
        <script src="/autospark/autospark-theme.js"></script>
        <script src="/autospark/theme-controls.js"></script>
        <script src="/autospark/theme-demo.js"></script>
    </head>

    <body>
        <aside class="demo-panel"><theme-controls></theme-controls></aside>

        <main class="demo-main">
            <div class="auto-card">
                <div class="auto-card-header">四角组合：只圆顶部（卡片头形态）</div>
                <div class="auto-card-body col">
                    <div style="border:var(--auto-border);border-radius:var(--auto-border-radius);overflow:hidden;">
                        <div style="padding:0.6em 1em;background:var(--auto-panel-header-bgcolor);font:var(--auto-panel-header);">
                            顶部两角圆、底部两角直
                        </div>
                        <div style="padding:0.8em 1em;background:var(--auto-bgcolor);">
                            border-radius: var(--auto-border-radius) var(--auto-border-radius) 0 0
                        </div>
                    </div>
                    <div class="auto-card-body-item" style="justify-content:center;height:3rem;border-radius:var(--x-border-radius-large) 0 var(--x-border-radius-large) 0;background:var(--auto-selected-bgcolor);border:1px solid var(--auto-selected-border-color);">
                        对角圆：large 0 large 0
                    </div>
                </div>
            </div>
        </main>

    </body>
</html>
