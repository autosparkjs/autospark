<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>组件变量 · 完整示例</title>
        <link rel="stylesheet" href="/autospark/autospark-theme.css" />
        <link rel="stylesheet" href="/autospark/theme-demo.css" />
        <script src="/autospark/autospark.theme.js"></script>
        <script src="/autospark/theme-controls.js"></script>
        <script src="/autospark/theme-demo.js"></script>
    </head>

    <body>
        <aside class="demo-panel"><theme-controls></theme-controls></aside>

        <main class="demo-main">
            <div class="auto-card">
                <div class="auto-card-header">完整示例：<code>.auto-card</code> + <code>.auto-input</code> + <code>.auto-btn</code></div>
                <div class="auto-card-body col">
                    <div class="auto-card border">
                        <div class="auto-card-header">
                            <span class="auto-card-title">标题</span>
                            <span class="closeable"></span>
                        </div>
                        <div class="auto-card-body">
                            <div class="auto-input">
                                <span class="auto-input-action">https://</span>
                                <input placeholder="域名" />
                                <span class="auto-input-action"><button>前往</button></span>
                            </div>
                        </div>
                        <div class="auto-card-footer">
                            <button class="auto-btn primary">确定</button>
                            <button class="auto-btn">取消</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </body>
</html>
