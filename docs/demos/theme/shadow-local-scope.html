<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>阴影 · 局部换档</title>
        <link rel="stylesheet" href="/autospark/autospark-theme.css" />
        <link rel="stylesheet" href="/autospark/theme-demo.css" />
        <script src="/autospark/autospark-theme.js"></script>
        <script src="/autospark/theme-controls.js"></script>
        <script src="/autospark/theme-demo.js"></script>
    </head>

    <body>
        <aside class="demo-panel"><theme-controls></theme-controls></aside>

        <main class="demo-main">
            <div class="auto-card">
                <div class="auto-card-header">元素域：<code>data-shadow</code> 局部换档</div>
                <div class="auto-card-body row">
                    <div class="scope-box" data-shadow="none">
                        <div class="box-label">data-shadow="none"（扁平）</div>
                        <div class="cell" style="box-shadow:var(--auto-shadow);">--auto-shadow</div>
                    </div>
                    <div class="scope-box" data-shadow="x-large">
                        <div class="box-label">data-shadow="x-large"（浮起）</div>
                        <div class="cell" style="box-shadow:var(--auto-shadow);">--auto-shadow</div>
                    </div>
                    <div class="scope-box" data-dark data-shadow="x-large">
                        <div class="box-label">data-dark + data-shadow="x-large"</div>
                        <div class="cell" style="box-shadow:var(--auto-shadow);">--auto-shadow</div>
                    </div>
                </div>
                <div class="auto-card-body col">
                    <p class="hint">
                        <code>data-size</code> 也会换 <code>--auto-shadow</code>（尺寸档位含阴影档）——
                        若同时挂 <code>data-size</code> 与 <code>data-shadow</code>，后者胜出（档位块带 <code>!important</code>）。
                    </p>
                </div>
            </div>
        </main>

    </body>
</html>
