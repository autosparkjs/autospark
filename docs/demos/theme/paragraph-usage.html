<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>组件变量 · 段落 · 内容层级</title>
        <link rel="stylesheet" href="/autospark/autospark-theme.css" />
        <link rel="stylesheet" href="/autospark/theme-demo.css" />
        <script src="/autospark/autospark.theme.js"></script>
        <script src="/autospark/theme-controls.js"></script>
        <script src="/autospark/theme-demo.js"></script>
    </head>

    <body>
        <aside class="demo-panel"><theme-controls></theme-controls></aside>

        <main class="demo-main">
            <div class="auto-card">
                <div class="auto-card-header">真实文档场景：通知列表的段落层级</div>
                <div class="auto-card-body col">
                    <div class="demo-sample">
                        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:1rem;">
                            <span style="color:var(--auto-color);font-weight:600;">构建任务 #128 完成</span>
                            <span class="caption">3 分钟前</span>
                        </div>
                        <div class="demo-sample-sub" style="line-height:var(--auto-line-height);letter-spacing:var(--auto-letter-spacing);">
                            产物已发布到测试环境，回归用例 412/412 通过。段落行高与字距都取自
                            <code>--auto-line-height</code> / <code>--auto-letter-spacing</code>，随全局尺寸档整体联动。
                        </div>
                    </div>
                </div>
            </div>
        </main>

    </body>
</html>
