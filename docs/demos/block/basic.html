<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-block · 布局与伸缩比值</title>
    <script src="/autospark/autospark.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .blk {
        border: 1px solid #dbdbdb;
        border-radius: 8px;
        padding: 6px 10px;
        gap: 8px;
      }
      .blk .title {
        white-space: nowrap;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body style="overflow:auto">
    <div class="demo-app section">
      <div x-data="{ dir: 'row' }">
        <div class="block has-text-grey is-size-7">
          子元素默认不伸不缩；<code>data-grow</code> 的标题吸收剩余空间（空间不足时它不收缩、和其余子元素一样照常折叠）。
          切换方向观察换轴。
        </div>
        <div class="field is-grouped">
          <button class="button is-small" @click="dir = 'row'" :class="{ 'is-link': dir === 'row' }">row</button>
          <button class="button is-small" @click="dir = 'column'" :class="{ 'is-link': dir === 'column' }">column</button>
        </div>
        <div class="blk" x-block="dir" style="width: 460px">
          <span class="title" data-grow>自动扩大的标题——吸收剩余空间</span>
          <button class="button is-small">保存</button>
          <button class="button is-small">取消</button>
          <button class="button is-small">删除</button>
        </div>
      </div>
    </div>
    <script>
      new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
