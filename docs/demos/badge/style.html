<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-badge · 形态与动画</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.badge.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .demo-card {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 16px;
        border: 1px solid #dcdfe6;
        border-radius: 8px;
      }
      .demo-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 8px; align-items: flex-start; }
      .demo-grid > div { display: flex; flex-direction: column; gap: 8px; }
      /* 独立状态点：空宿主 + dot，自定义底色容器 */
      .status-dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; background: #f0f2f5; }
    </style>
  </head>
  <body>
    <!-- ripple 脉冲（dot 为 SMIL 扩散环 / count 为 CSS 扩散环）/ 自定义色 / 独立状态点 / 运行时动态挂载 -->
    <div class="demo-app section">
      <div class="demo-grid">
        <div>
          <p class="is-size-7 has-text-grey mb-2">脉冲动画（x-badge.ripple）</p>
          <span class="demo-card">
            <button class="button is-small" x-badge.ripple>dot</button>
            <button class="button is-small" x-badge.count.ripple="likes">count</button>
          </span>
          <p class="is-size-7 has-text-grey">与 x-ripple 点击涟漪同词不同面：此处是常驻脉冲</p>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">自定义色（color 走 CSS 颜色值）</p>
          <span class="demo-card">
            <button class="button is-small" x-badge x-badge-options="{color:'#00b578'}">dot</button>
            <button class="button is-small" x-badge.count="msgs" x-badge-options="{color:'#3273dc'}">count</button>
          </span>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">独立状态点（空宿主 + dot）</p>
          <span class="demo-card">
            <span class="status-dot" x-badge></span>
            <span class="status-dot" x-badge x-badge-options="{color:'#00b578'}"></span>
          </span>
        </div>
        <div>
          <p class="is-size-7 has-text-grey mb-2">运行时动态挂载（Runtime 通道）</p>
          <span class="demo-card">
            <button class="button is-small" id="runtime-host">动态宿主</button>
            <button class="button is-small is-primary" @click="toggleRuntime()">setAttribute / removeAttribute</button>
          </span>
        </div>
      </div>
    </div>
    <script>
      // 方法走构造期 options.actions（state 函数会被 AutoStore 当 computed——构造期求值产生副作用）
      new AutoSpark(
        document.querySelector(".demo-app"),
        { likes: 6, msgs: 130 },
        {
          actions: {
            toggleRuntime() {
              const host = document.getElementById("runtime-host");
              if (host.hasAttribute("x-badge")) host.removeAttribute("x-badge");
              else host.setAttribute("x-badge", "msgs"); // 挂载即生效（不走编译）
            },
          },
        },
      );
    </script>
  </body>
</html>
