<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-spin · 触发器</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.spin.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
      .spin-card {
        padding: 36px 24px;
        border: 1px solid #dcdfe6;
        border-radius: 12px;
        background: #fff;
        text-align: center;
      }
      .hover-hint { cursor: pointer; }
    </style>
  </head>
  <body>
    <!-- always 挂载即播；hover 悬停旋转、移出播完当前圈再停；click 点击转一圈后自动停止 -->
    <div class="demo-app section">
      <div class="grid">
        <div class="spin-card" x-spin x-spin-options="{trigger: 'always', speed: 1800}">
          <strong>always</strong>
          <p class="is-size-7 has-text-grey">挂载后持续循环（默认）</p>
        </div>
        <div class="spin-card hover-hint" x-spin x-spin-options="{trigger: 'hover', speed: 1500}">
          <strong>hover</strong>
          <p class="is-size-7 has-text-grey">鼠标悬停旋转，移出播完当前圈再停</p>
        </div>
        <div class="spin-card hover-hint" x-spin.click x-spin-options="{speed: 1200}">
          <strong>click</strong>
          <p class="is-size-7 has-text-grey">点击转一圈后自动停止，再点重播（修饰符速记）</p>
        </div>
        <div class="spin-card hover-hint" x-spin.chase.click x-spin-options="{speed: 1500}">
          <strong>chase + click（级联链）</strong>
          <p class="is-size-7 has-text-grey">形态 × 触发器修饰符级联：x-spin.chase.click（次序无关）</p>
        </div>
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
