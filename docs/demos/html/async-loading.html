<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-html · 远程异步 HTML 源 · x-loading 三种配合</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>

    <body>
        <!-- 远程异步 HTML 源（ADR-0035 / ADR-0122）· 加载反馈对照：x-loading 覆盖层与 x-if 条件渲染的配合。
             每块「重新加载」按钮改写 url 插值（t={tick} query 变化 → 自动重取，延迟 1.5s）——
             重取期间旧内容保留，加载过程清晰可见。x-html 元键 $loading/$error 写宿主 locals，
             宿主内子元素经 scope 链可读（成功态写 innerHTML 会清空内部子元素）。 -->
        <div class="demo-app section">
            <!-- 块 A：无 x-if 条件渲染 → 默认合成 x-loading 覆盖层（盖在旧内容上，旧值保留） -->
            <div class="card">
                <div class="card-content">
                    <div class="heading has-text-grey">块 A · 默认合成覆盖层</div>
                    <div class="block" x-html="/autospark/api/card-zh.html?delay=1500&t={aTick}"></div>
                    <div class="buttons">
                        <button class="button is-primary is-small" @click="reloadA">重新加载</button>
                    </div>
                </div>
            </div>

            <!-- 块 B：x-if 条件渲染 + loading:{...} 显式并存——首载由 x-if 占位；
                 重取时 x-if 不闪现（保旧值），覆盖层显式叠加（自定义文案） -->
            <div class="card">
                <div class="card-content">
                    <div class="heading has-text-grey">块 B · x-if 条件渲染 + loading 显式并存</div>
                    <div class="block"
                        x-html="/autospark/api/card-zh.html?delay=1500&t={bTick}"
                        x-html-options="{loading:{message:'正在重新加载片段…', color:'#ffffff'}}">
                        <div class="notification is-warning is-light" x-if="$loading">⏳ 首次加载…</div>
                    </div>
                    <div class="buttons">
                        <button class="button is-primary is-small" @click="reloadB">重新加载</button>
                    </div>
                </div>
            </div>

            <!-- 块 C：loading:false 恒关——无覆盖层无 x-if，加载过程无任何自动指示（对比） -->
            <div class="card">
                <div class="card-content">
                    <div class="heading has-text-grey">块 C · loading:false 恒关（对比）</div>
                    <div class="block"
                        x-html="/autospark/api/card-zh.html?delay=1500&t={cTick}"
                        x-html-options="{loading:false}"></div>
                    <div class="buttons">
                        <button class="button is-primary is-small" @click="reloadC">重新加载</button>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                // 三个 tick 独立驱动各自块的 url 变化（t query → 重取）
                { aTick: 0, bTick: 0, cTick: 0 },
                {
                    actions: {
                        reloadA: function () { this.globalState.aTick = this.globalState.aTick + 1; },
                        reloadB: function () { this.globalState.bTick = this.globalState.bTick + 1; },
                        reloadC: function () { this.globalState.cTick = this.globalState.cTick + 1; },
                    },
                },
            );
        </script>
    </body>
</html>
