<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-icon · 值的两形态</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>

    <body>
        <div class="demo-app section" style="max-width: 560px">
            <h1 class="title is-5">值与通道：响应式切换</h1>
            <p class="subtitle is-6">值是表达式：图标名随状态切换，渲染即时跟随</p>

            <template x-icons>
                <svg id="heart" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                <svg id="star" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11.5 3.8 9 8.8l-5.5.8 4 3.9-1 5.5 5-2.7 5 2.7-1-5.5 4-3.9-5.5-.8Z"/></svg>
                <svg id="check" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 6 9 17l-5-5"/></svg>
                <svg id="bell" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
            </template>

            <div class="box">
                <span class="icon-text" style="font-size: 24px">
                    <!-- 值是表达式：求值结果作为图标名（沿图标域解析） -->
                    <span x-icon="current"></span>
                    <span style="font-size: 14px">current = <code x-text="current"></code></span>
                </span>
            </div>

            <div class="buttons">
                <button class="button is-light" @click="current='heart'">heart</button>
                <button class="button is-light" @click="current='star'">star</button>
                <button class="button is-light" @click="current='check'">check</button>
                <button class="button is-light" @click="current='bell'">bell</button>
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {
                current: "heart",
            });
        </script>
    </body>
</html>
