<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-field · 声明字段：控件形态（= x-model 全部语义）</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>

    <body>
        <!-- 控件形态：x-field 直接声明在标准控件上——行为与 x-model 完全一致（双向绑定 /
             修饰符 / 元数据自动注入 / name 自动注入），表单内不必再写 x-model -->
        <div class="demo-app section">
            <form x-form="reg">
                <div class="field">
                    <label class="label">用户名（placeholder 由 schema 自动注入）</label>
                    <div class="control">
                        <input class="input" x-field="username" />
                    </div>
                </div>
                <div class="field">
                    <label class="label">年龄（.number 修饰符：输入 "18" 写回数字）</label>
                    <div class="control">
                        <input class="input" x-field.number="age" />
                    </div>
                    <p class="help">
                        state 值 = <strong x-text="JSON.stringify(reg.age)"></strong>（数字而非字符串）
                    </p>
                </div>
                <div class="field">
                    <label class="label">城市（select 控件形态，静态选项）</label>
                    <div class="control">
                        <div class="select">
                            <select x-field="city">
                                <option value="qz">泉州</option>
                                <option value="xm">厦门</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="field">
                    <label class="checkbox">
                        <input type="checkbox" x-field="agree" />
                        同意条款（checkbox 布尔语义）
                    </label>
                </div>
                <p class="help">
                    getState() = <strong x-text="JSON.stringify($form.getState())"></strong>
                </p>
            </form>
        </div>

        <script>
            const { configurable } = AutoSparkSpaces;
            new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {
                reg: {
                    username: configurable("", {
                        label: "用户名",
                        placeholder: "请输入用户名",
                    }),
                    age: configurable(18, { label: "年龄", widget: "number" }),
                    city: configurable("qz", { label: "城市" }),
                    agree: configurable(false, { label: "同意条款" }),
                },
            });
        </script>
    </body>
</html>
