<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-ripple · 尺寸与节奏</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.ripple.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; align-items: center; }
      .ripple-card {
        padding: 32px 24px;
        border: 1px solid #dcdfe6;
        border-radius: 12px;
        background: #fff;
        text-align: center;
      }
      .ripple-circle {
        width: 120px;
        height: 120px;
        margin: 0 auto;
        border-radius: 50%;
        background: #fff;
        border: 1px solid #dcdfe6;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <!-- size 扩散距离 / speed 周期 / gap 静止段；border-radius: inherit 自动贴合宿主圆角 -->
    <div class="demo-app section">
      <div class="grid">
        <div class="ripple-card" x-ripple x-ripple-options="{size: 6, speed: 1200}">
          <strong>size: 6</strong>
          <p class="is-size-7 has-text-grey">近距快速涟漪</p>
        </div>
        <div class="ripple-card" x-ripple x-ripple-options="{size: 24, speed: 2400, gap: 800}">
          <strong>size: 24 · gap: 800</strong>
          <p class="is-size-7 has-text-grey">远距慢速 + 周期间静止</p>
        </div>
        <div class="ripple-circle" x-ripple x-ripple-options="{size: 16, speed: 1600}">
          <span class="is-size-7 has-text-grey">圆角 50%</span>
        </div>
      </div>
      <div class="block has-text-grey is-size-7">
        涟漪载体 <code>border-radius: inherit</code> 自动贴合宿主圆角——50% 圆与局部圆角一致生效，无需配置。
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
