<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>x-ripple · 载体与降级</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.ripple.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; }
      .ripple-card {
        padding: 32px 24px;
        border: 1px solid #dcdfe6;
        border-radius: 12px;
        background: #fff;
        text-align: center;
      }
      /* 宿主自身占用 ::after 伪元素（装饰角标）→ 涟漪自动降级为子元素载体 */
      .occupied { position: relative; }
      .occupied::after {
        content: "NEW";
        position: absolute;
        top: -10px;
        right: -10px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #f56c6c;
        color: #fff;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!-- 伪元素优先零 DOM 侵入；宿主 ::after 被占用时自动注入 absolute 子元素承载涟漪 -->
    <div class="demo-app section">
      <div class="grid">
        <div class="ripple-card" x-ripple x-ripple-options="{speed: 1800}">
          <strong>伪元素载体</strong>
          <p class="is-size-7 has-text-grey">默认形态，零 DOM 侵入</p>
        </div>
        <div class="ripple-card occupied" x-ripple x-ripple-options="{speed: 1800}">
          <strong>自动降级</strong>
          <p class="is-size-7 has-text-grey">宿主 ::after 被占用（角标）→ 注入子元素</p>
        </div>
      </div>
      <div class="block has-text-grey is-size-7">
        探测纯自动（<code>getComputedStyle(el, '::after').content</code>），无配置项；降级子元素
        <code>position: absolute</code> 脱离文档流，不参与 flex/gap 布局。
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
