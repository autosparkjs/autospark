<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-define:inherit · 链式继承</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            .demo-card {
                border: 1px solid #dbdbdb;
                border-radius: 6px;
                padding: 12px 16px;
                margin-bottom: 12px;
                max-width: 460px;
            }
            .demo-card .bd {
                line-height: 1.8;
            }
            .badge {
                display: inline-block;
                font-size: 0.75em;
                padding: 1px 8px;
                border-radius: 999px;
                background: #ededed;
                margin-right: 6px;
            }
            .b1 { background: #eef3ff; }
            .b2 { background: #effaf1; }
            .b3 { background: #fff5f7; }
        </style>
    </head>
    <body>
        <!--
            链式继承（ADR-0081）：base-card ← mid-card ← order-card 逐层递归展开——
            子有效定义 = 父已解析定义 + 本层覆盖。三个组件各自独立实例化：
            每层实例只累积到自己的层级（父快照不被变异，mid-card 不受 order-card 影响）。
        -->
        <div id="app" x-scope>
            <!-- 第 1 层：基础卡 -->
            <div x-define="base-card">
                <div class="demo-card">
                    <div class="bd" x-slot>
                        <span class="badge b1">1</span>{{ baseMsg }}
                    </div>
                </div>
                <script type="autospark/setup">
                    {
                        data: { baseMsg: 'base-card：默认出口 fallback', count: 0 },
                        methods: {
                            inc() {
                                this.data.count += 1;
                            },
                        },
                    }
                </script>
            </div>

            <!-- 第 2 层：继承 base-card，覆盖默认出口 -->
            <div x-define="mid-card" x-define:inherit="base-card">
                <div>
                    <span class="badge b1">1</span>{{ baseMsg }}<br />
                    <span class="badge b2">2</span>{{ midMsg }}
                </div>
                <script type="autospark/setup">
                    {
                        data: { midMsg: 'mid-card：覆盖默认出口 + 新增 data' },
                    }
                </script>
            </div>

            <!-- 第 3 层：继承 mid-card（链式展开到 base-card），再覆盖 -->
            <div x-define="order-card" x-define:inherit="mid-card">
                <div>
                    <span class="badge b1">1</span>{{ baseMsg }}<br />
                    <span class="badge b2">2</span>{{ midMsg }}<br />
                    <span class="badge b3">3</span>{{ orderMsg }}（count={{ count }}）
                    <button class="button is-small" x-on:click="inc">调用第 1 层方法 +1</button>
                </div>
                <script type="autospark/setup">
                    {
                        data: { orderMsg: 'order-card：三层数据全可见' },
                    }
                </script>
            </div>

            <div class="panel">
                <p><b>第 1 层实例化：</b>仅自身定义</p>
                <div x-component:base-card></div>
            </div>
            <div class="panel">
                <p><b>第 2 层实例化：</b>累积 1+2 层（不受第 3 层影响——父快照不被变异）</p>
                <div x-component:mid-card></div>
            </div>
            <div class="panel">
                <p><b>第 3 层实例化：</b>链式展开到根——三层模板与 data 全累积，方法跨层可用</p>
                <div x-component:order-card></div>
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(document.getElementById("app"), {});
        </script>
    </body>
</html>
