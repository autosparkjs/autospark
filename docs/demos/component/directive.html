<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Directive 特性 · x-组件名称 实例化组件</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <div id="app" x-scope>
            <!-- 声明组件 counter -->
            <div x-define="counter">
                <div class="counter">
                    <button class="button is-small" x-on:click="dec">−</button>
                    <span class="count" x-text="count"></span>
                    <button class="button is-small is-primary" x-on:click="inc">+</button>
                </div>
                <script type="autospark/setup">
                    {
                        data: { count: 0, step: 1 },
                        methods: {
                            inc() { this.data.count += this.data.step },
                            dec() { this.data.count -= this.data.step },
                        },
                    }
                </script>
                <style>
                    .counter {
                        display: inline-flex;
                        align-items: center;
                        gap: 10px;
                        padding: 8px 14px;
                        border: 1px solid #dbdbdb;
                        border-radius: 8px;
                        background: #fafafa;
                    }
                    .count {
                        min-width: 48px;
                        text-align: center;
                        font-weight: 700;
                        font-size: 1.25rem;
                    }
                </style>
            </div>

            <!-- 使用 directive 实例化 -->
            <div class="panel">
                <div class="label">Directive 写法：&lt;x-counter&gt;</div>
                <x-counter></x-counter>
            </div>

            <!-- 传统写法对比 -->
            <div class="panel">
                <div class="label">传统写法：x-component:counter</div>
                <div x-component:counter></div>
            </div>

            <!-- 带 props 的 directive -->
            <div class="panel">
                <div class="label">Directive + props</div>
                <x-counter x-component-options="{ count: 100 }"></x-counter>
            </div>
        </div>

        <script>
            // 注册 directive，将 <x-counter> 转换为 x-component:counter
            // 元素名指令须用类重载（spec 重载不支持 elementName）
            class CounterDirective extends AutoSparkSpaces.AutoSparkDirectiveBase {
                static elementName = "x-counter";
                static kind = 0;
                created() {
                    this.el.setAttribute("x-component:counter", "");
                    this.el.removeAttribute("x-counter");
                }
            }
            AutoSparkSpaces.AutoSpark.directive("counter", CounterDirective);

            const engine = new AutoSparkSpaces.AutoSpark(document.getElementById("app"), {});
        </script>

        <style>
            .panel {
                padding: 16px;
                border: 1px solid #dbdbdb;
                border-radius: 8px;
                margin-bottom: 12px;
            }
            .label {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 8px;
            }
        </style>
    </body>
</html>
