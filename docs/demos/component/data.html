<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-define · 组件数据 data</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!--
            组件数据 data（ADR-0057）：组件实例的响应式数据域。
            - data 注入响应式域：改 this.data.<键> 驱动模板更新；
            - setup 顶层变量（如 timer）：非响应式私有变量，经 this.<键> 读写、跨生命周期共享，
              改了不触发更新（适合定时器句柄、缓存、防抖标记）；
            - 模板表达式读不到顶层私有变量（{{timer}} 无效）——它是组件私有的。
            本 demo：data.time 驱动时钟显示，顶层 timer 跨 created/mounted/beforeUnmount 共享定时器句柄。
        -->
        <div id="app" x-scope>
            <div x-define="clock">
                <div class="clock">
                    <span class="time" x-text="time"></span>
                    <span class="hint">（data.time 驱动，每秒刷新）</span>
                </div>
                <script type="autospark/setup">
                    {
                        data: { time: new Date().toLocaleTimeString() },
                        // 顶层私有变量：非响应式、不进模板，跨生命周期共享
                        timer: null,
                        mounted() {
                            // 启动定时器，句柄存顶层私有变量 timer（非响应式，不该触发更新）
                            this.timer = setInterval(() => {
                                this.data.time = new Date().toLocaleTimeString();
                            }, 1000);
                        },
                        beforeUnmount() {
                            // 清理：读取 timer（watcher 仍活，可读最终状态）
                            clearInterval(this.timer);
                        },
                    }
                </script>
                <style>
                    .clock {
                        padding: 12px 16px;
                        background: #f5f9ff;
                        border-left: 3px solid #3273dc;
                        border-radius: 4px;
                        font-family: monospace;
                        font-size: 1.1rem;
                    }
                    .time {
                        font-weight: 700;
                        color: #3273dc;
                    }
                    .hint {
                        color: #888;
                        font-size: 0.8rem;
                        margin-left: 8px;
                    }
                </style>
            </div>

            <div class="panel">
                <div class="label">顶层 timer 跨生命周期共享：mounted 启动、beforeUnmount 清理</div>
                <label class="checkbox">
                    <input type="checkbox" x-model="running" />
                    挂载时钟组件（取消勾选触发 beforeUnmount → clearInterval）
                </label>
            </div>

            <div class="panel">
                <div x-if="running"><div x-component:clock></div></div>
                <div x-if="!running" class="unmounted">时钟已卸载（timer 已清理）</div>
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(document.getElementById("app"), {
                running: true,
            });
        </script>

        <style>
            .panel {
                padding: 16px;
                border: 1px solid #dbdbdb;
                border-radius: 8px;
                margin-bottom: 12px;
            }
            .label {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 8px;
            }
            .unmounted {
                padding: 12px 16px;
                color: #888;
                font-style: italic;
            }
        </style>
    </body>
</html>
