<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-define · x-component 实例化与 props</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!--
            x-component 实例化组件 + props 注入（ADR-0054）：
            - 组件名走属性参数（x-component:greeting），值专职 props；
            - 无值 = 无 props（用 state() 默认值）；
            - 静态字面量：x-component:greeting="{who:'张三'}"；
            - 绑定响应式状态对象：x-component:greeting="form"——对象按键展开为 props，
              状态内部键变化（如输入框改 form.who）实时更新组件（单向：外部 → 组件）；
            - 合并顺序：state() 默认先注入，props 后覆盖（外部优先）；
            - 属性继承：宿主 class 与组件根 class 拼接。
            组件内部状态（用户交互改的 hits）不被外部 props 重置——props 更新只覆盖出现的键。
        -->
        <div id="app" x-scope>
            <!-- 组件声明 -->
            <div x-define="greeting" class="greet-root">
                <div class="greeting">
                    <span x-text="who"></span>，你好！已被点击 <span x-text="hits"></span> 次。
                </div>
                <button class="button is-small" x-on:click="hit">点我 +1</button>
                <script type="autospark/setup">
                    {
                        // state() 默认状态：who 与 hits
                        state() {
                            return { who: "匿名", hits: 0 };
                        },
                        methods: {
                            // 内部方法改的是组件内部状态 hits（单向数据流：不回写外部）
                            hit() {
                                this.data.hits++;
                            },
                        },
                    }
                </script>
                <style>
                    .greeting {
                        display: inline-block;
                        padding: 6px 12px;
                        background: #f5f5f5;
                        border-radius: 6px;
                    }
                </style>
            </div>

            <!-- ① 无值实例化：用 state() 默认值（who=匿名） -->
            <div class="panel">
                <div class="label">① 无 props 实例化（who 用默认值"匿名"）</div>
                <div x-component:greeting></div>
            </div>

            <!-- ② 静态字面量 props：who 覆盖默认值；宿主 host-cls 与组件根 greet-root 的 class 拼接 -->
            <div class="panel">
                <div class="label">② 静态字面量 props：who=张三（覆盖默认），宿主 class 与组件根 class 拼接</div>
                <div x-component:greeting="{ who: '张三' }" class="host-cls"></div>
            </div>

            <!-- ③ 绑定响应式状态对象：form 按键展开为 props，输入框改 form.who 实时更新组件 -->
            <div class="panel">
                <div class="label">③ 响应式 props：绑定状态对象 form（按键展开，输入实时同步）</div>
                <div class="field has-addons">
                    <input class="input is-small" x-model="form.who" placeholder="输入名字试试" />
                </div>
                <div x-component:greeting="form" class="host-cls"></div>
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(document.getElementById("app"), {
                form: { who: "李四" },
            });
        </script>

        <style>
            .panel {
                padding: 16px;
                border: 1px solid #dbdbdb;
                border-radius: 8px;
                margin-bottom: 12px;
            }
            .label {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 8px;
            }
            /* 宿主 class + 组件根 class 拼接后，两者样式都生效 */
            .host-cls {
                background: #eef6ff;
            }
            .greet-root {
                padding: 8px;
                border-radius: 8px;
            }
        </style>
    </body>
</html>
