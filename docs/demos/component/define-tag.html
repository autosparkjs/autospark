<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-define-options.tag · 元素名组件</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!--
            元素名组件（ADR-0117）：组件**缺省开启**元素名形态——定义后即可以元素标签
            直接实例化，<x-counter> 与 <div x-component:counter> 完全等价；
            x-define-options.tag 仅用于自定义标签或 false 显式关闭。
            - 静态属性即 props：count="100" 类型推断为 number；
            - :step="step" 响应式 props：外部状态 step 变了，组件内随动；
            - @bump 事件监听：组件方法内 this.emit('bump', {...}) 发射，$event.detail 取载荷；
            - 保留属性（class/style/id/data-*/x-*）不折叠为 props，留给宿主化身。
        -->
        <div id="app" x-data="{ step: 5, bumpLog: [] }">
            <!-- 组件声明①：缺省开启——无需任何选项，标签自动推导为 <x-counter>（编译后声明从 DOM 消失） -->
            <div x-define="counter">
                <span class="tag is-info is-medium" x-text="count"></span>
                <button class="button is-small is-primary" x-on:click="inc">+step</button>
                <script setup>
                    {
                        data: { count: 0, step: 1 },
                        methods: {
                            inc() {
                                this.data.count += this.data.step;
                                this.emit('bump', { count: this.data.count });
                            },
                        },
                    }
                </script>
            </div>

            <!-- 组件声明②：自定义标签 → <my-rating> -->
            <div x-define="rating" x-define-options="{ tag: 'my-rating' }">
                <span class="stars" x-text="'★'.repeat(value) + '☆'.repeat(5 - value)"></span>
                <script setup>{ data: { value: 0 } }</script>
            </div>

            <!-- A：静态属性即 props（类型推断：count/step 均为 number；class 保留给宿主） -->
            <div class="panel">
                <div class="label">① 静态属性即 props：<code>&lt;x-counter count="100" step="5"&gt;</code></div>
                <x-counter count="100" step="5" class="counter-row"></x-counter>
            </div>

            <!-- B：:step 响应式 props + @bump 事件监听 -->
            <div class="panel">
                <div class="label">
                    ② 响应式 props + 事件：<code>&lt;x-counter :step="step" @bump="bumpLog.push($event.detail.count)"&gt;</code>
                    ——点下面「step 调大 5」再点组件内 +step，观察步数变化与事件日志
                </div>
                <x-counter :step="step" @bump="bumpLog.push($event.detail.count)" class="counter-row"></x-counter>
                <button class="button is-small is-info" x-on:click="step = step + 5">step 调大 5（当前 step = <span x-text="step"></span>）</button>
                <p class="log">事件日志（@bump 收到的 detail.count）：<span x-text="bumpLog.length ? bumpLog.join(' → ') : '（空）'"></span></p>
            </div>

            <!-- C：自定义标签 -->
            <div class="panel">
                <div class="label">③ 自定义标签：<code>&lt;my-rating value="4"&gt;</code>（tag: 'my-rating'）</div>
                <my-rating value="4"></my-rating>
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(document.getElementById("app"), {});
        </script>

        <style>
            .panel {
                padding: 16px;
                border: 1px solid #dbdbdb;
                border-radius: 8px;
                margin: 12px 0;
            }
            .label {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 8px;
            }
            .counter-row {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                margin-right: 12px;
                margin-bottom: 8px;
            }
            .log {
                font-size: 0.85rem;
                color: #555;
                margin-top: 8px;
            }
            .stars {
                color: #ff9f43;
                font-size: 1.2rem;
                letter-spacing: 2px;
            }
        </style>
    </body>
</html>
