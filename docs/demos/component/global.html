<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-define · 全局组件</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
    </head>
    <body>
        <!--
            全局组件：在 engine 构造选项 options.components 声明，全引擎复用。
            字符串入参按顶级节点数自动包装为「恰好一个带 x-define 的根元素」：
            - 单顶级元素无 x-define → 根打本 key 名
            - 多顶级节点 → 包一层 <div x-define="name">
            - 已含 x-define → 尊重原值
            - 纯文本 → 包成 <div x-define="name">文本
            全局组件支持 <script type="autospark/setup">（data/methods/hooks）与 <style>，懒预编译缓存。
        -->
        <div id="app" x-scope>
            <div class="panel">
                <div class="label">全局组件 card（含 &lt;script setup&gt; + props 注入）</div>
                <div x-component:card="{title: '全局卡片', desc: '经 options.components 声明' }"></div>
            </div>
            <div class="panel">
                <div class="label">全局组件 tag（纯文本入参自动包装）</div>
                <div x-component:tag></div>
            </div>
        </div>

        <script>
            const engine = new AutoSparkSpaces.AutoSpark(
                document.getElementById("app"),
                {},
                {
                    components: {
                        // 多顶级节点（title + desc）自动包一层 div，含 <script type="autospark/setup"> 与 <style>
                        card: `
                            <div class="card-wrap">
                                <div class="card-title" x-text="title"></div>
                                <div class="card-desc" x-text="desc"></div>
                            </div>
                            <script type="autospark/setup">{
                                data: { title: '默认标题', desc: '默认描述' }
                            }<\/script>
                            <style>
                                .card-wrap { padding: 12px 16px; border-left: 3px solid #3273dc; background:#f5f9ff; border-radius:4px; }
                                .card-title { font-weight: 700; }
                                .card-desc { color:#666; font-size:0.85rem; margin-top:4px; }
                            </style>
                        `,
                        // 纯文本入参：自动包成 <div x-define="tag">标签
                        tag: `全局标签`,
                    },
                },
            );
        </script>

        <style>
            .panel {
                padding: 16px;
                border: 1px solid #dbdbdb;
                border-radius: 8px;
                margin-bottom: 12px;
            }
            .label {
                font-size: 0.8rem;
                color: #888;
                margin-bottom: 8px;
            }
        </style>
    </body>
</html>
