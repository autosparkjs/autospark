<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-tree · 树形渲染基础</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            .org-tree {
                max-width: 420px;
                border: 1px solid #dbdbdb;
                border-radius: 6px;
                padding: 8px;
            }
            .org-tree .x-tree-row {
                gap: 6px;
                padding: 4px 6px;
                border-radius: 4px;
            }
            .org-tree .x-tree-row:hover {
                background: #f5f5f5;
            }
        </style>
    </head>

    <body>
        <!-- 自定义节点模板：图标 + 名称 + 子节点计数徽标；expand 高度动画——后续节点平滑跟随 -->
        <div class="demo-app section">
            <h1 class="title is-5">组织架构树</h1>
            <p class="subtitle is-6">点中心行展开/折叠，前 2 层默认可见</p>
            <div class="org-tree">
                <ul x-tree="node of nodes" x-tree-options="{ defaultExpandLevel: 2, animate: 'expand' }">
                    <li x-tree-node>
                        <div class="x-tree-row" x-tree-toggle style="cursor: pointer">
                            <span x-text="$leaf ? '👥' : '🏢'"></span>
                            <span x-text="node.name"></span>
                            <span class="tag is-light is-rounded" x-if="!$leaf" x-text="$children.length"></span>
                        </div>
                        <ul x-tree-children style="list-style: none; margin: 0; padding-left: 22px"></ul>
                    </li>
                </ul>
            </div>
        </div>

        <script>
            new AutoSparkSpaces.AutoSpark(document.querySelector(".demo-app"), {
                nodes: [
                    {
                        id: "company",
                        name: "AutoSpark 公司",
                        children: [
                            {
                                id: "admin",
                                name: "行政中心",
                                children: [
                                    { id: "admin-ceo", name: "总裁办" },
                                    { id: "admin-hr", name: "人力资源部" },
                                    { id: "admin-fin", name: "财务部" },
                                    { id: "admin-ga", name: "行政部" },
                                    { id: "admin-legal", name: "法务部" },
                                    { id: "admin-audit", name: "审计部" },
                                    { id: "admin-it", name: "信息中心" },
                                ],
                            },
                            {
                                id: "mkt",
                                name: "市场中心",
                                children: [
                                    { id: "mkt-mkt", name: "市场部" },
                                    { id: "mkt-sales", name: "销售部" },
                                    { id: "mkt-cs", name: "客服部" },
                                    { id: "mkt-brand", name: "品牌部" },
                                    { id: "mkt-plan", name: "市场策划部" },
                                    { id: "mkt-growth", name: "市场营销部" },
                                ],
                            },
                            {
                                id: "rd",
                                name: "研发中心",
                                children: [
                                    { id: "rd-mobile", name: "移动研发部" },
                                    { id: "rd-platform", name: "平台研发部" },
                                    { id: "rd-qa", name: "测试部" },
                                    { id: "rd-ops", name: "运维部" },
                                    { id: "rd-pd", name: "产品部" },
                                    { id: "rd-design", name: "设计部" },
                                ],
                            },
                        ],
                    },
                ],
            });
        </script>
    </body>
</html>
