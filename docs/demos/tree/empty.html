<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>x-tree · 空态</title>
        <script src="/autospark/autospark.js"></script>
        <link rel="stylesheet" href="/autospark/bulma.min.css" />
        <style>
            .org-tree {
                max-width: 420px;
                border: 1px solid #dbdbdb;
                border-radius: 6px;
                padding: 8px;
            }
            .org-tree .x-tree-row {
                gap: 6px;
                padding: 4px 6px;
                border-radius: 4px;
            }
            .org-tree .x-tree-row:hover {
                background: #f5f5f5;
            }
        </style>
    </head>

    <body>
        <!-- 树数据为真空数组 [] 时渲染 x-empty；undefined 不认领（留给异步晚到） -->
        <div class="demo-app section">
            <h1 class="title is-5">空态模板（x-empty）</h1>
            <p class="subtitle is-6">点「清空」让树数据变 []，空态渲染；「恢复数据」后自动复原</p>
            <div class="org-tree">
                <ul x-tree="node of nodes" x-tree-options="{ defaultExpandLevel: 2 }">
                    <li x-tree-node>
                        <div class="x-tree-row" x-tree-toggle style="cursor: pointer">
                            <span x-text="$leaf ? '👥' : '🏢'"></span>
                            <span x-text="node.name"></span>
                        </div>
                        <ul x-tree-children style="list-style: none; margin: 0; padding-left: 22px"></ul>
                    </li>
                    <li x-empty style="list-style: none; color: #999">暂无数据（x-empty）</li>
                </ul>
            </div>
            <div class="buttons mt-3">
                <button class="button is-light" @click="clear">清空（[]）</button>
                <button class="button is-light" @click="restore">恢复数据</button>
                <button class="button is-light" @click="late">晚到（undefined）</button>
            </div>
        </div>

        <script>
            const seed = [
                {
                    id: "company",
                    name: "AutoSpark 公司",
                    children: [
                        { id: "admin", name: "行政中心" },
                        { id: "mkt", name: "市场中心" },
                    ],
                },
            ];
            const engine = new AutoSparkSpaces.AutoSpark(
                document.querySelector(".demo-app"),
                {
                    nodes: JSON.parse(JSON.stringify(seed)),
                },
                {
                    actions: {
                        clear: () => {
                            engine.state.nodes = [];
                        },
                        restore: () => {
                            engine.state.nodes = JSON.parse(JSON.stringify(seed));
                        },
                        // undefined 不认领空态：树区域保持原样，数据到位自动渲染
                        late: () => {
                            engine.state.nodes = undefined;
                            setTimeout(() => {
                                engine.state.nodes = JSON.parse(JSON.stringify(seed));
                            }, 1200);
                        },
                    },
                },
            );
        </script>
    </body>
</html>
