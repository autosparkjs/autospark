<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>autospark.tag · 尺寸 · 可关闭 · 暗色</title>
    <!-- 本页不引主题 css：演示三级回退链的兜底形态（暗色块吃 [data-dark] 暗色兜底变体） -->
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.tag.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .tag-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .hint { color: #868e96; font-size: 0.875rem; margin-top: 4px; }
      /* 暗色块容器：深底衬托（组件暗色由 data-dark 独立样式域驱动） */
      .dark-panel {
        background: #1f1f23;
        padding: 16px;
        border-radius: 8px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="demo-app section">
      <h2 class="title is-5">三档尺寸（size）</h2>
      <div class="tag-row">
        <span x-component:autospark.tag="{ label: '小号 sm', size: 'sm' }"></span>
        <span x-component:autospark.tag="{ label: '中号 md（默认）' }"></span>
        <span x-component:autospark.tag="{ label: '大号 lg', size: 'lg' }"></span>
      </div>

      <h2 class="title is-5 mt-5">可关闭（closable）</h2>
      <p class="hint">点击标签右侧 × 从 DOM 移除该标签；移除后刷新页面恢复</p>
      <div class="tag-row">
        <span x-component:autospark.tag="{ label: '新订单', type: 'primary', closable: true }"></span>
        <span x-component:autospark.tag="{ label: '已支付', type: 'success', closable: true }"></span>
        <span x-component:autospark.tag="{ label: '待发货', type: 'warning', closable: true }"></span>
        <span x-component:autospark.tag="{ label: '已取消', type: 'danger', closable: true }"></span>
        <span x-component:autospark.tag="{ label: '备注信息', type: 'info', closable: true }"></span>
        <span x-component:autospark.tag="{ label: '不可关闭（默认）', closable: false }"></span>
      </div>

      <h2 class="title is-5 mt-5">暗色模式（data-dark 独立样式域）</h2>
      <p class="hint">容器裸挂 data-dark 属性即局部切换暗色兜底（无需主题在场）</p>
      <div class="dark-panel" data-dark>
        <div class="tag-row">
          <span x-component:autospark.tag="{ label: '默认' }"></span>
          <span x-component:autospark.tag="{ label: '主要', type: 'primary' }"></span>
          <span x-component:autospark.tag="{ label: '成功', type: 'success' }"></span>
          <span x-component:autospark.tag="{ label: '危险', type: 'danger' }"></span>
          <span x-component:autospark.tag="{ label: '警告', type: 'warning' }"></span>
          <span x-component:autospark.tag="{ label: '信息', type: 'info' }"></span>
        </div>
        <div class="tag-row" style="margin-top: 8px">
          <span x-component:autospark.tag="{ label: '可关闭', type: 'primary', closable: true }"></span>
          <span x-component:autospark.tag="{ label: '大号暗色', type: 'success', size: 'lg', closable: true }"></span>
        </div>
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
