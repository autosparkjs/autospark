<!--
    化身路径约束（x-component T4=B）：组件快照根的属性是静态并入宿主（class 拼接 /
    style 合并 / 其他属性复制），根上的动态绑定不会求值——type/size 变体绑定落在
    插槽出口元素上，经 :has() 选择器驱动宿主外观；closable 显隐经关闭按钮自身的
    x-show 求值（内层元素绑定不受化身约束），点击走 methods.close 移除化身宿主。
-->
<span class="asc-tag" x-define="autospark.tag">
  <script setup>
    {
        data: () => ({
            // 语义色变体：default（中性）/ primary / success / danger / warning / info
            type: "default",
            // 尺寸三档：sm / md / lg（md 即基础样式）
            size: "md",
            // 缺省文案：未提供插槽内容时显示
            label: "标签",
            // 可关闭：显示 × 按钮，点击后整标签从 DOM 移除（键须物化——x-show 表达式
            // 读取未物化键会使求值抛错，整按钮不显示）
            closable: false
        }),
        methods: {
            // 关闭：从 DOM 移除化身宿主（this.el 即组件根）——纯展示组件无状态清理诉求
            close() {
                this.el.remove();
            },
        },
    }
  </script>
  <style global id="autospark-components-tag">
    /* 主题化（ADR-0129）：三级样式回退链 var(--auto-X, var(--asc-tag-X, 校准兜底值))；
         --asc-tag-* 前缀是使用者覆盖通道；暗色兜底变体见块尾 */
    .asc-tag {
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
      max-width: 100%;
      border: 1px solid transparent;
      border-radius: var(--auto-border-radius, var(--asc-tag-radius, 0.25rem));
      font: inherit;
      line-height: 1.4;
      padding: 0.125rem 0.625rem;
      font-size: 0.8125rem;
      white-space: nowrap;
      vertical-align: middle;
      cursor: default;
      background: var(--auto-secondary-bgcolor, var(--asc-tag-bg, rgba(245, 245, 245, 0.45)));
      color: var(--auto-color, var(--asc-tag-color, #606060));
      border-color: var(--auto-border-color, var(--asc-tag-border-color, rgba(0, 0, 0, 0.1)));
    }
    /* type 语义色变体（变体数据在内层出口元素上，经 :has() 驱动宿主）：accent 中转
         变量先落定，tinted 底/边经 color-mix 调浅（notification-shell 先例），文字用
         accent 本色；default 走基础样式中性外观不设 accent */
    .asc-tag:has(> .asc-tag-inner[data-type="primary"]) {
      --asc-tag-accent: var(--auto-primary-color, var(--asc-tag-primary-color, #009aff));
    }
    .asc-tag:has(> .asc-tag-inner[data-type="success"]) {
      --asc-tag-accent: var(--auto-success-color, var(--asc-tag-success-color, #22c55e));
    }
    .asc-tag:has(> .asc-tag-inner[data-type="danger"]) {
      --asc-tag-accent: var(--auto-danger-color, var(--asc-tag-danger-color, #ef4444));
    }
    .asc-tag:has(> .asc-tag-inner[data-type="warning"]) {
      --asc-tag-accent: var(--auto-warning-color, var(--asc-tag-warning-color, #f59e0b));
    }
    .asc-tag:has(> .asc-tag-inner[data-type="info"]) {
      --asc-tag-accent: var(--auto-info-color, var(--asc-tag-info-color, #71717a));
    }
    /* tinted 消费段：五语义变体共用（accent 已由上方变体块落定） */
    .asc-tag:has(> .asc-tag-inner[data-type="primary"]),
    .asc-tag:has(> .asc-tag-inner[data-type="success"]),
    .asc-tag:has(> .asc-tag-inner[data-type="danger"]),
    .asc-tag:has(> .asc-tag-inner[data-type="warning"]),
    .asc-tag:has(> .asc-tag-inner[data-type="info"]) {
      color: var(--asc-tag-accent);
      background: color-mix(in srgb, var(--asc-tag-accent) 10%, transparent);
      border-color: color-mix(in srgb, var(--asc-tag-accent) 32%, transparent);
    }
    /* size 尺寸变体（md 即基础样式；档位直取 --x-font-size-* 标尺，字面值兜底脱离主题可用） */
    .asc-tag:has(> .asc-tag-inner[data-size="sm"]) {
      font-size: var(--x-font-size-small, 0.75rem);
      padding: 0.0625rem 0.5rem;
    }
    .asc-tag:has(> .asc-tag-inner[data-size="lg"]) {
      font-size: var(--x-font-size-large, 1rem);
      padding: 0.25rem 0.875rem;
    }
    /* 关闭按钮 ×：all:unset 清浏览器默认按钮皮后自绘；hover 底经 currentColor 调和，
         自适应各 type 的 accent 色（x-show 隐藏态为行内 display:none，与此处
         display:inline-flex 不冲突） */
    .asc-tag-close {
      all: unset;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.3em;
      height: 1.3em;
      margin-left: 0.15em;
      margin-right: -0.35em;
      border-radius: 50%;
      cursor: pointer;
      color: inherit;
      font-size: 0.85em;
      line-height: 1;
      transition: background 0.15s ease;
    }
    .asc-tag-close:hover,
    .asc-tag-close:focus-visible {
      background: color-mix(in srgb, currentColor 16%, transparent);
    }
    .asc-tag-close:focus-visible {
      outline: 1px solid color-mix(in srgb, currentColor 45%, transparent);
    }
    /* 暗色兜底变体（ADR-0129）：兜底字面值切换为 theme 默认暗色校准值（变量链不变；
         tinted 消费段无需重写——accent 经各变体块的暗色兜底值落定） */
    [dark] .asc-tag,
    [data-dark] .asc-tag {
      background: var(--auto-secondary-bgcolor, var(--asc-tag-bg, rgba(129, 129, 129, 0.45)));
      color: var(--auto-color, var(--asc-tag-color, #fafafa));
      border-color: var(--auto-border-color, var(--asc-tag-border-color, rgba(255, 255, 255, 0.16)));
    }
    [dark] .asc-tag:has(> .asc-tag-inner[data-type="primary"]),
    [data-dark] .asc-tag:has(> .asc-tag-inner[data-type="primary"]) {
      --asc-tag-accent: var(--auto-primary-color, var(--asc-tag-primary-color, #56baff));
    }
    [dark] .asc-tag:has(> .asc-tag-inner[data-type="success"]),
    [data-dark] .asc-tag:has(> .asc-tag-inner[data-type="success"]) {
      --asc-tag-accent: var(--auto-success-color, var(--asc-tag-success-color, #5cd07c));
    }
    [dark] .asc-tag:has(> .asc-tag-inner[data-type="danger"]),
    [data-dark] .asc-tag:has(> .asc-tag-inner[data-type="danger"]) {
      --asc-tag-accent: var(--auto-danger-color, var(--asc-tag-danger-color, #e6696a));
    }
    [dark] .asc-tag:has(> .asc-tag-inner[data-type="warning"]),
    [data-dark] .asc-tag:has(> .asc-tag-inner[data-type="warning"]) {
      --asc-tag-accent: var(--auto-warning-color, var(--asc-tag-warning-color, #f7d352));
    }
    [dark] .asc-tag:has(> .asc-tag-inner[data-type="info"]),
    [data-dark] .asc-tag:has(> .asc-tag-inner[data-type="info"]) {
      --asc-tag-accent: var(--auto-info-color, var(--asc-tag-info-color, #a8a8ad));
    }
  </style>
  <!-- 默认插槽出口：未提供内容时显示 {{ label }}（组件自身状态求值）；
         type/size 变体数据属性随出口元素承载（见文件头注释） -->
  <span class="asc-tag-inner" :data-type="type" :data-size="size" x-slot>{{ label }}</span>
  <button class="asc-tag-close" type="button" x-show="closable" @click="close()" aria-label="关闭">&times;</button>
</span>
