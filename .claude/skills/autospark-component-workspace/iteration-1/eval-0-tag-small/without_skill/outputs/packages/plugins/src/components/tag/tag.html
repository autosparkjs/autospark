<!--
    化身路径约束（x-component T4=B）：组件快照根的属性是静态并入宿主（class 拼接 /
    style 合并 / 其他属性复制），根上的动态绑定不会求值——变体绑定须落在编译子树的
    内层元素（插槽出口 span）上，经 :has() 选择器驱动宿主外观。
-->
<span class="asc-tag" x-define="autospark.tag">
  <script setup>
    {
        data: () => ({
            type: "default",
            size: "md",
            closable: false,
            label: "标签"
        }),
        methods: {
            // × 关闭：先派发组件事件（ADR-0117——宿主 / 祖先经 @close 监听可同步业务
            // 状态，如从列表 state 移除本项），再从 DOM 移除标签。this.el 在 x-on 场景
            // 是触发元素（关闭钮），closest 回溯到组件根——与钩子场景（this.el 即根）两态兼容。
            // closable 守卫：关闭钮经 x-show 隐藏（display:none 用户不可达），此处再挡
            // 程序化触发（元素仍在 DOM、click() 可直调）
            close() {
                if (!this.data.closable) return;
                this.emit("close", { label: this.data.label, type: this.data.type });
                this.el.closest(".asc-tag")?.remove();
            },
        },
    }
  </script>
  <style global id="autospark-components-tag">
    /* 主题化（ADR-0129）：三级样式回退链 var(--auto-X, var(--asc-tag-X, 校准兜底值))；
         标记形态为「淡底描边字」（区别于 button 的语义色实底）：底 = color-mix 淡染
         语义色于面板底、边 = currentColor 淡染、字 = 语义色本体；暗色兜底变体见块尾 */
    .asc-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25em;
      border: 1px solid color-mix(in srgb, currentColor 22%, transparent);
      border-radius: var(--auto-border-radius, var(--asc-tag-radius, 0.375rem));
      font: inherit;
      line-height: 1.5;
      white-space: nowrap;
      padding: 0.125rem 0.625rem;
      font-size: 0.8125rem;
      background: var(--auto-secondary-bgcolor, var(--asc-tag-bg, rgba(245, 245, 245, 0.45)));
      color: var(--auto-color, var(--asc-tag-color, #606060));
    }
    /* type 语义色变体（变体数据在内层出口元素上，经 :has() 驱动宿主）；
         default 即基础样式（中性淡底），五语义色淡染于面板底 */
    .asc-tag:has(> .asc-tag-label[data-type="primary"]) {
      color: var(--auto-primary-color, var(--asc-tag-primary, #009aff));
      background: color-mix(in srgb, var(--auto-primary-color, var(--asc-tag-primary, #009aff)) 10%, var(--auto-bgcolor, var(--asc-tag-bg, #fff)));
    }
    .asc-tag:has(> .asc-tag-label[data-type="success"]) {
      color: var(--auto-success-color, var(--asc-tag-success, #22c55e));
      background: color-mix(in srgb, var(--auto-success-color, var(--asc-tag-success, #22c55e)) 10%, var(--auto-bgcolor, var(--asc-tag-bg, #fff)));
    }
    .asc-tag:has(> .asc-tag-label[data-type="danger"]) {
      color: var(--auto-danger-color, var(--asc-tag-danger, #ef4444));
      background: color-mix(in srgb, var(--auto-danger-color, var(--asc-tag-danger, #ef4444)) 10%, var(--auto-bgcolor, var(--asc-tag-bg, #fff)));
    }
    .asc-tag:has(> .asc-tag-label[data-type="warning"]) {
      color: var(--auto-warning-color, var(--asc-tag-warning, #f59e0b));
      background: color-mix(in srgb, var(--auto-warning-color, var(--asc-tag-warning, #f59e0b)) 10%, var(--auto-bgcolor, var(--asc-tag-bg, #fff)));
    }
    .asc-tag:has(> .asc-tag-label[data-type="info"]) {
      color: var(--auto-info-color, var(--asc-tag-info, #71717a));
      background: color-mix(in srgb, var(--auto-info-color, var(--asc-tag-info, #71717a)) 10%, var(--auto-bgcolor, var(--asc-tag-bg, #fff)));
    }
    /* size 尺寸变体（md 即基础样式） */
    .asc-tag:has(> .asc-tag-label[data-size="sm"]) {
      padding: 0.0625rem 0.5rem;
      font-size: 0.75rem;
    }
    .asc-tag:has(> .asc-tag-label[data-size="lg"]) {
      padding: 0.25rem 0.75rem;
      font-size: 0.875rem;
    }
    /* × 关闭钮：随宿主字号缩放（em 单位），负右移贴右缘（圆形热区溢出内边距的视觉收边） */
    .asc-tag-close {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.25em;
      height: 1.25em;
      margin-right: -0.25em;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: 1;
      cursor: pointer;
      opacity: 0.65;
      transition: opacity 0.15s ease, background-color 0.15s ease;
    }
    .asc-tag-close:hover,
    .asc-tag-close:focus-visible {
      opacity: 1;
      background: color-mix(in srgb, currentColor 20%, transparent);
    }
    /* 暗色兜底变体（ADR-0129）：兜底字面值切换为 theme 默认暗色校准值（变量链不变），
         淡染浓度略升（10% → 16%）保暗底可辨 */
    [dark] .asc-tag,
    [data-dark] .asc-tag {
      background: var(--auto-secondary-bgcolor, var(--asc-tag-bg, rgba(129, 129, 129, 0.45)));
      color: var(--auto-color, var(--asc-tag-color, #fafafa));
    }
    [dark] .asc-tag:has(> .asc-tag-label[data-type="primary"]),
    [data-dark] .asc-tag:has(> .asc-tag-label[data-type="primary"]) {
      color: var(--auto-primary-color, var(--asc-tag-primary, #56baff));
      background: color-mix(in srgb, var(--auto-primary-color, var(--asc-tag-primary, #56baff)) 16%, var(--auto-bgcolor, var(--asc-tag-bg, #606060)));
    }
    [dark] .asc-tag:has(> .asc-tag-label[data-type="success"]),
    [data-dark] .asc-tag:has(> .asc-tag-label[data-type="success"]) {
      color: var(--auto-success-color, var(--asc-tag-success, #5cd07c));
      background: color-mix(in srgb, var(--auto-success-color, var(--asc-tag-success, #5cd07c)) 16%, var(--auto-bgcolor, var(--asc-tag-bg, #606060)));
    }
    [dark] .asc-tag:has(> .asc-tag-label[data-type="danger"]),
    [data-dark] .asc-tag:has(> .asc-tag-label[data-type="danger"]) {
      color: var(--auto-danger-color, var(--asc-tag-danger, #e6696a));
      background: color-mix(in srgb, var(--auto-danger-color, var(--asc-tag-danger, #e6696a)) 16%, var(--auto-bgcolor, var(--asc-tag-bg, #606060)));
    }
    [dark] .asc-tag:has(> .asc-tag-label[data-type="warning"]),
    [data-dark] .asc-tag:has(> .asc-tag-label[data-type="warning"]) {
      color: var(--auto-warning-color, var(--asc-tag-warning, #f7d352));
      background: color-mix(in srgb, var(--auto-warning-color, var(--asc-tag-warning, #f7d352)) 16%, var(--auto-bgcolor, var(--asc-tag-bg, #606060)));
    }
    [dark] .asc-tag:has(> .asc-tag-label[data-type="info"]),
    [data-dark] .asc-tag:has(> .asc-tag-label[data-type="info"]) {
      color: var(--auto-info-color, var(--asc-tag-info, #dcdce6));
      background: color-mix(in srgb, var(--auto-info-color, var(--asc-tag-info, #dcdce6)) 16%, var(--auto-bgcolor, var(--asc-tag-bg, #606060)));
    }
  </style>
  <!-- 默认插槽出口：未提供内容时显示 {{ label }}（组件自身状态求值）；
         变体数据属性随出口元素承载（见文件头注释） -->
  <span class="asc-tag-label" :data-type="type" :data-size="size" x-slot>{{ label }}</span>
  <!-- × 关闭钮（closable 物化于 data 域，props 注入覆盖） -->
  <button type="button" class="asc-tag-close" aria-label="关闭" x-show="closable" @click="close()">×</button>
</span>
