<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>autospark.alert · 左侧图标</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.alert.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <!-- icon 三态：true（缺省，按 type 取语义图标）/ 字符串（自定义图标名）/ false（关闭）；
         type 响应式切换时语义图标与语义色联动跟随 -->
    <div class="demo-app section" x-data="{ t: 'info' }">
      <div class="stack">
        <div x-component:autospark.alert="{ type: 'info', title: '语义图标（缺省）', description: 'icon 未声明时按 type 取 info/success/warn/error。' }"></div>
        <div x-component:autospark.alert="{ type: 'warning', title: '关闭图标', description: 'icon: false 不渲染左侧图标。', icon: false }"></div>
        <div x-component:autospark.alert="{ type: 'info', title: '自定义图标', description: 'icon: 传入图标名替换语义图标（此处为 file）。', icon: 'file' }"></div>
        <div x-component:autospark.alert="{ type: t, title: '响应式 type 切换', description: 'type 变化时语义色与语义图标同步跟随。' }"></div>
      </div>
      <div class="block buttons">
        <button class="button is-small" @click="t = 'info'">info</button>
        <button class="button is-small" @click="t = 'success'">success</button>
        <button class="button is-small" @click="t = 'warning'">warning</button>
        <button class="button is-small" @click="t = 'danger'">danger</button>
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
