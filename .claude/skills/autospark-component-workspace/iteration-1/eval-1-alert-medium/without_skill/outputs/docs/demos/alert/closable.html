<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>autospark.alert · 可关闭与重新显示</title>
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.alert.js"></script>
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <!-- 组件封闭域：宿主表达式见不到外层状态——@close 监听与 open 绑定写在包裹元素/props 上 -->
    <div class="demo-app section" x-data="{ show: true, panelOn: true }">
      <div class="stack">
        <!-- 推荐形态：closable + open 受控绑定 + 包裹元素 @close 同步父状态（重显 = show 置 true） -->
        <div @close="show = false">
          <div
            x-component:autospark.alert="{
                        type: 'danger',
                        title: '可关闭的危险警告',
                        description: '点击右侧 × 收起；点击下方按钮经父状态 open 重新显示。',
                        closable: true,
                        open: show,
                    }"
          ></div>
        </div>
        <!-- 纯受控显隐：open 绑定父状态，开关直接切换（关闭钮点击同样收起并派发 close） -->
        <div x-component:autospark.alert="{
                    type: 'warning',
                    title: '受控警告条',
                    description: 'open 绑定父状态 panelOn，切换下方开关直接显隐。',
                    closable: true,
                    open: panelOn,
                }"></div>
      </div>
      <div class="block buttons">
        <button class="button is-small" @click="show = true">重新显示（show = true）</button>
        <button class="button is-small" @click="panelOn = !panelOn">切换受控显隐（panelOn = <span x-text="panelOn"></span>）</button>
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
