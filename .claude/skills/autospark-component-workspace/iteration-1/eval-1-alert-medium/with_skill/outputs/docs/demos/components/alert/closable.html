<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>alert · 可关闭与重新显示</title>
    <!-- 引擎先加载；插件脚本随后（自举注册，零手动接线） -->
    <script src="/autospark/autospark.js"></script>
    <script src="/autospark/autospark.alert.js"></script>
    <link rel="stylesheet" href="/autospark/autospark-theme.css" />
    <link rel="stylesheet" href="/autospark/bulma.min.css" />
    <style>
      .alert-gap {
        margin-bottom: 0.75rem;
      }
    </style>
  </head>
  <body>
    <div class="demo-app section" x-data="{ synced: true, armed: false }">
      <!-- 场景一：自治关闭——点击 × 组件自身收起（无需父组件配合） -->
      <h2 class="title is-5">自治关闭</h2>
      <div class="block">
        <div class="alert-gap" x-component:autospark.alert="{ type: 'warning', title: '浏览器版本过低', description: '部分功能可能不可用，建议升级到最新版本。点击右侧 × 收起后，本条不会重新出现。', closable: true }"></div>
        <div class="alert-gap" x-component:autospark.alert="{ type: 'info', title: '普通信息条（不可关闭）', description: '未开启 closable 时警告条常驻，无关闭按钮。' }"></div>
      </div>

      <!-- 场景二：父组件状态闭环——close 事件冒泡同步父状态，visible props 驱动重新显示。
             注意：组件域封闭（宿主上的表达式见不到外层状态），事件绑定写在组件外的
             包裹元素上，点击经冒泡触发；visible 由父状态注入，关闭置源、按钮重开。 -->
      <h2 class="title is-5">父组件状态控制重新显示</h2>
      <div class="block">
        <div @close="synced = false">
          <div class="alert-gap" x-component:autospark.alert="{ type: 'success', title: '已保存', description: '更改已同步到云端。关闭后可点击下方按钮重新显示。', visible: synced, closable: true }"></div>
        </div>
        <button class="button is-small is-primary" x-show="!synced" @click="synced = true">重新显示</button>
        <p class="is-size-7 has-text-grey">
          父状态 synced = <code x-text="String(synced)"></code>——关闭时经 close 事件置 false，按钮重新置 true 即重现。
        </p>
      </div>

      <!-- 场景三：初始隐藏——visible 注入 false，父状态翻转后显示；关闭经 close 事件回到初始态 -->
      <h2 class="title is-5">初始隐藏，按需出现</h2>
      <div class="block">
        <div @close="armed = false">
          <div class="alert-gap" x-component:autospark.alert="{ type: 'danger', title: '删除确认提醒', description: '您正在执行不可恢复的删除操作，请谨慎操作。', visible: armed, closable: true }"></div>
        </div>
        <button class="button is-small is-danger is-outlined" x-show="!armed" @click="armed = true">执行删除</button>
      </div>
    </div>
    <script>
      new AutoSpark(document.querySelector(".demo-app"), {});
    </script>
  </body>
</html>
