<!--
    化身路径约束（x-component T4=B）：组件快照根的属性是静态并入宿主（class 拼接 /
    style 合并 / 其他属性复制），根上的动态绑定不会求值——type 变体绑定落在编译子树的
    内层元素（.asc-alert-body）上，经 :has() 选择器驱动宿主外观；显示/隐藏（visible）
    属 DOM 层控制，在 mounted 钩子经 JS 通道同步到宿主（this.el 即化身后的组件根）。
-->
<div class="asc-alert" x-define="autospark.alert">
  <script setup>
    {
        data: () => ({
            type: "info",            // 语义类型：info | success | warning | danger
            title: "提示",            // 标题行文案
            description: "",          // 描述行文案（空则单行布局）
            icon: true,               // 左侧语义图标（按 type 自动切换）
            closable: false,          // 右侧关闭按钮（点击收起并派发冒泡 close 事件）
            visible: true,            // 显示状态（父组件可经 props 注入控制重新显示）
        }),
        methods: {
            // 关闭（@click 须裸标识符调用形态——组件 method 经 getMethod 查找）：
            // 组件域立即收起（响而不哑），同时经 this.emit（ADR-0117 组件事件通道，
            // 向组件根派发冒泡 CustomEvent）通知父组件同步源状态
            close() {
                this.data.visible = false;
                this.emit("close");
            },
        },
        mounted() {
            // 显示状态同步到宿主根（display 属 DOM 层控制走 JS 通道；
            // CSS 变体驱动走 :has()，两通道勿混）；后续 props 变化经 watch 保持同步。
            // 注意 scope.watch 的 listener 以 { value } 对象信封调用（两支路统一形态）
            this.el.style.display = this.data.visible ? "" : "none";
            this.watch("visible", ({ value: v }) => { this.el.style.display = v ? "" : "none"; });
        },
    }
  </script>
  <style global id="autospark-components-alert">
    /* 主题化（ADR-0129）：三级样式回退链 var(--auto-X, var(--asc-alert-X, 校准兜底值))；
         --asc-alert-* 前缀是使用者覆盖通道；语义色底/边框由语义主色经 color-mix 现场派生
         （浅底深字），硬编码色值仅在兜底位；暗色兜底变体见块尾 */
    .asc-alert {
      display: flex;
      border: 1px solid transparent;
      border-radius: var(--auto-border-radius, var(--asc-alert-radius, 0.5rem));
      padding: 0.75rem 1rem;
      font-size: var(--auto-font-size, var(--asc-alert-font-size, 0.875rem));
      line-height: 1.5;
      background: var(--auto-secondary-bgcolor, var(--asc-alert-bg, rgba(245, 245, 245, 0.45)));
      color: var(--auto-color, var(--asc-alert-color, #606060));
      transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }
    /* 内容行：图标 + 正文 + 关闭（type 变体数据在本元素上，经 :has() 驱动宿主配色） */
    .asc-alert-body {
      display: flex;
      align-items: flex-start;
      gap: 0.6em;
      flex: 1;
      min-width: 0;
    }
    /* 左侧语义图标（四个内联 SVG 按 type 切换，零外部依赖） */
    .asc-alert-icon {
      display: flex;
      flex: none;
      width: var(--auto-icon-size, var(--asc-alert-icon-size, 1.25em));
      height: var(--auto-icon-size, var(--asc-alert-icon-size, 1.25em));
      margin-top: 0.125em;
    }
    .asc-alert-svg {
      display: none;
      width: 100%;
      height: 100%;
    }
    .asc-alert-body[data-type="info"] .asc-alert-svg-info,
    .asc-alert-body[data-type="success"] .asc-alert-svg-success,
    .asc-alert-body[data-type="warning"] .asc-alert-svg-warning,
    .asc-alert-body[data-type="danger"] .asc-alert-svg-danger {
      display: block;
    }
    /* 正文：标题 + 描述两行布局（描述缺省自然收成单行）；默认插槽出口在 main 上——
         宿主提供子内容时投影替换标准两行，图标/关闭按钮/配色外壳保留 */
    .asc-alert-main {
      display: flex;
      flex-direction: column;
      gap: 0.15em;
      flex: 1;
      min-width: 0;
    }
    .asc-alert-title {
      font-weight: var(--x-font-weight-medium, var(--asc-alert-title-weight, 600));
    }
    .asc-alert-desc {
      font-size: var(--x-font-size-small, 0.8125rem);
      opacity: 0.85;
    }
    /* 关闭按钮（closable） */
    .asc-alert-close {
      display: flex;
      flex: none;
      padding: 0.125em;
      margin: -0.125em 0;
      border: none;
      background: none;
      color: inherit;
      cursor: pointer;
      opacity: 0.55;
      transition: opacity 0.15s ease;
    }
    .asc-alert-close:hover {
      opacity: 1;
    }
    .asc-alert-close svg {
      width: 1em;
      height: 1em;
    }
    /* type 语义配色（变体数据在内层 body 上，经 :has() 驱动宿主；字色取深一档兜底保证浅底可读，
         主题在场时随 --auto-*-color 自动换肤） */
    .asc-alert:has(> .asc-alert-body[data-type="info"]) {
      background: color-mix(in srgb, var(--auto-info-color, var(--asc-alert-info-color, #009aff)) 10%, transparent);
      border-color: color-mix(in srgb, var(--auto-info-color, var(--asc-alert-info-color, #009aff)) 32%, transparent);
      color: var(--auto-info-color, var(--asc-alert-info-color, #0070c8));
    }
    .asc-alert:has(> .asc-alert-body[data-type="success"]) {
      background: color-mix(in srgb, var(--auto-success-color, var(--asc-alert-success-color, #22c55e)) 10%, transparent);
      border-color: color-mix(in srgb, var(--auto-success-color, var(--asc-alert-success-color, #22c55e)) 32%, transparent);
      color: var(--auto-success-color, var(--asc-alert-success-color, #15803d));
    }
    .asc-alert:has(> .asc-alert-body[data-type="warning"]) {
      background: color-mix(in srgb, var(--auto-warning-color, var(--asc-alert-warning-color, #f59f00)) 12%, transparent);
      border-color: color-mix(in srgb, var(--auto-warning-color, var(--asc-alert-warning-color, #f59f00)) 35%, transparent);
      color: var(--auto-warning-color, var(--asc-alert-warning-color, #b45309));
    }
    .asc-alert:has(> .asc-alert-body[data-type="danger"]) {
      background: color-mix(in srgb, var(--auto-danger-color, var(--asc-alert-danger-color, #ef4444)) 10%, transparent);
      border-color: color-mix(in srgb, var(--auto-danger-color, var(--asc-alert-danger-color, #ef4444)) 32%, transparent);
      color: var(--auto-danger-color, var(--asc-alert-danger-color, #b91c1c));
    }
    /* 暗色兜底变体（ADR-0129）：兜底字面值切换为 theme 默认暗色校准值（提亮版，
         与 button 同款校准；变量链不变——主题在场时 --auto-* 自动跟随暗色） */
    [dark] .asc-alert,
    [data-dark] .asc-alert {
      background: var(--auto-secondary-bgcolor, var(--asc-alert-bg, rgba(129, 129, 129, 0.18)));
      color: var(--auto-color, var(--asc-alert-color, #fafafa));
    }
    [dark] .asc-alert:has(> .asc-alert-body[data-type="info"]),
    [data-dark] .asc-alert:has(> .asc-alert-body[data-type="info"]) {
      background: color-mix(in srgb, var(--auto-info-color, var(--asc-alert-info-color, #56baff)) 14%, transparent);
      color: var(--auto-info-color, var(--asc-alert-info-color, #56baff));
    }
    [dark] .asc-alert:has(> .asc-alert-body[data-type="success"]),
    [data-dark] .asc-alert:has(> .asc-alert-body[data-type="success"]) {
      background: color-mix(in srgb, var(--auto-success-color, var(--asc-alert-success-color, #5cd07c)) 14%, transparent);
      color: var(--auto-success-color, var(--asc-alert-success-color, #5cd07c));
    }
    [dark] .asc-alert:has(> .asc-alert-body[data-type="warning"]),
    [data-dark] .asc-alert:has(> .asc-alert-body[data-type="warning"]) {
      background: color-mix(in srgb, var(--auto-warning-color, var(--asc-alert-warning-color, #ffc53d)) 14%, transparent);
      color: var(--auto-warning-color, var(--asc-alert-warning-color, #ffc53d));
    }
    [dark] .asc-alert:has(> .asc-alert-body[data-type="danger"]),
    [data-dark] .asc-alert:has(> .asc-alert-body[data-type="danger"]) {
      background: color-mix(in srgb, var(--auto-danger-color, var(--asc-alert-danger-color, #e6696a)) 14%, transparent);
      color: var(--auto-danger-color, var(--asc-alert-danger-color, #e6696a));
    }
  </style>
  <!-- type 变体绑定落 body（内层非根，见文件头注释）；main 为默认插槽出口：
         未提供子内容时显示标准的「标题 + 描述」两行（组件自身状态求值） -->
  <div class="asc-alert-body" :data-type="type">
    <span class="asc-alert-icon" x-show="icon">
      <svg class="asc-alert-svg asc-alert-svg-info" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
      <svg class="asc-alert-svg asc-alert-svg-success" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.1V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
      <svg class="asc-alert-svg asc-alert-svg-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
      <svg class="asc-alert-svg asc-alert-svg-danger" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
    </span>
    <div class="asc-alert-main" x-slot>
      <div class="asc-alert-title">{{ title }}</div>
      <div class="asc-alert-desc" x-show="description">{{ description }}</div>
    </div>
    <button type="button" class="asc-alert-close" x-show="closable" @click="close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </button>
  </div>
</div>
