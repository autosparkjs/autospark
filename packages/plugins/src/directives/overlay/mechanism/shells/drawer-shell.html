<div class="autospark-drawer" x-define="autospark.drawer">
    <!-- ADR-0124 决策 8：内嵌 overlay 结构骨架（同 dialog-shell 注记）；整壳滚动移除
         （决策 9：滚动归 overlay body 区）——高度链经宿主化身 100% 闭合（面板 fixed
         贴边 inset 对拉定高，贴边轴 100% 成立）。属性形态宿主：宿主化身组件根，
         autospark-overlay class（flex 列布局）并入宿主 -->
    <div class="autospark-drawer-slot" x-component:autospark.overlay="{ title: title, icon: icon, closeable: closeable, actions: actions, padding: padding }" x-component-options='{ slots: "*" }'></div>
    <style global id="autospark-shell-styles">
        .autospark-drawer {
            border-radius: 0;
            box-sizing: border-box;
        }
        .autospark-drawer > .autospark-drawer-slot {
            height: 100%;
        }
        .autospark-drawer[data-overlay-placement^="left"],
        .autospark-drawer[data-overlay-placement^="right"] {
            width: var(--autospark-drawer-size, 280px);
        }
        .autospark-drawer[data-overlay-placement^="top"],
        .autospark-drawer[data-overlay-placement^="bottom"] {
            height: var(--autospark-drawer-size, 280px);
        }
        .autospark-dialog-mask.drawer-enter-active,
        .autospark-dialog-mask.drawer-leave-active {
            transition: opacity 0.3s ease;
        }
        .autospark-dialog-mask.drawer-enter-from,
        .autospark-dialog-mask.drawer-leave-to {
            opacity: 0;
        }
        .autospark-overlays > .autospark-expandable-trigger {
            position: fixed;
            z-index: calc(var(--autospark-overlay-z, 1000) + 1);
            box-shadow: none;
            transition:
                left 0.3s ease,
                top 0.3s ease,
                clip-path 0.3s ease,
                border-color 0.15s,
                background 0.15s,
                opacity 0.15s;
        }
        .autospark-overlays > .autospark-expandable-trigger[data-show-trigger="hover"] {
            opacity: 0;
        }
        .autospark-overlays > .autospark-expandable-trigger[data-show-trigger="hover"]:hover,
        .autospark-overlays
            > .autospark-expandable-trigger[data-show-trigger="hover"]:focus-visible {
            opacity: 1;
        }
        .autospark-overlays > .autospark-expandable-trigger[data-collapsed] {
            /* 主题化（ADR-0129）：三级样式回退链；drawer 尺寸/z-index/贴边 radius 0 属功能几何不映射 */
            box-shadow: var(--auto-shadow, var(--autospark-expandable-trigger-shadow, 0 2px 4px hsl(240 3.8% 46.1% / 12%)));
            opacity: 1;
        }
        /* 暗色兜底变体（ADR-0129）：只切末级字面值 */
        [dark] .autospark-overlays > .autospark-expandable-trigger[data-collapsed],
        [data-dark] .autospark-overlays > .autospark-expandable-trigger[data-collapsed] {
            box-shadow: var(--auto-shadow, var(--autospark-expandable-trigger-shadow, 0 2px 4px hsl(0 0% 0% / 50%)));
        }
        @media (hover: none) {
            .autospark-overlays > .autospark-expandable-trigger[data-show-trigger="hover"] {
                opacity: 1;
            }
        }
        .autospark-overlays > .autospark-expandable-edge {
            position: fixed;
            display: none;
            z-index: calc(var(--autospark-overlay-z, 1000) + 1);
        }
        @media (hover: hover) {
            .autospark-overlays > .autospark-expandable-edge[data-show-trigger="hover"] {
                display: block;
            }
        }
        .autospark-overlays
            > .autospark-expandable-trigger[data-collapsed][data-direction="right"] {
            clip-path: inset(0 50% 0 0);
        }
        .autospark-overlays > .autospark-expandable-trigger[data-collapsed][data-direction="left"] {
            clip-path: inset(0 0 0 50%);
        }
        .autospark-overlays > .autospark-expandable-trigger[data-collapsed][data-direction="top"] {
            clip-path: inset(50% 0 0 0);
        }
        .autospark-overlays
            > .autospark-expandable-trigger[data-collapsed][data-direction="bottom"] {
            clip-path: inset(0 0 50% 0);
        }
    </style>
</div>
