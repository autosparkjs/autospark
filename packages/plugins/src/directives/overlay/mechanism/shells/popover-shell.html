<div class="autospark-popover" x-define="autospark.popover">
    <!-- ADR-0124 决策 8：内嵌 overlay 结构骨架（同 dialog-shell 注记）；padding 归
         overlay body 区（padding props，决策 9 视觉变化接受），content 层不再显式 0px -->
    <!-- 属性形态宿主（元素名形态挂 props 值非法）：宿主化身组件根，模板根 class
         （autospark-overlay）并入宿主——原内容包装类的定位 CSS 语义保留。props 平铺读取
         （同 dialog-shell 注记：config 字段级散开，点路径读法抛错死循环） -->
    <div class="autospark-popover-content" x-component:autospark.overlay="{ title: title, icon: icon, closeable: closeable, actions: actions, padding: padding }" x-component-options='{ slots: "*" }'></div>
    <div class="autospark-overlay-arrow"></div>
    <style global id="autospark-popover-styles">
        /* 主题化（ADR-0129）：三级样式回退链 var(--auto-X, var(--autospark-<feature>-X, 校准兜底值))；
             z-index 恒两级（永不映射）；暗色兜底变体只切末级字面值、不改变量引用链 */
        [data-overlay] {
            position: relative;
            border-radius: var(--auto-border-radius, var(--autospark-overlay-radius, 0.5rem));
        }
        .autospark-popover > .autospark-popover-content {
            position: relative;
            z-index: var(--autospark-overlay-z, 1000);
        }
        [data-overlay][data-overlay-border] {
            border: 1px solid var(--auto-border-color, var(--autospark-overlay-border, #f0f0f0));
            background: var(--auto-bgcolor, var(--autospark-overlay-bg, #fff));
            box-shadow: var(--auto-shadow, var(--autospark-overlay-shadow, 0 2px 4px hsl(240 3.8% 46.1% / 12%)));
        }
        .autospark-overlay-arrow {
            position: absolute;
            width: 8px;
            height: 8px;
            pointer-events: none;
        }
        .autospark-overlay-arrow::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--auto-bgcolor, var(--autospark-overlay-bg, #fff));
            box-shadow: var(--auto-shadow, var(--autospark-overlay-shadow, 0 2px 4px hsl(240 3.8% 46.1% / 12%)));
            transform: rotate(45deg);
        }
        .autospark-overlay-arrow::after {
            content: "";
            position: absolute;
            inset: -1px;
            background: var(--auto-bgcolor, var(--autospark-overlay-bg, #fff));
            transform: rotate(45deg);
        }
        [data-overlay][data-overlay-border] > .autospark-overlay-arrow::before {
            background: var(--auto-border-color, var(--autospark-overlay-border, #f0f0f0));
        }
        [data-overlay][data-overlay-border] > .autospark-overlay-arrow::after {
            inset: -2px;
        }
        [data-overlay-placement^="top"] > .autospark-overlay-arrow::after {
            translate: 0 -4px;
        }
        [data-overlay-placement^="bottom"] > .autospark-overlay-arrow::after {
            translate: 0 4px;
        }
        [data-overlay-placement^="left"] > .autospark-overlay-arrow::after {
            translate: -4px 0;
        }
        [data-overlay-placement^="right"] > .autospark-overlay-arrow::after {
            translate: 4px 0;
        }
        [data-autospark-overlays] > [data-overlay] {
            z-index: var(--autospark-overlay-z, 1000);
        }
        /* 暗色兜底变体（ADR-0129）：兜底字面值切换为 theme 默认暗色校准值 */
        [dark] [data-overlay][data-overlay-border],
        [data-dark] [data-overlay][data-overlay-border] {
            border-color: var(--auto-border-color, var(--autospark-overlay-border, #606060));
            background: var(--auto-bgcolor, var(--autospark-overlay-bg, #606060));
            box-shadow: var(--auto-shadow, var(--autospark-overlay-shadow, 0 2px 4px hsl(0 0% 0% / 50%)));
        }
        [dark] [data-overlay][data-overlay-border] > .autospark-overlay-arrow::before,
        [data-dark] [data-overlay][data-overlay-border] > .autospark-overlay-arrow::before {
            background: var(--auto-border-color, var(--autospark-overlay-border, #606060));
        }
    </style>
</div>
