<div
    class="autospark-notification"
    x-define="autospark.notifications.shell"
    :data-notification-type="type"
    :data-notification-level="levelName"
>
    <script setup>
        {
            data: () => ({
                holdOpen: false,
                visible: false,
                closed: false,
                remaining: -1,
            }),
            methods: {
                hide() { this.engine.notifications.hide(this.props.id); },
                show() { this.engine.notifications.show(this.props.id); },
                remove() { this.engine.notifications.delete(this.props.id); },
                cancel() { this.engine.notifications.hide(this.props.id); },
                update(p) { this.engine.notifications.update(this.props.id, p); },
                markRead() { this.engine.notifications.markRead(this.props.id); },
                respond(v) { this.engine.notifications.respond(this.props.id, v); },
            },
        }
    </script>
    <style global id="autospark-notification-styles">
        /* 主题化（ADR-0129）：三级样式回退链 var(--auto-X, var(--autospark-<feature>-X, 校准兜底值))；
             语义色命名对齐 theme 侧词汇（warn ↔ warning、error ↔ danger）；
             --autospark-notification-mix-bg 是内部中转（语义色混合底，暗色变体只改它一处）；
             字号/间距/排版常量保留组件设计；暗色兜底变体见块尾 */
        .autospark-notification {
            position: relative;
            --autospark-notification-mix-bg: var(--auto-bgcolor, var(--autospark-overlay-bg, #fff));
            border-radius: var(--auto-border-radius, var(--autospark-overlay-radius, 0.5rem));
            border: 1px solid var(--auto-border-color, var(--autospark-overlay-border, #f0f0f0));
            background: var(--auto-bgcolor, var(--autospark-overlay-bg, #fff));
            box-shadow: var(--auto-shadow, var(--autospark-overlay-shadow, 0 2px 4px hsl(240 3.8% 46.1% / 12%)));
            display: flex;
            flex-direction: column;
            padding: 10px 12px;
            box-sizing: border-box;
            max-width: var(--autospark-notification-max-w, 360px);
            font-size: 14px;
            line-height: 1.5;
            color: var(--auto-color, var(--autospark-notification-fg, #606060));
        }
        .autospark-notification[data-notification-level="info"] {
            --autospark-notification-accent: var(--auto-info-color, var(--autospark-notification-info-color, #71717a));
            border-color: var(--autospark-notification-accent);
            background: color-mix(
                in srgb,
                var(--autospark-notification-accent) 7%,
                var(--autospark-notification-mix-bg)
            );
        }
        .autospark-notification[data-notification-level="success"] {
            --autospark-notification-accent: var(--auto-success-color, var(--autospark-notification-success-color, #22c55e));
            border-color: var(--autospark-notification-accent);
            background: color-mix(
                in srgb,
                var(--autospark-notification-accent) 7%,
                var(--autospark-notification-mix-bg)
            );
        }
        .autospark-notification[data-notification-level="warn"] {
            --autospark-notification-accent: var(--auto-warning-color, var(--autospark-notification-warn-color, #f59e0b));
            border-color: var(--autospark-notification-accent);
            background: color-mix(
                in srgb,
                var(--autospark-notification-accent) 7%,
                var(--autospark-notification-mix-bg)
            );
        }
        .autospark-notification[data-notification-level="error"] {
            --autospark-notification-accent: var(--auto-danger-color, var(--autospark-notification-error-color, #ef4444));
            border-color: var(--autospark-notification-accent);
            background: color-mix(
                in srgb,
                var(--autospark-notification-accent) 7%,
                var(--autospark-notification-mix-bg)
            );
        }
        .autospark-notification-header {
            display: flex;
            align-items: flex-start;
            padding-right: 22px;
        }
        .autospark-notification-main {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            flex: 1;
            min-width: 0;
        }
        .autospark-notification-icon {
            flex: none;
            display: inline-flex;
            font-size: 17px;
            color: var(--autospark-notification-accent, transparent);
        }
        .autospark-notification-content {
            flex: 1;
            min-width: 0;
        }
        .autospark-notification-title-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .autospark-notification-title {
            font-weight: 500;
            overflow-wrap: break-word;
        }
        .autospark-notification-link {
            flex: none;
            text-decoration: none;
            font-size: 12px;
            color: var(--autospark-notification-accent, inherit);
        }
        .autospark-notification-link-icon {
            display: inline-flex;
            font-size: 13px;
        }
        .autospark-notification-description {
            font-size: 12px;
            opacity: 0.75;
            margin-top: 2px;
            overflow-wrap: break-word;
        }
        .autospark-notification-close {
            position: absolute;
            /* 与 title 首行文字中心对齐：10(卡 padding-top) + 21/2(首行 14×1.5) − 17/2(钮高 13+2×2) = 12；
               推导自本表写死的排版常量，改 padding/字号/行高须同步重算（无 title 时维持同位——chrome 不读 slot 内容） */
            top: 12px;
            right: 8px;
            display: inline-flex;
            align-items: center;
            border: none;
            background: none;
            padding: 2px;
            font-size: 13px;
            color: var(--auto-color, var(--autospark-notification-fg, #606060));
            opacity: 0.5;
            cursor: pointer;
        }
        .autospark-notification-close:hover {
            opacity: 1;
        }
        .autospark-notification-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-top: 6px;
        }
        .autospark-notification-action {
            flex: none;
            border: none;
            background: none;
            padding: 0;
            font: inherit;
            font-size: 13px;
            color: var(--autospark-notification-accent, #71717a);
            cursor: pointer;
        }

        /* 暗色兜底变体（ADR-0129）：兜底字面值切换为 theme 默认暗色校准值（变量链不变）；
           语义色混合底只改中转变量一处 */
        [dark] .autospark-notification,
        [data-dark] .autospark-notification {
            --autospark-notification-mix-bg: var(--auto-bgcolor, var(--autospark-overlay-bg, #606060));
            border-color: var(--auto-border-color, var(--autospark-overlay-border, #606060));
            background: var(--auto-bgcolor, var(--autospark-overlay-bg, #606060));
            box-shadow: var(--auto-shadow, var(--autospark-overlay-shadow, 0 2px 4px hsl(0 0% 0% / 50%)));
            color: var(--auto-color, var(--autospark-notification-fg, #fafafa));
        }
        [dark] .autospark-notification-close,
        [data-dark] .autospark-notification-close {
            color: var(--auto-color, var(--autospark-notification-fg, #fafafa));
        }
    </style>
    <div class="autospark-notification-header" x-slot:header>
        <div class="autospark-notification-main">
            <i
                class="autospark-notification-icon"
                x-icon="icon"
                x-show="icon"
                aria-hidden="true"
            ></i>
            <div class="autospark-notification-content">
                <div class="autospark-notification-title-row">
                    <span class="autospark-notification-title" x-html="title"></span>
                    <a
                        class="autospark-notification-link"
                        x-show="link"
                        :href="link"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="查看详情"
                        ><i
                            class="autospark-notification-link-icon"
                            x-icon="'external'"
                            aria-hidden="true"
                        ></i
                    ></a>
                </div>
                <div
                    class="autospark-notification-description"
                    x-html="description"
                    x-show="description"
                ></div>
            </div>
        </div>
    </div>
    <div x-slot></div>
    <div x-slot:actions>
        <div
            class="autospark-notification-actions"
            x-show="actions.length > 0"
            x-for="a of actions"
        >
            <button
                class="autospark-notification-action"
                type="button"
                x-text="a.title"
                :data-notification-action="actions.indexOf(a)"
            ></button>
        </div>
    </div>
    <button
        class="autospark-notification-close"
        type="button"
        x-show="closeable"
        x-icon="'no'"
        aria-label="关闭"
    ></button>
</div>
