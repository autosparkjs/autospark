<button
  class="asc-button"
  x-define="autospark.button"
  x-define:inherit="autospark.base"
>
  <script setup>
    {
        data: () => ({
            variant: "default",
            type: "primary",
            label: "按钮",
            labelPos: "right",
            icon: "",
            loading: false,
            ghost: false,
            border: false,
            block: false,
            disabled: false,
            ripple: true,
            autoInsertSpace: true,
            shape: "default",
            wrap: false,
            align: "center",
            indent: 0,
            memo: "",
            tags: [],
            caret: "none",
            menu: false,
            checkable: false,
            value: false,
            checkValues: [true, false],
            checkStyle: "corner",
            checkMark: false,
            state: null,
            collapsed: false,
            hideTags: false,
            // floatCaret 值域：false（缺省，不浮动）| 'top' | 'center' | 'bottom'（浮动垂直档位，
            // 裸布尔 true 归一为 'center'——绑定通道统一产出三档字符串或 null）
            floatCaret: false,
            states: null,
            displayLabel: (s) => (s.autoInsertSpace && /^[一-龥]{2}$/.test(s.label ?? "")) ? (s.label[0] + " " + s.label[1]) : s.label
        }),
        methods: {
            tagCheckValues(tag) {
                return [tag.checkValues?.[0] ?? true, tag.checkValues?.[1] ?? false];
            },
            onTagClick(tag, event) {
                event.stopPropagation();
                if (tag.checkable) {
                    const vals = this.tagCheckValues(tag);
                    tag.value = tag.value === vals[0] ? vals[1] : vals[0];
                }
                this.el.dispatchEvent(new CustomEvent("tag-click", { bubbles: true, detail: { name: tag.name, label: tag.label, value: tag.value, tag } }));
            }
        },
        mounted() {
            const syncDisabled = () => { this.el.disabled = !!this.data.disabled || !!this.data.loading; };
            syncDisabled();
            this.watch("disabled", ({ value }) => { syncDisabled(); });
            this.watch("loading", ({ value }) => { syncDisabled(); });

            const syncIconBadge = () => {
                const i = this.data.icon;
                const span = this.el.querySelector(".asc-button-icon");
                if (!span) return;
                const hadPad = span.classList.contains("asc-button-icon-badge-pad");
                span.classList.remove("asc-button-icon-badge", "asc-button-icon-badge-pad");
                if (hadPad && (typeof i !== "object" || !i || i.padding == null || i.padding === "")) {
                    span.style.removeProperty("padding");
                }
                if (typeof i !== "object" || !i) return;
                const badge = i.badge;
                const on = badge === true
                    || typeof badge === "number"
                    || (typeof badge === "string" && badge.trim() !== "");
                if (!on) return;
                span.classList.add("asc-button-icon-badge");
                if (typeof badge === "number") {
                    span.style.padding = badge + "px";
                    span.classList.add("asc-button-icon-badge-pad");
                } else if (typeof badge === "string") {
                    span.style.padding = badge;
                    span.classList.add("asc-button-icon-badge-pad");
                }
            };
            setTimeout(syncIconBadge, 0);
            this.watch("icon", () => { setTimeout(syncIconBadge, 0); });

            const tipAttr = this.engine?.tooltip?.enabled ? "data-tooltip" : "title";
            let selfTip = false;
            const syncTip = () => {
                if (this.data.labelPos === "none") {
                    if (this.el.getAttribute(tipAttr) && !selfTip) return;
                    this.el.setAttribute(tipAttr, String(this.data.label ?? ""));
                    selfTip = true;
                    return;
                }
                const span = this.el.querySelector(".asc-button-label");
                if (!span) return;
                if (span.scrollWidth > span.clientWidth) {
                    if (this.el.getAttribute(tipAttr) && !selfTip) return;
                    this.el.setAttribute(tipAttr, span.textContent);
                    selfTip = true;
                } else if (selfTip) {
                    this.el.removeAttribute(tipAttr);
                    selfTip = false;
                }
            };
            setTimeout(syncTip, 0);
            this.watch("label", () => { setTimeout(syncTip, 0); });
            this.watch("wrap", () => { setTimeout(syncTip, 0); });
            this.watch("labelPos", () => { setTimeout(syncTip, 0); });

            if (!this.data.checkable && this.data.checkMark) {
                this.el.classList.add("asc-check-" + (this.data.checkStyle || "check"));
                this.watch("checkStyle", ({ value: s }) => {
                    for (const k of ["solid", "check", "corner", "ripple"]) this.el.classList.remove("asc-check-" + k);
                    this.el.classList.add("asc-check-" + (s || "check"));
                });
            }

            if (this.data.checkable) {
                this.el.classList.add("asc-check-" + this.data.checkStyle);
                const proto = Object.getOwnPropertyDescriptor(HTMLButtonElement.prototype, "value");
                const real = document.createElement("input");
                real.type = "checkbox";
                real.style.display = "none";
                const vals = () => this.data.checkValues;
                const nameAttr = this.el.getAttribute("name");
                if (nameAttr != null) real.name = nameAttr;
                this.el.appendChild(real);
                let rippleBase = this.data.ripple;
                const applyChecked = (on) => {
                    const [onV, offV] = vals();
                    this.data.value = on ? onV : offV;
                    real.checked = !!on;
                    this.el.classList.toggle("asc-checked", !!on);
                    if (this.data.checkStyle === "ripple") {
                        this.data.ripple = on ? { trigger: "always", inside: false, type: "echo" } : rippleBase;
                    }
                };
                Object.defineProperty(this.el, "value", {
                    get: () => proto.get.call(this.el),
                    set: (v) => { proto.set.call(this.el, v); applyChecked(v === "true"); },
                    configurable: true,
                });
                const resync = () => {
                    real.value = String(vals()[0]);
                    const raw = proto.get.call(this.el);
                    if (raw === "true") applyChecked(true);
                    else if (raw === "false") applyChecked(false);
                    else if (this.data.value === vals()[0]) applyChecked(true);
                    else if (this.data.value === vals()[1]) applyChecked(false);
                };
                setTimeout(resync, 0);
                this.watch("checkValues", () => { setTimeout(resync, 0); });
                this.watch("checkStyle", ({ value: s }) => {
                    for (const k of ["solid", "check", "corner", "ripple"]) this.el.classList.remove("asc-check-" + k);
                    this.el.classList.add("asc-check-" + s);
                });
                this.watch("value", ({ value: v }) => {
                    if (v === vals()[0] || v === vals()[1]) resync();
                });
                this.el.addEventListener("click", () => {
                    if (!this.data.checkable || this.el.disabled) return;
                    const [onVal, offVal] = vals();
                    const next = this.data.value === onVal ? offVal : onVal;
                    this.el.value = String(next === onVal);
                    this.el.dispatchEvent(new Event("input", { bubbles: false }));
                    this.el.dispatchEvent(new CustomEvent("change", { bubbles: true, detail: { value: next } }));
                });
            }

            let rippleMountTimer = 0;
            const syncRipple = () => {
                const conf = this.data.ripple;
                clearTimeout(rippleMountTimer);
                this.el.removeAttribute("x-ripple");
                this.el.removeAttribute("x-ripple-options");
                if (conf) {
                    this.el.setAttribute("x-ripple-options", JSON.stringify(typeof conf === "object" ? { trigger: "click", inside: true, ...conf } : { trigger: "click", inside: true }));
                    rippleMountTimer = setTimeout(() => this.el.setAttribute("x-ripple", ""), 0);
                }
            };
            syncRipple();
            this.watch("ripple", () => { syncRipple(); });

            // ---------- 命名状态覆盖（state/states + collapsed 快捷糖，2026-11-22 共识） ----------
            // state（激活键，唯一真相）命中 states 表时，该键的 props 覆盖集整组 assign 进 data
            // 接管按钮渲染；切走时按快照守卫还原（激活期间被外部改过的键外部值赢）。
            // collapsed 是 state 的快捷写入糖：true ≡ state='collapsed'、false ≡ state=null。
            // menu:false——折叠图标条时退出菜单形态（占满宽/左对齐解除，按钮收缩到内容宽），
            // 宽度收窄归消费方 data-state CSS（零几何内建不变）
            const BUILTIN_COLLAPSED = { labelPos: "none", indent: 0, hideTags: true, menu: false };
            const isOverrideMap = (v) => v != null && typeof v === "object" && !Array.isArray(v);
            // 双层合并：表与内置 collapsed 预设浅合并，用户 collapsed 键再与预设浅合并（部分定制
            // 保留默认形态），其余自定义键所见即所得（值对象整体生效、未写的键不碰）。
            // states 非纯对象（state-button 继承场景的数组）时机制整体静默跳过。
            const resolveStates = () => {
                const user = this.data.states;
                if (user == null) return { collapsed: { ...BUILTIN_COLLAPSED } };
                if (!isOverrideMap(user)) return null;
                const merged = Object.assign({ collapsed: { ...BUILTIN_COLLAPSED } }, user);
                if (user.collapsed != null && isOverrideMap(user.collapsed)) {
                    merged.collapsed = Object.assign({ ...BUILTIN_COLLAPSED }, user.collapsed);
                }
                return merged;
            };
            let stateSnap = null; // { key, recs: { 键: { orig, applied } } }
            const warnedStateKeys = new Set();
            const revertState = () => {
                if (!stateSnap) return;
                for (const [k, rec] of Object.entries(stateSnap.recs)) {
                    // 守卫：仅还原「当前值仍严格等于激活时写入值」的键——被外部改过的保持外部值
                    if (this.data[k] === rec.applied) this.data[k] = rec.orig;
                }
                this.el.removeAttribute("data-state");
                stateSnap = null;
            };
            const applyState = (key) => {
                const table = resolveStates();
                const overrides = table == null ? undefined : table[key];
                revertState();
                if (table == null) return; // states 非纯对象（数组等，state-button 继承语境）：机制整体静默跳过
                if (!isOverrideMap(overrides)) {
                    // null/''/undefined = 合法取消（静默恢复）；非空字符串不在表 = miss，warn 一次
                    if (typeof key === "string" && key !== "" && !warnedStateKeys.has(key)) {
                        warnedStateKeys.add(key);
                        console.warn(`[autospark.button] state="${key}" 不在 states 表中，已按无状态渲染`);
                    }
                    return;
                }
                const recs = {};
                for (const [k, v] of Object.entries(overrides)) {
                    recs[k] = { orig: this.data[k], applied: v };
                    this.data[k] = v;
                }
                stateSnap = { key, recs };
                this.el.setAttribute("data-state", key);
            };
            // 初始快捷方式：state 显式声明（非空）赢、collapsed 忽略；否则 collapsed=true 初始化折叠键
            if ((this.data.state == null || this.data.state === "") && this.data.collapsed) {
                this.data.state = "collapsed";
            }
            // 初始 apply 走微任务：i18n 插件在场时其 $.ready 换血（构造末尾 scope.refresh 重跑
            // 值闭包）会整组重注入 props，把 mounted 同步覆盖的、外部 props 显式声明的键冲回
            // 外部值——微任务化使覆盖稳定发生在换血之后；运行时切换走 watch 同步 apply 不受影响
            queueMicrotask(() => { applyState(this.data.state ?? null); });
            this.watch("state", ({ value }) => { applyState(value ?? null); });
            // 激活期间 states 表替换：用新表重放当前键（revert 旧覆盖集 + apply 新覆盖集；
            // 键从新表消失走 miss 口径——warn 一次 + 恢复常态）
            this.watch("states", () => { if (stateSnap) applyState(stateSnap.key); });
            // collapsed 运行时翻转恒写 state（最近操作赢）；值未变的首跑（若有）跳过，
            // 保住上方「初始 state 显式声明赢」的优先级
            let lastCollapsed = !!this.data.collapsed;
            this.watch("collapsed", ({ value }) => {
                const on = !!value;
                if (on === lastCollapsed) return;
                lastCollapsed = on;
                this.data.state = on ? "collapsed" : null;
            });
        },
    }
  </script>
  <style global id="autospark-components-button">
    .asc-button {
      --asc-tone: var(
        --auto-primary-color,
        var(--asc-button-primary, #009aff)
      );
      --asc-bg: transparent;
      --asc-ink: var(--auto-color, var(--asc-button-color, #606060));
      --asc-line: transparent;
      --asc-pad: var(--auto-padding, var(--asc-button-padding, 0.8rem));
      display: inline-flex;
      border: var(--auto-border-size, var(--asc-button-border-size, 1px)) solid
        var(--asc-line);
      border-radius: var(
        --auto-border-radius,
        var(--asc-button-radius, 0.5rem)
      );
      background: var(--asc-bg);
      color: var(--asc-ink);
      font: inherit;
      font-size: var(--auto-font-size, var(--asc-button-font-size, 0.875rem));
      line-height: 1.4;
      padding: calc(var(--asc-pad) * 0.55) calc(var(--asc-pad) * 0.8);
      cursor: pointer;
      user-select: none;
      transition:
        filter 0.15s ease,
        background-color 0.15s ease;
    }
    .asc-button:has(> .asc-button-body[data-border="true"]) {
      --asc-line: var(
        --auto-border-color,
        var(--asc-button-border-color, #d9d9d9)
      );
    }

    .asc-button:has(> .asc-button-body[data-type="primary"]) {
      --asc-tone: var(--auto-primary-color, var(--asc-button-primary, #009aff));
    }
    .asc-button:has(> .asc-button-body[data-type="success"]) {
      --asc-tone: var(--auto-success-color, var(--asc-button-success, #22c55e));
    }
    .asc-button:has(> .asc-button-body[data-type="warning"]) {
      --asc-tone: var(--auto-warning-color, var(--asc-button-warning, #f59e0b));
    }
    .asc-button:has(> .asc-button-body[data-type="danger"]) {
      --asc-tone: var(--auto-danger-color, var(--asc-button-danger, #ef4444));
    }
    .asc-button:has(> .asc-button-body[data-type="info"]) {
      --asc-tone: var(--auto-info-color, var(--asc-button-info, #71717a));
    }
    .asc-button:has(> .asc-button-body[data-variant="default"]) {
      --asc-bg: var(--auto-bgcolor, var(--asc-button-bg, #ffffff));
      --asc-ink: var(--auto-color, var(--asc-button-color, #606060));
    }
    .asc-button:has(
      > .asc-button-body[data-variant="default"][data-type="success"]
    ),
    .asc-button:has(
      > .asc-button-body[data-variant="default"][data-type="warning"]
    ),
    .asc-button:has(
      > .asc-button-body[data-variant="default"][data-type="danger"]
    ),
    .asc-button:has(
      > .asc-button-body[data-variant="default"][data-type="info"]
    ) {
      --asc-ink: var(--asc-tone);
      --asc-line: var(--asc-tone);
    }
    .asc-button:has(> .asc-button-body[data-variant="primary"]) {
      --asc-bg: var(--asc-tone);
      --asc-ink: #fff;
    }
    .asc-button:has(> .asc-button-body[data-variant="secondary"]) {
      --asc-bg: var(
        --auto-secondary-bgcolor,
        var(--asc-button-bg, rgba(245, 245, 245, 0.45))
      );
      --asc-ink: var(--auto-color, var(--asc-button-color, #606060));
    }
    .asc-button:has(> .asc-button-body[data-variant="dashed"]) {
      --asc-bg: transparent;
      --asc-ink: var(--asc-tone);
      --asc-line: var(--asc-tone);
      border-style: dashed;
    }
    .asc-button:has(> .asc-button-body[data-variant="text"]) {
      --asc-bg: transparent;
      --asc-ink: var(--auto-color, var(--asc-button-color, #606060));
      padding: calc(var(--asc-pad) * 0.55) calc(var(--asc-pad) * 0.6);
    }
    .asc-button:has(> .asc-button-body[data-variant="link"]) {
      --asc-bg: transparent;
      --asc-ink: var(--asc-tone);
      padding: 0;
    }

    .asc-button:has(> .asc-button-body[data-ghost="true"]) {
      --asc-bg: transparent;
      --asc-ink: var(--asc-tone);
      --asc-line: var(--asc-tone);
    }

    .asc-button:has(> .asc-button-body[data-menu="true"]) {
      --asc-bg: transparent;
      --asc-ink: var(--auto-color, var(--asc-button-color, #606060));
      display: flex;
      width: 100%;
      border-radius: var(
        --auto-border-radius,
        var(--asc-button-radius, 0.375rem)
      );
      padding: calc(var(--asc-pad) * 0.55) calc(var(--asc-pad) * 0.6);
      text-align: left;
    }

    /* ---------- 勾选渲染（checkable / checkStyle 四值，2026-11-13 回归——ADR-0016 修订记：
       decorate 四值渲染下沉为组件级 checkStyle）。指示色统一 --asc-tone（theme 主色，type
       非默认时语义色）；宿主 class 驱动（.asc-checked 勾选态 + .asc-check-<style> 静态形态类
       ——Chromium :active 粘滞期间 :has(属性变化) 不重算，class 是强失效信号） ---------- */
    .asc-button.asc-checked.asc-check-solid {
      --asc-bg: var(--asc-tone) !important;
      --asc-ink: #fff !important;
      --asc-line: transparent !important;
    }
    .asc-button.asc-check-check > .asc-button-body::before {
      content: "";
      flex: none;
      width: 1.2em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--asc-tone);
      font-size: 0.9em;
      font-weight: bold;
    }
    /* asc-marked：外部 class 驱动的勾选显影（checkMark 占位列的勾选态，menu v2 写入——
       不走 checkable 行为桥，避免与宿主组件的点击处理双写） */
    .asc-button.asc-checked.asc-check-check > .asc-button-body::before,
    .asc-button.asc-marked.asc-check-check > .asc-button-body::before {
      content: "✓";
    }
    /* corner：勾选 = tone 外描边（box-shadow，视觉等价 outline 且跟随圆角）+ 右上角 tone 小三角
         （渐变盒对角线分割）内嵌反白小勾；尺寸 = min(圆角 ×2.5, 2.5em, 高 50%) 随圆角档位与
         按钮高度自适应。**无缝贴合**：描边画在 border 外缘，而 absolute 定位基准是 padding
         box（border 内缘）——故 border 消隐（--asc-line: transparent，占位保留零布局影响）、
         三角 -2px 跨过 1px border 区直抵描边内缘（三角与描边零间隙） */
    .asc-button.asc-checked.asc-check-corner {
      --asc-corner: min(
        calc(var(--auto-border-radius, 0.5rem) * 2.5),
        2.5em,
        50%
      ) !important;
      --asc-line: transparent !important;
      box-shadow: 0 0 0 1px var(--asc-tone) !important;
      position: relative !important;
    }
    .asc-button.asc-checked.asc-check-corner::after {
      content: "" !important;
      position: absolute !important;
      top: -2px !important;
      right: -2px !important;
      height: calc(var(--asc-corner) + 2px) !important;
      aspect-ratio: 1 / 1 !important;
      border-top-right-radius: min(
        calc(var(--auto-border-radius, 0.5rem) + 1px),
        1.4em
      );
      background: linear-gradient(
        to bottom left,
        var(--asc-tone) 49.5%,
        transparent 50%
      );
      z-index: 1 !important;
    }
    .asc-button.asc-checked.asc-check-corner::before {
      content: "" !important;
      position: absolute !important;
      top: calc(var(--asc-corner) * 0.24 - 2px) !important;
      right: calc(var(--asc-corner) * 0.14 - 2px) !important;
      z-index: 2 !important;
      width: calc(var(--asc-corner) * 0.36) !important;
      aspect-ratio: 2 / 1 !important;
      border-left: 1.5px solid var(--auto-bgcolor, #fff) !important;
      border-bottom: 1.5px solid var(--auto-bgcolor, #fff) !important;
      transform: rotate(-45deg) !important;
    }
    /* 按压预览（corner）：未勾选按压即预显描边——松手勾选正式化、按住拖出取消随按压消失；
         border 同步消隐防预览描边与 border 间的 1px 间隙（同勾选态无缝口径） */
    .asc-button.asc-check-corner:active:not([disabled]):not(.asc-checked) {
      --asc-line: transparent !important;
      box-shadow: 0 0 0 1px var(--asc-tone) !important;
    }
    /* ripple：勾选视觉 = 宿主整体恒开 echo 双环涟漪（mounted 经 data.ripple 单通道由父
       syncRipple 挂载 { trigger: "always", inside: false, type: "echo" }——需页面加载
       autospark.ripple.js，未加载静默无指示）；无占位指示器、背景维持原 variant */

    .asc-button:has(> .asc-button-body[data-shape="circle"]) {
      border-radius: 9999px;
      padding: calc(var(--asc-pad) * 0.55);
    }

    .asc-button:has(> .asc-button-body[data-block="true"]) {
      display: flex;
      width: 100%;
    }

    .asc-button:hover:not([disabled]) {
      filter: brightness(0.96);
    }
    .asc-button:active:not([disabled]) {
      filter: brightness(0.9);
    }
    .asc-button:has(> .asc-button-body[data-variant="text"]):hover:not(
        [disabled]
      ),
    .asc-button:has(> .asc-button-body[data-variant="link"]):hover:not(
        [disabled]
      ),
    .asc-button:has(> .asc-button-body[data-ghost="true"]):hover:not(
        [disabled]
      ),
    .asc-button:has(> .asc-button-body[data-menu="true"]):hover:not(
        [disabled]
      ) {
      filter: none;
      background: var(
        --auto-hover-bgcolor,
        var(--asc-button-hover-bg, rgba(0, 0, 0, 0.05))
      );
    }
    .asc-button:has(> .asc-button-body[data-variant="link"]):hover:not(
        [disabled]
      ) {
      text-decoration: underline;
    }
    .asc-button[disabled] {
      opacity: 0.55;
      cursor: not-allowed;
      filter: none;
    }
    .asc-button:has(> .asc-button-body[data-loading="true"]) {
      opacity: 1;
      cursor: progress;
    }

    .asc-button-body {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4em;
      width: 100%;
      min-width: 0;
    }
    .asc-button-body[data-align="left"] {
      justify-content: flex-start;
    }
    .asc-button-body[data-align="right"] {
      justify-content: flex-end;
    }
    .asc-button-body[data-menu="true"] {
      justify-content: flex-start;
    }
    .asc-button-body[data-label-pos="top"],
    .asc-button-body[data-label-pos="bottom"] {
      flex-direction: column;
      gap: 0.15em;
    }
    .asc-button-body[data-label-pos="top"] .asc-button-icon {
      order: 2;
    }
    /* 图标放大内建 1.5×（ADR-0138，2026-11-16 修订：memo 并入统一倍率）：纵排（top/bottom）
         或 memo 在场即放大，倍率乘在 --auto-icon-size 上（width/height 覆盖载体，theme 档位
         绝对值与 1em 回落两态一致生效——font-size 载体在 theme 在场时撑不动绝对宽高，勿用；
         svg 恒 100% 撑满宿主自动跟随）；loading 位同容器天然吃内建 1.5×；caret / tag 独立
         容器不命中；显式 size / size×scale 乘积走 x-icon 内联恒压本规则（显式即接管） */
    .asc-button-body[data-label-pos="top"] .asc-button-icon.as-icon,
    .asc-button-body[data-label-pos="bottom"] .asc-button-icon.as-icon,
    .asc-button:has(.asc-button-memo) .asc-button-icon.as-icon {
      width: calc(var(--auto-icon-size, 1em) * 1.5);
      height: calc(var(--auto-icon-size, 1em) * 1.5);
    }

    .asc-button-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    /* labelPos left：图标（含 loading 位）移 main 之后即按钮内容右端（2026-11-22 布局
         调整：tags/caret 已入标签行随 main，原先「与 tags 互换」的 order 协同不再成立）；
         横排 = 右侧、纵排 = 下方 */
    .asc-button-body[data-label-pos="left"] .asc-button-icon {
      order: 5;
    }
    /* 图标角标（icon.badge 标量三形态启用）：板 padding 承载留白（缺省 2px，可被显式
         badge 数值/字符串或 x-icon 的 padding 选项内联覆盖），伪元素红点取 danger 语义色 */
    .asc-button-icon-badge {
      position: relative;
      padding: 2px;
    }
    .asc-button-icon-badge::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      width: 0.4em;
      height: 0.4em;
      border-radius: 50%;
      background: var(--auto-danger-color, var(--asc-button-danger, #ef4444));
    }

    .asc-button-main {
      display: flex;
      flex-direction: column;
      /* stretch + 占满 body 主轴剩余：行容器（line）满宽——tags/caret 的 auto margin
         才能贴到按钮右缘；body 的 justify（内容组对齐）随之让位给 line 的行内 justify */
      align-items: stretch;
      flex: 1 1 auto;
      min-width: 0;
    }
    /* 标签行：label + tags + caret 恒同一行，memo 独占次行（2026-11-22 布局调整）——
         对齐（align / menu 左对齐）派生为行内 justify：tags/caret 的 auto margin 优先于
         justify，贴右不受对齐影响（无 tags/caret 时 label 按对齐落位） */
    .asc-button-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4em;
      min-width: 0;
    }
    .asc-button-body[data-align="left"] .asc-button-line,
    .asc-button-body[data-menu="true"] .asc-button-line {
      justify-content: flex-start;
    }
    .asc-button-body[data-align="right"] .asc-button-line {
      justify-content: flex-end;
    }
    /* label 单行截断（wrap 默认 false，ADR-0012 补记）：溢出显示省略号——截断只在按钮
         宽度受约束时发生（block / menu / 容器挤压；inline-flex 收缩到内容宽永不触发）；
         max-width 钳制 + 行内 min-width:0（flex item 默认 min-width:auto 不可收缩）是
         关键——nowrap 下 min-content 涨至全文宽，无钳制会被 min-content 抬出可用宽
         （截断失效）；截断发生时由 mounted 静态检测自动挂 title；wrap=true 回折行
         （按钮高度随行数增长，显式声明才换行，防布局被意外撑开） */
    .asc-button-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
      min-width: 0;
    }
    .asc-button-body[data-wrap="true"] .asc-button-label {
      white-space: normal;
    }
    /* 空内容不占位：纯图标用法（label 空）或 labelPos=none 时，行内无可承载体（无可见
         label、无 tags、无 caret）且无 memo 则 main 整体隐藏，消除 body gap/行高占位；
         tags/caret 在场则保留（labelPos=none 折叠图标条 + 箭头/小圆钮是合法形态）；
         插槽有内容时出口非空不命中，不受影响 */
    .asc-button-label:empty {
      display: none;
    }
    .asc-button-body:not([data-label-pos="none"])
      .asc-button-main:has(> .asc-button-line > .asc-button-label:empty):not(
        :has(.asc-button-memo)
      ):not(:has(.asc-button-tags)):not(:has(.asc-button-caret)),
    .asc-button-body[data-label-pos="none"]
      .asc-button-main:not(:has(.asc-button-tags)):not(
        :has(.asc-button-caret)
      ):not(:has(.asc-button-memo)) {
      display: none;
    }

    /* 备注：小一号 + 相对内容色的淡化（color-mix 跟随 --asc-ink，实底上自然呈淡白）；
         最多两行，超出截断显示省略号（line-clamp） */
    .asc-button-memo {
      font-size: 0.75em;
      line-height: 1.2;
      color: color-mix(in srgb, var(--asc-ink, currentColor) 70%, transparent);
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      overflow: hidden;
    }
    /* memo 视觉配平：图标放大已并入上方统一 1.5× 规则（ADR-0138 修订，原独立 2× 规则废除）；
         图标与 label+memo 文本块的垂直居中由 body 的 align-items: center 承担 */

    /* tags 小圆钮：恒贴标签行右端（margin-left:auto 吸收剩余空间；按钮收缩到内容宽时
         退化为紧跟 label，最小间距由行容器 line 的 gap 保证），独立 hover 反馈 */
    .asc-button-tags {
      display: inline-flex;
      gap: 0.15em;
      margin-left: auto;
    }
    /* 尾部方向箭头（caret）：恒居标签行（line）最右；无 tags 时自身吸收剩余空间贴右，
         有 tags 时由 tags 的 auto margin 统一推至右端（两个 auto margin 会分摊剩余空间，
         使 tags 落点内缩）。方向经 x-icon 的 rotate 选项旋转同一枚 arrow 图标（svg 载体
         自带 transition，切换即连续旋转） */
    .asc-button-caret {
      display: inline-flex;
      margin-left: auto;
    }
    .asc-button-line:has(> .asc-button-tags) > .asc-button-caret {
      margin-left: 0;
    }
    /* 浮动箭头（floatCaret）：脱离标签行流，绝对定位到按钮**右缘**（right 2px）、垂直
         三档可选——'top'（右上角，top 与 right 等距 2px）/ 'center'（缺省档，垂直居中
         ——横排下即与图标中心线一致）/ 'bottom'（右下角，bottom 与 right 对称 2px）；
         尺寸减半（0.5×，宿主+svg 双载体同 tag 图标手法）；叠加形态：不占行内空间，与
         tags 并存时叠于其上、label 截断可用宽不含 caret（尾部可能被压，组合自担）。
         裸布尔 true 经绑定通道归一 'center' */
    .asc-button:has(> .asc-button-body[data-float-caret]) {
      position: relative;
    }
    .asc-button-body[data-float-caret] .asc-button-caret {
      position: absolute;
      right: 2px;
      margin-left: 0;
    }
    .asc-button-body[data-float-caret="top"] .asc-button-caret {
      top: 2px;
    }
    .asc-button-body[data-float-caret="center"] .asc-button-caret {
      top: 50%;
      transform: translateY(-50%);
    }
    .asc-button-body[data-float-caret="bottom"] .asc-button-caret {
      bottom: 2px;
    }
    .asc-button-body[data-float-caret] .asc-button-caret.as-icon,
    .asc-button-body[data-float-caret] .asc-button-caret.as-icon > svg {
      width: calc(var(--auto-icon-size, 1em) * 0.5);
      height: calc(var(--auto-icon-size, 1em) * 0.5);
    }
    .asc-button-tag-item {
      display: contents;
    }
    .asc-button-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.25em;
      height: 1.8rem;
      width: 1.8rem;
      padding: 0;
      font-size: 1rem;
      border-radius: 50%;
      color: var(--asc-ink);
      cursor: pointer;
      background: transparent;
      transition: background-color 0.15s ease, transform 0.1s ease;
    }
    .asc-button-tag:hover {
      background: color-mix(
        in srgb,
        var(--asc-ink, currentColor) 28%,
        transparent
      );
    }
    /* shape 底板（默认 none 无背景）：circle 圆形底板 / radius 主题圆角底板——板色按内容色
         派生淡底（与按钮主背景形成层次）；胶囊 tag 的 9999px 规则后位覆盖 radius 呈胶囊板 */
    .asc-button-tag[data-shape="circle"],
    .asc-button-tag[data-shape="radius"] {
      background: color-mix(in srgb, var(--asc-ink, currentColor) 12%, transparent);
    }
    .asc-button-tag[data-shape="radius"] {
      border-radius: var(--auto-border-radius, 0.25rem);
    }
    .asc-button-tag:has(> .asc-button-tag-label) {
      width: auto;
      padding: 0 0.6rem;
      border-radius: 9999px;
    }
    .asc-button-tag-label {
      line-height: 1;
      white-space: nowrap;
    }
    .asc-button-tag:active {
      background: color-mix(
        in srgb,
        var(--asc-ink, currentColor) 45%,
        transparent
      );
      transform: scale(0.88);
    }
    /* checkable 勾选态（data-checked 属性绑定通道）：语义色（--asc-tone 随宿主 type）淡底 +
         内容色转语义色——与常态 hover（ink 淡灰）形成「点亮」区分；同特异性后位覆盖 shape
         底板色，hover 加深一档 */
    .asc-button-tag[data-checked] {
      color: var(--asc-tone, #009aff);
      background: color-mix(
        in srgb,
        var(--asc-tone, #009aff) 22%,
        transparent
      );
    }
    .asc-button-tag[data-checked]:hover {
      background: color-mix(
        in srgb,
        var(--asc-tone, #009aff) 34%,
        transparent
      );
    }
    /* tag 图标钉死 1rem：不消费 --auto-icon-size（theme 档位 1.2× 会放大）也不随 data-size——
         tag 为紧凑小圆钮图标恒小；.as-icon 双类选择器（0,2,0）压过引擎 .as-icon 基础规则
         （同特异性但 icon 样式表惰性后注入），svg 撑满宿主规则一并覆盖 */
    .asc-button-tag-icon.as-icon,
    .asc-button-tag-icon.as-icon > svg {
      width: 1rem;
      height: 1rem;
    }

    [dark] .asc-button,
    [data-dark] .asc-button {
      /* 只兜字色——bg 不在此兜底：各 variant 的专属 dark 块已承接（default/secondary 有暗色底、
         primary 恒 tone）；通配 bg 会以同特异性后位覆盖 primary 形态的 --asc-bg: var(--asc-tone)，
         dark 下 secondary-bgcolor 派生为主题系色 → 所有语义色实底钮同色（本次修复的回归根因） */
      --asc-ink: var(--auto-color, var(--asc-button-color, #fafafa));
    }
    [dark] .asc-button:has(> .asc-button-body[data-variant="primary"]),
    [data-dark] .asc-button:has(> .asc-button-body[data-variant="primary"]) {
      /* bg 走 tone 中转（与 light 一致）——直引 --auto-primary-color 会无视 data-type 的语义色，
         dark 下所有语义色实底钮同变主色（本次修复的回归根因之二）；dark 兜底值经 tone 第二级 */
      --asc-bg: var(--asc-tone);
    }
    [dark] .asc-button:has(> .asc-button-body[data-variant="secondary"]),
    [data-dark] .asc-button:has(> .asc-button-body[data-variant="secondary"]) {
      --asc-bg: var(
        --auto-secondary-bgcolor,
        var(--asc-button-bg, rgba(129, 129, 129, 0.45))
      );
      --asc-ink: var(--auto-color, var(--asc-button-color, #fafafa));
    }
    [dark] .asc-button:has(> .asc-button-body[data-variant="default"]),
    [data-dark] .asc-button:has(> .asc-button-body[data-variant="default"]) {
      --asc-bg: var(--auto-bgcolor, var(--asc-button-bg, #3a3a3a));
      --asc-ink: var(--auto-color, var(--asc-button-color, #fafafa));
    }
    [dark] .asc-button:has(> .asc-button-body[data-type="primary"]),
    [data-dark] .asc-button:has(> .asc-button-body[data-type="primary"]) {
      --asc-tone: var(--auto-primary-color, var(--asc-button-primary, #56baff));
    }
    [dark] .asc-button:has(> .asc-button-body[data-type="success"]),
    [data-dark] .asc-button:has(> .asc-button-body[data-type="success"]) {
      --asc-tone: var(--auto-success-color, var(--asc-button-success, #5cd07c));
    }
    [dark] .asc-button:has(> .asc-button-body[data-type="warning"]),
    [data-dark] .asc-button:has(> .asc-button-body[data-type="warning"]) {
      --asc-tone: var(--auto-warning-color, var(--asc-button-warning, #f0a03c));
    }
    [dark] .asc-button:has(> .asc-button-body[data-type="danger"]),
    [data-dark] .asc-button:has(> .asc-button-body[data-type="danger"]) {
      --asc-tone: var(--auto-danger-color, var(--asc-button-danger, #e6696a));
    }
    [dark] .asc-button:has(> .asc-button-body[data-type="info"]),
    [data-dark] .asc-button:has(> .asc-button-body[data-type="info"]) {
      --asc-tone: var(--auto-info-color, var(--asc-button-info, #a1a1aa));
    }
    [dark]
      .asc-button:has(> .asc-button-body[data-variant="text"]):hover:not(
        [disabled]
      ),
    [dark]
      .asc-button:has(> .asc-button-body[data-variant="link"]):hover:not(
        [disabled]
      ),
    [dark]
      .asc-button:has(> .asc-button-body[data-ghost="true"]):hover:not(
        [disabled]
      ),
    [dark]
      .asc-button:has(> .asc-button-body[data-menu="true"]):hover:not(
        [disabled]
      ),
    [data-dark]
      .asc-button:has(> .asc-button-body[data-variant="text"]):hover:not(
        [disabled]
      ),
    [data-dark]
      .asc-button:has(> .asc-button-body[data-variant="link"]):hover:not(
        [disabled]
      ),
    [data-dark]
      .asc-button:has(> .asc-button-body[data-ghost="true"]):hover:not(
        [disabled]
      ),
    [data-dark]
      .asc-button:has(> .asc-button-body[data-menu="true"]):hover:not(
        [disabled]
      ) {
      background: var(
        --auto-hover-bgcolor,
        var(--asc-button-hover-bg, rgba(255, 255, 255, 0.08))
      );
    }
  </style>
  <span
    class="asc-button-body"
    :data-variant="variant"
    :data-type="type"
    :data-ghost="ghost"
    :data-border="border"
    :data-shape="shape"
    :data-wrap="wrap"
    :data-align="align"
    :data-menu="menu"
    :data-block="block"
    :data-loading="loading"
    :data-label-pos="labelPos"
    :data-float-caret="typeof floatCaret === 'string' && floatCaret ? floatCaret : (floatCaret === true ? 'center' : null)"
    :style="indent ? { paddingLeft: (typeof indent === 'number' ? indent + 'px' : indent) } : undefined"
  >
    <span class="asc-button-icon" x-if="loading" x-icon="'loading'"></span>
    <span
      class="asc-button-icon"
      x-if="!loading && typeof icon === 'string' && icon"
      x-icon="icon"
    ></span>
    <span
      class="asc-button-icon"
      x-if="!loading && typeof icon === 'object' && icon"
      x-icon="icon.name"
      x-icon-options:size="(labelPos==='top'||labelPos==='bottom'||!!memo) ? (icon.size==null ? (typeof icon.scale==='number'&&icon.scale>0 ? 'calc(var(--auto-icon-size, 1em) * '+icon.scale+')' : undefined) : (typeof icon.size==='number' ? icon.size*(typeof icon.scale==='number'&&icon.scale>0?icon.scale:1.5)+'px' : 'calc('+icon.size+' * '+(typeof icon.scale==='number'&&icon.scale>0?icon.scale:1.5)+')')) : icon.size"
      x-icon-options:color="icon.color"
      x-icon-options:stroke-width="icon.strokeWidth"
      x-icon-options:padding="icon.padding"
      x-icon-options:shape="icon.shape"
      x-icon-options:button="icon.button"
      x-icon-options:pointer="icon.pointer"
      x-icon-options:rotate="icon.rotate"
    ></span>
    <span class="asc-button-main">
      <span class="asc-button-line">
        <span class="asc-button-label" x-show="labelPos !== 'none'" x-slot>{{ displayLabel }}</span>
        <span class="asc-button-tags" x-if="tags && tags.length && !hideTags">
          <span
            class="asc-button-tag-item"
            x-for="tag of tags"
            :key="tag.name || tag.icon"
          >
            <i
              class="asc-button-tag"
              :class="tag.classes"
              :title="tag.tooltip"
              :style="tag.styles"
              :data-shape="tag.shape"
              :data-checked="!tag.checkable ? null : (tag.value === (tag.checkValues?.[0] ?? true) ? '' : null)"
              @click="onTagClick(tag, $event)"
            >
              <i class="asc-button-tag-icon" x-if="tag.icon" x-icon="tag.icon"></i>
              <span class="asc-button-tag-label" x-if="tag.label">{{ tag.label }}</span>
            </i>
          </span>
        </span>
        <span
          class="asc-button-caret"
          x-if="caret !== 'none'"
          x-icon="'arrow'"
          :data-caret="caret"
          x-icon-options:rotate="caret === 'left' ? 180 : caret === 'bottom' ? 90 : caret === 'top' ? -90 : 0"
        ></span>
      </span>
      <span class="asc-button-memo" x-if="memo && labelPos !== 'none'">{{ memo }}</span>
    </span>
  </span>
</button>
