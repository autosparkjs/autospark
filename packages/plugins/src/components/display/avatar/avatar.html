<span
  class="asc-avatar"
  x-define="autospark.avatar"
  x-define:inherit="autospark.base"
>
  <script setup>
    {
        data: () => ({
            src: "",
            icon: "",
            label: "",
            shape: "circle",
            failed: false,
            errorArmed: false,
        }),
        methods: {
            onImgError() {
                if (!this.data.errorArmed) return;
                this.data.failed = true;
            },
        },
        mounted() {
            setTimeout(() => { this.data.errorArmed = true; }, 0);
            const rearm = () => setTimeout(() => { this.data.errorArmed = true; }, 0);
            let lastSrc = String(this.data.src ?? "");
            this.watch("src", ({ value }) => {
                const v = String(value ?? "");
                if (v === lastSrc) return;
                lastSrc = v;
                this.data.errorArmed = false;
                this.data.failed = false;
                rearm();
            });
        },
    }
  </script>
  <style global id="autospark-components-avatar">
    .asc-avatar {
      display: inline-flex;
      font-size: var(--auto-font-size, var(--asc-avatar-font-size, 0.875rem));
      vertical-align: middle;
    }

    .asc-avatar-inner {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.6em;
      height: 2.6em;
      overflow: hidden;
      flex: none;
      background: var(--auto-third-bgcolor, var(--asc-avatar-bg, rgba(0, 0, 0, 0.06)));
      border-radius: 50%;
      color: var(--auto-secondary-color, var(--asc-avatar-color, rgba(0, 0, 0, 0.55)));
      user-select: none;
    }
    .asc-avatar-inner[data-shape="square"] {
      border-radius: var(--auto-border-radius, var(--asc-avatar-radius, 0.375rem));
    }

    .asc-avatar-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .asc-avatar-icon {
      display: inline-flex;
      font-size: 1.5em;
      line-height: 1;
    }
    .asc-avatar-char {
      font-size: 1.1em;
      font-weight: var(--x-font-weight-large, 600);
      line-height: 1;
      white-space: nowrap;
    }

    [dark] .asc-avatar-inner,
    [data-dark] .asc-avatar-inner {
      background: var(--auto-third-bgcolor, var(--asc-avatar-bg, rgba(255, 255, 255, 0.14)));
      color: var(--auto-secondary-color, var(--asc-avatar-color, rgba(255, 255, 255, 0.65)));
    }
  </style>
  <span class="asc-avatar-inner" :data-shape="shape">
    <img
      class="asc-avatar-img"
      x-show="src && !failed"
      :src="src"
      :alt="label"
      @error="onImgError()"
    />
    <i
      class="asc-avatar-icon"
      x-show="(!src || failed) && typeof icon === 'string' && icon"
      x-icon="icon"
    ></i>
    <i
      class="asc-avatar-icon"
      x-show="(!src || failed) && typeof icon === 'object' && icon && icon.name"
      x-icon="icon.name"
    ></i>
    <span
      class="asc-avatar-char"
      x-show="(!src || failed) && !icon && label"
      x-text="Array.from(String(label).trim())[0]"
    ></span>
    <i
      class="asc-avatar-icon"
      x-show="(!src || failed) && !icon && !label"
      x-icon="'default'"
    ></i>
  </span>
</span>
