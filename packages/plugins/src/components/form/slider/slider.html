<!--
    autospark.slider 滑动条（ADR-0018 决策 7 原生增强）——真实原生 <input type=range>
    藏起仍可交互（opacity:0 覆盖层：点击跳值/拖拽跟随/键盘方向键/触屏原生行为与
    可访问性全保留），轨道/已填充段/滑块视觉自绘。继承 autospark.base-field 骨架
    （状态色通道/焦点态/disabled 同步，裸态无盒饰，ADR-0020）。

    值桥（x-model 兼容协议）：宿主 el.value 劫持为数字语域——原生 input 事件自然
    冒泡过宿主被 x-model 直接监听（原生控件自带 value 语义，桥比 button-group 更薄，
    ADR-0020 决策 5 同款）；change（松手确认）capture 归位（clamp + step 刻度防御）
    后阻断重派发 detail={ value }（外层 @change="v = $event.detail.value" 一行回写）。

    表单提交：宿主 name 透传到内层 range——原生直提交（range 是原生表单控件自带
    提名义，控件即真身无须 hidden 代理，ADR-0020 决策 6 同款；对照 switch 自绘控件
    的 hidden 载体分叉）。

    视觉同步：填充段宽度与滑块位置同源（--asc-slider-pos 百分比变量挂轨道，JS 通道
    随 input/setter/watch 维护）；readonly 无原生语义（range 忽略 readOnly），JS 通道
    pointer-events 阻断交互。

    showInput（可选）：在场渲染 autospark.input-number 双向联动——跨产物组合（模板
    字符串引用不构成构建依赖），按需加载场景须同引 autospark.input-number.js。
    range 双滑块 P3 按需（ADR-0018 边界声明）。
-->
<!-- 根 class 拼接进骨架宿主（.asc-field + .asc-slider——裸态控件不加 .asc-field-box，
     状态色仍经 --asc-field-tone 消费，ADR-0020 决策 3）；data-readonly/data-disabled
     由骨架反射，--asc-slider-pos 由 mounted JS 通道同步，根上无动态绑定（T4=B） -->
<span class="asc-slider" x-define="autospark.slider" x-define:inherit="autospark.base-field">
  <script setup>
    {
        data: () => ({
            value: 0,        // number 非受控初值 / 单向同步值（NaN 防御：非法归 min；受控真相走宿主 x-model）
            min: 0,          // 下界
            max: 100,        // 上界（<= min 时视为 min + 1 防除零）
            step: 1,         // 步长（<=0 或非法视为 1）
            showInput: false,// 数值输入联动（在场渲染 autospark.input-number；须同引其产物）
        }),
        mounted() {
            // —— 内层元素查询（每查现取，家族纪律）——
            const native = () => this.el.querySelector(".asc-slider-native");
            const track = () => this.el.querySelector(".asc-slider-track");
            // showInput 联动宿主（化身后的 autospark.input-number 根，自有 el.value 劫持）
            const numHost = () => this.el.querySelector(".asc-input-number");

            // —— 数值工具（NaN 防御：非法值归界值，恒不抛）——
            const num = (v) => {
                const n = typeof v === "number" ? v : parseFloat(String(v ?? "").trim());
                return Number.isFinite(n) ? n : null;
            };
            const bounds = () => {
                let mn = num(this.data.min) ?? 0;
                let mx = num(this.data.max) ?? 100;
                if (mx <= mn) mx = mn + 1; // 除零/倒界防御
                return [mn, mx];
            };
            const clamp = (n) => {
                const [mn, mx] = bounds();
                return Math.min(mx, Math.max(mn, n));
            };
            const stepSize = () => {
                const s = num(this.data.step);
                return s != null && s > 0 ? s : 1;
            };

            // —— 原生属性同步（props → range：min/max/step 原生刻度语义）——
            const syncAttrs = () => {
                const r = native();
                if (!r) return;
                const [mn, mx] = bounds();
                r.min = String(mn);
                r.max = String(mx);
                r.step = String(stepSize());
                // 表单提交载体：宿主 name 透传到 range（原生直提交）
                const nameAttr = this.el.getAttribute("name");
                if (nameAttr != null) r.name = nameAttr;
            };

            // —— 视觉同步：填充/滑块位置百分比（同源变量挂轨道）——
            const syncVisual = () => {
                const r = native();
                const t = track();
                if (!r || !t) return;
                const [mn, mx] = bounds();
                const v = clamp(num(r.value) ?? mn);
                const pct = ((v - mn) / (mx - mn)) * 100;
                t.style.setProperty("--asc-slider-pos", `${pct}%`);
            };

            // —— 值写（受控语义：clamp 后落原生控件 + 视觉）——
            const setVal = (v, { fromNum = false } = {}) => {
                const n = clamp(num(v) ?? bounds()[0]);
                const r = native();
                if (r) r.value = String(n);
                syncVisual();
                if (!fromNum) {
                    const nh = numHost();
                    if (nh) nh.value = String(n); // 联动输入框（写其劫持 setter，不派发无回环）
                }
            };

            // —— 值桥（x-model 兼容协议）：宿主 el.value 劫持为数字语域 ——
            //     劫持前快照 expando（x-model 编译期可能已写初值）；无 x-model 时回退
            //     props.value 初值（劫持快照序：expando > props.value，input 同款）
            const prior = this.el.value;
            const initV = num(prior) != null ? num(prior) : num(this.data.value);
            Object.defineProperty(this.el, "value", {
                get: () => {
                    const r = native();
                    return r ? r.value : String(bounds()[0]);
                },
                set: (v) => {
                    setVal(v);
                },
                configurable: true,
            });

            // —— 拖动跟随（原生 input 冒泡过宿主；capture 先于 x-model 冒泡监听）：
            //     视觉 + showInput 联动（x-model 回写由宿主监听自理）——
            this.el.addEventListener(
                "input",
                (e) => {
                    if (e.target !== native()) return;
                    syncVisual();
                    const r = native();
                    const nh = numHost();
                    if (r && nh) nh.value = r.value;
                },
                true,
            );

            // —— 确认归位（原生 change = 松手）：clamp 防御 + 阻断重派发 detail ——
            //     capture 阶段先归位再阻断（x-model.lazy 读到归位后的劫持 getter）
            this.el.addEventListener(
                "change",
                (e) => {
                    if (e.target !== native()) return;
                    e.stopPropagation();
                    const r = native();
                    if (r) setVal(r.value);
                    this.el.dispatchEvent(
                        new CustomEvent("change", {
                            bubbles: true,
                            detail: { value: num(this.el.value) ?? bounds()[0] },
                        }),
                    );
                },
                true,
            );

            // —— 一跳后初始化（化身子树挂载与 props 注入落定，家族惯用法）——
            setTimeout(() => {
                syncAttrs();
                setVal(initV != null ? initV : bounds()[0]);
                // showInput 联动接线（其组件劫持已就位）：初值下发 + 输入侧反向同步
                // （input-number 的 input 派发非冒泡在自身——直接挂其宿主监听；
                // 程序赋值不触发事件，天然无回环）
                const nh = numHost();
                if (nh) {
                    const r = native();
                    if (r) nh.value = r.value;
                    nh.addEventListener("input", () => {
                        const v = num(nh.value);
                        if (v != null) setVal(v, { fromNum: true });
                    });
                }
            }, 0);

            // —— props 变化跟随（回调收 { value } 信封对象，此处只用作触发信号）——
            // value 单向同步（无 x-model 场景）：变化才写（劫持 setter 不派发，无回环）
            this.watch("value", ({ value: v }) => {
                const n = num(v);
                if (n == null) return;
                const r = native();
                if (r && num(r.value) === clamp(n)) return;
                setVal(n);
            });
            // 边界/步长变化：属性重同步 + 当前值夹取归位
            const reBound = () => {
                syncAttrs();
                const r = native();
                if (r) setVal(r.value);
            };
            this.watch("min", () => { setTimeout(reBound, 0); });
            this.watch("max", () => { setTimeout(reBound, 0); });
            this.watch("step", () => { setTimeout(reBound, 0); });
        },
    }
  </script>
  <style global id="autospark-components-slider">
    /* ---------- 结构：组件根占满父宽（块级滑动形态，antd 同惯例；复合选择器稳赢
             .asc-field 的 inline-flex 基座，不依赖样式注入顺序）；包裹层横向排布
             （showInput 联动框随行）；轨道 = 自绘视觉容器，原生 range 透明铺满承载
             交互（覆盖层模式） ---------- */
    .asc-field.asc-slider {
      display: flex;
      width: 100%;
    }
    .asc-slider-wrap {
      display: flex;
      align-items: center;
      gap: 0.75em;
      flex: 1 1 auto;
      min-width: 0;
      cursor: pointer;
    }
    /* 轨道：高度 em 基准随主题 data-size 档位字号缩放（不设自有尺寸属性，button 同范式
       ADR-0012）；--asc-slider-pos 由 mounted JS 通道维护（填充/滑块同源） */
    .asc-slider-track {
      --asc-slider-pos: 0%;
      position: relative;
      display: inline-block;
      box-sizing: border-box;
      flex: 1 1 auto;
      min-width: 8em;
      height: 0.3em;
      border-radius: 9999px;
      background: color-mix(
        in srgb,
        var(--auto-color, var(--asc-slider-track, #606060)) 18%,
        transparent
      );
      transition: box-shadow 0.15s ease;
    }
    /* 已填充段：tone 色（缺省主色，status 在场随 --asc-field-tone 联动——骨架通道） */
    .asc-slider-fill {
      position: absolute;
      inset-block: 0;
      inset-inline-start: 0;
      width: var(--asc-slider-pos);
      border-radius: 9999px;
      background: var(--asc-field-tone);
    }
    /* 滑块：白底细边 tone（暗色不换——恒定对比设计，switch 滑块同款）；尺寸 em 基准 */
    .asc-slider-thumb {
      position: absolute;
      top: 50%;
      inset-inline-start: var(--asc-slider-pos);
      box-sizing: border-box;
      width: 1em;
      height: 1em;
      border-radius: 50%;
      border: 0.125em solid var(--asc-field-tone);
      background: var(--asc-slider-thumb, #ffffff);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      transform: translate(-50%, -50%);
      transition: box-shadow 0.15s ease;
      pointer-events: none; /* 命中交给覆盖层原生 range（拖拽语义原生承载） */
    }
    /* 原生 range：透明覆盖层（藏起仍可交互——点击/拖拽/键盘/触屏原生行为全保留） */
    .asc-slider-native {
      position: absolute;
      inset: -0.5em 0; /* 纵向命中区放大（滑块直径溢出轨道高） */
      width: 100%;
      margin: 0;
      padding: 0;
      opacity: 0;
      cursor: inherit;
    }
    .asc-slider[data-focus]:not([data-disabled]) .asc-slider-thumb {
      box-shadow: 0 0 0 3px
        color-mix(in srgb, var(--asc-field-tone) 25%, transparent);
    }
    /* 禁用（骨架通道 [data-disabled]：range.disabled 原生阻断 + 宿主反射）：淡化 + 禁点 */
    .asc-slider[data-disabled] {
      opacity: 0.55;
    }
    .asc-slider[data-disabled] .asc-slider-wrap {
      cursor: not-allowed;
    }
    /* 只读：range 无原生 readOnly 语义（属性被忽略），JS 通道经骨架反射的 data-readonly
       阻断指针交互（值不可变语义；无禁用淡化） */
    .asc-slider[data-readonly] .asc-slider-native {
      pointer-events: none;
    }
    .asc-slider[data-readonly] .asc-slider-wrap {
      cursor: default;
    }

    /* ---------- showInput 联动框：定宽收窄（数值场景无需通栏） ---------- */
    .asc-slider-input {
      flex: none;
      width: 7.5em;
    }

    /* ---------- 暗色兜底变体（ADR-0129）：兜底字面值切换为 theme 默认暗色校准值（变量链不变）；
             开态 tone 与滑块白底为恒定设计不变 ---------- */
    [dark] .asc-slider-track,
    [data-dark] .asc-slider-track {
      background: color-mix(
        in srgb,
        var(--auto-color, var(--asc-slider-track, #fafafa)) 22%,
        transparent
      );
    }
  </style>
  <!-- 默认段（替换 base-field 出口 fallback）：轨道（自绘视觉 + 原生覆盖层）+
         可选联动输入框。注意：嵌套 x-slot 出口在继承形态下被忽略（ADR-0056）——
         文案/刻度等消费方内容经 base-field 出口整段替换控件区（逃生通道，input 同款） -->
  <span class="asc-slider-wrap">
    <span class="asc-slider-track">
      <span class="asc-slider-fill"></span>
      <span class="asc-slider-thumb"></span>
      <input type="range" class="asc-slider-native" data-autospark-control />
    </span>
  </span>
  <span class="asc-slider-input" x-if="showInput">
    <span x-component:autospark.input-number></span>
  </span>
</span>
