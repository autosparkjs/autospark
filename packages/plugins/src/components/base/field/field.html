<!--
    Field 表单域骨架（ADR-0020）——base/ 目录首个产物（ADR-0018 决策 7：form 前瞻
    唯一例外，其余基类演进式抽取）。2026-11-14 修订：转公开文档组件（侧边栏「表单」组
    + demo + 文档页）——可直接实例化（默认出口装任意控件内容即得骨架能力：状态色/
    焦点态/禁用只读同步/盒饰），同时仍是 form 域家族（input/checkbox/radio/switch/
    select/input-number…）的继承基座。

    骨架职责（宁薄勿胖——只承担 form 域家族共性，控件本体与装饰一概留给子组件）：
    - 结构：宿主级包裹层（.asc-field 布局基座，class 拼接进子组件宿主）+ 三出口——
      默认出口（.asc-field-body，display:contents 不产生布局层；子组件全部控件结构
      经默认段替换出口 fallback（继承覆盖，ADR-0081），直接实例化时消费方内容同位）
      + prefix / suffix 具名装饰出口（body 兄弟位，DOM 序固定
      [slot:prefix][body][slot:suffix]；template 载体（ADR-0137，2026-11-15 切换）
      ——class 经属性活注入落投影内容首根（间距/防收缩规则随类落内容根本身），
      无内容整出口静默消失、零多余 DOM，裸态控件组件继承亦无害；多根装饰仅首根
      得注入类——装饰出口建议单根，多根后续节点消费方自理）；盒饰 chrome 为 .asc-field-box
      选配类（input 类控件用，checkbox/radio/switch 等裸态控件不用）
    - 轻装饰/重装饰分层（2026-11-14 修订）：子组件 props 前后置（input 的
      prefix/suffix 文本|图标）是轻装饰（组件内贴控件），插槽前后置是重装饰
      （消费方任意 HTML，恒在轻装饰外侧），两者共存不互斥；插槽内容默认次要色、
      点击转发焦点到控件（消费方放交互件须自标 data-autospark-action 自理）；
      disabled/readonly 不对插槽内容做专门处理（与 props 装饰对齐）
    - 融合动作 actions（2026-11-16 修订二，ADR-0020 决策 3）：props 驱动渲染段
      （非插槽出口——数据→视图）——button props 数组 + 自有键 pos（before|after
      分侧，缺省 after）/name/value；组合复用 autospark.button（产物依赖其同页
      加载），融合复用 button-group 负 margin 边线复用范式（ADR-0014）；field
      disabled 联动合并项 disabled；点击组包派发 action-click（detail =
      {index,name,value,item}）+ 原生 click 双通道；空数组整段不渲染零 DOM
    - 状态色通道：status（"" | error | success | warning）→ 宿主 data-status 属性 →
      --asc-field-tone 中转变量派生（焦点环/边框色统一消费）；error 态同步 aria-invalid
    - 焦点态追踪：focusin/focusout（焦点在骨架内元素间移动不闪烁）→ 宿主 data-focus
    - disabled / readonly：同步到 [data-autospark-control] 原生控件 + 宿主 data-disabled /
      data-readonly 反射（CSS 淡化与光标通道）
    - 尺寸档位：经 autospark.base 继承链消费主题 data-size 通道（--auto-input-height /
      --auto-input-padding 随档位联动），骨架不设自有尺寸属性（button 同范式 ADR-0012）
    - 与 x-field 分工（ADR-0018 决策 7：不双轨建域）：label/校验/域布局由 engine
      x-form/x-field 指令承担；校验结果经子组件 status props 染色进入（x-field 容器
      形态后代绑定 status: $field.error ? "error" : ""），骨架不感知 x-field

    data-* 标记协议（子组件挂点约定，ADR-0020）：
    - data-autospark-control：原生控件标记——disabled/readonly/aria-invalid 同步目标、
      点击转发焦点的受让者
    - data-autospark-action：交互动作件标记（清除/切换钮等）——点击不转发焦点（自理）
-->
<!-- 继承 autospark.base（ADR-0134）须为非抽象继承：abstract 组件不能再声明
     x-define:inherit（ADR-0134 抽象根约束），而主题档位六键物化必须沿继承链下传——
     故本骨架贡献真实模板（包裹层 + 三出口），子组件快照 = 本骨架克隆 + 子默认段替换 +
     子根属性并入（class 拼接：宿主恒得 .asc-field + 子自有类），继承链
     子组件 → field → autospark.base 三层（ADR-0020 决策 2） -->
<span
  class="asc-field"
  x-define="autospark.field"
  x-define:inherit="autospark.base"
>
  <script setup>
    {
        data: () => ({
            status: "",       // 状态色通道："" 无 | error 危险 | success 成功 | warning 警告（tone 中转变量随动，焦点环/边框消费）
            disabled: false,  // 禁用：同步 [data-autospark-control] 原生控件 + 宿主 data-disabled（CSS 淡化/光标）+ 融合动作按钮联动
            readonly: false,  // 只读：同步 [data-autospark-control]（readOnly 语义）+ 宿主 data-readonly
            actions: [],      // 融合动作（2026-11-16 修订二）：button props 数组 + 自有键 pos（"before"|"after" 分侧，缺省 after）/ name（标识）/ value（原样透传 action-click detail）——数组 props 经状态引用注入（:actions="myActions"，引擎字面量数组死环缺陷 HEAD 未修）
        }),
        mounted() {
            // —— 控件查询（data-autospark-control 标记协议）：每查现取不缓存——运行时
            //     控件可能随形态切换重建（input ↔ textarea 等），缓存引用会指向已摘除节点
            const control = () => this.el.querySelector("[data-autospark-control]");

            // —— 状态色通道：status → 宿主 data-status（CSS 派生 --asc-field-tone）——
            const applyStatus = () => {
                const v = this.data.status;
                if (typeof v === "string" && v !== "") this.el.setAttribute("data-status", v);
                else this.el.removeAttribute("data-status");
            };

            // —— 控件同步：disabled/readonly 落原生控件 + 宿主反射 + error 态 aria-invalid
            //     （可访问性：组件级状态归一到 aria，与原生约束校验互补）——
            const syncControl = () => {
                const c = control();
                if (c) {
                    c.disabled = !!this.data.disabled;
                    if ("readOnly" in c) c.readOnly = !!this.data.readonly;
                    if (this.data.status === "error") c.setAttribute("aria-invalid", "true");
                    else c.removeAttribute("aria-invalid");
                }
                this.el.toggleAttribute("data-disabled", !!this.data.disabled);
                this.el.toggleAttribute("data-readonly", !!this.data.readonly);
            };

            // —— 焦点态追踪：focusin/focusout 冒泡承接（骨架内任意可聚焦元素）——
            //     焦点在骨架内部元素间移动（如 input → 清除钮）时 relatedTarget 仍在
            //     骨架内，跳过摘除防闪烁
            this.el.addEventListener("focusin", () => {
                this.el.setAttribute("data-focus", "");
            });
            this.el.addEventListener("focusout", (e) => {
                const to = e.relatedTarget;
                if (to instanceof Node && this.el.contains(to)) return;
                this.el.removeAttribute("data-focus");
            });

            // —— 点击转发焦点：点击盒饰空白区/前后置装饰（非控件非动作件）时焦点落控件
            //     （原生 label 包裹的近似体验；动作件 data-autospark-action 自理不转发；
            //     插槽装饰内容同此——消费方放交互件须自标 data-autospark-action）——
            this.el.addEventListener("click", (e) => {
                const t = e.target instanceof Element ? e.target : null;
                if (!t) return;
                if (this.data.disabled) return;
                if (t.closest("[data-autospark-control]")) return;
                if (t.closest("[data-autospark-action]")) return;
                const c = control();
                if (c && typeof c.focus === "function") c.focus();
            });

            // —— 初始化与跟随（mounted 时化身子树与 props 注入均可能未就位，一跳后
            //     首同步；后续 props 变化经 watch 保持——回调收 { value } 信封对象，
            //     此处只用作触发信号，家族惯用法）——
            // —— 融合动作组包（ADR-0020 修订二）：按钮原生 click 冒泡经宿主——按
            //     DOM 序（容器内 .asc-field-action 集合的 indexOf）回查 actions
            //     原始项，组包派发 action-click（bubbles，detail =
            //     {index, name, value, item}）；原生 click 照常冒泡（双通道）；
            //     禁用按钮原生阻断、不到达此处 ——
            this.el.addEventListener("click", (e) => {
                const t = e.target instanceof Element ? e.target : null;
                if (!t) return;
                const btn = t.closest(".asc-field-action");
                if (!btn || !this.el.contains(btn)) return;
                const wrap = btn.closest(".asc-field-actions");
                if (!wrap) return;
                const side = wrap.classList.contains("asc-field-actions-before") ? "before" : "after";
                const list = (Array.isArray(this.data.actions) ? this.data.actions : [])
                    .filter((a) => a && (a.pos || "after") === side);
                const i = Array.from(wrap.querySelectorAll(".asc-field-action")).indexOf(btn);
                const item = list[i];
                if (!item) return;
                this.el.dispatchEvent(new CustomEvent("action-click", {
                    bubbles: true,
                    detail: { index: i, name: item.name, value: item.value, item },
                }));
            });

            const syncAll = () => { applyStatus(); syncControl(); };
            setTimeout(syncAll, 0);
            this.watch("status", () => { setTimeout(syncAll, 0); });
            this.watch("disabled", () => { setTimeout(syncAll, 0); });
            this.watch("readonly", () => { setTimeout(syncAll, 0); });
        },
    }
  </script>
  <style global id="autospark-components-field">
    /* ---------- .asc-field 布局基座（无盒饰——chrome 由 .asc-field-box 选配类承担）：
         tone 为状态色中转变量（缺省 primary，data-status 派生），焦点环/边框统一消费；
         尺寸档位经主题 data-size 通道全跟随（字号/行高/字体族消费 --auto-font-* 基线，
         字面级校准 theme-token-baseline.md：无 theme 环境与 theme 默认档观感归一） ---------- */
    .asc-field {
      --asc-field-tone: var(
        --auto-primary-color,
        var(--asc-field-primary, #009aff)
      );
      display: inline-flex;
      align-items: center;
      font-family: var(
        --auto-font-family,
        var(--asc-field-font-family, inherit)
      );
      font-size: var(--auto-font-size, var(--asc-field-font-size, 1rem));
      line-height: var(--auto-line-height, var(--asc-field-line-height, 1.5));
      color: var(--auto-color, var(--asc-field-color, #606060));
    }
    /* 状态色派生（data-status 由 mounted 同步）：tone 切语义色，未聚焦也染边框 */
    .asc-field[data-status="error"] {
      --asc-field-tone: var(
        --auto-danger-color,
        var(--asc-field-danger, #ef4444)
      );
    }
    .asc-field[data-status="success"] {
      --asc-field-tone: var(
        --auto-success-color,
        var(--asc-field-success, #22c55e)
      );
    }
    .asc-field[data-status="warning"] {
      --asc-field-tone: var(
        --auto-warning-color,
        var(--asc-field-warning, #f59e0b)
      );
    }

    /* ---------- .asc-field-box 盒饰选配类（input 类控件 chrome；裸态控件不加）：
         高度/内距消费 --auto-input-*（theme data-size/data-spacing 档位联动）；
         边框色经 --asc-field-line 中转（hover/focus/状态/禁用多级覆盖）。
         边框维持 size + color 拆分消费（ADR-0020 决策 7 口径②）——组合令牌
         --auto-input-border 无法只换色，状态重染色机制依赖拆分 ---------- */
    .asc-field-box {
      --asc-field-line: var(
        --auto-border-color,
        var(--asc-field-border-color, #f0f0f0)
      );
      box-sizing: border-box;
      border: var(--auto-border-size, var(--asc-field-border-size, 1px)) solid
        var(--asc-field-line);
      border-radius: var(--auto-input-radius, var(--asc-field-radius, 0.5rem));
      background: var(--auto-input-bgcolor, var(--asc-field-bg, #ffffff));
      /* 高度兜底随字号自适应（≈字号 × 2.57）：theme 档位块引用的 --x-input-height-* 标尺
         未定义（theme 侧缺陷），档位容器上 --auto-input-height 失效落此级时仍随档位缩放 */
      height: var(
        --auto-input-height,
        var(--asc-field-height, calc(var(--auto-font-size, 1rem) * 2.57))
      );
      /* 最小高度守卫（max）：theme 基值 --auto-input-height 实为行高（24px，未含内距预算），
         纵向内距在场时固定高度会把控件压扁——令牌不足时以「行内容高 + 纵向距×2 + 边框×2」
         兜底（token 为盒高语义保持，theme 补标尺后天然让位；--auto-line-height 为 rem 制
         长度，直接作行内容高消费，勿与 font-size 相乘） */
      min-height: max(
        var(
          --auto-input-height,
          var(--asc-field-height, calc(var(--auto-font-size, 1rem) * 2.57))
        ),
        calc(
          var(--auto-line-height, 1.5rem) + var(--auto-border-size, 1px) * 2 +
            var(--auto-input-padding, var(--asc-field-padding, 0.8rem))
        )
      );
      /* 四向内距（纵向取横向半距——输入框惯例；固定高度形态（border-box）纵向被
         高度+flex 居中吸收，height:auto 形态（textarea / theme 在场标尺缺陷回退）
         由纵向半距撑起呼吸感，全档位随 --auto-input-padding 联动） */
      padding: calc(var(--auto-input-padding, var(--asc-field-padding, 0.8rem)) / 2)
        var(--auto-input-padding, var(--asc-field-padding, 0.8rem));
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        background-color 0.15s ease;
      cursor: text;
    }
    .asc-field-box:hover:not([data-disabled]):not([data-readonly]):not(
        [data-status]
      ) {
      --asc-field-line: var(
        --auto-hover-border-color,
        var(--asc-field-hover-border, #009aff)
      );
    }
    /* 焦点态（data-focus 由 focusin/focusout 同步）：边框取 tone + 同色淡晕 */
    .asc-field-box[data-focus] {
      --asc-field-line: var(--asc-field-tone);
      box-shadow: 0 0 0 2px
        color-mix(in srgb, var(--asc-field-tone) 22%, transparent);
    }
    /* 状态在场：未聚焦也染状态色边框（聚焦规则同色调、仅补光晕） */
    .asc-field-box[data-status="error"],
    .asc-field-box[data-status="success"],
    .asc-field-box[data-status="warning"] {
      --asc-field-line: var(--asc-field-tone);
    }
    /* 禁用：边框/底色取禁用语义变量 + 禁点光标（控件字色由 opacity 整体淡化）；
         状态在场时边框让位状态色（status 是显式意图，禁用仅接管底色/光标） */
    .asc-field-box[data-disabled]:not([data-status]) {
      --asc-field-line: var(
        --auto-disable-border-color,
        var(--asc-field-disable-border, #bdbdbd)
      );
      background: var(
        --auto-disable-bgcolor,
        var(--asc-field-disable-bg, rgba(96, 96, 96, 0.2))
      );
      cursor: not-allowed;
    }
    .asc-field-box[data-disabled][data-status] {
      background: var(
        --auto-disable-bgcolor,
        var(--asc-field-disable-bg, rgba(96, 96, 96, 0.2))
      );
      cursor: not-allowed;
    }
    /* 只读：光标归正文（无禁用淡化） */
    .asc-field-box[data-readonly] {
      cursor: default;
    }

    /* ---------- 具名装饰出口 prefix/suffix（2026-11-15 切 template 载体，ADR-0137）：
         出口无包裹层——类经属性活注入落投影内容首根，内容根即骨架 flex 项：
         次要色设在内容根（消费方设色自然覆盖）+ 防收缩换行（控件 width:100% 会挤压
         装饰至 min-content，flex:none 镜像 .asc-input-prefix 同款保护）与间距（0.4em
         镜像 .asc-input-prefix/suffix 惯例）直接落内容根本身。无内容整出口静默消失
         （零多余 DOM，裸态控件组件继承亦无害）；多根装饰仅首根得注入类——装饰出口
         建议单根，多根后续节点消费方自理 ---------- */
    .asc-field-prefix,
    .asc-field-suffix {
      color: var(
        --auto-secondary-color,
        var(--asc-field-affix, rgba(96, 96, 96, 0.75))
      );
    }
    .asc-field-prefix {
      flex: none;
      margin-inline-end: 0.4em;
    }
    .asc-field-suffix {
      flex: none;
      margin-inline-start: 0.4em;
    }

    /* ---------- 默认出口包裹层：不产生布局层（子组件控件直接成为骨架 flex 项） ---------- */
    .asc-field-body {
      display: contents;
    }

    /* ---------- 融合动作 actions（2026-11-16 修订二）：渲染段容器 display:contents
         （按钮直接成盒饰 flex 项）；融合仅在盒饰层（.asc-field-box 后代——裸态控件
         无盒饰融合线不生效）——复用 button-group 负 margin 边线复用范式（ADR-0014
         决策 2）：按钮边框色让位 --asc-field-line 共享线（status/disabled 联动天然
         继承——变量定义在 box 上随状态覆盖），相邻按钮侧线压叠单线、组首/尾与盒
         边框重合（负距吃掉单侧内距+边框）；首/尾钮外侧圆角匹配盒饰、其余清除；
         stretch 等高 + 纵向负距全高贴上下边框（textarea 形态照常随盒高） ---------- */
    .asc-field-actions {
      display: contents;
    }
    .asc-field-box .asc-field-action {
      border-color: var(--asc-field-line);
      border-radius: 0;
      align-self: stretch;
      margin-block: calc(
        -1 *
          (
            var(--auto-input-padding, var(--asc-field-padding, 0.8rem)) / 2 +
              var(--auto-border-size, var(--asc-field-border-size, 1px))
          )
      );
    }
    /* before 组首钮左贴盒左线（负距吃左内距+边框）+ 外侧圆角匹配盒饰。
       首尾用 *-of-type：x-for 的 template 宿主渲染后追加在项元素之后（DOM 序
       [钮…, template]），:last-child 会误中 template */
    .asc-field-box .asc-field-actions-before .asc-field-action:first-of-type {
      margin-inline-start: calc(
        -1 *
          (
            var(--auto-input-padding, var(--asc-field-padding, 0.8rem)) +
              var(--auto-border-size, var(--asc-field-border-size, 1px))
          )
      );
      border-start-start-radius: var(
        --auto-input-radius,
        var(--asc-field-radius, 0.5rem)
      );
      border-end-start-radius: var(
        --auto-input-radius,
        var(--asc-field-radius, 0.5rem)
      );
    }
    /* after 组尾钮右贴盒右线 + 外侧圆角匹配盒饰 */
    .asc-field-box .asc-field-actions-after .asc-field-action:last-of-type {
      margin-inline-end: calc(
        -1 *
          (
            var(--auto-input-padding, var(--asc-field-padding, 0.8rem)) +
              var(--auto-border-size, var(--asc-field-border-size, 1px))
          )
      );
      border-start-end-radius: var(
        --auto-input-radius,
        var(--asc-field-radius, 0.5rem)
      );
      border-end-end-radius: var(
        --auto-input-radius,
        var(--asc-field-radius, 0.5rem)
      );
    }
    /* 组内相邻按钮：侧线压叠单线（每钮压前邻右线，共享一条 --asc-field-line） */
    .asc-field-box .asc-field-action + .asc-field-action {
      margin-inline-start: calc(
        -1 * var(--auto-border-size, var(--asc-field-border-size, 1px))
      );
    }
    /* 钮组与控件位间距（2026-11-16）：贴盒边融合保留（首/尾钮负距吃盒内距+边框，
       控件与钮零距贴死）——组靠控件侧一钮留 0.4em 缝（镜像装饰出口间距标尺），
       DOM 序中 prefix/suffix 出口为空时同样成立 */
    .asc-field-box .asc-field-actions-before .asc-field-action:last-child {
      margin-inline-end: 0.4em;
    }
    .asc-field-box .asc-field-actions-after .asc-field-action:first-child {
      margin-inline-start: 0.4em;
    }

    /* ---------- 暗色兜底变体（ADR-0129）：兜底字面值切换为 theme 默认暗色校准值（变量链不变） ---------- */
    [dark] .asc-field,
    [data-dark] .asc-field {
      --asc-field-tone: var(
        --auto-primary-color,
        var(--asc-field-primary, #56baff)
      );
      color: var(--auto-color, var(--asc-field-color, #fafafa));
    }
    [dark] .asc-field[data-status="error"],
    [data-dark] .asc-field[data-status="error"] {
      --asc-field-tone: var(
        --auto-danger-color,
        var(--asc-field-danger, #e6696a)
      );
    }
    [dark] .asc-field[data-status="success"],
    [data-dark] .asc-field[data-status="success"] {
      --asc-field-tone: var(
        --auto-success-color,
        var(--asc-field-success, #5cd07c)
      );
    }
    [dark] .asc-field[data-status="warning"],
    [data-dark] .asc-field[data-status="warning"] {
      --asc-field-tone: var(
        --auto-warning-color,
        var(--asc-field-warning, #f7d352)
      );
    }
    /* 暗色兜底让位状态色：状态在场时边框取 tone（:not 守卫防高特异性兜底块压掉状态染色） */
    [dark] .asc-field-box:not([data-status]),
    [data-dark] .asc-field-box:not([data-status]) {
      --asc-field-line: var(
        --auto-border-color,
        var(--asc-field-border-color, #606060)
      );
      background: var(--auto-input-bgcolor, var(--asc-field-bg, #3c3c3c));
    }
    [dark] .asc-field-box[data-disabled]:not([data-status]),
    [data-dark] .asc-field-box[data-disabled]:not([data-status]) {
      --asc-field-line: var(
        --auto-disable-border-color,
        var(--asc-field-disable-border, #7a7a7a)
      );
      background: var(
        --auto-disable-bgcolor,
        var(--asc-field-disable-bg, rgba(250, 250, 250, 0.2))
      );
    }
    [dark] .asc-field-prefix,
    [dark] .asc-field-suffix,
    [data-dark] .asc-field-prefix,
    [data-dark] .asc-field-suffix {
      color: var(
        --auto-secondary-color,
        var(--asc-field-affix, rgba(250, 250, 250, 0.75))
      );
    }
  </style>
  <!-- 三出口（文档序即呈现序 [slot:prefix][默认段][slot:suffix]，2026-11-14 修订）：
       prefix / suffix 具名装饰出口 template 载体（ADR-0137，2026-11-15 切换）——无
       内容整出口静默消失，消费方经宿主直接子级标记 <template x-slot:prefix> 投影
       任意内容（class 活注入落内容首根：次要色/间距/防收缩随类落根，恒在子组件
       props 轻装饰外侧）；默认出口被子组件默认段替换（继承覆盖，ADR-0081）——
       直接实例化时消费方内容同位，三层优先级：消费方内容 > 继承覆盖 > 本空 fallback -->
  <!-- 融合动作渲染段（2026-11-16 修订二，ADR-0020 决策 3）：props 驱动非插槽出口——
       空 actions 整段 x-if 不渲染（零 DOM）；双段按 pos 过滤分侧，DOM 序恒
       [before actions][prefix][body][suffix][after actions]（动作按钮最外层包壳）。
       值 = Object.assign 全键透传项（button props 全集 + disabled 与 field 联动合并，
       自有键 pos/name/value 入 button data 域被忽略无害）；按钮宿主自动标
       data-autospark-action（点击自理）；x-for 值表达式 = 官方 filter 形态
       （引擎 x-for 测试覆盖，with 求值通道响应 actions 注入） -->
  <span class="asc-field-actions asc-field-actions-before" x-if="!!(actions && actions.length)">
    <template x-for="item of actions.filter(a => a && a.pos === 'before')">
      <span
        class="asc-field-action"
        data-autospark-action
        x-component:autospark.button="Object.assign({}, item, { disabled: item.disabled || !!disabled })"
      ></span>
    </template>
  </span>
  <template class="asc-field-prefix" x-slot:prefix></template>
  <span class="asc-field-body" x-slot></span>
  <template class="asc-field-suffix" x-slot:suffix></template>
  <span class="asc-field-actions asc-field-actions-after" x-if="!!(actions && actions.length)">
    <template x-for="item of actions.filter(a => !a || a.pos !== 'before')">
      <span
        class="asc-field-action"
        data-autospark-action
        x-component:autospark.button="Object.assign({}, item, { disabled: item.disabled || !!disabled })"
      ></span>
    </template>
  </span>
</span>
