<span
  class="asc-field"
  x-define="autospark.field"
  x-define:inherit="autospark.base"
>
  <script setup>
    {
        data: () => ({
            status: "",
            disabled: false,
            readonly: false,
            actions: [],
        }),
        mounted() {
            const control = () => this.el.querySelector("[data-autospark-control]");

            const applyStatus = () => {
                const v = this.data.status;
                if (typeof v === "string" && v !== "") this.el.setAttribute("data-status", v);
                else this.el.removeAttribute("data-status");
            };

            const syncControl = () => {
                const c = control();
                if (c) {
                    c.disabled = !!this.data.disabled;
                    if ("readOnly" in c) c.readOnly = !!this.data.readonly;
                    if (this.data.status === "error") c.setAttribute("aria-invalid", "true");
                    else c.removeAttribute("aria-invalid");
                }
                this.el.toggleAttribute("data-disabled", !!this.data.disabled);
                this.el.toggleAttribute("data-readonly", !!this.data.readonly);
            };

            this.el.addEventListener("focusin", () => {
                this.el.setAttribute("data-focus", "");
            });
            this.el.addEventListener("focusout", (e) => {
                const to = e.relatedTarget;
                if (to instanceof Node && this.el.contains(to)) return;
                this.el.removeAttribute("data-focus");
            });

            this.el.addEventListener("click", (e) => {
                const t = e.target instanceof Element ? e.target : null;
                if (!t) return;
                if (this.data.disabled) return;
                if (t.closest("[data-autospark-control]")) return;
                if (t.closest("[data-autospark-action]")) return;
                const c = control();
                if (c && typeof c.focus === "function") c.focus();
            });

            this.el.addEventListener("click", (e) => {
                const t = e.target instanceof Element ? e.target : null;
                if (!t) return;
                const btn = t.closest(".asc-field-action");
                if (!btn || !this.el.contains(btn)) return;
                const wrap = btn.closest(".asc-field-actions");
                if (!wrap) return;
                const side = wrap.classList.contains("asc-field-actions-before") ? "before" : "after";
                const list = (Array.isArray(this.data.actions) ? this.data.actions : [])
                    .filter((a) => a && (a.pos || "after") === side);
                const i = Array.from(wrap.querySelectorAll(".asc-field-action")).indexOf(btn);
                const item = list[i];
                if (!item) return;
                this.el.dispatchEvent(new CustomEvent("action-click", {
                    bubbles: true,
                    detail: { index: i, name: item.name, value: item.value, item },
                }));
            });

            const syncAll = () => { applyStatus(); syncControl(); };
            setTimeout(syncAll, 0);
            this.watch("status", () => { setTimeout(syncAll, 0); });
            this.watch("disabled", () => { setTimeout(syncAll, 0); });
            this.watch("readonly", () => { setTimeout(syncAll, 0); });
        },
    }
  </script>
  <style global id="autospark-components-field">
    /* ---------- .asc-field 布局基座（无盒饰——chrome 由 .asc-field-box 选配类承担）：
         tone 为状态色中转变量（缺省 primary，data-status 派生），焦点环/边框统一消费；
         尺寸档位经主题 data-size 通道全跟随（字号/行高/字体族消费 --auto-font-* 基线，
         字面级校准 theme-token-baseline.md：无 theme 环境与 theme 默认档观感归一） ---------- */
    .asc-field {
      --asc-field-tone: var(
        --auto-primary-color,
        var(--asc-field-primary, #009aff)
      );
      display: inline-flex;
      align-items: center;
      font-family: var(
        --auto-font-family,
        var(--asc-field-font-family, inherit)
      );
      font-size: var(--auto-font-size, var(--asc-field-font-size, 1rem));
      line-height: var(--auto-line-height, var(--asc-field-line-height, 1.5));
      color: var(--auto-color, var(--asc-field-color, #606060));
    }
    .asc-field[data-status="error"] {
      --asc-field-tone: var(
        --auto-danger-color,
        var(--asc-field-danger, #ef4444)
      );
    }
    .asc-field[data-status="success"] {
      --asc-field-tone: var(
        --auto-success-color,
        var(--asc-field-success, #22c55e)
      );
    }
    .asc-field[data-status="warning"] {
      --asc-field-tone: var(
        --auto-warning-color,
        var(--asc-field-warning, #f59e0b)
      );
    }

    /* ---------- .asc-field-box 盒饰选配类（input 类控件 chrome；裸态控件不加）：
         高度/内距消费 --auto-input-*（theme data-size/data-spacing 档位联动）；
         边框 = 组合令牌打底 + border-color longhand 色通道（ADR-0020 决策 7
         2026-11-17 修订）：shorthand 消费 --auto-input-border（theme input 域
         组合令牌，size+color 成对校准；缺省回退拆分链保持无 theme 观感），
         随后 border-color 接 --asc-field-line 中转（hover/focus/状态/禁用只换
         色不动粗——longhand 覆盖 shorthand 色分量，状态重染色机制完整保留） ---------- */
    .asc-field-box {
      --asc-field-line: var(
        --auto-border-color,
        var(--asc-field-border-color, #f0f0f0)
      );
      box-sizing: border-box;
      border: var(
        --auto-input-border,
        var(--asc-field-border-size, 1px) solid
          var(--asc-field-border-color, #f0f0f0)
      );
      border-color: var(--asc-field-line);
      border-radius: var(--auto-input-radius, var(--asc-field-radius, 0.5rem));
      background: var(--auto-input-bgcolor, var(--asc-field-bg, #ffffff));
      /* 高度兜底随字号自适应（≈字号 × 2.57）：theme 档位块引用的 --x-input-height-* 标尺
         未定义（theme 侧缺陷），档位容器上 --auto-input-height 失效落此级时仍随档位缩放 */
      height: var(
        --auto-input-height,
        var(--asc-field-height, calc(var(--auto-font-size, 1rem) * 2.57))
      );
      /* 最小高度守卫（max）：theme 基值 --auto-input-height 实为行高（24px，未含内距预算），
         纵向内距在场时固定高度会把控件压扁——令牌不足时以「行内容高 + 纵向距×2 + 边框×2」
         兜底（token 为盒高语义保持，theme 补标尺后天然让位；--auto-line-height 为 rem 制
         长度，直接作行内容高消费，勿与 font-size 相乘） */
      min-height: max(
        var(
          --auto-input-height,
          var(--asc-field-height, calc(var(--auto-font-size, 1rem) * 2.57))
        ),
        calc(
          var(--auto-line-height, 1.5rem) + var(--auto-border-size, 1px) * 2 +
            var(--auto-input-padding, var(--asc-field-padding, 0.8rem))
        )
      );
      /* 四向内距（纵向取横向半距——输入框惯例；固定高度形态（border-box）纵向被
         高度+flex 居中吸收，height:auto 形态（多行控件 autospark.textarea / theme
         在场标尺缺陷回退）由纵向半距撑起呼吸感，全档位随 --auto-input-padding 联动） */
      padding: calc(
          var(--auto-input-padding, var(--asc-field-padding, 0.8rem)) / 2
        )
        var(--auto-input-padding, var(--asc-field-padding, 0.8rem));
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease,
        background-color 0.15s ease;
      cursor: text;
    }
    .asc-field-box:hover:not([data-disabled]):not([data-readonly]):not(
        [data-status]
      ) {
      --asc-field-line: var(
        --auto-hover-border-color,
        var(--asc-field-hover-border, #009aff)
      );
    }
    .asc-field-box[data-focus] {
      --asc-field-line: var(--asc-field-tone);
      box-shadow: 0 0 0 2px
        color-mix(in srgb, var(--asc-field-tone) 22%, transparent);
    }
    .asc-field-box[data-status="error"],
    .asc-field-box[data-status="success"],
    .asc-field-box[data-status="warning"] {
      --asc-field-line: var(--asc-field-tone);
    }
    /* 禁用：边框/底色取禁用语义变量 + 禁点光标（控件字色由 opacity 整体淡化）；
         状态在场时边框让位状态色（status 是显式意图，禁用仅接管底色/光标） */
    .asc-field-box[data-disabled]:not([data-status]) {
      --asc-field-line: var(
        --auto-disable-border-color,
        var(--asc-field-disable-border, #bdbdbd)
      );
      background: var(
        --auto-disable-bgcolor,
        var(--asc-field-disable-bg, rgba(96, 96, 96, 0.2))
      );
      cursor: not-allowed;
    }
    .asc-field-box[data-disabled][data-status] {
      background: var(
        --auto-disable-bgcolor,
        var(--asc-field-disable-bg, rgba(96, 96, 96, 0.2))
      );
      cursor: not-allowed;
    }
    .asc-field-box[data-readonly] {
      cursor: default;
    }

    /* ---------- 具名装饰出口 prefix/suffix（2026-11-15 切 template 载体，ADR-0137）：
         出口无包裹层——类经属性活注入落投影内容首根，内容根即骨架 flex 项：
         次要色设在内容根（消费方设色自然覆盖）+ 防收缩换行（控件 width:100% 会挤压
         装饰至 min-content，flex:none 镜像 .asc-input-prefix 同款保护）与间距（0.4em
         镜像 .asc-input-prefix/suffix 惯例）直接落内容根本身。无内容整出口静默消失
         （零多余 DOM，裸态控件组件继承亦无害）；多根装饰仅首根得注入类——装饰出口
         建议单根，多根后续节点消费方自理 ---------- */
    .asc-field-prefix,
    .asc-field-suffix {
      color: var(
        --auto-secondary-color,
        var(--asc-field-affix, rgba(96, 96, 96, 0.75))
      );
    }
    .asc-field-prefix {
      flex: none;
      margin-inline-end: 0.4em;
    }
    .asc-field-suffix {
      flex: none;
      margin-inline-start: 0.4em;
    }

    .asc-field-body {
      display: contents;
    }

    /* ---------- 融合动作 actions（2026-11-16 修订二）：渲染段容器 display:contents
         （按钮直接成盒饰 flex 项）；融合仅在盒饰层（.asc-field-box 后代——裸态控件
         无盒饰融合线不生效）——复用 button-group 负 margin 边线复用范式（ADR-0014
         决策 2）：按钮边框色让位 --asc-field-line 共享线（status/disabled 联动天然
         继承——变量定义在 box 上随状态覆盖），相邻按钮侧线压叠单线、组首/尾与盒
         边框重合（负距吃掉单侧内距+边框）；首/尾钮外侧圆角匹配盒饰、其余清除。
         **上下边框单线让位（2026-11-16 修订三）**：按钮不画自己的上下边框、纵向
         负距不吃盒边框（从线内缘起）——盒线独享、连续穿过按钮段。此前「两线对齐」
         形态（按钮自带上下线 + 负距全高贴边）在非整数缩放下两条各自取整的 1px 线
         会差出 1 物理像素（重合不严），且实心/无边框 variant 的按钮背景会盖住盒线
         段；单线让位结构性消灭两类缺陷（线只有一个绘制者）。左右侧线照常由按钮
         绘制（--asc-field-line） ---------- */
    .asc-field-actions {
      display: contents;
    }
    .asc-field-box .asc-field-action {
      /* 内侧分隔线（钮↔钮、钮↔控件）与盒边框同色（--asc-field-line 共享线，随
         hover/focus/status/disabled 状态同步染——2026-11-17 回归：variant 缺省
         secondary 的半透明衬底（叠盒底成浅罩）已保证与线色的对比，此前「暗色
         湮灭」前提（plain 实底与盒线同色）不复存在，独立 divider 分档退役）；
         上下线不画（单线让位） */
      border-color: var(--asc-field-line);
      border-top-width: 0;
      border-bottom-width: 0;
      border-radius: 0;
      align-self: stretch;
      margin-block: calc(
        -1 * var(--auto-input-padding, var(--asc-field-padding, 0.8rem)) / 2
      );
    }
    /* 外侧竖线让位盒线（首钮左 / 尾钮右不画——盒线独享整圈外框，同上下线单线让位
       哲学：防按钮线与状态染色的盒线在贴边处双色并排） */
    .asc-field-box .asc-field-actions-before .asc-field-action:first-of-type {
      border-left-width: 0;
    }
    .asc-field-box .asc-field-actions-after .asc-field-action:last-of-type {
      border-right-width: 0;
    }
    /* before 组首钮左贴盒左线（负距吃左内距+边框）+ 外侧圆角匹配盒饰。
       首尾用 *-of-type：x-for 的 template 宿主渲染后追加在项元素之后（DOM 序
       [钮…, template]），:last-child 会误中 template */
    .asc-field-box .asc-field-actions-before .asc-field-action:first-of-type {
      margin-inline-start: calc(
        -1 *
          (
            var(--auto-input-padding, var(--asc-field-padding, 0.8rem)) +
              var(--auto-border-size, var(--asc-field-border-size, 1px))
          )
      );
      border-start-start-radius: var(
        --auto-input-radius,
        var(--asc-field-radius, 0.5rem)
      );
      border-end-start-radius: var(
        --auto-input-radius,
        var(--asc-field-radius, 0.5rem)
      );
    }
    .asc-field-box .asc-field-actions-after .asc-field-action:last-of-type {
      margin-inline-end: calc(
        -1 *
          (
            var(--auto-input-padding, var(--asc-field-padding, 0.8rem)) +
              var(--auto-border-size, var(--asc-field-border-size, 1px))
          )
      );
      border-start-end-radius: var(
        --auto-input-radius,
        var(--asc-field-radius, 0.5rem)
      );
      border-end-end-radius: var(
        --auto-input-radius,
        var(--asc-field-radius, 0.5rem)
      );
    }
    .asc-field-box .asc-field-action + .asc-field-action {
      margin-inline-start: calc(
        -1 * var(--auto-border-size, var(--asc-field-border-size, 1px))
      );
    }
    /* 钮组与控件位间距（2026-11-16）：贴盒边融合保留（首/尾钮负距吃盒内距+边框，
       控件与钮零距贴死）——组靠控件侧一钮留 0.4em 缝（镜像装饰出口间距标尺）。
       伪类须 *-of-type：x-for 的 template 锚点追加在项后（同款坑见上方贴边规则），
       :last-child 永不命中（template 在最后） */
    .asc-field-box .asc-field-actions-before .asc-field-action:last-of-type {
      margin-inline-end: 0.4em;
    }
    .asc-field-box .asc-field-actions-after .asc-field-action:first-of-type {
      margin-inline-start: 0.4em;
    }

    [dark] .asc-field,
    [data-dark] .asc-field {
      --asc-field-tone: var(
        --auto-primary-color,
        var(--asc-field-primary, #56baff)
      );
      color: var(--auto-color, var(--asc-field-color, #fafafa));
    }
    [dark] .asc-field[data-status="error"],
    [data-dark] .asc-field[data-status="error"] {
      --asc-field-tone: var(
        --auto-danger-color,
        var(--asc-field-danger, #e6696a)
      );
    }
    [dark] .asc-field[data-status="success"],
    [data-dark] .asc-field[data-status="success"] {
      --asc-field-tone: var(
        --auto-success-color,
        var(--asc-field-success, #5cd07c)
      );
    }
    [dark] .asc-field[data-status="warning"],
    [data-dark] .asc-field[data-status="warning"] {
      --asc-field-tone: var(
        --auto-warning-color,
        var(--asc-field-warning, #f7d352)
      );
    }
    [dark] .asc-field-box:not([data-status]),
    [data-dark] .asc-field-box:not([data-status]) {
      --asc-field-line: var(
        --auto-border-color,
        var(--asc-field-border-color, #606060)
      );
      background: var(--auto-input-bgcolor, var(--asc-field-bg, #3c3c3c));
    }
    [dark] .asc-field-box[data-disabled]:not([data-status]),
    [data-dark] .asc-field-box[data-disabled]:not([data-status]) {
      --asc-field-line: var(
        --auto-disable-border-color,
        var(--asc-field-disable-border, #7a7a7a)
      );
      background: var(
        --auto-disable-bgcolor,
        var(--asc-field-disable-bg, rgba(250, 250, 250, 0.2))
      );
    }
    [dark] .asc-field-prefix,
    [dark] .asc-field-suffix,
    [data-dark] .asc-field-prefix,
    [data-dark] .asc-field-suffix {
      color: var(
        --auto-secondary-color,
        var(--asc-field-affix, rgba(250, 250, 250, 0.75))
      );
    }
  </style>
  <span
    class="asc-field-actions asc-field-actions-before"
    x-if="!!(actions && actions.length)"
  >
    <template x-for="item of actions.filter(a => a && a.pos === 'before')">
      <span
        class="asc-field-action"
        data-autospark-action
        x-component:autospark.button="Object.assign({ variant: 'secondary' }, item, { disabled: item.disabled || !!disabled })"
      ></span>
    </template>
  </span>
  <template class="asc-field-prefix" x-slot:prefix></template>
  <span class="asc-field-body" x-slot></span>
  <template class="asc-field-suffix" x-slot:suffix></template>
  <span
    class="asc-field-actions asc-field-actions-after"
    x-if="!!(actions && actions.length)"
  >
    <template x-for="item of actions.filter(a => !a || a.pos !== 'before')">
      <span
        class="asc-field-action"
        data-autospark-action
        x-component:autospark.button="Object.assign({ variant: 'secondary' }, item, { disabled: item.disabled || !!disabled })"
      ></span>
    </template>
  </span>
</span>
