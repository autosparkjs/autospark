<div
  class="asc-menu"
  x-define="autospark.menu"
  x-define:inherit="autospark.base"
>
  <script setup>
    {
        data: () => ({
            value: "",
            items: [],
            expandLevel: 1,
            popLevel: 0,
            openKeys: {},
            collapsed: false,
            trigger: "hover",
            mode: "vertical",
            slotDir: "vertical",
            // 0 = 自适应填充父容器（缺省——body 恒 100% 充满宿主，显式正数才 inline 定宽，2026-11-26 语义翻转）
            width: 0,
            collapsedWidth: 48,
            // main / 弹层面板内边距（number→px / string→原样 CSS）：弹层面板在 overlay 容器、
            // CSS 继承断，经 props 管道显式下传同一值；--auto-spacing 缺省兜底 0.8rem（theme 未加载）
            padding: "calc(var(--auto-spacing, 0.8rem) * 0.5)",
            // Logo 区配置（string ≡ { icon }；null = 不渲染 logo 分区）
            logo: null,
            // URL 形态 logo 图加载失败 → 首字符块兜底（errorArmed 防初始误报，avatar 同款）
            logoErr: false,
            logoArmed: false,
            tree: [],
            openView: {},
            activeKey: "",
            markedMap: {},
            wantFocusAt: 0,
            // 弹层等宽源（px）：本体实测宽（展开态测量，折叠过渡期沿用——48 窄条非弹层基准；
            // 0 = 不写等宽，弹层内容自适应）
            panelW: 0,
            // 生效宽度（px 数值；0 = 自适应填充父容器 / 水平模式不适用）：仅正有限数生效，
            // 否则展开态回落自适应、折叠态回落 48（折叠态必须窄）
            effWidth: (s) => {
                if (s.mode === "horizontal") return 0;
                const fold = !!s.collapsed;
                const raw = fold ? s.collapsedWidth : s.width;
                return typeof raw === "number" && isFinite(raw) && raw > 0 ? raw : fold ? 48 : 0;
            },
            // 宽度 inline（0 = 不写，回落样式表 width:100%）——落内层 body：模板根动态绑定不求值
            boxStyle: (s) => (s.effWidth > 0 ? { width: s.effWidth + "px" } : null),
            // 激活项（影子树条目引用；数组勾选形态 / 未激活为 null）
            activeItem: (s) => {
                if (s.activeKey === "") return null;
                let found = null;
                const walk = (list) => {
                    for (const e of list) {
                        if (found) return;
                        if (e.kind === "item" && e.key === s.activeKey) {
                            found = e;
                            return;
                        }
                        if (e.kids && e.kids.length) walk(e.kids);
                    }
                };
                walk(s.tree || []);
                return found;
            },
            // 激活项祖先链（根 → 自身；未激活为空数组）
            activePath: (s) => {
                const path = [];
                if (s.activeKey === "") return path;
                const walk = (list) => {
                    for (const e of list) {
                        if (e.kind !== "item") continue;
                        path.push(e);
                        if (e.key === s.activeKey) return true;
                        if (e.kids && e.kids.length && walk(e.kids)) return true;
                        path.pop();
                    }
                    return false;
                };
                return walk(s.tree || []) ? path : [];
            },
            // 内边距格式化（padding prop：number→px / string→原样）——main 与弹层面板同值
            menuPadStr: (s) => {
                const p = s.padding;
                if (p == null || p === "") return "";
                return typeof p === "number" && isFinite(p) ? p + "px" : String(p);
            },
            // main 内边距 inline（空 = 不写，回落样式表；落 .asc-menu-main，header/footer 分区不跟随）
            mainPad: (s) => (s.menuPadStr ? { padding: s.menuPadStr } : null),
            // logo 归一（string ≡ { icon }）：icon = 图片 URL 或图标名一体两用、url = 点击跳转、
            // direction 缺省 auto（容器查询 ≥160px hori / <160px vert，折叠态窄宽自然落 vert）、
            // aspectRatio 缺省 1、shape 缺省 radius、color = 图标自定义色（显式时 x-icon theme
            // 强调退位为浓板联动——指定色板 + 同色图形，引擎 ADR-0135 决策五语义）
            logoView: (s) => {
                const raw = s.logo;
                if (raw == null || raw === "") return null;
                const cfg = typeof raw === "string" ? { icon: raw } : (typeof raw === "object" ? raw : null);
                if (!cfg) return null;
                return {
                    icon: cfg.icon == null ? "" : String(cfg.icon),
                    url: cfg.url == null || cfg.url === "" ? "" : String(cfg.url),
                    title: cfg.title == null ? "" : String(cfg.title),
                    desc: cfg.description == null ? "" : String(cfg.description),
                    direction: ["hori", "vert", "auto"].includes(cfg.direction) ? cfg.direction : "auto",
                    padding: cfg.padding,
                    size: cfg.size,
                    ratio: typeof cfg.aspectRatio === "number" && isFinite(cfg.aspectRatio) && cfg.aspectRatio > 0 ? cfg.aspectRatio : 1,
                    shape: ["none", "circle", "radius"].includes(cfg.shape) ? cfg.shape : "radius",
                    color: cfg.color == null ? "" : String(cfg.color),
                };
            },
            // icon 是否图片 URL 形态（http(s):// / 协议相对 / 根或相对路径 / data: / blob: / 常见图片扩展名）
            // → img，否则 x-icon
            logoIsImg: (s) => {
                const v = s.logoView ? s.logoView.icon : "";
                return /^(https?:)?\/\/|^(data|blob):|^\.{0,2}\//i.test(v) || /\.(png|jpe?g|gif|webp|svg|ico|bmp|avif)(\?.*)?$/i.test(v);
            },
            // logo 区 inline：padding 缺省跟随 menu padding（与 main 留白一致），显式 logo.padding 覆盖
            logoStyle: (s) => {
                const lv = s.logoView;
                if (!lv) return null;
                const p = lv.padding != null && lv.padding !== "" ? lv.padding : s.menuPadStr;
                if (!p) return null;
                return { padding: typeof p === "number" && isFinite(p) ? p + "px" : String(p) };
            },
            // 图标展示区尺寸字符串（size：number→px / string→原样，缺省 2.5em）——容器 inline
            // 专用；图形经 CSS 三层撑满（wrapper / 宿主 100% 相对容器，板即容器）
            logoBoxSize: (s) => {
                const lv = s.logoView;
                const raw = lv ? lv.size : null;
                return raw == null || raw === "" ? "2.5em" : typeof raw === "number" && isFinite(raw) ? raw + "px" : String(raw);
            },
            // 图标展示区 inline（宽 = 高 × aspectRatio）
            logoBoxStyle: (s) => {
                const lv = s.logoView;
                if (!lv) return null;
                const h = s.logoBoxSize;
                return lv.ratio === 1 ? { height: h, width: h } : { height: h, width: "calc(" + h + " * " + lv.ratio + ")" };
            },
            // 插槽形参（作用域插槽）：header / footer 出口全集，调用方按需解构（只读）
            slotParams: (s) => ({
                collapsed: !!s.collapsed,
                width: s.effWidth,
                activeKey: s.activeKey,
                activeItem: s.activeItem,
                activePath: s.activePath,
                mode: s.mode,
                value: s.value,
                items: s.items,
                openKeys: s.openKeys,
                expandLevel: s.expandLevel,
                popLevel: s.popLevel,
                trigger: s.trigger,
                slotDir: s.slotDir,
            }),
        }),
        methods: {
            normalize(list, parentDisabled) {
                const raw = Array.isArray(list) ? list.filter((x) => x != null) : [];
                const entries = [];
                for (const entry of raw) {
                    if (entry === "-" || (entry && entry.type === "separator")) {
                        entries.push({ kind: "sep" });
                        continue;
                    }
                    if (entry && entry.type === "group") {
                        entries.push({ kind: "group", title: String(entry.title ?? ""), icon: entry.icon ?? "" });
                        continue;
                    }
                    const it = entry && typeof entry === "object" ? entry : {};
                    const kidsRaw = Array.isArray(it.children)
                        ? it.children
                        : (it.children && Array.isArray(it.children.children) ? it.children.children : []);
                    const conf = Array.isArray(it.children) ? {} : (it.children ?? {});
                    const disabled = !!it.disabled || !!parentDisabled;
                    const key = it.key == null ? null : String(it.key);
                    if (key == null && (kidsRaw.length > 0 || it.checkable) && typeof console !== "undefined") {
                        console.warn("[autospark.menu] 无 key 的项不可被 value/openKeys 引用：", it.label ?? it);
                    }
                    entries.push({ ...it, kind: "item", key, disabled, kids: this.normalize(kidsRaw, disabled), conf });
                }
                const items = entries.filter((e) => e.kind === "item");
                const hasIcon = items.some((e) => !!e.icon);
                const hasCheck = items.some((e) => !!e.checkable);
                for (const e of entries) {
                    if (e.kind !== "item") continue;
                    e.iconPh = hasIcon && !e.icon;
                    e.checkPh = hasCheck;
                }
                while (entries.length && entries[0].kind === "sep") entries.shift();
                while (entries.length && entries[entries.length - 1].kind === "sep") entries.pop();
                return entries;
            },
            // 弹层起始层级：折叠态（垂直 = 子级全弹层）与水平模式（子级全弹层）恒为 1
            popFromNow() {
                if (this.data.collapsed || this.data.mode === "horizontal") return 1;
                const pl = Number(this.data.popLevel);
                return pl > 0 ? pl + 1 : Infinity;
            },
            recomputeView() {
                const open = this.data.openKeys ?? {};
                const popFrom = this.popFromNow();
                const view = {};
                const walk = (list, depth) => {
                    for (const e of list) {
                        if (e.kind !== "item") { e._fold = false; e._pop = false; e._leaf = false; continue; }
                        const hasKids = !!(e.kids && e.kids.length);
                        e._fold = hasKids && depth < popFrom;
                        e._pop = hasKids && depth >= popFrom;
                        e._leaf = !hasKids;
                        if (!hasKids || e.key == null) continue;
                        view[e.key] = e.key in open ? !!open[e.key] : depth <= Number(this.data.expandLevel ?? 1);
                        e._open = !!view[e.key];
                        walk(e.kids, depth + 1);
                    }
                };
                walk(this.data.tree || [], 1);
                this.data.openView = view;
            },
            recomputeMarks() {
                const v = this.data.value;
                const tree = this.data.tree || [];
                if (Array.isArray(v)) {
                    this.data.activeKey = "";
                    const m = {};
                    for (const k of v) m[String(k)] = true;
                    this.data.markedMap = m;
                    const walk = (list) => {
                        for (const e of list) {
                            if (e.kind !== "item") continue;
                            e._marked = !!m[e.key];
                            e._active = false;
                            if (e.kids && e.kids.length) walk(e.kids);
                        }
                    };
                    walk(tree);
                } else {
                    const active = v == null ? "" : String(v);
                    this.data.activeKey = active;
                    this.data.markedMap = {};
                    const walk = (list) => {
                        for (const e of list) {
                            if (e.kind !== "item") continue;
                            e._active = e.key != null && e.key === active && active !== "";
                            e._marked = false;
                            if (e.kids && e.kids.length) walk(e.kids);
                        }
                    };
                    walk(tree);
                }
            },
            findItem(key) {
                if (key == null) return null;
                const target = String(key);
                let found = null;
                const walk = (list) => {
                    for (const e of list) {
                        if (found) return;
                        if (e.kind === "item" && e.key === target) { found = e; return; }
                        if (e.kids && e.kids.length) walk(e.kids);
                    }
                };
                walk(this.data.tree || []);
                return found;
            },
            // logo 图加载失败（URL 形态）→ 首字符块兜底（errorArmed 防初始误报，avatar 同款）
            onLogoError() {
                if (!this.data.logoArmed) return;
                this.data.logoErr = true;
            },
            onRelay(event) {
                const d = event.detail || {};
                if (d.kind === "toggle") this.onToggle(d.key);
                else if (d.kind === "pick") this.onPick(d.key);
            },
            closeAllPanels() {
                document.body.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            },
            onPick(key) {
                const item = this.findItem(key);
                if (!item || item.disabled) return;
                if (Array.isArray(this.data.value)) {
                    if (!item.checkable || item.key == null) return;
                    const arr = (this.data.value || []).map(String);
                    const next = arr.indexOf(item.key) >= 0 ? arr.filter((k) => k !== item.key) : arr.concat(item.key);
                    this.data.value = next;
                    this.recomputeMarks();
                    this.el.dispatchEvent(new Event("input", { bubbles: false }));
                    this.el.dispatchEvent(new CustomEvent("change", { bubbles: true, detail: { value: next } }));
                    return;
                }
                if (item.kids.length || item.key == null || item.key === String(this.data.value ?? "")) return;
                this.data.value = item.key;
                this.recomputeMarks();
                this.el.dispatchEvent(new Event("input", { bubbles: false }));
                this.el.dispatchEvent(new CustomEvent("change", { bubbles: true, detail: { value: item.key } }));
                this.closeAllPanels();
            },
            onToggle(key) {
                if (key == null) return;
                const open = { ...(this.data.openKeys ?? {}) };
                // 目标态按当前**实际**展开态取反：openKeys 未覆盖的项其展开态来自 expandLevel
                // 默认、不在 openKeys 里——按原值取反会把「默认展开」误判成「要展开」（首次点击无效）
                const current = key in open ? !!open[key] : !!this.data.openView[key];
                const expanded = !current;
                // 显式三态：收起写 false（不 delete）——删键会落入 recomputeView 的 expandLevel
                // 回退分支，depth ≤ expandLevel 的父项收不起
                open[key] = expanded;
                this.data.openKeys = open;
                this.el.dispatchEvent(new CustomEvent("expand", { bubbles: true, detail: { key, expanded } }));
            },
            expandTo(key) {
                const target = String(key ?? "");
                if (target === "" || Array.isArray(this.data.value)) return;
                let chain = null;
                const walk = (list, parents) => {
                    for (const e of list) {
                        if (chain) return true;
                        if (e.kind !== "item") continue;
                        if (e.key === target && !e.kids.length) { chain = parents.slice(); return true; }
                        if (e.kids.length && walk(e.kids, parents.concat(e.key))) return true;
                    }
                    return false;
                };
                if (!walk(this.data.tree || [], [])) return;
                const open = { ...(this.data.openKeys ?? {}) };
                let dirty = false;
                for (const k of chain) {
                    if (!open[k]) { open[k] = true; dirty = true; }
                }
                if (dirty) this.data.openKeys = open;
            },
            onKeydown(event) {
                const k = event.key;
                if (k !== "ArrowDown" && k !== "ArrowUp" && k !== "ArrowRight" && k !== "ArrowLeft" && k !== "Home" && k !== "End") return;
                const btn = event.target && event.target.closest ? event.target.closest(".asc-menu-entry > .asc-button") : null;
                const currentEntry = btn ? btn.closest(".asc-menu-entry") : null;
                const focusables = (list) => Array.from(list.querySelectorAll(":scope > .asc-menu-entry > .asc-button:not([disabled])"));
                if (k === "ArrowDown" || k === "ArrowUp" || k === "Home" || k === "End") {
                    const list = currentEntry ? currentEntry.parentElement : this.el.querySelector(".asc-menu-list");
                    const arr = list ? focusables(list) : [];
                    if (!arr.length) return;
                    event.preventDefault();
                    let next = null;
                    if (k === "Home") next = arr[0];
                    else if (k === "End") next = arr[arr.length - 1];
                    else {
                        const i = arr.indexOf(btn);
                        const dir = k === "ArrowDown" ? 1 : -1;
                        next = i < 0 ? arr[0] : arr[(i + dir + arr.length) % arr.length];
                    }
                    if (next) next.focus();
                    return;
                }
                if (!btn || !currentEntry) return;
                if (k === "ArrowRight") {
                    const mode = currentEntry.getAttribute("data-mode");
                    if (mode === "fold") {
                        event.preventDefault();
                        const pkey = currentEntry.getAttribute("data-key");
                        if (pkey && !this.data.openView[pkey]) this.onToggle(pkey);
                        setTimeout(() => {
                            const first = currentEntry.querySelector(".asc-menu-sub .asc-menu-entry > .asc-button:not([disabled])");
                            if (first) first.focus();
                        }, 0);
                        return;
                    }
                    if (mode === "pop") {
                        event.preventDefault();
                        this.openPophost(currentEntry);
                        this.data.wantFocusAt = Date.now();
                    }
                    return;
                }
                const sub = currentEntry.closest(".asc-menu-sub");
                if (sub) {
                    event.preventDefault();
                    const parentEntry = sub.closest(".asc-menu-entry");
                    const pkey = parentEntry ? parentEntry.getAttribute("data-key") : null;
                    if (pkey && this.data.openView[pkey]) this.onToggle(pkey);
                    const pbtn = parentEntry ? parentEntry.querySelector(":scope > .asc-button") : null;
                    if (pbtn) pbtn.focus();
                }
            },
            openPophost(popEl) {
                if (String(this.data.trigger) === "click") {
                    popEl.dispatchEvent(new MouseEvent("click", { bubbles: true }));
                } else {
                    popEl.dispatchEvent(new MouseEvent("mouseenter", { bubbles: false }));
                }
            },
        },
        mounted() {

            // logo 图 error 误报防御 + logo 变化重置（avatar 同款模式）
            setTimeout(() => { this.data.logoArmed = true; }, 0);
            this.watch("logo", () => {
                this.data.logoErr = false;
                this.data.logoArmed = false;
                setTimeout(() => { this.data.logoArmed = true; }, 0);
            });

            const raw = this.el.getAttribute("data-items");
            if ((!this.data.items || !this.data.items.length) && raw) {
                try { this.data.items = JSON.parse(raw); } catch { /* 非法 JSON 静默忽略（容错缺省空组） */ }
                this.el.removeAttribute("data-items");
            }

            this.data.tree = this.normalize(this.data.items, false);
            this.recomputeMarks();
            this.recomputeView();

            const prior = this.el.value;
            Object.defineProperty(this.el, "value", {
                get: () => (Array.isArray(this.data.value) ? this.data.value.join(",") : String(this.data.value ?? "")),
                set: (v) => {
                    this.data.value = String(v ?? "");
                    this.recomputeMarks();
                    this.expandTo(v);
                },
                configurable: true,
            });

            setTimeout(() => {
                if ((this.data.value === "" || this.data.value == null) && typeof prior === "string" && prior !== "") {
                    this.data.value = prior;
                }
                this.recomputeMarks();
                this.expandTo(this.data.value);
            }, 0);

            this.watch("items", () => {
                this.data.tree = this.normalize(this.data.items, false);
                this.recomputeMarks();
                this.recomputeView();
            });
            this.watch("value", () => {
                this.recomputeMarks();
                this.expandTo(this.data.value);
            });
            this.watch("openKeys", () => { this.recomputeView(); });
            this.watch("expandLevel", () => { this.recomputeView(); });
            this.watch("popLevel", () => { this.recomputeView(); });
            this.watch("collapsed", () => { this.recomputeView(); });
            this.watch("mode", () => { this.recomputeView(); });

            // 弹层等宽源：本体实测宽（ResizeObserver 持续跟随——自适应容器变宽/显式定宽统一覆盖；
            // 展开态才测量，折叠窄条不污染；水平模式弹层不等宽无值）
            const bodyEl = this.el.querySelector(".asc-menu-body");
            const measure = () => {
                if (this.data.mode === "horizontal" || this.data.collapsed) return;
                const w = bodyEl ? bodyEl.getBoundingClientRect().width : 0;
                if (w > 0) this.data.panelW = Math.round(w);
            };
            measure();
            // RO 实例挂 el expando：存 this（响应式容器）会被 Proxy 包装致 observe Illegal invocation
            if (typeof ResizeObserver !== "undefined" && bodyEl) {
                this.el._panelRO = new ResizeObserver(measure);
                this.el._panelRO.observe(bodyEl);
            }
        },
        unmounted() {
            if (this.el._panelRO) { this.el._panelRO.disconnect(); delete this.el._panelRO; }
        },
    }
  </script>
  <style global id="autospark-components-menu">
    .asc-menu {
      display: block;
      width: 100%;
      font-size: var(--auto-font-size, var(--asc-menu-font-size, 0.875rem));
      line-height: var(--auto-line-height, 1.5);
    }
    .asc-menu-body {
      --asc-tone: var(--auto-primary-color, var(--asc-menu-primary, #009aff));
      display: flex;
      flex-direction: column;
      /* 恒充满容器：宽度源 = 宿主容器（width prop 显式正数时才经 inline 覆盖） */
      width: 100%;
      outline: none;
      min-width: 0;
      transition: width 0.2s ease;
      /* logo direction:auto 的宽度感知容器（@container 查询） */
      container-type: inline-size;
    }
    .asc-menu-body:focus-visible {
      box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--asc-tone) 28%, transparent);
    }
    .asc-menu-header,
    .asc-menu-footer {
      padding: 0.4em 0.25em;
      color: var(--auto-third-color, var(--asc-menu-aux-color, rgba(0, 0, 0, 0.35)));
      min-width: 0;
    }
    /* 垂直折叠态：header/footer 保留（可经插槽形参切换内容）并裁剪溢出——只在分区上裁，
       根上裁会连带裁掉子树内定位的弹层 */
    .asc-menu-body[data-mode="vertical"][data-collapsed] .asc-menu-header,
    .asc-menu-body[data-mode="vertical"][data-collapsed] .asc-menu-footer {
      overflow: hidden;
    }
    .asc-menu-slot {
      display: block;
      min-width: 0;
    }

    /* —— Logo 区（独立分区：vertical 位于 header 之上 / slotDir horizontal 时横排最前；
       slot=logo 内容段重载，出口 fallback = 内置默认渲染，ADR-0033 修订）—— */
    .asc-menu-logo {
      padding: calc(var(--auto-spacing, 0.8rem) * 0.5);
      min-width: 0;
    }
    .asc-menu-logo-main {
      display: flex;
      align-items: center;
      gap: 0.6em;
      color: inherit;
      text-decoration: none;
      min-width: 0;
    }
    /* 仅图片（无 title / description 文字段）：图标水平居中（hori / auto 横排；
       折叠态恒居中另有规则） */
    .asc-menu-logo-main:not([data-text]) {
      justify-content: center;
    }
    /* vert 纵排居中；hori 由 data-direction="hori" 声明（flex row 缺省）；auto 二态走容器查询 */
    .asc-menu-logo[data-direction="vert"] .asc-menu-logo-main,
    .asc-menu-logo[data-direction="auto"] .asc-menu-logo-main {
      flex-direction: column;
      text-align: center;
    }
    /* auto：容器宽度 ≥160px 走 hori（折叠态 48px 窄宽自然落 vert，零 JS） */
    @container (min-width: 160px) {
      .asc-menu-logo[data-direction="auto"] .asc-menu-logo-main {
        flex-direction: row;
        text-align: start;
      }
    }
    .asc-menu-logo-icon {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      /* 缺省 2.5em；显式 size 经 inline 覆盖 */
      width: 2.5em;
      height: 2.5em;
      overflow: hidden;
      flex: none;
      /* 品牌色块：背景主题色 + 内容白色（x-icon currentColor / 首字符块；img 不受影响） */
      background: var(--auto-theme-color, var(--asc-menu-primary, #009aff));
      color: #fff;
      border-radius: var(--auto-border-radius, 0.375rem);
    }
    .asc-menu-logo-icon[data-shape="circle"] {
      border-radius: 50%;
    }
    .asc-menu-logo-icon[data-shape="none"] {
      border-radius: 0;
      background: transparent;
    }
    /* 图片形态：不套背景（图片自带画面；失效转 fallback 时背景由下方规则恢复——源序在后赢） */
    .asc-menu-logo-icon[data-img] {
      background: transparent;
    }
    /* 图标形态：品牌色块职责移交 x-icon（shape+theme 双色调板，ADR-0135 决策五）——
       容器透明纯布局（尺寸/居中）；fallback 恢复规则源序在后不受影响。
       三层撑满：shape wrapper 与 x-icon 宿主 100% 相对容器（容器 inline 定尺寸为锚，
       wrapper 压倒 engine 形态类的 height:fit-content 防内容高循环）——板即容器 */
    .asc-menu-logo-icon[data-glyph] {
      background: transparent;
    }
    .asc-menu-logo-icon[data-glyph] > span {
      width: 100%;
      height: 100%;
    }
    .asc-menu-logo-icon[data-glyph] .asc-menu-logo-glyph {
      width: 100%;
      height: 100%;
    }
    /* fallback 首字符块：不论 shape 都有可见底（none → 圆角矩形品牌色块，logo 图无效的兜底） */
    .asc-menu-logo-icon[data-has-fallback] {
      background: var(--auto-theme-color, var(--asc-menu-primary, #009aff));
      border-radius: var(--auto-border-radius, 0.375rem);
    }
    .asc-menu-logo-icon[data-shape="circle"][data-has-fallback] {
      border-radius: 50%;
    }
    .asc-menu-logo-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .asc-menu-logo-glyph {
      display: inline-flex;
      line-height: 1;
    }
    .asc-menu-logo-char {
      font-weight: var(--x-font-weight-large, 600);
      font-size: 1.2em;
      line-height: 1;
      white-space: nowrap;
    }
    .asc-menu-logo-text {
      display: flex;
      flex-direction: column;
      gap: 0.1em;
      min-width: 0;
    }
    .asc-menu-logo-title {
      font-weight: var(--x-font-weight-large, 600);
      color: var(--auto-color, var(--asc-menu-color, #606060));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .asc-menu-logo-desc {
      font-size: 0.85em;
      color: var(--auto-third-color, var(--asc-menu-aux-color, rgba(0, 0, 0, 0.35)));
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    /* 折叠：只留图标（文字隐藏、归一居中、内边距收窄适配 collapsedWidth）；
       size 大图标防溢出图标条 */
    .asc-menu-body[data-collapsed] .asc-menu-logo {
      padding: 0.25em;
    }
    .asc-menu-body[data-collapsed] .asc-menu-logo-icon {
      max-width: 100%;
    }
    .asc-menu-body[data-collapsed] .asc-menu-logo-main {
      flex-direction: row;
      justify-content: center;
    }
    .asc-menu-body[data-collapsed] .asc-menu-logo-text {
      display: none;
    }
    .asc-menu-main {
      min-width: 0;
    }

    .asc-menu-list {
      list-style: none;
      margin: 0;
      padding: 0;
      min-width: 0;
    }
    .asc-menu-entry {
      position: relative;
      min-width: 0;
    }
    /* 分割线与菜单项同宽：左右 margin 为零，缩进全部由 main 内边距承担 */
    .asc-menu-sep {
      margin: 0.35em 0;
      border-top: var(--auto-border-size, var(--asc-menu-border-size, 1px)) solid
        var(--auto-border-color, var(--asc-menu-border, #f0f0f0));
    }
    .asc-menu-group {
      display: flex;
      align-items: center;
      gap: 0.4em;
      padding: 0.6em 0.75em 0.25em;
      font-size: 0.85em;
      color: var(--auto-secondary-color, var(--asc-menu-aux-color, rgba(0, 0, 0, 0.55)));
      white-space: nowrap;
    }
    /* 折叠态：分组标题只留图标，无图标的整标题不渲染（文字在图标列里无处安放） */
    .asc-menu-body[data-collapsed] .asc-menu-group-title {
      display: none;
    }
    .asc-menu-body[data-collapsed] .asc-menu-group:not([data-icon]) {
      display: none;
    }
    .asc-menu-group-icon {
      display: inline-flex;
      flex: none;
    }
    .asc-menu-group-title {
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* button 化身载体是 div（content-box，异于 <button> 的 UA border-box）：block 的
       width:100% 须含 padding 与边框，否则每行撑出菜单宽度一个内边距的量 */
    .asc-menu-entry > .asc-button {
      box-sizing: border-box;
    }
    .asc-menu-entry[data-active] > .asc-button {
      color: var(--asc-tone);
      font-weight: var(--x-font-weight-large, 600);
      background: color-mix(in srgb, var(--asc-tone) 10%, transparent);
    }
    /* 勾选项（数组形态，checkMark 占位列的显影——button 自有 ✓ 规则需 asc-marked 类，
       menu 侧经 entry 标记命中，不经 class 通道） */
    .asc-menu-entry[data-marked] > .asc-button.asc-check-check > .asc-button-body::before {
      content: "✓";
    }
    /* 图标占位列：仅展开态隐藏（同级图标对齐）；折叠态只剩图标列，占位图标须可见 */
    .asc-menu-body:not([data-collapsed]) .asc-menu-entry[data-icon-ph] > .asc-button .asc-button-icon {
      visibility: hidden;
    }
    /* 折叠态：激活 / 勾选 = 图标染激活色（label 不在场，仅此一处可表达） */
    .asc-menu-body[data-collapsed] .asc-menu-entry[data-active] > .asc-button .asc-button-icon,
    .asc-menu-body[data-collapsed] .asc-menu-entry[data-marked] > .asc-button .asc-button-icon {
      color: var(--asc-tone);
      visibility: visible;
    }

    .asc-menu-subwrap {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.2s ease;
    }
    .asc-menu-subwrap[data-open] {
      grid-template-rows: 1fr;
    }
    .asc-menu-subwrap > .asc-menu-sub {
      overflow: hidden;
      min-height: 0;
      /* 子级缩进基准 = 父项内容起点：1.5em 使子项文字与父项图标列起点对齐，逐级累计 */
      padding-inline-start: var(--asc-menu-indent, 1.5em);
    }

    /* 水平菜单：logo 与菜单条并排（row）、垂直居中——视觉同一水平线 */
    .asc-menu-body[data-mode="horizontal"] {
      flex-direction: row;
      align-items: center;
    }
    .asc-menu-body[data-mode="horizontal"] .asc-menu-list {
      display: flex;
      align-items: stretch;
      flex-wrap: wrap;
      row-gap: 0.125em;
      column-gap: 0.125em;
    }
    .asc-menu-body[data-mode="horizontal"] .asc-menu-entry + .asc-menu-entry {
      margin-left: 0.125em;
    }
    .asc-menu-body[data-mode="horizontal"] .asc-menu-sep {
      margin: 0.35em 0.25em;
      border-top: none;
      border-left: var(--auto-border-size, var(--asc-menu-border-size, 1px)) solid
        var(--auto-border-color, var(--asc-menu-border, #f0f0f0));
      align-self: stretch;
    }
    .asc-menu-body[data-mode="horizontal"] .asc-menu-group {
      align-items: center;
      padding: 0.6em 0.5em 0.25em;
    }
    /* header / footer 仅垂直菜单生效：水平模式分区隐藏（横排条无上下分区语义） */
    .asc-menu-body[data-mode="horizontal"] > .asc-menu-header,
    .asc-menu-body[data-mode="horizontal"] > .asc-menu-footer {
      display: none;
    }

    .asc-menu-body[data-slot-dir="horizontal"] {
      flex-direction: row;
      align-items: center;
    }
    .asc-menu-body[data-slot-dir="horizontal"] > .asc-menu-header {
      order: 0;
      align-self: center;
      padding-inline: 0.5em;
    }
    .asc-menu-body[data-slot-dir="horizontal"] > .asc-menu-main {
      order: 1;
      flex: 1 1 auto;
      min-width: 0;
    }
    .asc-menu-body[data-slot-dir="horizontal"] > .asc-menu-footer {
      order: 2;
      align-self: center;
      padding-inline: 0.5em;
    }

    .asc-menu-panel {
      min-width: max-content;
      max-width: 18em;
      font-size: var(--auto-font-size, var(--asc-menu-font-size, 0.875rem));
      line-height: var(--auto-line-height, 1.5);
      color: var(--auto-color, var(--asc-menu-color, #606060));
      --asc-tone: var(--auto-primary-color, var(--asc-menu-primary, #009aff));
      outline: none;
    }

    [dark] .asc-menu-body,
    [data-dark] .asc-menu-body {
      --asc-tone: var(--auto-primary-color, var(--asc-menu-primary, #56baff));
    }
    [dark] .asc-menu .asc-menu-entry > .asc-button,
    [data-dark] .asc-menu .asc-menu-entry > .asc-button {
      color: var(--auto-color, var(--asc-menu-color, #fafafa));
    }
    [dark] .asc-menu-sep,
    [data-dark] .asc-menu-sep {
      border-color: var(--auto-border-color, var(--asc-menu-border, #52525b));
    }
    [dark] .asc-menu-group,
    [data-dark] .asc-menu-group {
      color: var(--auto-secondary-color, var(--asc-menu-aux-color, rgba(255, 255, 255, 0.65)));
    }
    [dark] .asc-menu-header,
    [dark] .asc-menu-footer,
    [dark] .asc-menu-panel,
    [data-dark] .asc-menu-header,
    [data-dark] .asc-menu-footer,
    [data-dark] .asc-menu-panel {
      color: var(--auto-color, var(--asc-menu-color, #fafafa));
    }
    [dark] .asc-menu-logo-title,
    [data-dark] .asc-menu-logo-title {
      color: var(--auto-color, var(--asc-menu-color, #fafafa));
    }
    [dark] .asc-menu-logo-icon,
    [data-dark] .asc-menu-logo-icon {
      background: var(--auto-theme-color, var(--asc-menu-primary, #56baff));
    }
  </style>
  <div
    class="asc-menu-body"
    :data-mode="mode"
    :data-collapsed="!!collapsed ? '' : null"
    :data-slot-dir="!!collapsed && mode !== 'horizontal' ? 'vertical' : slotDir"
    :style="boxStyle"
    tabindex="0"
    @keydown="onKeydown($event)"
    @menu-relay="onRelay($event)"
  >
    <div
      class="asc-menu-logo"
      x-show="logoView"
      :data-direction="logoView ? logoView.direction : null"
    >
      <!-- :style 不与 x-show 同元素（patchStyle falsy 分支整删 style 属性会冲掉 display:none），
           padding 覆盖落 slot 出口包裹层（无 x-show，几何等价） -->
      <div class="asc-menu-slot" x-slot:logo="slotParams" :style="logoStyle">
        <a
          class="asc-menu-logo-main"
          x-show="logoView"
          :data-text="logoView && (logoView.title || logoView.desc) ? '' : null"
          :href="logoView && logoView.url ? logoView.url : null"
        >
          <span
            class="asc-menu-logo-icon"
            :data-shape="logoView ? logoView.shape : null"
            :data-img="logoIsImg ? '' : null"
            :data-glyph="logoIsImg ? null : ''"
            :data-has-fallback="logoView && logoIsImg && logoErr && logoView.title ? '' : null"
            :style="logoBoxStyle"
          >
            <img
              class="asc-menu-logo-img"
              x-show="logoView && logoIsImg && !logoErr"
              :src="logoView ? logoView.icon : ''"
              :alt="logoView ? logoView.title : ''"
              @error="onLogoError()"
            />
            <!-- 图标形态：品牌色块职责移交 x-icon（shape+theme 双色调板，ADR-0135 决策五；
                 padding 0 + CSS 三层撑满 = 板即容器；显式 logo.color 时 theme 退位浓板联动） -->
            <i
              class="asc-menu-logo-glyph"
              x-show="logoView && logoView.icon && !logoIsImg"
              x-icon="logoView ? logoView.icon : ''"
              x-icon-options:shape="logoView ? logoView.shape : 'radius'"
              x-icon-options:theme="true"
              x-icon-options:padding="0"
              x-icon-options:color="logoView ? logoView.color : ''"
            ></i>
            <span
              class="asc-menu-logo-char"
              x-show="logoView && logoIsImg && logoErr && logoView.title"
              x-text="logoView && logoView.title ? Array.from(logoView.title.trim())[0] : ''"
            ></span>
            <i
              class="asc-menu-logo-glyph"
              x-show="logoView && logoIsImg && logoErr && !logoView.title"
              x-icon="'default'"
              x-icon-options:shape="logoView ? logoView.shape : 'radius'"
              x-icon-options:theme="true"
              x-icon-options:padding="0"
            ></i>
          </span>
          <span class="asc-menu-logo-text" x-show="!collapsed">
            <span class="asc-menu-logo-title" x-show="logoView && logoView.title" x-text="logoView ? logoView.title : ''"></span>
            <span class="asc-menu-logo-desc" x-show="logoView && logoView.desc" x-text="logoView ? logoView.desc : ''"></span>
          </span>
        </a>
      </div>
    </div>
    <!-- header/footer 出口 = template 载体（ADR-0137）：无包裹层，template 上的分区 class
         经出口注入落到投影内容根（多根对称、class token 合并）；空载体 = 可选出口，
         未提供插槽时分区整段不渲染（原空壳占位取消） -->
    <template class="asc-menu-header" x-slot:header="slotParams"></template>
    <div class="asc-menu-main" :style="mainPad">
      <div
        x-component:autospark-menu-node="{
            list: tree,
            depth: 1,
            mode: mode,
            trigger: trigger,
            collapsed: !!collapsed,
            effWidth: panelW,
            padding: menuPadStr
        }"
      ></div>
    </div>
    <template class="asc-menu-footer" x-slot:footer="slotParams"></template>
  </div>
</div>
