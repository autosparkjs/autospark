<!--
    autospark.breadcrumb 面包屑（组件库 P1 导航件，ADR-0018 清单权威表 navigation 行）：
    数据驱动 items（{ label, href?, icon? }[]）渲染层级路径——末项恒为「当前页」
    （aria-current="page"）；有 href 的项渲染为真 a 链接（primary 色，原生导航语义
    保真），无 href 的项渲染为纯文本（正文色）。

    两形态（mounted 统一收敛到 items 数据面渲染）：
    - items 状态引用注入：<nav x-component:autospark.breadcrumb="{ items: crumbs }">——
      引擎对值对象内的字面量数组 props 存在 _propsEqual 引用比较死环缺陷（P0 固化
      规避清单第 1 条），items 恒走状态引用；
    - 子元素声明（静态路径）：<x-breadcrumb-item label href icon> 由 index.ts 的
      precompile 变换折叠为 items JSON 落 data-* 通道（字符串标量，规避字面量数组
      props），mounted 解析写组件 data → x-for 响应渲染。

    分隔符（separator）："arrow" = x-icon 内置箭头 | 其他任意字符串原样文本（缺省 "/"）；
    末项分隔符经 :last-child 隐藏。

    router 隔离（ADR-0018 决策 6 约定 2）：组件纯状态驱动、不 import router——点击
    拦截由外层包裹元素 @click.capture 判 a[href] preventDefault 接管（配方见组件文档）。

    化身路径约束（x-component T4=B）：组件快照根的属性静态并入宿主，根上的动态绑定
    不会求值——本组件无宿主级变体外观，绑定全落在编译子树内层（克隆体内部元素）。
-->
<!-- 继承 autospark.base（ADR-0134，engine 内置抽象基组件）：主题档位 props
     （data-size / data-shadow / data-radius / data-spacing / data-dark / data-colorized
     六键）自动获得——字号档位经主题通道全跟随；breadcrumb 不在 data() 声明主题六键，
     内部变体属性亦禁用六个通道名 -->
<nav
  class="asc-breadcrumb"
  x-define="autospark.breadcrumb"
  x-define:inherit="autospark.base"
>
  <script setup>
    {
        data: () => ({
            items: [],      // 面包屑项 { label, href?, icon? }[]——状态引用注入（字面量数组死环规避）；声明形态经 data-items 通道兜底
            separator: "/", // 分隔符："arrow" = x-icon 内置箭头 | 其他任意字符串原样文本（缺省 "/"）
        }),
        mounted() {
            // 声明形态兜底（precompile 变换落盘的 data-items JSON 字符串）：items props
            // 缺席时解析写组件 data（x-for 指令值通道响应，随写随渲染）；props 在场恒优先
            const raw = this.el.getAttribute("data-items");
            if ((!this.data.items || !this.data.items.length) && raw) {
                try { this.data.items = JSON.parse(raw); } catch { /* 非法 JSON 静默忽略（容错缺省空路径） */ }
                this.el.removeAttribute("data-items");
            }
        },
    }
  </script>
  <style global id="autospark-components-breadcrumb">
    .asc-breadcrumb {
      /* 排版基线：字号经主题档位通道（data-size → --auto-font-size 全跟随，button 同范式 ADR-0012）；
         缺省文案色为次要色（路径导航的视觉降噪惯例），当前页项另覆正文色 */
      display: inline-flex;
      max-width: 100%;
      font-size: var(--auto-font-size, var(--asc-breadcrumb-font-size, 0.875rem));
      line-height: var(--auto-line-height, 1.5);
      color: var(--auto-secondary-color, var(--asc-breadcrumb-color, rgba(0, 0, 0, 0.55)));
    }
    .asc-breadcrumb-list {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      list-style: none;
      margin: 0;
      padding: 0;
      min-width: 0;
    }
    /* 项载体：x-for 克隆载体（li 本体），链接/当前/分隔符横排 */
    .asc-breadcrumb-item {
      display: inline-flex;
      align-items: center;
      gap: 0.5em;
      min-width: 0;
    }
    /* 链接项：primary 色（可点击语义引导），hover 压暗（link 同款交互惯例） */
    .asc-breadcrumb-link {
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
      min-width: 0;
      color: var(--auto-primary-color, var(--asc-breadcrumb-link, #009aff));
      text-decoration: none;
      cursor: pointer;
      transition: color 0.15s ease, filter 0.15s ease;
    }
    .asc-breadcrumb-link:hover {
      filter: brightness(0.9);
    }
    /* 当前项（无 href）：正文色（末项恒 aria-current="page"，绑定通道随项数变化响应） */
    .asc-breadcrumb-current {
      display: inline-flex;
      align-items: center;
      gap: 0.3em;
      min-width: 0;
      color: var(--auto-color, var(--asc-breadcrumb-current, #606060));
    }
    /* 文案：单行截断（宽度受约束时省略号） */
    .asc-breadcrumb-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }
    /* 分隔符：辅助色弱化；末项分隔符隐藏（当前页后无路径） */
    .asc-breadcrumb-sep {
      display: inline-flex;
      align-items: center;
      color: var(--auto-third-color, var(--asc-breadcrumb-sep, rgba(0, 0, 0, 0.35)));
    }
    .asc-breadcrumb-item:last-child .asc-breadcrumb-sep {
      display: none;
    }

    /* ---------- 暗色兜底变体（ADR-0129）：兜底字面值切换为 theme 默认暗色校准值（变量链不变） ---------- */
    [dark] .asc-breadcrumb,
    [data-dark] .asc-breadcrumb {
      color: var(--auto-secondary-color, var(--asc-breadcrumb-color, rgba(255, 255, 255, 0.65)));
    }
    [dark] .asc-breadcrumb-link,
    [data-dark] .asc-breadcrumb-link {
      color: var(--auto-primary-color, var(--asc-breadcrumb-link, #56baff));
    }
    [dark] .asc-breadcrumb-current,
    [data-dark] .asc-breadcrumb-current {
      color: var(--auto-color, var(--asc-breadcrumb-current, #fafafa));
    }
    [dark] .asc-breadcrumb-sep,
    [data-dark] .asc-breadcrumb-sep {
      color: var(--auto-third-color, var(--asc-breadcrumb-sep, rgba(255, 255, 255, 0.45)));
    }
  </style>
  <!-- 绑定全在 x-for 克隆体内部（载体 li 自身绑定不被编译，ownsChildren——:key 例外）。
         克隆体内条件显隐一律 x-show（不用 x-if）：共享快照多实例 + items 晚注入下
         x-if 延迟编译会挂错 scope 链（P0 固化规避清单第 4 条，button-group 同款纪律）——
         href 在场 → 真 a 链接，缺席 → 纯文本当前项（互补双分支）；末项恒 aria-current
         （$index 判位）；分隔符双形态（arrow 图标 / 文本字符），末项经 :last-child 隐藏；
         icon 空值时 x-icon 渲染默认图标（x-show 隐藏不可见） -->
  <ol class="asc-breadcrumb-list">
    <li class="asc-breadcrumb-item" x-for="item of items" :key="item.label">
      <a class="asc-breadcrumb-link" x-show="item.href" :href="item.href" :aria-current="$index === items.length - 1 ? 'page' : null">
        <i class="asc-breadcrumb-icon" x-show="item.icon" x-icon="item.icon"></i>
        <span class="asc-breadcrumb-label">{{ item.label }}</span>
      </a>
      <span class="asc-breadcrumb-current" x-show="!item.href" :aria-current="$index === items.length - 1 ? 'page' : null">
        <i class="asc-breadcrumb-icon" x-show="item.icon" x-icon="item.icon"></i>
        <span class="asc-breadcrumb-label">{{ item.label }}</span>
      </span>
      <span class="asc-breadcrumb-sep" aria-hidden="true">
        <i class="asc-breadcrumb-sep-icon" x-show="separator === 'arrow'" x-icon="'arrow'"></i>
        <span class="asc-breadcrumb-sep-text" x-show="separator !== 'arrow'">{{ separator }}</span>
      </span>
    </li>
  </ol>
</nav>
