<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>autospark.button · 组件演示</title>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        color: #212529;
      }
      h1 {
        font-size: 1.5rem;
      }
      h2 {
        margin-top: 2rem;
        font-size: 1.1rem;
      }
      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      code {
        background: #f1f3f5;
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 0.85em;
      }
      .hint {
        color: #868e96;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <h1>autospark.button</h1>
    <p>
      props 外观变体 + 默认插槽兜底 + 使用处事件绑定。宿主标签即组件根标签（化身语义）——用
      <code>button</code> 宿主得到语义化按钮。
    </p>

    <div id="app" x-data="{ clicks: 0 }">
      <h2>类型变体（type）</h2>
      <div class="row">
        <button x-component:autospark.button="{ label: '默认按钮' }"></button>
        <button x-component:autospark.button="{ label: '主要按钮', type: 'primary' }"></button>
        <button x-component:autospark.button="{ label: '成功按钮', type: 'success' }"></button>
        <button x-component:autospark.button="{ label: '危险按钮', type: 'danger' }"></button>
      </div>

      <h2>尺寸变体（size）</h2>
      <div class="row">
        <button x-component:autospark.button="{ label: '小号', size: 'sm' }"></button>
        <button x-component:autospark.button="{ label: '中号（默认）' }"></button>
        <button x-component:autospark.button="{ label: '大号', size: 'lg' }"></button>
      </div>

      <h2>插槽自定义内容（覆盖 label 兜底）</h2>
      <div class="row">
        <button x-component:autospark.button="{ type: 'primary' }"><b>加粗</b>插槽内容</button>
      </div>
      <p class="hint">
        宿主裸子节点填入默认插槽；未提供时显示 <code>{{ label }}</code>（组件状态求值）。
      </p>

      <h2>禁用与事件</h2>
      <div class="row">
        <button x-component:autospark.button="{ label: '禁用按钮', disabled: true }"></button>
        <span @click="clicks = clicks + 1">
          <button x-component:autospark.button="{ label: '点我计数', type: 'primary' }"></button>
        </span>
        <span>共点击 <b>{{ clicks }}</b> 次</span>
      </div>
      <p class="hint">
        组件默认封闭（宿主上的表达式在组件域求值，见不到外层状态）——事件绑定写在组件外的包裹元素上，点击经冒泡触发。
      </p>
    </div>

    <p><a href="./index.html">← 返回组件列表</a></p>

    <!-- 消费契约（ADR-0003 决策 4）：script 直引是唯一官方消费方式——引擎与插件均经全局
         命名空间就位；插件先于引擎加载时由闭包外壳推入预加载队列，engine 构造 drain 回放（ADR-0114）。
         dev 下 /autospark.*.js 由 vite.config.ts 即时闭包化服务（改插件源码刷新即生效），
         build 后为 dist-demo 装配的正式产物。 -->
    <script src="/autospark.js"></script>
    <script src="/autospark.button.js"></script>
    <script>
      new AutoSpark(document.getElementById("app"), {});
    </script>
  </body>
</html>
