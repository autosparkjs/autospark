<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@autospark/plugins · 插件演示</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        display: flex;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: #212529;
        background: #fff;
      }

      /* 左侧：组件树（固定 220px） */
      .sidebar {
        width: 220px;
        flex: 0 0 220px;
        height: 100%;
        overflow-y: auto;
        border-right: 1px solid #dee2e6;
        background: #f8f9fa;
        padding: 12px 0;
      }
      .sidebar .brand {
        padding: 4px 16px 12px;
        font-size: 0.95rem;
        font-weight: 600;
      }
      .sidebar .brand code {
        color: #339af0;
      }
      .tree,
      .tree ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .tree ul {
        padding-left: 14px;
      }
      .tree .group {
        padding: 8px 16px 4px;
        font-size: 0.75rem;
        color: #868e96;
        letter-spacing: 0.04em;
      }
      .tree a {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 7px 16px;
        text-decoration: none;
        color: #212529;
        font-size: 0.875rem;
        border-left: 3px solid transparent;
      }
      .tree a:hover {
        background: #e9ecef;
      }
      .tree a.active {
        background: #e7f5ff;
        border-left-color: #339af0;
        color: #1971c2;
      }
      .tree a .desc {
        font-size: 0.75rem;
        color: #868e96;
      }

      /* 右侧：组件演示区 */
      .demo {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .demo-bar {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 10px 16px;
        border-bottom: 1px solid #dee2e6;
        background: #fff;
      }
      .demo-bar h1 {
        margin: 0;
        font-size: 1rem;
      }
      .demo-bar .hint {
        color: #868e96;
        font-size: 0.8125rem;
      }
      .demo-bar a {
        margin-left: auto;
        color: #868e96;
        font-size: 0.8125rem;
        text-decoration: none;
      }
      .demo-bar a:hover {
        color: #339af0;
      }
      .demo-frame {
        flex: 1 1 auto;
        width: 100%;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><code>@autospark/plugins</code></div>
      <nav>
        <ul class="tree" id="tree"></ul>
      </nav>
    </aside>

    <main class="demo">
      <div class="demo-bar">
        <h1 id="demo-title">组件演示</h1>
        <span class="hint" id="demo-hint">选择左侧组件查看演示</span>
        <a id="demo-open" href="#" target="_blank" rel="noopener">在新窗口打开 ↗</a>
      </div>
      <iframe class="demo-frame" id="demo-frame" title="组件演示"></iframe>
    </main>

    <script>
      /**
       * 组件树：新增演示页时在 groups 下补一项即可（path 相对本页）。
       * 树按 group 分组，渲染为可折叠层级导航，右侧 iframe 加载对应演示页。
       */
      const COMPONENT_TREE = [
        {
          group: "基础",
          items: [
            {
              id: "button",
              name: "autospark.button",
              desc: "按钮：type/size 变体 + 插槽兜底 + 事件绑定",
              path: "./button.html",
            },
            {
              id: "button-group",
              name: "autospark.button-group",
              desc: "按钮组：融合/间隔布局 + 缺省下发 + x-model 单选选中",
              path: "./button-group.html",
            },
            {
              id: "text",
              name: "autospark.text",
              desc: "排版文本：层级/语义色 + 溢出省略（单行/多行）+ 复制",
              path: "./text.html",
            },
            {
              id: "link",
              name: "autospark.link",
              desc: "链接：href/target/disabled/icon + 语义色 + 下划线档位",
              path: "./link.html",
            },
          ],
        },
        {
          group: "布局",
          items: [
            {
              id: "divider",
              name: "autospark.divider",
              desc: "分割线：水平/垂直 + 虚线 + 带文字位置 + 间距",
              path: "./divider.html",
            },
            {
              id: "space",
              name: "autospark.space",
              desc: "间距容器：档位/两轴数组 + 方向/对齐/换行",
              path: "./space.html",
            },
            {
              id: "grid",
              name: "autospark.grid",
              desc: "栅格容器：固定/自适应/响应式列数 + 间隙/分布/对齐",
              path: "./grid.html",
            },
          ],
        },
        {
          group: "反馈",
          items: [
            {
              id: "alert",
              name: "autospark.alert",
              desc: "警示条：语义色五档 + 标题描述 + 关闭/图标/通栏",
              path: "./alert.html",
            },
          ],
        },
        {
          group: "展示",
          items: [
            {
              id: "card",
              name: "autospark.card",
              desc: "卡片：三段插槽 + 边框/悬停/可折叠",
              path: "./card.html",
            },
            {
              id: "tag",
              name: "autospark.tag",
              desc: "标签：语义色×形态正交 + icon + closable",
              path: "./tag.html",
            },
            {
              id: "empty",
              name: "autospark.empty",
              desc: "空状态：i18n 内置文案 + image 槽换图 + 附加动作",
              path: "./empty.html",
            },
          ],
        },
        {
          group: "表单",
          items: [
            {
              id: "input",
              name: "autospark.input",
              desc: "输入框：type 文本族/textarea + 清除/密码切换/前后置/计数",
              path: "./input.html",
            },
            {
              id: "checkbox",
              name: "autospark.checkbox",
              desc: "复选框：真 input 勾形/半选视觉 + x-model.boolean 布尔语域",
              path: "./checkbox.html",
            },
            {
              id: "radio",
              name: "autospark.radio",
              desc: "单选钮：原生 name 同名互斥组语义 + checked 值桥",
              path: "./radio.html",
            },
            {
              id: "switch",
              name: "autospark.switch",
              desc: "自绘开关：loading 态 + hidden 载体表单桥 + change 事件",
              path: "./switch.html",
            },
          ],
        },
      ];

      const treeEl = document.getElementById("tree");
      const frameEl = document.getElementById("demo-frame");
      const titleEl = document.getElementById("demo-title");
      const hintEl = document.getElementById("demo-hint");
      const openEl = document.getElementById("demo-open");

      /** 展平全部组件项，供查找与默认选中 */
      const flat = COMPONENT_TREE.flatMap((g) => g.items);

      function render() {
        treeEl.innerHTML = COMPONENT_TREE.map(
          (g) => `
            <li>
              <div class="group">${g.group}</div>
              <ul>
                ${g.items
                  .map(
                    (it) => `
                  <li>
                    <a href="#${it.id}" data-id="${it.id}" data-path="${it.path}">
                      <span>${it.name}</span>
                      <span class="desc">${it.desc}</span>
                    </a>
                  </li>`,
                  )
                  .join("")}
              </ul>
            </li>`,
        ).join("");
      }

      /** 按 hash 选中组件并加载演示；无 hash 时回落到第一个 */
      function activate() {
        const id = location.hash.slice(1);
        const item = flat.find((it) => it.id === id) ?? flat[0];
        if (!item) return;

        treeEl.querySelectorAll("a").forEach((a) => {
          a.classList.toggle("active", a.dataset.id === item.id);
        });

        titleEl.textContent = item.name;
        hintEl.textContent = item.desc;
        openEl.href = item.path;
        if (!frameEl.src.endsWith(item.path.replace("./", ""))) {
          frameEl.src = item.path;
        }
      }

      render();
      activate();
      window.addEventListener("hashchange", activate);
    </script>
  </body>
</html>
