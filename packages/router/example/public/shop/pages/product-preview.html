<!-- 产品快速预览模态框 -->
<div class="product-preview-modal">
    <div class="preview-header">
        <h2 x-text="product?.name || '产品预览'"></h2>
        <button class="close-btn" @click="window.router.back()">✕</button>
    </div>

    <div class="preview-content" x-show="product">
        <div class="preview-image">
            <div class="image-placeholder" x-text="product?.badge || '📱'"></div>
        </div>

        <div class="preview-info">
            <div class="preview-price">
                <span class="current-price" x-text="'¥' + (product?.price || '0')"></span>
                <span class="original-price" x-show="product?.originalPrice" x-text="'¥' + product.originalPrice"></span>
            </div>

            <div class="preview-desc" x-text="product?.desc || ''"></div>

            <div class="preview-specs" x-show="product?.specs">
                <h4>规格参数</h4>
                <ul>
                    <template x-for="(value, key) in product?.specs" :key="key">
                        <li>
                            <span class="spec-key" x-text="key + ':'"></span>
                            <span class="spec-value" x-text="value"></span>
                        </li>
                    </template>
                </ul>
            </div>

            <div class="preview-actions">
                <button class="btn-view-detail" @click="viewDetail()">
                    <span>🔗</span>
                    <span>查看详情</span>
                </button>
                <button class="btn-close" @click="window.router.back()">
                    <span>✕</span>
                    <span>关闭预览</span>
                </button>
            </div>
        </div>
    </div>

    <div class="preview-loading" x-show="!product">
        <div class="loading-spinner"></div>
        <p>加载中...</p>
    </div>

    <div class="preview-footer">
        <p class="preview-hint">💡 提示：按 ESC 键或点击遮罩关闭</p>
    </div>
</div>

<style>
    .product-preview-modal {
        height: 100%;
        display: flex;
        flex-direction: column;
        background: white;
    }

    .preview-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 20px;
        border-bottom: 1px solid #e0e0e0;
    }

    .preview-header h2 {
        font-size: 1.2em;
        margin: 0;
    }

    .close-btn {
        width: 32px;
        height: 32px;
        border: none;
        background: #f5f5f5;
        border-radius: 50%;
        cursor: pointer;
        font-size: 1.2em;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .close-btn:hover {
        background: #e0e0e0;
    }

    .preview-content {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
    }

    .preview-image {
        display: flex;
        justify-content: center;
        margin-bottom: 20px;
    }

    .image-placeholder {
        width: 200px;
        height: 200px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4em;
        color: white;
    }

    .preview-info {
        text-align: center;
    }

    .preview-price {
        margin-bottom: 16px;
    }

    .current-price {
        font-size: 2em;
        font-weight: bold;
        color: #f44336;
    }

    .original-price {
        font-size: 1.2em;
        color: #999;
        text-decoration: line-through;
        margin-left: 10px;
    }

    .preview-desc {
        color: var(--text-secondary);
        margin-bottom: 20px;
        line-height: 1.6;
    }

    .preview-specs {
        text-align: left;
        padding: 16px;
        background: #f5f5f5;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    .preview-specs h4 {
        margin: 0 0 12px 0;
    }

    .preview-specs ul {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .preview-specs li {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid #e0e0e0;
    }

    .preview-specs li:last-child {
        border-bottom: none;
    }

    .spec-key {
        font-weight: 500;
        color: var(--text-secondary);
    }

    .spec-value {
        color: var(--text-primary);
    }

    .preview-actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .preview-actions button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        font-size: 1em;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-view-detail {
        background: var(--primary-color);
        color: white;
    }

    .btn-view-detail:hover {
        opacity: 0.9;
    }

    .btn-close {
        background: #f5f5f5;
        color: var(--text-primary);
    }

    .btn-close:hover {
        background: #e0e0e0;
    }

    .preview-loading {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
    }

    .loading-spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #f0f0f0;
        border-top-color: var(--primary-color);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .preview-footer {
        padding: 12px 20px;
        border-top: 1px solid #e0e0e0;
        text-align: center;
    }

    .preview-hint {
        margin: 0;
        font-size: 0.85em;
        color: var(--text-secondary);
    }
</style>

<script>
    function initProductPreview() {
        return {
            product: null,

            init() {
                // 获取产品 ID 并加载产品数据
                const path = window.location.pathname;
                const match = path.match(/preview\/(\w+)/);
                if (match) {
                    this.loadProduct(match[1]);
                }
            },

            async loadProduct(id) {
                try {
                    const response = await fetch('./data/products.json');
                    const data = await response.json();
                    this.product = data.products.find(p => p.id === id) || null;
                } catch (e) {
                    console.error('加载产品失败:', e);
                }
            },

            viewDetail() {
                if (this.product) {
                    window.router.replace(`/product/${this.product.id}`);
                }
            }
        };
    }
</script>
