<!-- 服务列表模板 -->
<div class="content-header">
    <div class="content-title" x-text="title"></div>
    <div class="content-subtitle" x-text="subtitle"></div>
</div>

<div class="service-list">
    <template x-for="service of services" :key="service.id">
        <div
            class="service-card"
            @click="window.router.push('/shop/services/' + service.id)"
        >
            <div class="service-header">
                <div class="service-name">
                    <span x-text="service.icon"></span>
                    <span x-text="service.name"></span>
                </div>
                <div class="service-price" x-text="service.price"></div>
            </div>
            <div class="service-desc" x-text="service.desc"></div>
        </div>
    </template>
</div>

<style>
.service-list .service-card {
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.service-list .service-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
}
</style>
