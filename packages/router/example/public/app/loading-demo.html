<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading 与错误呈现演示 - AutoSpark Router</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .demo-links {
            margin-bottom: 30px;
        }

        .demo-links a {
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 10px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .demo-links a:hover {
            background: #764ba2;
            transform: translateY(-2px);
        }

        .page-content {
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚦 Loading 与错误呈现演示</h1>

        <div class="demo-links">
            <a href="#/">首页</a>
            <a href="#/slow">慢速加载 (2秒，默认遮罩)</a>
            <a href="#/message">自定义文案</a>
            <a href="#/no-loading">关闭 loading</a>
            <a href="#/error">加载失败 (重试/返回)</a>
            <a href="#/not-exist">404 (未匹配)</a>
        </div>

        <div id="app">
            <!-- 注入模式须显式声明出口（完整形态；x-outlet 简写仅自建模式生效） -->
            <div x-component:autospark.outlet></div>
        </div>
    </div>

    <script type="module">
        import { AutoSpark } from "autospark";
        import { AutoSparkRouter } from '/src/index.ts';

        const app = document.getElementById('app');

        // 注入模式：应用创建并拥有 engine 实例（vite 源码场景无 IIFE 全局，须显式注入）
        const engine = new AutoSpark(app, {});
        const router = new AutoSparkRouter(app, {
            engine,
            routes: {
                name: 'root',
                path: '/',
                view: `
                    <div class="page-content">
                        <h2>欢迎首页</h2>
                        <p>这是出口内建加载覆盖层（x-loading 门控）与内建错误块的演示。</p>
                        <p>点击上方链接体验：默认遮罩（200ms 防闪烁）、文案覆盖、关闭指示、错误重试与 404。</p>
                    </div>
                `,
                children: [
                    {
                        name: 'slow',
                        path: 'slow',
                        // 缺省 loading：内置默认（delay 200ms 防闪烁 + 白色 0.6 浅色遮罩）
                        view: {
                            form: async () => {
                                await new Promise(resolve => setTimeout(resolve, 2000));
                                return `
                                    <div class="page-content">
                                        <h2>🐢 慢速加载页面</h2>
                                        <p>这个页面模拟了2秒的加载时间。</p>
                                        <p>加载期间出口呈现 x-loading 遮罩覆盖层（未声明 loading 时走内置默认）。</p>
                                    </div>
                                `;
                            }
                        }
                    },
                    {
                        name: 'message',
                        path: 'message',
                        // string 简写 ≡ { message: string }
                        loading: '拼命加载中…',
                        view: {
                            form: async () => {
                                await new Promise(resolve => setTimeout(resolve, 1500));
                                return `
                                    <div class="page-content">
                                        <h2>💬 自定义文案页面</h2>
                                        <p>loading: '拼命加载中…' 覆盖了默认文案。</p>
                                    </div>
                                `;
                            }
                        }
                    },
                    {
                        name: 'no-loading',
                        path: 'no-loading',
                        // 显式关闭本路由的加载指示
                        loading: false,
                        view: {
                            form: async () => {
                                await new Promise(resolve => setTimeout(resolve, 1500));
                                return `
                                    <div class="page-content">
                                        <h2>🔇 关闭 loading 页面</h2>
                                        <p>loading: false 关闭了本路由的加载指示，加载期间出口无任何提示。</p>
                                    </div>
                                `;
                            }
                        }
                    },
                    {
                        name: 'error',
                        path: 'error',
                        // 视图地址不存在 → 加载失败 → 内建错误块（重试 + 返回）
                        view: './views/missing-view.html',
                    },
                ]
            }
        });

        router.attach();

        console.log('✅ Loading 与错误呈现演示页面已加载');
        console.log('📝 提示：点击不同的链接体验 loading 覆盖层、错误重试与 404 呈现');
    </script>
</body>
</html>
