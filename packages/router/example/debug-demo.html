<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSparkRouter 调试模式演示</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .nav {
            margin-bottom: 20px;
        }
        .nav button {
            margin-right: 10px;
            padding: 8px 16px;
            cursor: pointer;
        }
        .content {
            border: 1px solid #ccc;
            padding: 20px;
            min-height: 200px;
        }
        .info {
            background: #f0f0f0;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <h1>AutoSparkRouter 调试模式演示</h1>

    <div class="info">
        <h3>🔍 调试模式已启用</h3>
        <p>打开浏览器控制台查看详细的导航日志，包括：</p>
        <ul>
            <li>导航开始和完成</li>
            <li>路由匹配结果</li>
            <li>钩子执行状态</li>
            <li>导航方法调用</li>
        </ul>
        <p>
            本页示范<strong>注入模式</strong>：应用先创建 engine 实例再交给 router
            （静态模板中的出口须写 <code>x-component:autospark.outlet</code> 完整形态；
            远程模板内可简写 <code>&lt;div x-outlet&gt;</code>）。
        </p>
    </div>

    <div class="nav">
        <button onclick="router.push('/')">首页</button>
        <button onclick="router.push('/about')">关于</button>
        <button onclick="router.push('/user/123')">用户</button>
        <button onclick="router.back()">后退</button>
        <button onclick="router.forward()">前进</button>
    </div>

    <div class="content">
        <!-- 注入模式静态出口：完整组件形态 -->
        <div x-component:autospark.outlet></div>
    </div>

    <script type="module">
        import { AutoSpark } from "autospark";
        import "../src/index.ts"; // 插件自举（ADR-0011）：注册 precompile/ready 回调

        // 插件模式（ADR-0011）：路由意图经 engine 构造 options 声明——完整路由配置对象形态
        const routerOptions = {
            routes: [
                {
                    name: "home",
                    path: "/",
                    view: "./debug-pages/home.html",
                    meta: { title: "首页" },
                },
                {
                    name: "about",
                    path: "/about",
                    view: "./debug-pages/about.html",
                    meta: { title: "关于" },
                },
                {
                    name: "user",
                    path: "/user/:id",
                    // 远程模板可自带 <script type="autospark/data"> 静态数据；
                    // data 提供的动态数据覆盖同名键
                    view: "./debug-pages/user.html",
                    meta: { title: "用户详情" },
                },
            ],
            debug: true, // 🔍 启用调试模式
            beforeRoute: () => {
                console.log("[自定义钩子] beforeRoute 执行");
                return true;
            },
            afterRoute: (context) => {
                console.log("[自定义钩子] afterRoute 执行");
                const to = context?.to?.[context.to.length - 1];
                if (to?.route?.meta?.title) {
                    document.title = to.route.meta.title;
                }
            },
        };

        // 挂载：engine 构造 options 声明路由（ready 回调持 engine 构造 router）
        new AutoSpark(document.body, {}, { routes: routerOptions });

        // 路由器实例挂于宿主元素，暴露到全局方便在控制台测试
        window.router = document.body.router;

        console.log("%c🚀 AutoSparkRouter 初始化完成", "color: green; font-weight: bold");
        console.log("提示: 点击上方按钮进行导航，查看控制台中的调试日志");
    </script>
</body>
</html>
