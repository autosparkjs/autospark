<!-- task type 组件（autospark.notifications.task）：继承 base 族根（头部/actions 复用），出口覆盖段 =
     进度条 + 三控制钮；task 状态机（进度 clamp / pause 闸门 / 完成转计时 / 协作取消）为组件 methods。
     约定键：`progress/paused/completed`（manager watch → notification:update 广播观测面）、`holdOpen`
     （进行中恒 true sticky，完成态联动置 false）；`_abort`（AbortController）非约定键——canCancel
     时由 manager 注水，外部经 `instance.data._abort.signal` 挂接协作取消。defaults 段 = 合并链
     type 种子层（紧凑形态，ADR-0092 模板化）。契约与 ADR 回链：ADR-0089/0092。 -->
<div x-define="autospark.notifications.task" x-define:inherit="autospark.notifications.base">
    <script setup>
    {
        defaults: { width: 300 },
        data: () => ({
            progress: 0,
            paused: false,
            completed: false,
            holdOpen: true,
        }),
        methods: {
            start() {},            // 幂等兼容面（创建即 started，ADR-0083 二次修订沿用）
            progress(n) {
                if (this.data.paused || this.data.completed) return;
                const v = Math.min(100, Math.max(0, Math.round(Number(n) || 0)));
                this.data.progress = v;
                if (v >= 100) this._complete();
            },
            pause() { if (!this.data.completed) this.data.paused = true; },
            resume() { this.data.paused = false; },
            stop() { this._complete(); },
            complete() { this._complete(); },
            cancel() {
                this.data._abort?.abort();
                this.engine.notifications.hide(this.props.id);
            },
            _complete() {
                if (this.data.completed) return;
                this.data.progress = 100;
                this.data.completed = true;
                this.data.holdOpen = false;
            },
        },
    }
    </script>
    <style>
    .autospark-notification-progress { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .autospark-notification-progress-track { flex: 1; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--autospark-notification-accent, #999) 15%, var(--autospark-overlay-bg, #fff)); overflow: hidden; }
    .autospark-notification-progress-bar { height: 100%; border-radius: 3px; background: var(--autospark-notification-accent, #409eff); transition: width 0.2s; }
    .autospark-notification-progress-text { flex: none; font-size: 12px; opacity: 0.75; min-width: 34px; text-align: right; }
    .autospark-notification-ops { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 6px; }
    .autospark-notification-op { flex: none; border: none; background: none; padding: 0; font: inherit; font-size: 13px; color: var(--autospark-notification-accent, #409eff); cursor: pointer; }
    </style>
    <div class="autospark-notification-progress">
        <div class="autospark-notification-progress-track">
            <div class="autospark-notification-progress-bar" :style="'width:' + (progress ?? 0) + '%'"></div>
        </div>
        <span class="autospark-notification-progress-text" x-text="(progress ?? 0) + '%'"></span>
    </div>
    <div class="autospark-notification-ops" x-show="(canPause || canStop || canCancel) && !completed">
        <button class="autospark-notification-op" type="button" x-show="canPause" x-text="paused ? '恢复' : '暂停'" @click="paused ? resume() : pause()"></button>
        <button class="autospark-notification-op" type="button" x-show="canStop" @click="stop()">停止</button>
        <button class="autospark-notification-op" type="button" x-show="canCancel" @click="cancel()">取消</button>
    </div>
</div>
