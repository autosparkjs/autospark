<div x-define="autospark.notifications.confirm" x-define:inherit="autospark.notifications.shell">
    <script setup>
    {
        defaults: {
            width: 300,
            delayClose: 0,
            actions: [
                { title: "确定", value: true },
                { title: "取消", value: false },
            ],
        },
        methods: {
            yes() { this.engine.notifications.respond(this.props.id, true); },
            no() { this.engine.notifications.respond(this.props.id, false); },
        },
    }
    </script>
</div>
