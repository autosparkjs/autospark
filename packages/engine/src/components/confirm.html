<!-- confirm type 组件（autospark.notifications.confirm）：继承 base（内容与公共 methods 复用），仅追加
     yes/no——经 `notifications.respond(id, value)` 走 value-action 统一闭环（与 DOM 点击同一条执行路径）。
     defaults 段（合并链 type 种子层，ADR-0089 决策九 + ADR-0092 模板化）：紧凑形态 + sticky
     （delayClose 0——等应答不自动关，ADR-0077 沿用）+ 默认双钮（value-only 数据化，可被 options /
     types[type] / 单次 props 的 actions 覆盖）。契约与 ADR 回链：ADR-0089/0092。 -->
<div x-define="autospark.notifications.confirm" x-define:inherit="autospark.notifications.base">
    <script setup>
    {
        defaults: {
            width: 300,
            delayClose: 0,
            actions: [
                { title: "确定", value: true },
                { title: "取消", value: false },
            ],
        },
        methods: {
            yes() { this.engine.notifications.respond(this.props.id, true); },
            no() { this.engine.notifications.respond(this.props.id, false); },
        },
    }
    </script>
</div>
