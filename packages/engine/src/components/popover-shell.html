<div class="autospark-popover" x-define="autospark.popover">
    <div class="autospark-popover-content" x-slot></div>
    <div class="autospark-overlay-arrow"></div>
    <style global id="autospark-popover-styles">
        [data-overlay] {
            position: relative;
            border-radius: var(--autospark-overlay-radius, 8px);
        }
        .autospark-popover > .autospark-popover-content {
            padding: 0px;
            position: relative;
            z-index: var(--autospark-overlay-z, 1000);
        }
        [data-overlay][data-overlay-border] {
            border: 1px solid var(--autospark-overlay-border, rgba(0, 0, 0, 0.1));
            background: var(--autospark-overlay-bg, #fff);
            box-shadow: 2px 4px 4px rgba(0, 0, 0, 0.18);
        }
        .autospark-overlay-arrow {
            position: absolute;
            width: 8px;
            height: 8px;
            pointer-events: none;
        }
        .autospark-overlay-arrow::before {
            content: "";
            position: absolute;
            inset: 0;
            background: var(--autospark-overlay-bg, #fff);
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.18);
            transform: rotate(45deg);
        }
        .autospark-overlay-arrow::after {
            content: "";
            position: absolute;
            inset: -1px;
            background: var(--autospark-overlay-bg, #fff);
            transform: rotate(45deg);
        }
        [data-overlay][data-overlay-border] > .autospark-overlay-arrow::before {
            background: var(--autospark-overlay-border, rgba(0, 0, 0, 0.1));
        }
        [data-overlay][data-overlay-border] > .autospark-overlay-arrow::after {
            inset: -2px;
        }
        [data-overlay-placement^="top"] > .autospark-overlay-arrow::after {
            translate: 0 -4px;
        }
        [data-overlay-placement^="bottom"] > .autospark-overlay-arrow::after {
            translate: 0 4px;
        }
        [data-overlay-placement^="left"] > .autospark-overlay-arrow::after {
            translate: -4px 0;
        }
        [data-overlay-placement^="right"] > .autospark-overlay-arrow::after {
            translate: 4px 0;
        }
        [data-autospark-overlays] > [data-overlay] {
            z-index: var(--autospark-overlay-z, 1000);
        }
    </style>
</div>
