<div x-define="autospark.error" class="as-error">
    <style global id="autospark-error">
        .as-error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 24px;
            background: rgba(255, 255, 255, 0.96);
            color: #888;
            font-size: 14px;
        }

        .as-error-icon {
            display: inline-flex;
            width: 28px;
            height: 28px;
            color: #c0c4cc;
        }

        .as-error-message {
            text-align: center;
            line-height: 1.5;
            word-break: break-word;
        }

        .as-error-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        .as-error-btn {
            padding: 4px 16px;
            border: 1px solid #dcdfe6;
            border-radius: 6px;
            background: #fff;
            color: #606266;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .as-error-btn:hover {
            border-color: #c0c4cc;
            color: #409eff;
        }
    </style>
    <span class="as-error-icon" x-show="icon" x-icon="icon" x-slot="icon"></span>
    <div class="as-error-message" x-slot="message">{{ message }}</div>
    <div class="as-error-actions">
        <button type="button" class="as-error-btn" x-show="retryable" @click="retry()">重试</button>
        <button type="button" class="as-error-btn" x-show="closeable" @click="close()">关闭</button>
        <template x-for="a of actions">
            <button type="button" class="as-error-btn" :data-action="a.name" x-text="a.title"></button>
        </template>
    </div>
</div>
