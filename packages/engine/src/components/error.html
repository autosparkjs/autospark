<div x-define="autospark.error" class="as-error">
    <style global id="autospark-error">
        /* 主题化（ADR-0129）：三级样式回退链；字号/间距/布局量不映射（保留组件设计）；
             暗色兜底变体只切末级字面值。兜底值按 theme 默认浅色校准（specs/theme-token-baseline.md） */
        .as-error {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 24px;
            background: var(--auto-bgcolor, var(--autospark-error-bg, #fff));
            color: var(--auto-color, var(--autospark-error-color, #606060));
            font-size: 14px;
        }

        .as-error-icon {
            display: inline-flex;
            width: 28px;
            height: 28px;
            color: var(--auto-third-color, var(--autospark-error-icon-color, rgba(96, 96, 96, 0.55)));
        }

        .as-error-message {
            text-align: center;
            line-height: 1.5;
            word-break: break-word;
        }

        .as-error-actions {
            display: flex;
            gap: 8px;
            margin-top: 4px;
        }

        /* 无 actions 配置（空数组）时容器折叠为零占位——x-for 容器保留但子节点已被清空 */
        .as-error-more:empty {
            display: none;
        }

        .as-error-more {
            display: flex;
            gap: 8px;
        }

        .as-error-btn {
            padding: 4px 16px;
            border: 1px solid var(--auto-border-color, var(--autospark-error-border-color, #f0f0f0));
            border-radius: var(--auto-border-radius, var(--autospark-error-radius, 0.5rem));
            background: var(--auto-bgcolor, var(--autospark-error-btn-bg, #fff));
            color: var(--auto-color, var(--autospark-error-btn-color, #606060));
            font-size: 13px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .as-error-btn:hover {
            border-color: var(--auto-hover-border-color, var(--autospark-error-btn-hover-border-color, #009aff));
            color: var(--auto-hover-color, var(--autospark-error-btn-hover-color, #009aff));
        }

        /* 暗色兜底变体（ADR-0129）：兜底字面值切换为 theme 默认暗色校准值 */
        [dark] .as-error,
        [data-dark] .as-error {
            background: var(--auto-bgcolor, var(--autospark-error-bg, #606060));
            color: var(--auto-color, var(--autospark-error-color, #fafafa));
        }

        [dark] .as-error-icon,
        [data-dark] .as-error-icon {
            color: var(--auto-third-color, var(--autospark-error-icon-color, rgba(250, 250, 250, 0.55)));
        }

        [dark] .as-error-btn,
        [data-dark] .as-error-btn {
            border-color: var(--auto-border-color, var(--autospark-error-border-color, #606060));
            background: var(--auto-bgcolor, var(--autospark-error-btn-bg, #606060));
            color: var(--auto-color, var(--autospark-error-btn-color, #fafafa));
        }

        [dark] .as-error-btn:hover,
        [data-dark] .as-error-btn:hover {
            border-color: var(--auto-hover-border-color, var(--autospark-error-btn-hover-border-color, #56baff));
            color: var(--auto-hover-color, var(--autospark-error-btn-hover-color, #56baff));
        }
    </style>
    <span class="as-error-icon" x-show="icon" x-icon="icon" x-slot="icon"></span>
    <div class="as-error-message" x-slot="message">{{ message }}</div>
    <div class="as-error-actions">
        <button type="button" class="as-error-btn" x-show="retryable" @click="retry()">重试</button>
        <button type="button" class="as-error-btn" x-show="closeable" @click="close()">关闭</button>
        <span class="as-error-more" x-for="a of actions">
            <button type="button" class="as-error-btn" :data-action="a.name" x-text="a.title"></button>
        </span>
    </div>
</div>
